<body>
<!-- ===== INTRO OVERLAY ===== -->
<div id="intro-overlay">
   <div id="petal-container"></div>
  <div class="intro-text">
    <p id="intro-line1" class="typing-line"></p>
    <p id="intro-line2" class="fade-line">Một trang web game có độ khó cao đang chờ bạn thử sức</p>
  </div>
    <button id="skip-intro" type="button">

</button>

    <audio id="bgm" loop preload="auto">

                    <line x1="6" y1="-6" x2="-6" y2="6"/>

        </button>

        <!-- MEMORY -->
        <button class="util-btn" id="memori" title="Memory">

                <i class="fas fa-brain"></i>
                <span class="memory-dot dot-1"></span>
                <span class="memory-dot dot-2"></span>
                <span class="memory-dot dot-3"></span>

        </button>

        <!-- TÌM BÓNG -->
        <button class="util-btn" id="magic" title="Tìm bóng">
            <div class="shell-mini">
                <span class="shell-light"></span>
                <span class="shell-spark s1"></span>

                <span class="shell-spark s3"></span>

                <span class="shell-cup cup-b"></span>
                <span class="shell-cup cup-c"></span>

        <!-- CHẶN CUA -->
        <button class="util-btn" id="crab" title="Chặn cua">
            <span>🦀</span>

        <!-- REVERSI -->

        <!-- MINESWEEPER -->

        </button>

                <span class="star s4"></span>
                <span class="star s5"></span>
                <span class="star s6"></span>

        </button>

        <!-- THẤP HAY CAO -->
        <button class="util-btn" id="thaphaycao" title="Thấp hay cao">

                <span class="thc-card">7</span>
                <span class="thc-arrow thc-down"></span>
            </div>
        </button>

            <div class="codam-piece">
                <div class="codam-ring"></div>
                <div class="codam-shine"></div>
            </div>
        </button>

        <!-- NEON REFLEX -->
        <button class="util-btn" id="neonreflex" title="Neon Reflex">

        <!-- UNO -->
        <button class="util-btn" id="unogame" title="UNO">
            <div class="uno-fan-mini">
                <span class="uno-card-mini c1"><b>UNO</b></span>
                <span class="uno-card-mini c2"><b>UNO</b></span>
                <span class="uno-card-mini c3"><b>UNO</b></span>
                <span class="uno-card-mini c4"><b>UNO</b></span>

                <span class="uno-spark us2"></span>

                    <span class="chase-light red"></span>

            <span class="dicebeach-sand-dot d4"></span>

        </button>

        <button class="util-btn" id="blockjump" title="Block Jump 3D">

                <div class="bj-ear ear-right"></div>

    </div>

</button>

                <span class="bb-cloud c2"></span>

                    <span class="bb-basket"></span>

        let currentGenre = 'all';
function createDifficultyHTML(diff) {

    const difficulty = parseInt(diff, 10) || 0;

    const difficultyColors = {
        1: 'blue',
        2: 'green',
        3: 'yellow',
        4: 'orange',
        5: 'red'
    };

    const color = difficultyColors[difficulty] || 'blue';

    let html = `
        <span class="game-difficulty">
            <span class="difficulty-label">Độ khó:</span>
            <span class="difficulty-bar">
    `;

    for (let i = 1; i <= 5; i++) {

        if (i <= difficulty) {
            html += `
                <span class="difficulty-segment ${color}"></span>
            `;
        } else {
            html += `
                <span class="difficulty-segment"></span>
            `;
        }
    }

    html += `
            </span>
        </span>
    `;

    return html;
}
        // ========== RENDER LƯỚI GAME ==========
        function getButtonHTML(gameId) {
            const originalBtn = document.getElementById(gameId);
            if (originalBtn) return originalBtn.outerHTML;
            console.warn('Không tìm thấy nút:', gameId);
            return '';
        }

        function renderGames(genre) {
            gamesGrid.innerHTML = '';
            const filtered = genre === 'all'
                ? games
                : games.filter(g => g.genre && g.genre.includes(genre));

            filtered.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.style.animationDelay = `${Math.min(index * 0.03, 0.6)}s`;
                card.setAttribute('data-id', game.id);

                const btnHTML = getButtonHTML(game.id);
                if (btnHTML) card.innerHTML += btnHTML;

                const infoDiv = document.createElement('div');
                infoDiv.className = 'game-info';
                const genreDisplay = game.genre
                    ? game.genre.map(g => genreNames[g] || g).join(', ')
                    : '';
                infoDiv.innerHTML = `
    <span class="game-name">${game.name}</span>

    ${
        genreDisplay
            ? `<span class="game-genre">${genreDisplay}</span>`
            : ''
    }

    ${
        game.status
            ? `<span class="tag">${game.status}</span>`
            : createDifficultyHTML(game.diff)
    }
`;
                card.appendChild(infoDiv);

    card.addEventListener('click', () => {
    const url = routes[game.id];
    if (url) {
        // Gọi hàm navigateToGame từ script.js
        navigateToGame(url, game.name);
    }
});

                gamesGrid.appendChild(card);
            });
        }

        filterSection.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            filterSection.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGenre = btn.dataset.genre;

            // Làm mờ lưới cũ rồi mới vẽ lưới mới để chuyển cảnh mượt hơn
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                renderGames(currentGenre);
                return;
            }
            gamesGrid.classList.add('is-switching');
            clearTimeout(gamesGrid._switchTimer);
            gamesGrid._switchTimer = setTimeout(() => {
                renderGames(currentGenre);
                gamesGrid.classList.remove('is-switching');
            }, 180);
        });

        renderGames('all');

    });
    </script>

            </span>
        </div>
        <div class="loading-game-name" id="loading-game-name">Cờ Caro</div>
        <div class="loading-progress">
            <div class="loading-progress-bar"></div>
        </div>
    </div>
</div>
