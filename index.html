            'covua':'game/covua',
            'timkhacbiet':'game/timkhacbiet',
        };

        games.forEach(g => {
            if (typeof g.genre === 'string') g.genre = [g.genre];
        });

        // ========== THỂ LOẠI ==========
        const genreNames = {
            'sieukho': 'Siêu khó',
            'co': 'Cờ', 'chien-thuat': 'Chiến thuật', 'tri-tue': 'Trí tuệ', 'phan-xa': 'Phản xạ',
            'quan-sat': 'Quan sát', 'ghi-nho': 'Ghi nhớ', 'giai-tri': 'Giải trí'
        };
        const genreOrder = ['sieukho', 'co', 'chien-thuat', 'tri-tue', 'phan-xa', 'quan-sat', 'ghi-nho', 'giai-tri'];
        const genreColor = {
            'moi': '#f2c14e', 'co': '#f2c14e', 'chien-thuat': '#ff8a5c', 'tri-tue': '#7aa2ff', 'phan-xa': '#ff5d8f',
            'quan-sat': '#4fd1c5', 'ghi-nho': '#b48cff', 'giai-tri': '#6fdc78', 'sap': '#8a93ab'
        };
        // Game mới ra mắt: hiện nhãn NEW và mục "Mới ra mắt" ở đầu trang (game mới nhất đứng trước)
        const NEW_IDS = ['truottuyet3d', 'daibacvutru', 'biendoithichung', 'dauba'];
        // Danh mục SIÊU KHÓ: hiện ở mục riêng ngay sau "Mới ra mắt", gắn nhãn rực lửa
        const HARD_IDS = ['gamecaro', 'sieuduoibat', 'dayhop', 'colorSweeper', 'nedan', 'dungsidietvirus', 'cotuhuyenbi'];

        const feed = document.getElementById('hFeed');
        const chipBar = document.querySelector('.h-chips');
        const playable = games.filter(g => !g.status);
        document.getElementById('hCount').textContent = '· ' + playable.length + ' trò chơi';

        function maintenanceOff(gameId) {
            return !!(routes[gameId] && window.gameMaintenance && window.gameMaintenance.isOff(gameId));
        }
        function iconHTML(id) {
            const b = document.getElementById(id);
            return b ? b.outerHTML : '';
        }
        function diffHTML(diff) {
            const d = parseInt(diff, 10) || 0;
            if (d < 1 || d > 5) return '';
            const col = ['', 'blue', 'green', 'yellow', 'orange', 'red'][d];
            let h = '<span class="h-diff" title="Độ khó ' + d + '/5" aria-label="Độ khó ' + d + ' trên 5">';
            for (let i = 1; i <= 5; i++) h += '<i class="' + (i <= d ? col : '') + '"></i>';
            return h + '</span>';
        }
        function tileHTML(g) {
            const off = maintenanceOff(g.id), soon = !!g.status;
            const hot = HARD_IDS.includes(g.id) && !off && !soon;
            const badge = off ? '<b class="h-badge off">BẢO TRÌ</b>'
                : soon ? '<b class="h-badge soon">SẮP RA</b>'
                : hot ? '<b class="h-badge hot"><i class="fl f1"></i><i class="fl f2"></i><i class="fl f3"></i><span>SIÊU KHÓ</span></b>'
                : NEW_IDS.includes(g.id) ? '<b class="h-badge new">NEW</b>' : '';
            const sub = off ? '<span class="h-sub">Đang bảo trì</span>'
                : soon ? '<span class="h-sub">' + g.status + '</span>'
                : diffHTML(g.diff);
            return '<div class="h-tile' + (hot ? ' is-hot' : '') + (off ? ' is-off' : '') + (soon ? ' is-soon' : '') + '" role="button" tabindex="' + (off || soon ? -1 : 0) +
                '" data-id="' + g.id + '" aria-label="' + g.name + '">' +
                '<span class="h-ico">' + iconHTML(g.id) + badge + '</span>' +
                '<span class="h-name">' + g.name + '</span>' + sub + '</div>';
        }
        function sectionHTML(key, title, list) {
            if (!list.length) return '';
            return '<section class="h-sec' + (key === 'sieukho' ? ' hot' : '') + '" style="--c:' + (genreColor[key] || '#8a93ab') + '">' +
                '<h2 class="h-sec-title"><i></i><span>' + title + '</span><em>' + list.length + '</em></h2>' +
                '<div class="h-grid">' + list.map(tileHTML).join('') + '</div></section>';
        }

        // Mỗi game nằm ở một mục: có "cờ" thì vào mục Cờ, còn lại theo thể loại đầu tiên
        function homeKey(g) { return HARD_IDS.includes(g.id) ? 'sieukho' : g.genre.includes('co') ? 'co' : g.genre[0]; }

        let currentGenre = 'all';
        function renderGames(genre) {
            let html = '';
            if (genre === 'all') {
                html += sectionHTML('moi', 'Mới ra mắt', NEW_IDS.map(id => games.find(g => g.id === id)).filter(Boolean));
                genreOrder.forEach(k => { html += sectionHTML(k, genreNames[k], playable.filter(g => homeKey(g) === k || (k !== 'sieukho' && HARD_IDS.includes(g.id) && g.genre.includes(k)))); });
                html += sectionHTML('sap', 'Sắp ra mắt', games.filter(g => g.status));
            } else {
                html += sectionHTML(genre, genreNames[genre] || genre, genre === 'sieukho' ? playable.filter(g => HARD_IDS.includes(g.id)) : playable.filter(g => g.genre.includes(genre)));
            }
            feed.innerHTML = html;
        }

        // ========== CHIP LỌC THỂ LOẠI ==========
        chipBar.innerHTML = '<button class="h-chip active" data-genre="all">Tất cả</button>' +
            genreOrder.map(k => {
                const n = k === 'sieukho' ? HARD_IDS.length : playable.filter(g => g.genre.includes(k)).length;
                return n ? '<button class="h-chip' + (k === 'sieukho' ? ' hot' : '') + '" data-genre="' + k + '">' + (k === 'sieukho' ? '<i class="fa-solid fa-fire-flame-curved"></i> ' : '') + genreNames[k] +
                    ' <small>' + n + '</small></button>' : '';
            }).join('');

        chipBar.addEventListener('click', (e) => {
            const btn = e.target.closest('.h-chip');
            if (!btn || btn.dataset.genre === currentGenre) return;
            chipBar.querySelectorAll('.h-chip').forEach(b => b.classList.toggle('active', b === btn));
            currentGenre = btn.dataset.genre;
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            feed.classList.add('is-switching');
            clearTimeout(feed._t);
            feed._t = setTimeout(() => {
                renderGames(currentGenre);
                feed.classList.remove('is-switching');
                const top = document.querySelector('.h-main').offsetTop - document.querySelector('.h-top').offsetHeight;
                if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 140);
        });

        // ========== MỞ GAME ==========
        function openTile(tile) {
            const g = games.find(x => x.id === tile.dataset.id);
            if (!g) return;
            const url = routes[g.id];
            if (url && !maintenanceOff(g.id)) navigateToGame(url, g.name);
        }
        feed.addEventListener('click', (e) => { const t = e.target.closest('.h-tile'); if (t) openTile(t); });
        feed.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const t = e.target.closest('.h-tile'); if (!t) return;
            e.preventDefault(); openTile(t);
        });

        renderGames('all');

        // Bảo trì: đọc maintenance.json rồi vẽ lại nếu có game đang bảo trì
        if (window.gameMaintenance) {
            window.gameMaintenance.ready.then(() => {
                if (games.some(g => maintenanceOff(g.id))) renderGames(currentGenre);
            });
            // maintenance.json được đọc lại định kỳ: bật/tắt bảo trì thì thẻ game đổi ngay, không cần tải lại trang
            if (window.gameMaintenance.onChange) window.gameMaintenance.onChange(() => renderGames(currentGenre));
        }
    });
    </script>
    <!-- ===== LOADING OVERLAY ===== -->
<div id="loading-overlay" style="display:none;">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-text">
            <span>Vui lòng chờ</span>
            <span class="loading-dots">
                <span>.</span><span>.</span><span>.</span>
            </span>
        </div>
        <div class="loading-game-name" id="loading-game-name">Cờ Caro</div>
        <div class="loading-progress">
            <div class="loading-progress-bar"></div>
        </div>
    </div>
</div>
</body>
