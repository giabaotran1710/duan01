<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap');

  :root {
    --bg: #070b10;
    --panel: rgba(16, 24, 33, .86);
    --line: rgba(120, 170, 150, .16);
    --accent: #2ef59a;
    --accent-soft: rgba(46, 245, 154, .14);
    --danger: #ff4d5a;
    --gold: #ffd257;
    --text: #e3eef5;
    --dim: #7d8fa0;
    --tile-a: #2a3a4a;
    --tile-b: #1d2935;
    --open: #0e151d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(46, 245, 154, .10), transparent 60%),
      radial-gradient(700px 500px at 110% 10%, rgba(64, 140, 255, .10), transparent 60%),
      var(--bg);
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(46, 245, 154, .028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46, 245, 154, .028) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask: radial-gradient(circle at 50% 30%, #000, transparent 75%);
    mask: radial-gradient(circle at 50% 30%, #000, transparent 75%);
    pointer-events: none;
  }

  .wrapper { position: relative; z-index: 1; width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 12px; }

  /* ---------- tiêu đề ---------- */
  header { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 0 2px; }
  .logo {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(145deg, #1f3b33, #0f1d1a);
    border: 1px solid rgba(46, 245, 154, .35);
    box-shadow: 0 0 22px rgba(46, 245, 154, .22), inset 0 1px 0 rgba(255, 255, 255, .08);
  }
  .title {
    font-family: 'Orbitron', sans-serif; font-size: clamp(24px, 6.4vw, 36px); font-weight: 900; letter-spacing: .14em; line-height: 1;
    background: linear-gradient(180deg, #b8ffdb, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(46, 245, 154, .35));
  }
  .subtitle { font-size: 11px; font-weight: 600; letter-spacing: .32em; color: var(--dim); margin-top: 6px; text-transform: uppercase; }

  /* ---------- thông số ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 8px; }
  .stat {
    display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 9px 12px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .stat-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  .stat-value { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
  .stat-value i { font-style: normal; margin-right: 6px; font-size: 15px; }
  .stat-value.danger { color: var(--danger); text-shadow: 0 0 10px rgba(255, 77, 90, .5); }
  .stat-value.warn { color: var(--gold); }

  .btn-reset {
    width: 56px; border-radius: 14px; border: 1px solid rgba(46, 245, 154, .45);
    background: linear-gradient(180deg, rgba(46, 245, 154, .22), rgba(46, 245, 154, .08));
    color: var(--accent); font-size: 24px; cursor: pointer; transition: transform .12s, background .15s;
  }
  .btn-reset:active { transform: scale(.94); }

  /* ---------- thanh chế độ + trạng thái ---------- */
  .bar { display: flex; align-items: center; gap: 10px; }
  .mode {
    display: inline-flex; padding: 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); flex: none;
  }
  .mode button {
    border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 800; color: var(--dim);
    background: transparent; cursor: pointer; transition: background .15s, color .15s;
  }
  .mode button.on { color: #06231a; background: linear-gradient(180deg, #7dffc4, var(--accent)); box-shadow: 0 2px 10px rgba(46, 245, 154, .35); }
  .mode button[data-mode="flag"].on { color: #2b1d00; background: linear-gradient(180deg, #ffe597, var(--gold)); box-shadow: 0 2px 10px rgba(255, 210, 87, .35); }

  .status {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--dim);
  }
  #status-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .25s; }
  #status-text.blink-out { opacity: 0; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
  .status-dot.red { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: pulse 1s infinite; }
  .status-dot.gold { background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: none; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------- bàn mìn ---------- */
  .grid-container {
    position: relative; padding: 10px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(22, 32, 43, .95), rgba(12, 18, 25, .95));
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  .grid-blur-wrapper { transition: filter .4s ease; }
  .grid-blur-wrapper.blurred { filter: blur(3px) brightness(.4); pointer-events: none; }

  #grid { --cell: 26px; display: grid; gap: 2px; width: fit-content; margin: 0 auto; touch-action: manipulation; }

  .cell {
    width: var(--cell); height: var(--cell); border-radius: calc(var(--cell) * .22);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: calc(var(--cell) * .56); line-height: 1;
    color: transparent; cursor: pointer; position: relative;
    background: linear-gradient(160deg, var(--tile-a), var(--tile-b));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), inset 0 -2px 0 rgba(0, 0, 0, .35);
    transition: background .1s, transform .08s;
  }
  .cell:not(.open):not(.exploded):active { transform: scale(.9); }
  @media (hover: hover) { .cell:hover:not(.open):not(.exploded) { background: linear-gradient(160deg, #35506a, #24364a); } }

  .cell.open {
    background: var(--open); cursor: default;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .03);
    animation: opened .18s ease-out;
  }
  @keyframes opened { from { transform: scale(.82); opacity: .4; } }

  .cell::after { color: #fff; }
  .cell.flagged { background: linear-gradient(160deg, #4a3f1c, #2d2612); }
  .cell.flagged::after { content: ''; font-size: calc(var(--cell) * .58); filter: drop-shadow(0 0 4px rgba(255, 210, 87, .6)); }

  .cell.exploded { background: radial-gradient(circle, #ff8a6a, #b3121f) !important; color: #fff; animation: explode .35s ease-out; font-family: system-ui; }
  @keyframes explode { 30% { transform: scale(1.35); } }

  .cell.reveal-mine { background: linear-gradient(160deg, #3a1a22, #24121a); }
  .cell.reveal-mine::after { content: ''; font-size: calc(var(--cell) * .58); }
  .cell.wrong-flag { background: linear-gradient(160deg, #4a1c22, #2b1015); }
  .cell.wrong-flag::after { content: '✖'; color: var(--danger); font-size: calc(var(--cell) * .55); }

  .cell.open.n1 { color: #5ab4ff; }
  .cell.open.n2 { color: #3ee08f; }
  .cell.open.n3 { color: #ff6b5f; }
  .cell.open.n4 { color: #a98bff; }
  .cell.open.n5 { color: #ff9a3d; }
  .cell.open.n6 { color: #3fe3e0; }
  .cell.open.n7 { color: #ff6fd8; }
  .cell.open.n8 { color: #c7d2dc; }

  /* ---------- kết quả ---------- */
  .overlay { display: none; position: absolute; inset: 0; z-index: 10; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .result {
    width: min(100%, 320px); padding: 22px 18px 18px; border-radius: 20px; text-align: center;
    background: rgba(12, 18, 25, .92); border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .55);
    animation: pop .35s cubic-bezier(.2, .9, .3, 1.3);
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .overlay-icon { font-size: 52px; line-height: 1; }
  .overlay-title { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: .08em; margin: 10px 0 6px; }
  .overlay-title.win { color: var(--accent); text-shadow: 0 0 14px rgba(46, 245, 154, .5); }
  .overlay-title.lose { color: var(--danger); text-shadow: 0 0 14px rgba(255, 77, 90, .5); }
  .overlay-msg { font-size: 13px; line-height: 1.5; color: var(--text); opacity: .85; }
  .result .row { display: flex; gap: 8px; margin-top: 16px; }
  .result button {
    flex: 1; padding: 12px 0; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer;
    color: var(--text); background: rgba(255, 255, 255, .06); border: 1px solid var(--line);
  }
  .result button.primary { color: #06231a; border: 0; background: linear-gradient(180deg, #7dffc4, var(--accent)); }

  /* ---------- hướng dẫn ---------- */
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 12px; color: var(--dim); text-align: center; }
  .legend b { color: var(--text); font-weight: 700; }
  footer { margin-top: 6px; font-size: 10px; color: rgba(160, 180, 195, .45); text-align: center; }
</style>

<body>

<div class="wrapper">
  <header>
    <div class="logo"><i class="fa-solid fa-bomb" aria-hidden="true"></i></div>
    <div>
      <div class="title">DÒ MÌN</div>
      <div class="subtitle">Cẩn thận nó phát nổ</div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-label">Mìn còn lại</div><div class="stat-value" id="mine-count">080</div></div>
    <div class="stat"><div class="stat-label">Thời gian</div><div class="stat-value" id="timer">000</div></div>
    <div class="stat"><div class="stat-label">Ô đã mở</div><div class="stat-value" id="open-count">000</div></div>
    <button class="btn-reset" id="btn-reset" onclick="initGame()" title="Chơi lại" aria-label="Chơi lại">↻</button>
  </div>

  <div class="bar">
    <div class="mode" role="tablist" aria-label="Chế độ chạm">
      <button type="button" data-mode="open" class="on">⛏ Mở ô</button>
      <button type="button" data-mode="flag"><i class="fa-solid fa-flag" aria-hidden="true"></i> Cắm cờ</button>
    </div>
    <div class="status"><div class="status-dot" id="status-dot"></div><span id="status-text">SẴN SÀNG</span></div>
  </div>

  <div class="grid-container" id="grid-container">
    <div class="grid-blur-wrapper" id="grid-blur-wrapper"><div id="grid"></div></div>
    <div class="overlay" id="overlay">
      <div class="result">
        <div class="overlay-icon" id="overlay-icon"></div>
        <div class="overlay-title" id="overlay-title"></div>
        <div class="overlay-msg" id="overlay-msg"></div>
        <div class="row">
          <button type="button" id="btn-review" onclick="reviewBoard()">XEM LẠI</button>
          <button type="button" class="primary" onclick="initGame()">↻ CHƠI LẠI</button>
        </div>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><b>Chạm</b> mở ô</span>
    <span><b>Giữ lâu</b> hoặc chế độ <i class="fa-solid fa-flag" aria-hidden="true"></i> để cắm cờ</span>
    <span><b>Chạm số</b> đã đủ cờ để mở nhanh xung quanh</span>
  </div>
  <footer class="tbFooter">Version: D20261027174003 &gt;&gt;&gt; developed by Tran Gia Bao</footer>
</div>

<script>
// Bàn 22×16 (80 mìn); màn hình dọc thì xoay thành 16×22 cho vừa chiều ngang
const MINES = 80;
let COLS = 22, ROWS = 16;
let board = [], revealed = [], flagged = [];
let gameOver = false, gameWon = false, firstClick = true;
let timerInterval = null, seconds = 0;
let openCount = 0, flagCount = 0;
let tapMode = 'open';
let cells = [];

function fmt(n) { return String(n).padStart(3, '0'); }

function blurGrid() { document.getElementById('grid-blur-wrapper').classList.add('blurred'); }
function unblurGrid() { document.getElementById('grid-blur-wrapper').classList.remove('blurred'); }

// ── Trạng thái ─────────────────────────────────────────────
function setStatus(dotClass, msg, noAnim) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot';
  if (dotClass === 'dot-red') dot.classList.add('red');
  else if (dotClass === 'dot-gold') dot.classList.add('gold');
  const el = document.getElementById('status-text');
  if (noAnim) { el.textContent = msg; return; }
  el.classList.add('blink-out');
  setTimeout(() => { el.textContent = msg; el.classList.remove('blink-out'); }, 250);
}

function reviewBoard() {
  document.getElementById('overlay').classList.remove('show');
  unblurGrid();
  setStatus('dot-gold', 'CHẾ ĐỘ XEM LẠI', true);
}

// ── Chế độ chạm (mở ô / cắm cờ) ────────────────────────────
document.querySelectorAll('.mode button').forEach(b => {
  b.addEventListener('click', () => {
    tapMode = b.dataset.mode;
    document.querySelectorAll('.mode button').forEach(x => x.classList.toggle('on', x === b));
  });
});

// ── Khởi tạo ───────────────────────────────────────────────
function pickLayout() {
  const portrait = window.innerHeight > window.innerWidth && window.innerWidth < 700;
  COLS = portrait ? 16 : 22;
  ROWS = portrait ? 22 : 16;
}

function fitCells() {
  const box = document.getElementById('grid-container');
  const grid = document.getElementById('grid');
  const avail = box.clientWidth - 20;
  const size = Math.max(16, Math.min(34, Math.floor((avail - (COLS - 1) * 2) / COLS)));
  grid.style.setProperty('--cell', size + 'px');
}

function initGame() {
  clearInterval(timerInterval);
  seconds = 0; openCount = 0; flagCount = 0;
  gameOver = false; gameWon = false; firstClick = true;
  pickLayout();

  board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  revealed = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  flagged = Array.from({ length: ROWS }, () => Array(COLS).fill(false));

  document.getElementById('timer').textContent = '000';
  document.getElementById('timer').className = 'stat-value';
  document.getElementById('mine-count').textContent = fmt(MINES);
  document.getElementById('mine-count').className = 'stat-value';
  document.getElementById('open-count').textContent = '000';
  document.getElementById('overlay').classList.remove('show');
  unblurGrid();
  setStatus('dot-green', 'SẴN SÀNG · chạm một ô để bắt đầu', true);
  renderGrid();
}

// ── Đặt mìn (né 3×3 quanh ô đầu tiên) ──────────────────────
function placeMines(safeR, safeC) {
  const safe = new Set();
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      const nr = safeR + dr, nc = safeC + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) safe.add(nr * COLS + nc);
    }
  let placed = 0;
  while (placed < MINES) {
    const r = Math.floor(Math.random() * ROWS);
    const c = Math.floor(Math.random() * COLS);
    if (!safe.has(r * COLS + c) && board[r][c] !== -1) { board[r][c] = -1; placed++; }
  }
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] === -1) continue;
      let cnt = 0;
      forNeighbors(r, c, (nr, nc) => { if (board[nr][nc] === -1) cnt++; });
      board[r][c] = cnt;
    }
}

function forNeighbors(r, c, fn) {
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) fn(nr, nc);
    }
}

// ── Vẽ bàn ─────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${COLS}, var(--cell))`;
  grid.innerHTML = '';
  cells = [];
  for (let r = 0; r < ROWS; r++) {
    cells.push([]);
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      grid.appendChild(cell);
      cells[r].push(cell);
    }
  }
  fitCells();
}

function getCell(r, c) { return cells[r] && cells[r][c]; }

function updateCell(r, c) {
  const el = getCell(r, c);
  if (!el) return;
  el.className = 'cell';
  el.textContent = '';
  if (flagged[r][c]) { el.classList.add('flagged'); return; }
  if (!revealed[r][c]) return;
  el.classList.add('open');
  const v = board[r][c];
  if (v > 0) { el.classList.add(`n${v}`); el.textContent = v; }
}

// ── Thao tác: chạm / giữ lâu / chuột phải ──────────────────
const grid = document.getElementById('grid');
let press = null;

function cellOf(e) {
  const el = e.target.closest && e.target.closest('.cell');
  return el ? [+el.dataset.r, +el.dataset.c] : null;
}

grid.addEventListener('pointerdown', e => {
  const rc = cellOf(e);
  if (!rc || e.button > 0) return;
  press = { rc, x: e.clientX, y: e.clientY, long: false };
  press.timer = setTimeout(() => {
    if (!press) return;
    press.long = true;
    toggleFlag(...press.rc);
    if (navigator.vibrate) navigator.vibrate(25);
  }, 420);
});
grid.addEventListener('pointermove', e => {
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.timer); press = null; }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => grid.addEventListener(t, e => {
  if (!press) return;
  clearTimeout(press.timer);
  const p = press; press = null;
  if (t !== 'pointerup' || p.long) return;
  const rc = cellOf(e);
  if (!rc || rc[0] !== p.rc[0] || rc[1] !== p.rc[1]) return;
  if (tapMode === 'flag') toggleFlag(...rc); else reveal(...rc);
}));
grid.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (press) { clearTimeout(press.timer); press = null; }
  const rc = cellOf(e);
  if (rc && !(e.pointerType === 'touch')) toggleFlag(...rc);
});

function reveal(r, c) {
  if (gameOver || gameWon || flagged[r][c]) return;
  if (revealed[r][c]) { chord(r, c); return; }
  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    startTimer();
    setStatus('dot-green', 'ĐANG DÒ MÌN · chúc may mắn!');
  }
  if (board[r][c] === -1) { triggerExplosion(r, c); return; }
  openCell(r, c);
  checkWin();
}

// Chạm vào số đã có đủ cờ xung quanh: mở hết các ô còn lại quanh nó
function chord(r, c) {
  const v = board[r][c];
  if (v <= 0) return;
  let flags = 0;
  forNeighbors(r, c, (nr, nc) => { if (flagged[nr][nc]) flags++; });
  if (flags !== v) return;
  let boom = null;
  forNeighbors(r, c, (nr, nc) => {
    if (flagged[nr][nc] || revealed[nr][nc]) return;
    if (board[nr][nc] === -1) { if (!boom) boom = [nr, nc]; }
    else openCell(nr, nc);
  });
  if (boom) { triggerExplosion(...boom); return; }
  checkWin();
}

function toggleFlag(r, c) {
  if (gameOver || gameWon || revealed[r][c]) return;
  flagged[r][c] = !flagged[r][c];
  flagCount += flagged[r][c] ? 1 : -1;
  updateCell(r, c);
  const rem = MINES - flagCount;
  document.getElementById('mine-count').textContent = fmt(Math.max(0, rem));
  document.getElementById('mine-count').className = rem <= 10 ? 'stat-value danger' : 'stat-value';
}

function openCell(r, c) {
  // mở lan bằng hàng đợi (không đệ quy sâu)
  const q = [[r, c]];
  while (q.length) {
    const [y, x] = q.pop();
    if (revealed[y][x] || flagged[y][x]) continue;
    revealed[y][x] = true;
    openCount++;
    updateCell(y, x);
    if (board[y][x] === 0) forNeighbors(y, x, (nr, nc) => { if (!revealed[nr][nc]) q.push([nr, nc]); });
  }
  document.getElementById('open-count').textContent = fmt(openCount);
}

// ── Nổ ─────────────────────────────────────────────────────
function triggerExplosion(r, c) {
  gameOver = true;
  clearInterval(timerInterval);
  const el = getCell(r, c);
  if (el) { el.className = 'cell exploded'; el.textContent = '💥'; }
  setStatus('dot-red', 'KÍCH NỔ · NHIỆM VỤ THẤT BẠI');
  document.getElementById('timer').className = 'stat-value danger';
  if (navigator.vibrate) navigator.vibrate([60, 40, 120]);

  setTimeout(() => {
    for (let i = 0; i < ROWS; i++) for (let j = 0; j < COLS; j++) {
      const cell = getCell(i, j);
      if (!cell) continue;
      if (board[i][j] === -1 && !(i === r && j === c)) {
        if (!flagged[i][j]) cell.classList.add('reveal-mine');
      } else if (flagged[i][j] && board[i][j] !== -1) {
        cell.classList.remove('flagged');
        cell.classList.add('wrong-flag');
      }
    }
    blurGrid();
    showOverlay(false, seconds);
  }, 650);
}

// ── Thắng ──────────────────────────────────────────────────
function checkWin() {
  if (gameOver || gameWon) return;
  if (openCount === ROWS * COLS - MINES) {
    gameWon = true;
    clearInterval(timerInterval);
    setStatus('dot-gold', `HOÀN THÀNH · ${seconds} giây`);
    for (let i = 0; i < ROWS; i++) for (let j = 0; j < COLS; j++) if (board[i][j] === -1 && !flagged[i][j]) { flagged[i][j] = true; updateCell(i, j); }
    document.getElementById('mine-count').textContent = '000';
    blurGrid();
    showOverlay(true, seconds);
  }
}

function showOverlay(win, time) {
  document.getElementById('overlay-icon').textContent = win ? '🏆' : '💀';
  const t = document.getElementById('overlay-title');
  t.className = 'overlay-title ' + (win ? 'win' : 'lose');
  t.textContent = win ? 'HOÀN THÀNH!' : 'THẤT BẠI!';
  document.getElementById('overlay-msg').textContent = win
    ? `Xuất sắc! Bạn đã rà phá ${MINES} quả mìn trong ${time} giây.`
    : `Một quả mìn đã phát nổ sau ${time} giây.`;
  document.getElementById('btn-review').style.display = win ? 'none' : '';
  document.getElementById('overlay').classList.add('show');
}

// ── Đồng hồ ────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    const t = document.getElementById('timer');
    t.textContent = fmt(Math.min(seconds, 999));
    t.className = seconds > 400 ? 'stat-value danger' : seconds > 200 ? 'stat-value warn' : 'stat-value';
  }, 1000);
}

// Xoay màn hình trước khi bắt đầu: đổi bố cục; đang chơi dở thì chỉ co giãn ô
window.addEventListener('resize', () => {
  if (firstClick) { const c = COLS; pickLayout(); if (c !== COLS) initGame(); else fitCells(); }
  else fitCells();
});

initGame();
</script>
