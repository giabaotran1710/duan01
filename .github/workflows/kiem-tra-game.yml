# Mở thử mọi game ở màn điện thoại dọc và ngang mỗi khi có pull request (xem tool/kiem-tra-game.js).
# Báo đỏ khi có game lỗi JavaScript hoặc thiếu file; tràn ngang / phải cuộn chỉ ghi trong log.
name: Kiểm tra game
on:
  pull_request:
  workflow_dispatch:
jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node tool/kiem-tra-game.js
