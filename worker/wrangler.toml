name = "duan01-scores"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Các trang được gọi API, cách nhau bởi dấu phẩy. "*" = cho phép mọi nơi.
ALLOWED_ORIGINS = "*"

# Không ghi database_id: Cloudflare tự tạo cơ sở dữ liệu D1 ở lần triển khai đầu tiên.
[[d1_databases]]
binding = "DB"
database_name = "duan01-scores"
