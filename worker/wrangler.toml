name = "duan01-scores"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Các trang được gọi API, cách nhau bởi dấu phẩy. "*" = cho phép mọi nơi.
ALLOWED_ORIGINS = "*"

[[d1_databases]]
binding = "DB"
database_name = "duan01-scores"
# database_id sẽ được điền sau khi chạy `npx wrangler d1 create duan01-scores`
database_id = "THAY-BANG-ID-THAT"
