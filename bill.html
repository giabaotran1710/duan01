<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách nợ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#101010;
    color:#fff;
    padding:14px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

h1{
    margin-bottom:14px;
    font-size:24px;
}

/* =========================
   FORM
========================= */

.form{
    background:#191919;
    border:1px solid #333;
    border-radius:12px;
    padding:12px;
}

.input-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.field label{
    display:block;
    margin-bottom:5px;
    font-size:12px;
    color:#aaa;
}

.field input{
    width:100%;
    height:42px;
    padding:0 10px;
    border:1px solid #444;
    border-radius:8px;
    background:#111;
    color:#fff;
    font-size:14px;
    outline:none;
}

.field input:focus{
    border-color:#888;
}

.type-row{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.type-option{
    flex:1;
    position:relative;
}

.type-option input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.type-label{
    display:flex;
    align-items:center;
    justify-content:center;
    height:38px;
    border:1px solid #444;
    border-radius:8px;
    background:#111;
    color:#999;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.type-option.borrow input:checked + .type-label{
    color:#ff6565;
    border-color:#c84242;
    background:#211313;
}

.type-option.repay input:checked + .type-label{
    color:#67dc78;
    border-color:#429550;
    background:#132017;
}

.save-btn{
    width:100%;
    height:42px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#000;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:active{
    transform:scale(.98);
}

/* =========================
   COUNT
========================= */

.count{
    margin:14px 2px 8px;
    color:#777;
    font-size:12px;
}

/* =========================
   DANH SÁCH
========================= */

.list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.card{
    min-height:60px;
    padding:8px 10px;

    display:flex;
    align-items:center;
    gap:8px;

    background:#191919;
    border:1px solid #2d2d2d;
    border-radius:9px;

    cursor:pointer;
    transition:background .15s, border-color .15s;
}

.card:active{
    background:#222;
}

.card-info{
    min-width:0;
    flex:1;
}

.name{
    font-size:14px;
    font-weight:bold;
    color:#eee;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.meta{
    display:flex;
    align-items:center;
    gap:6px;

    margin-top:4px;

    min-width:0;
    white-space:nowrap;
    overflow:hidden;
}

.type-text{
    flex-shrink:0;
    font-size:10px;
    font-weight:bold;
}

.type-text.borrow{
    color:#ff6262;
}

.type-text.repay{
    color:#67dc78;
}

.time{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    color:#666;
    font-size:10px;
}

.money{
    flex-shrink:0;
    min-width:115px;
    text-align:right;
    font-size:15px;
    font-weight:bold;
}

.money.borrow{
    color:#ff5555;
}

.money.repay{
    color:#61dc72;
}

.delete-btn{
    width:30px;
    height:30px;
    flex-shrink:0;

    border:none;
    border-radius:7px;

    background:#292929;
    color:#aaa;

    font-size:13px;
    cursor:pointer;
}

.delete-btn:active{
    transform:scale(.92);
}

.empty{
    text-align:center;
    color:#555;
    padding:25px 10px;
    font-size:13px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;

    display:none;
    align-items:flex-end;
    justify-content:center;

    background:rgba(0,0,0,.65);

    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:700px;

    max-height:88vh;
    overflow:auto;

    background:#181818;

    border:1px solid #333;
    border-bottom:none;

    border-radius:16px 16px 0 0;

    padding:16px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:14px;
}

.modal-name{
    font-size:21px;
    font-weight:bold;
    word-break:break-word;
}

.close-btn{
    width:34px;
    height:34px;

    border:none;
    border-radius:8px;

    background:#292929;
    color:#fff;

    font-size:18px;
    cursor:pointer;
}

/* Tổng quan */

.summary{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;

    margin-bottom:14px;
}

.summary-box{
    background:#111;
    border:1px solid #2d2d2d;
    border-radius:9px;
    padding:10px 8px;
}

.summary-label{
    color:#777;
    font-size:10px;
    margin-bottom:5px;
}

.summary-value{
    font-size:14px;
    font-weight:bold;
}

.summary-value.borrow{
    color:#ff5555;
}

.summary-value.repay{
    color:#61dc72;
}

.summary-value.debt{
    color:#ffb84d;
}

.history-title{
    color:#aaa;
    font-size:12px;
    margin-bottom:7px;
}

.history{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.history-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    min-height:52px;

    padding:8px 10px;

    background:#111;
    border:1px solid #292929;
    border-radius:8px;
}

.history-left{
    min-width:0;
}

.history-type{
    font-size:11px;
    font-weight:bold;
}

.history-type.borrow{
    color:#ff6262;
}

.history-type.repay{
    color:#67dc78;
}

.history-time{
    color:#666;
    font-size:10px;
    margin-top:3px;
}

.history-money{
    flex-shrink:0;
    font-size:14px;
    font-weight:bold;
    text-align:right;
}

.history-money.borrow{
    color:#ff5555;
}

.history-money.repay{
    color:#61dc72;
}

/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    body{
        padding:10px;
    }

    h1{
        font-size:21px;
    }

    .money{
        min-width:105px;
        font-size:14px;
    }

    .name{
        font-size:13px;
    }

    .summary-value{
        font-size:13px;
    }

    .modal-box{
        padding:14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>💰 DANH SÁCH NỢ</h1>

    <!-- FORM -->
    <div class="form">

        <div class="input-row">

            <div class="field">
                <label>TÊN</label>

                <input
                    id="name"
                    type="text"
                    placeholder="NHẬP TÊN..."
                    autocomplete="off"
                >
            </div>

            <div class="field">
                <label>SỐ TIỀN (ĐƠN VỊ NGHÌN)</label>

                <input
                    id="money"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    step="1"
                    placeholder="Ví dụ: 500"
                >
            </div>

        </div>

        <div class="type-row">

            <label class="type-option borrow">

                <input
                    id="borrow"
                    type="checkbox"
                    checked
                    onchange="selectType('borrow')"
                >

                <span class="type-label">
                    MƯỢN TIỀN
                </span>

            </label>

            <label class="type-option repay">

                <input
                    id="repay"
                    type="checkbox"
                    onchange="selectType('repay')"
                >

                <span class="type-label">
                    TRẢ TIỀN
                </span>

            </label>

        </div>

        <button
            class="save-btn"
            onclick="saveData()"
        >
            💾 LƯU
        </button>

    </div>

    <div
        class="count"
        id="count"
    >
        0 bản ghi
    </div>

    <div
        class="list"
        id="list"
    ></div>

</div>


<!-- =========================
     CHI TIẾT NGƯỜI
========================= -->

<div
    class="modal"
    id="detailModal"
    onclick="closeModalOutside(event)"
>

    <div
        class="modal-box"
        onclick="event.stopPropagation()"
    >

        <div class="modal-header">

            <div
                class="modal-name"
                id="detailName"
            >
                —
            </div>

            <button
                class="close-btn"
                onclick="closeDetail()"
            >
                ×
            </button>

        </div>

        <div class="summary">

            <div class="summary-box">

                <div class="summary-label">
                    TỔNG MƯỢN
                </div>

                <div
                    class="summary-value borrow"
                    id="totalBorrow"
                >
                    0 ₫
                </div>

            </div>

            <div class="summary-box">

                <div class="summary-label">
                    TỔNG TRẢ
                </div>

                <div
                    class="summary-value repay"
                    id="totalRepay"
                >
                    0 ₫
                </div>

            </div>

            <div class="summary-box">

                <div class="summary-label">
                    CÒN NỢ
                </div>

                <div
                    class="summary-value debt"
                    id="totalDebt"
                >
                    0 ₫
                </div>

            </div>

        </div>

        <div class="history-title">
            LỊCH SỬ GIAO DỊCH
        </div>

        <div
            class="history"
            id="history"
        ></div>

    </div>

</div>


<script>

const STORAGE_KEY = "bao_money_database";

let database =
    JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];


/* =========================
   CHUẨN HÓA TÊN
========================= */

function normalizeName(name){

    return String(name)
        .trim()
        .replace(/\s+/g," ")
        .toUpperCase();

}


/* =========================
   CHỌN LOẠI
========================= */

function selectType(type){

    const borrow =
        document.getElementById("borrow");

    const repay =
        document.getElementById("repay");

    if(type === "borrow"){

        borrow.checked = true;
        repay.checked = false;

    }
    else{

        borrow.checked = false;
        repay.checked = true;

    }
}


/* =========================
   THỜI GIAN
========================= */

function getCurrentTime(){

    const now = new Date();

    const day =
        String(now.getDate()).padStart(2,"0");

    const month =
        String(now.getMonth() + 1).padStart(2,"0");

    const year =
        now.getFullYear();

    const hours =
        String(now.getHours()).padStart(2,"0");

    const minutes =
        String(now.getMinutes()).padStart(2,"0");

    const seconds =
        String(now.getSeconds()).padStart(2,"0");

    return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
}


/* =========================
   LƯU
========================= */

function saveData(){

    const name =
        normalizeName(
            document.getElementById("name").value
        );

    const moneyValue =
        document.getElementById("money").value.trim();

    const borrow =
        document.getElementById("borrow").checked;

    const repay =
        document.getElementById("repay").checked;

    if(!name){

        alert("Vui lòng nhập TÊN.");
        return;

    }

    if(!moneyValue){

        alert("Vui lòng nhập SỐ TIỀN.");
        return;

    }

    if(!borrow && !repay){

        alert("Vui lòng chọn MƯỢN TIỀN hoặc TRẢ TIỀN.");
        return;

    }

    const amount =
        Math.abs(Number(moneyValue)) * 1000;

    if(!Number.isFinite(amount) || amount <= 0){

        alert("Số tiền không hợp lệ.");
        return;

    }

    const item = {

        id: Date.now(),

        name: name,

        money: amount,

        type: borrow
            ? "borrow"
            : "repay",

        createdAt:
            getCurrentTime()

    };

    database.push(item);

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(database)
    );

    clearForm();

    renderData();
}


/* =========================
   HIỂN THỊ DANH SÁCH
========================= */

function renderData(){

    const list =
        document.getElementById("list");

    const count =
        document.getElementById("count");

    count.textContent =
        `${database.length} bản ghi`;

    list.innerHTML = "";

    if(database.length === 0){

        list.innerHTML = `
            <div class="empty">
                Chưa có dữ liệu
            </div>
        `;

        return;
    }

    [...database].reverse().forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.addEventListener(
            "click",
            () => openDetail(item.name)
        );

        const isBorrow =
            item.type === "borrow";

        const moneyClass =
            isBorrow
                ? "borrow"
                : "repay";

        const typeClass =
            isBorrow
                ? "borrow"
                : "repay";

        const typeText =
            isBorrow
                ? "MƯỢN"
                : "TRẢ";

        const moneyText =
            isBorrow
                ? "-" + formatMoney(item.money)
                : "+" + formatMoney(item.money);

        card.innerHTML = `

            <div class="card-info">

                <div class="name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="meta">

                    <div class="type-text ${typeClass}">
                        ${typeText}
                    </div>

                    <div class="time">
                        • ${escapeHTML(item.createdAt || "")}
                    </div>

                </div>

            </div>

            <div class="money ${moneyClass}">
                ${moneyText}
            </div>

            <button
                class="delete-btn"
                onclick="deleteItem(event, ${item.id})"
                aria-label="Xóa"
            >
                ×
            </button>

        `;

        list.appendChild(card);

    });
}


/* =========================
   MỞ CHI TIẾT
========================= */

function openDetail(name){

    const personName =
        normalizeName(name);

    const records =
        database.filter(
            item =>
                normalizeName(item.name) === personName
        );

    if(records.length === 0){
        return;
    }

    let totalBorrow = 0;
    let totalRepay = 0;

    records.forEach(item => {

        if(item.type === "borrow"){
            totalBorrow += Number(item.money);
        }
        else{
            totalRepay += Number(item.money);
        }

    });

    const debt =
        totalBorrow - totalRepay;

    document.getElementById("detailName")
        .textContent = personName;

    document.getElementById("totalBorrow")
        .textContent = formatMoney(totalBorrow);

    document.getElementById("totalRepay")
        .textContent = formatMoney(totalRepay);

    const debtElement =
        document.getElementById("totalDebt");

    if(debt > 0){

        debtElement.textContent =
            "-" + formatMoney(debt);

        debtElement.style.color =
            "#ff5555";

    }
    else if(debt < 0){

        debtElement.textContent =
            "+" + formatMoney(Math.abs(debt));

        debtElement.style.color =
            "#61dc72";

    }
    else{

        debtElement.textContent =
            "0 ₫";

        debtElement.style.color =
            "#67dc78";
    }

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    [...records].reverse().forEach(item => {

        const row =
            document.createElement("div");

        row.className = "history-row";

        const isBorrow =
            item.type === "borrow";

        const typeText =
            isBorrow
                ? "MƯỢN TIỀN"
                : "TRẢ TIỀN";

        const typeClass =
            isBorrow
                ? "borrow"
                : "repay";

        const moneyClass =
            isBorrow
                ? "borrow"
                : "repay";

        const moneyText =
            isBorrow
                ? "-" + formatMoney(item.money)
                : "+" + formatMoney(item.money);

        row.innerHTML = `

            <div class="history-left">

                <div class="history-type ${typeClass}">
                    ${typeText}
                </div>

                <div class="history-time">
                    ${escapeHTML(item.createdAt || "")}
                </div>

            </div>

            <div class="history-money ${moneyClass}">
                ${moneyText}
            </div>

        `;

        history.appendChild(row);

    });

    document
        .getElementById("detailModal")
        .classList.add("show");
}


/* =========================
   ĐÓNG MODAL
========================= */

function closeDetail(){

    document
        .getElementById("detailModal")
        .classList.remove("show");

}

function closeModalOutside(event){

    if(event.target.id === "detailModal"){
        closeDetail();
    }

}


/* =========================
   XÓA
========================= */

function deleteItem(event,id){

    event.stopPropagation();

    if(!confirm("Xóa bản ghi này?")){
        return;
    }

    database =
        database.filter(
            item => item.id !== id
        );

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(database)
    );

    renderData();
}


/* =========================
   FORMAT TIỀN
========================= */

function formatMoney(value){

    return Number(value)
        .toLocaleString("vi-VN") + " ₫";

}


/* =========================
   RESET FORM
========================= */

function clearForm(){

    document.getElementById("name").value = "";

    document.getElementById("money").value = "";

    /*
       Sau khi lưu:
       MƯỢN TIỀN tiếp tục được chọn mặc định.
    */

    document.getElementById("borrow").checked = true;

    document.getElementById("repay").checked = false;

    document.getElementById("name").focus();
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   TÊN TỰ ĐỘNG VIẾT HOA
========================= */

document
    .getElementById("name")
    .addEventListener("input", function(){

        const position =
            this.selectionStart;

        this.value =
            this.value.toUpperCase();

        try{

            this.setSelectionRange(
                position,
                position
            );

        }catch(e){}

    });


/* =========================
   ENTER ĐỂ LƯU
========================= */

document
    .getElementById("money")
    .addEventListener("keydown", function(e){

        if(e.key === "Enter"){
            saveData();
        }

    });


/* =========================
   CHUẨN HÓA DỮ LIỆU CŨ
========================= */

function normalizeExistingData(){

    let changed = false;

    database = database.map(item => {

        const normalized =
            normalizeName(item.name);

        if(item.name !== normalized){

            changed = true;

            return {
                ...item,
                name: normalized
            };

        }

        return item;

    });

    if(changed){

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(database)
        );

    }
}


/* =========================
   KHỞI ĐỘNG
========================= */

normalizeExistingData();

renderData();

</script>

</body>
</html>
