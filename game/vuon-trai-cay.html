<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vườn Trái Cây - Đang bảo trì</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#3b2a14;
    background:linear-gradient(180deg,#bfe8ff 0%,#e4f7d4 55%,#8fd06a 100%)}
  .card{max-width:420px;width:100%;text-align:center;background:#fffaf0;border:4px solid #7cc35a;
    border-radius:24px;padding:32px 24px;box-shadow:0 10px 30px rgba(60,110,30,.25)}
  .fruits{font-size:48px;letter-spacing:6px;margin-bottom:12px}
  .fruits span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  .fruits span:nth-child(2){animation-delay:.2s}.fruits span:nth-child(3){animation-delay:.4s}
  .fruits span:nth-child(4){animation-delay:.6s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{font-size:28px;color:#3f8f2a;margin-bottom:8px}
  h2{font-size:20px;color:#e0712b;margin-bottom:16px}
  p{font-size:16px;line-height:1.5;margin-bottom:24px}
  a.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:17px;color:#fff;
    background:linear-gradient(180deg,#ffb23f,#f07c1c);padding:12px 28px;border-radius:999px;
    box-shadow:0 4px 0 #c45f10}
  a.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c45f10}
</style>
</head>
<body>
  <div class="card">
    <div class="fruits"><span>🍓</span><span>🍊</span><span>🍇</span><span>🍉</span></div>
    <h1>Vườn Trái Cây</h1>
    <h2>🛠️ Đang bảo trì</h2>
    <p>Khu vườn đang được chăm sóc và nâng cấp.<br>Bạn quay lại sau nhé!</p>
    <a class="btn" href="../index.html">← Về trang chủ</a>
  </div>
</body>
</html>
