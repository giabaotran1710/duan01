async function spawnRainbow(){ // thanh cầu vồng đầy: cầu vồng bay từ thanh vào 1 quả thường và thay thế nó

async function useHammer(r,c){ // búa: phá 1 ô (trái cây, mật ong, mầm, sâu, hộp gỗ, hũ đã có mứt), không tốn lượt
 if(st.busy||st.over||st.paused)return;
 const t=st.g[r][c],cr=st.wall[r][c]&&(st.hp[r][c]>0||isPot(r,c)||isCake(r,c)||isIceB(r,c)||isBug(r,c));
 if(!cr&&(!t||(t.s===5&&!t.ic)||t.pz)){toast('Hãy chọn một ô khác');return}

 st.busy=true;st.sel=null;await toolAnim('hammer',r,c);fx.push({k:'r',r,c,life:.4});shake=.8;beep(130,.2,'square',.08);

const QT={win:{t:'Thắng {n} màn',n:[1,2,4]},fruit:{t:'Phá {n} trái cây',n:[120,300,700]},spec:{t:'Nổ {n} quả đặc biệt',n:[4,10,22]},obs:{t:'Phá {n} lớp vật cản',n:[15,40,90]},rain:{t:'Nhận {n} cầu vồng từ thanh tích điểm',n:[1,2,4]},tool:{t:'Dùng {n} vật phẩm hỗ trợ',n:[1,3,5]},streak:{t:'Đạt chuỗi {n} trận thắng',n:[0,2,3]}}; // n theo độ khó Dễ/Thường/Khó (0 = không có ở mức đó)
const QRW=[[[{k:'hammer',n:1}],[{k:'glove',n:1}],[{k:'r2',n:1}]], // phần thưởng (tối đa 2 vật phẩm) theo độ khó
 [[{k:'rake',n:1}],[{k:'br',n:1}],[{k:'hammer',n:1},{k:'glove',n:1}],[{k:'r2',n:1},{k:'hammer',n:1}]],
 [[{k:'bw',n:1},{k:'rake',n:1}],[{k:'br',n:1},{k:'rake',n:1}],[{k:'bw',n:1},{k:'hammer',n:2}],[{k:'rake',n:2},{k:'r2',n:1}]]];
const LOGIN=[[{k:'coin',n:30}],[{k:'hammer',n:1}],[{k:'coin',n:50},{k:'rake',n:1}],[{k:'glove',n:1}],[{k:'coin',n:40}],[{k:'r2',n:1}],[{k:'coin',n:120},{k:'bw',n:1},{k:'rake',n:1}]]; // Thứ 2..Chủ nhật: thứ 4 cao hơn, chủ nhật đặc biệt
const qText=q=>QT[q.k].t.replace('{n}',q.n);
let qDirty=false;
function ensureDaily(){ // sang ngày mới: 3 nhiệm vụ mới (Dễ/Thường/Khó), chọn cố định theo ngày
 const d=dayKey();if(save.dq&&save.dq.day===d)return save.dq;
 let s=7;for(const ch of d)s=s*31+ch.charCodeAt(0)|0;const r=rng(s),ks=Object.keys(QT),used=[];
 save.dq={day:d,list:[0,1,2].map(tier=>{const pool=ks.filter(k=>!used.includes(k)&&QT[k].n[tier]>0),k=pool[r()*pool.length|0];used.push(k);return{k,tier,n:QT[k].n[tier],have:0,got:0,rw:QRW[tier][r()*QRW[tier].length|0]}})};
 persist();return save.dq;
}
function quest(k,v){ // cộng tiến độ nhiệm vụ ngày; streak: lấy chuỗi thắng hiện tại
 if(window.SIM||!(v>0))return;jrAdd(k,v);
 for(const q of ensureDaily().list){if(q.k!==k||q.got||q.have>=q.n)continue;q.have=Math.min(q.n,k==='streak'?Math.max(q.have,v):q.have+v);qDirty=true;if(q.have>=q.n)toast(qText(q),'Hoàn thành nhiệm vụ')}
}
function ensureLogin(){const d=new Date(),wd=(d.getDay()+6)%7,wk=dayKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd));if(!save.lg||save.lg.wk!==wk){save.lg={wk,got:[0,0,0,0,0,0,0]};persist()}return wd} // tuần mới bắt đầu từ thứ 2
function grant(list){list.forEach(({k,n})=>{if(k==='coin')save.coins+=n;else if(k in save.inv)save.inv[k]+=n;else save.pre[k]+=n});persist();toast('Nhận: '+list.map(({k,n})=>k==='coin'?n+' xu':n+' '+NAME[k]).join(', '));beep(988,.15,'triangle',.07)}
const rwHtml=rw=>rw.map(({k,n})=>`<span class="rw"><img src="${icon(k==='coin'?'coin':k in PRE?'pre_'+k:k)}" alt="${NAME[k]}" title="${NAME[k]}">${k==='coin'?n:'×'+n}</span>`).join('');

 ['statue','Tạc tượng trái cây',3,1.6,'statue'],['berry','Thu việt quất',20,1.6,'berry'],['hive','Khai thác tổ ong',2,1.6,'hive'],['mold','Dọn nấm mốc',10,1.6,'mold'],['vine','Gỡ dây leo',10,1.6,'vine'],['cake','Phá dưa hấu khổng lồ',1,1.8,'cake'],

 ['coin','Tích lũy xu',200,1.6,'coin'],['best','Điểm cao nhất trong 1 màn',5000,1.4,'🏆']];
const JRD=Object.fromEntries(JR.map(d=>[d[0],d])),JRT={},JRMAX=new Set(['level','ws','best']);
const jrNice=v=>{const p=Math.pow(10,Math.max(0,Math.floor(Math.log10(v))-1));return Math.round(v/p)*p};
function jrTarget(k,i){const T=JRT[k]||(JRT[k]=[JRD[k][2]]),g=JRD[k][3];while(T.length<=i){const a=T[T.length-1];T.push(Math.max(a+1,Math.min(2*a,jrNice(a*g))))}return T[i]} // mốc sau luôn lớn hơn và không quá gấp đôi mốc trước
const jr=()=>save.jr||(save.jr={c:{},m:{},co:save.coins});
function jrAdd(k,v){if(window.SIM||!JRD[k]||!(v>0))return;const J=jr();J.c[k]=(J.c[k]||0)+v}

function jrCoins(){const J=jr();if(save.coins>J.co)J.c.coin=(J.c.coin||0)+save.coins-J.co;J.co=save.coins} // xu nhận thêm (không trừ khi tiêu)

const JRI=['hammer','glove','rake','r2','br','bw'];
const jrReward=i=>[{k:'coin',n:Math.min(400,20+15*i)},...(i%2?[{k:JRI[(i>>1)%6],n:i>=12?2:1}]:[])];
function jrPanel(re){
 jrCoins();jrMax('level',save.level-1);const J=jr(),rows=JR.map(d=>{const k=d[0],i=J.m[k]||0,t=jrTarget(k,i),c=J.c[k]||0;return{d,k,i,t,c,ok:c>=t}}).sort((a,b)=>b.ok-a.ok||b.c/b.t-a.c/a.t);
 modal(`<h2>Hành trình</h2>${rows.map(({d,k,i,t,c,ok})=>`<div class="qr jr${ok?' done':''}">${/^[a-z]/.test(String(d[4]))||typeof d[4]==='number'?`<img class="ji" src="${icon(d[4])}" alt="">`:`<span class="jt">${d[4]}</span>`}<div class="qx"><p>${JRT_[k].replace('{n}',t.toLocaleString('vi-VN'))}</p><div class="qbar"><i style="width:${Math.min(1,c/t)*100}%"></i></div><small>${Math.min(c,t).toLocaleString('vi-VN')}/${t.toLocaleString('vi-VN')}</small></div><div class="rws"><div class="rwl">${rwHtml(jrReward(i))}</div><button class="btn qb" data-k="${k}" ${ok?'':'disabled'}>NHẬN</button></div></div>`).join('')}`,[['Đóng',menuLabel,'alt']],'wide'+(re?' nopop':''));
 $('modal').querySelectorAll('.qb').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(!jrReady(k))return;const i=jr().m[k]||0;jr().m[k]=i+1;grant(jrReward(i));jrCoins();menuLabel();const sc=$('modal').querySelector('.card');const y=sc?sc.scrollTop:0;jrPanel(1);const s2=$('modal').querySelector('.card');if(s2)s2.scrollTop=y});
}

  x.fillStyle='#e53935';x.beginPath();x.arc(18,70,5,0,7);x.fill();

});

 if(!st.drag||!st.sel||st.busy)return;
 const p=pt(e),dx=p.x-st.drag.x,dy=p.y-st.drag.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))<.4)return;
 const horiz=Math.abs(dx)>Math.abs(dy),a=st.sel,b={r:a.r+(horiz?0:Math.sign(dy)),c:a.c+(horiz?Math.sign(dx):0)};
 st.drag=null;st.sel=null;st.tap=null;if(inB(b.r,b.c)&&!st.wall[b.r][b.c])swap(a,b,st.tool==='glove');
});
cv.addEventListener('pointerup',()=>{st.drag=null;const q=st.tap;st.tap=null;if(q&&st.sel&&st.sel.r===q.r&&st.sel.c===q.c)activate(q.r,q.c)});
cv.addEventListener('pointercancel',()=>{st.drag=null;st.tap=null});

(window.claude?window.claude.use('downloads'):Promise.resolve(null)).then(d=>{if(!d)$('bDl').style.display='none'}).catch(()=>{$('bDl').style.display='none'}); // không có quyền tải thì ẩn nút
