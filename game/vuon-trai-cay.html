<style>

.hs{width:22px;height:22px;vertical-align:-4px;margin-left:3px}.hs3{width:34px;height:34px;vertical-align:-10px;filter:hue-rotate(250deg) drop-shadow(0 0 6px #b050ff)}.hs2{width:30px;height:30px;vertical-align:-8px;filter:drop-shadow(0 0 4px #ff5a1a)}
.card img.sk{width:64px;height:64px;animation:wob 1.6s ease-in-out infinite}.card img.sk2{width:108px;height:108px;margin-top:-10px;animation:wob 1.2s ease-in-out infinite,glow 1s ease-in-out infinite alternate}

 #top{grid-column:1;grid-row:1;flex-wrap:wrap;padding:8px 6px 2px 10px;gap:5px}#top .ic{width:40px;height:40px}#top .pill{flex:1 1 60px}#top .pill.mv{flex-basis:100%}
 #goals{grid-column:1;grid-row:2;flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;padding:4px 6px 4px 10px;gap:5px;overflow:auto}
 #bw{grid-column:2;grid-row:1/3;margin-right:72px}} /* màn hình ngang thấp: vật phẩm sang cạnh phải để bàn chơi không bị thu nhỏ */
.mrow{display:flex;gap:12px}
#rside{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px;z-index:2}
.rb{position:relative;width:62px;padding:4px 0 3px;border-radius:14px;border:2px solid var(--wood);background:var(--cream);box-shadow:0 3px 0 var(--wood2);cursor:pointer;display:flex;flex-direction:column;align-items:center;font:800 10.5px "Trebuchet MS",system-ui;color:#5b3a1a}
.rb canvas{width:44px;height:44px}.rb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood2)}
.jr .jt{font-size:22px;width:34px;text-align:center}.jr img.ji{width:34px;height:34px}.jr .lvj{background:#2e9b44}
.qr.jr{border-color:#7cb342;height:84px;box-sizing:border-box;margin:7px 0}.qr.jr .qx p{font-size:14px;line-height:1.2;height:34px;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.qr.jr .rws{width:112px;flex:none;justify-content:center;gap:4px}.qr.jr .rwl{display:flex;justify-content:center;gap:6px}.qr.jr .qb{width:100%;padding:6px 0}.qr.jr .ji,.qr.jr .jt{flex:none}.qr.jr.done{border-color:#f2c200;background:#fffbe6}.btn.mb{position:relative;min-width:0;padding:10px 16px;font-size:17px}
.dot{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:#e5283a;border:2px solid #fff;animation:bump .9s infinite}
.card.wide{width:min(410px,94vw);padding:16px 14px}.card.nopop{animation:none}
.qr{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border-radius:14px;padding:8px;margin:8px 0;border:3px solid;border-left-width:10px}
.qr.t0{border-color:#f2c200}.qr.t1{border-color:#e53935}.qr.t2{border-color:#8e44ad}
.tg{display:inline-block;font:800 12px "Trebuchet MS",system-ui;color:#fff;border-radius:8px;padding:1px 8px}.t0 .tg{background:#e0a800}.t1 .tg{background:#e53935}.t2 .tg{background:#8e44ad}
.qx{flex:1;min-width:0}.card .qx p{margin:3px 0;font-size:15px}.qx small{font-weight:800;font-size:12px;opacity:.75}
.qbar{height:8px;border-radius:4px;background:#eadfca;overflow:hidden}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#9be15d,#2e9b44)}
.rw{display:inline-flex;align-items:center;font:800 13px "Trebuchet MS",system-ui;white-space:nowrap}.card .rw img{width:28px;height:28px}
.qr>.rws{display:flex;flex-direction:column;align-items:center}
.btn.qb{min-width:0;padding:8px 10px;font-size:15px;border-bottom-width:4px}.btn.qb:disabled{filter:grayscale(1);opacity:.55}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.dy{position:relative;background:#fff;border:3px solid #e0b56b;border-radius:12px;padding:4px 2px;font:800 12px "Trebuchet MS",system-ui}.dy>div{display:flex;flex-wrap:wrap;justify-content:center}
.dy.td{border-color:#ff8a1f;box-shadow:0 0 0 3px #ffd54f}.dy.wed{background:#fff3c4}.dy.sun{grid-column:span 2;background:linear-gradient(#ffe9f6,#e8d5ff);border-color:#8e44ad}
.dy.ok::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:#2e9b44;background:rgba(255,255,255,.65);border-radius:9px}.dy.miss{opacity:.45}
.pre,.wsr{display:flex;justify-content:center;gap:10px;margin:6px 0}
.pg{position:relative;width:62px;height:56px;border-radius:14px;border:3px solid var(--wood);background:#fff;padding:0;cursor:pointer}.card .pg img{width:44px;height:44px}
.pg span{position:absolute;right:-8px;top:-8px;min-width:24px;height:22px;padding:0 5px;border-radius:11px;background:#e5283a;color:#fff;font:800 13px/22px "Trebuchet MS",system-ui;border:2px solid #fff}
.pg.on{background:#b9f5a8;box-shadow:0 0 0 3px #fff,0 0 12px 4px #ffd54f}.pg:disabled{opacity:.4}
.wsr figure{margin:0;padding:3px 6px;border-radius:12px;border:2px dashed #e0b56b;font:800 11px "Trebuchet MS",system-ui;opacity:.45}.card .wsr img{width:34px;height:34px}.wsr figure.on{opacity:1;border-style:solid;border-color:#ff8a1f;background:#ffe6b8}
#rbm{--p:0deg;position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;width:56px;height:56px;border-radius:50%;padding:6px;box-sizing:border-box;box-shadow:0 3px 0 var(--wood2); /* vòng cầu vồng: viền tròn là thanh tiến độ */
 background:radial-gradient(var(--cream) 0 21px,transparent 22px),conic-gradient(#e5283a,#ff9a1f,#ffe135,#6dbf3a,#4aa3c7,#8e44ad var(--p),#7a5a3a var(--p))}#rbm img{width:44px;height:44px;display:block}
.pill.bump{animation:bump .4s}
@media (max-height:540px) and (orientation:landscape){#menu{gap:8px}#menu h1{font-size:34px}#menu .row2{display:none}#menu .btn{padding:8px 20px;font-size:17px}}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}
</style></head><body>
<div id="menu" class="scr"><button id="bDl" title="Tải game (.html) về máy" aria-label="Tải game về máy">⬇</button>
 <img class="fl" data-f="0" style="left:8%;top:12%"><img class="fl" data-f="3" style="right:10%;top:18%;animation-delay:.6s"><img class="fl" data-f="1" style="left:14%;bottom:14%;animation-delay:1.2s"><img class="fl" data-f="4" style="right:12%;bottom:20%;animation-delay:.3s">
 <h1>Vườn<br>Trái Cây</h1><div class="row2" id="mrow"></div><div class="cn" id="coins"></div>
 <button class="btn" id="play">Chơi</button><div id="rside"><button class="rb" id="bJr" title="Hành trình" aria-label="Hành trình"><canvas width="88" height="88" data-ui="jr"></canvas>Hành trình<i class="dot hidden"></i></button><button class="rb" id="bQst" title="Nhiệm vụ hằng ngày" aria-label="Nhiệm vụ"><canvas width="88" height="88" data-ui="qst"></canvas>Nhiệm vụ<i class="dot hidden"></i></button><button class="rb" id="bLog" title="Điểm danh hằng ngày" aria-label="Điểm danh"><canvas width="88" height="88" data-ui="cal"></canvas>Điểm danh<i class="dot hidden"></i></button></div><button class="btn alt" id="snd">Âm thanh: Bật</button>
</div>

 <div id="top"><button class="ic" id="pz">⏸</button>

 <div id="goals"></div><div id="bw"><canvas id="cv"></canvas></div>

<script>
'use strict';
// ===== Config =====
const CFG={C:8,R:8,SWAP:.16,GRAV:42,MAXV:26,PTS:20,LEVELS:60,KEY:'vuonTraiCay.v1',DPR:2};
let C=8,R=12; // kích thước bàn (cột D × hàng R) thay đổi theo màn: D 8..13, R 12..23
const COL=['#6dbf3a','#ff9a1f','#ffe135','#8e44ad','#e5283a','#ff6b81','#4157c9']; // kiwi, cam, chanh, nho, dâu, dưa hấu, việt quất (t=6: chỉ sinh ra từ bồn cây, không rơi xuống từ trên)
const BERRY=6,POTN=6; // POTN: số quả việt quất mỗi lần bụi cho trái
// special: 0 thường, 1 quét ngang, 2 quét dọc, 3 bom, 4 cầu vồng, 7 chú ong (ghép 2×2)
const PRICE={hammer:50,glove:45,rake:80},PACK=3; // giá 1 vật phẩm hỗ trợ (xu); mua theo combo 3 cái, trả tiền 3 cái
const PRE={r2:['rocket','rocket'],br:['bomb','rocket'],bw:['bomb','rainbow']}; // vật phẩm đầu game: quả đặc biệt đặt sẵn lên bàn khi bắt đầu màn
const NAME={hammer:'Búa',glove:'Găng tay',rake:'Bồ cào',r2:'Cặp pháo',br:'Bom và pháo',bw:'Bom và cầu vồng',coin:'xu'};
const RBN=8000; // điểm cộng dồn để thanh cầu vồng đầy (mỗi lần nổ tính tối đa 400), khoảng 10-14 lượt được 1 cầu vồng
const MORE=[{c:50,g:[]},{c:90,g:['rocket']},{c:140,g:['bomb','rocket']},{c:200,g:['bomb','rainbow']}]; // mua thêm 5 lượt: lần 1..4 trong một màn, từ lần 5 giữ giá và quà của lần 4
const COIN={win:10,hard:[0,10,25,40],move:2}; // xu nhận khi thắng: cơ bản + thưởng màn khó/siêu khó + mỗi lượt dư
// ===== State =====
const $=id=>document.getElementById(id);
let save={level:1,sound:true,coins:0,inv:{hammer:3,glove:3,rake:2},pre:{r2:1,br:1,bw:0},ws:0,act:0,dq:null,lg:null,jr:null}; // ws: chuỗi thắng, act: đang chơi dở 1 màn, dq: nhiệm vụ ngày, lg: điểm danh tuần

 modal(`<h2>Tạm dừng</h2>${save.ws&&st.ready?`<p class="wal">Chơi lại hoặc về Menu sẽ mất chuỗi thắng ${save.ws} 🔥</p>`:''}`,[['Tiếp tục',()=>{st.paused=false;if(!st.ready)beginLevel([])}],['Chơi lại',()=>{if(st.ready)breakStreak();prelevel(st.level)},'alt'],['Menu',()=>{if(st.ready)breakStreak();toMenu()},'alt']]);
}
function sndLabel(){$('snd').textContent='Âm thanh: '+(save.sound?'Bật':'Tắt')}
// ===== Input =====
const pt=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left-cv.clientLeft)/cs+OX,y:(e.clientY-b.top-cv.clientTop)/cs+OY}};
const inB=(r,c)=>r>=0&&r<R&&c>=0&&c<C;
cv.addEventListener('pointerdown',e=>{
 unlock();st.idle=0;st.hint=null;
 if(!st.playing||st.busy||st.over||st.paused)return;
 e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 const p=pt(e),r=Math.floor(p.y),c=Math.floor(p.x);
 if(st.tool==='hammer'||st.tool==='rake'){if(inB(r,c))(st.tool==='hammer'?useHammer:useRake)(r,c);return}
 if(!inB(r,c)||st.wall[r][c]||(st.g[r][c]&&lock(st.g[r][c])))return;
 if(st.sel&&Math.abs(st.sel.r-r)+Math.abs(st.sel.c-c)===1){const a=st.sel;st.sel=null;st.drag=null;swap(a,{r,c},st.tool==='glove')}
 else{st.sel={r,c};st.drag={x:p.x,y:p.y};if(st.tool==='glove'&&st.tfx){st.tfx.idle=0;tw(st.tfx,{x:c+.15,y:r-.15},.15)}const t=st.g[r][c];st.tap=st.tool!=='glove'&&t&&isSp(t)&&t.s!==7?{r,c}:null} // chạm (không vuốt) vào pháo/bom/cầu vồng -> nổ ngay; ong thì không
});
cv.addEventListener('pointermove',e=>{
 if(!st.drag||!st.sel||st.busy)return;
 const p=pt(e),dx=p.x-st.drag.x,dy=p.y-st.drag.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))<.4)return;
 const horiz=Math.abs(dx)>Math.abs(dy),a=st.sel,b={r:a.r+(horiz?0:Math.sign(dy)),c:a.c+(horiz?Math.sign(dx):0)};
 st.drag=null;st.sel=null;st.tap=null;if(inB(b.r,b.c)&&!st.wall[b.r][b.c])swap(a,b,st.tool==='glove');
});
cv.addEventListener('pointerup',()=>{st.drag=null;const q=st.tap;st.tap=null;if(q&&st.sel&&st.sel.r===q.r&&st.sel.c===q.c)activate(q.r,q.c)});
cv.addEventListener('pointercancel',()=>{st.drag=null;st.tap=null});
$('play').onclick=()=>{unlock();prelevel(save.level)};
$('rbm').querySelector('img').src=icon('rainbow');document.querySelectorAll('.bst').forEach(b=>{b.querySelector('img').src=icon(b.dataset.b);b.onclick=()=>{unlock();pickTool(b.dataset.b)}});
$('snd').onclick=()=>{save.sound=!save.sound;persist();sndLabel()};
$('bDl').onclick=async()=>{unlock();const dl=window.claude?await window.claude.use('downloads'):null; // xin quyền tải file qua nền tảng (không tự tải trực tiếp)
  if(!dl){toast('Bản xem này không cho tải file');return}
  try{await dl.save({filename:'vuon-trai-cay.html',data:'<!doctype html>\n'+document.documentElement.outerHTML});toast('Đã lưu game')}catch(e){toast(e&&e.code==='declined'?'Đã hủy tải':'Không tải được file')}};
(window.claude?window.claude.use('downloads'):Promise.resolve(null)).then(d=>{if(!d)$('bDl').style.display='none'}).catch(()=>{$('bDl').style.display='none'}); // không có quyền tải thì ẩn nút
$('bQst').onclick=()=>{unlock();questPanel()};$('bJr').onclick=()=>{unlock();jrPanel()};document.querySelectorAll('canvas[data-ui]').forEach(drawUI);$('bLog').onclick=()=>{unlock();loginPanel()};
$('pz').onclick=doPause;
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));
document.addEventListener('visibilitychange',()=>{if(document.hidden)doPause()});
document.querySelectorAll('.fl').forEach(e=>e.src=icon(+e.dataset.f));
$('mrow').innerHTML=[2,5].map(i=>`<img src="${icon(i)}" width="56" height="56" alt="">`).join('');
menuLabel();sndLabel();requestAnimationFrame(loop);
</script></body></html>
