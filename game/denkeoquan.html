<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<script src="../maintenance.js?v=20261123a" data-game="denkeoquan"></script>
<script src="../scene.js" data-game="denkeoquan"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171a33">
<title>Đèn kéo quân</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&family=Pattaya&display=swap">
<style>
/* Kế hoạch thiết kế (làm lại): cả màn hình là chiếc đèn kéo quân đêm rằm.
   Chất liệu: gỗ sơn son, giấy dó thắp nến từ bên trong, hình cắt bóng mực, đồng thau. Không dùng kính mờ hay thẻ bo tròn chung chung.
   Nguyên tắc: (1) nến là bộ đếm bước: cây nến ngắn dần, ngọn lửa chạy theo; (2) mỗi bệ/cửa có hình riêng (tròn, lục giác, thoi) nên không phụ thuộc màu;
   (3) góc cắt vát (như thẻ tre, khung đèn) thay cho bo tròn; (4) khoảnh khắc dàn dựng: quay đèn và ba đèn lồng sáng lên khi qua màn. */
:root{
  --night:#0d0f24; --night2:#070816; --paper:#f3dca4; --paper2:#e6bd72; --paper3:#cf9a47;
  --ink:#1b1410; --ink2:#5a4326; --lac:#a8221b; --lac2:#6b130f; --gold:#e0b04a; --gold2:#8f6a22;
  --flame:#ffb13b; --text:#fbecd0; --muted:#c9b48e;
  --a:#c8372a; --b:#2b6ea8; --c:#2f8f5a;
  --head:'Pattaya','Be Vietnam Pro',serif; --body:'Be Vietnam Pro',system-ui,sans-serif;
  --cut6:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  --cut10:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  --cut16:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--night2)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font:500 14px/1.4 var(--body);
  background:
    radial-gradient(1.3px 1.3px at 9% 14%,rgba(255,240,205,.8),transparent 60%),radial-gradient(1.1px 1.1px at 27% 6%,rgba(255,240,205,.6),transparent 60%),
    radial-gradient(1.4px 1.4px at 46% 11%,rgba(255,240,205,.7),transparent 60%),radial-gradient(1px 1px at 64% 4%,rgba(255,240,205,.6),transparent 60%),
    radial-gradient(1.2px 1.2px at 91% 21%,rgba(255,240,205,.7),transparent 60%),radial-gradient(1px 1px at 5% 38%,rgba(255,240,205,.5),transparent 60%),
    radial-gradient(70px 70px at 86% 7%,rgba(255,229,170,.30),transparent 70%),
    radial-gradient(90% 46% at 50% 44%,rgba(255,177,59,.14),transparent 72%),
    linear-gradient(var(--night),var(--night2)) fixed;
  display:flex;flex-direction:column;align-items:center;overflow-x:hidden;touch-action:manipulation}
main{width:100%;max-width:520px;padding:8px 16px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--flame);outline-offset:2px}

/* nắp đèn: mái son có tua, tên màn treo ngay dưới mái */
.top{display:grid;grid-template-columns:44px 1fr 44px 44px;gap:8px;align-items:center;min-height:58px}
.roof{position:relative;height:52px;display:grid;place-items:center;min-width:0}
.roof svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.roof::before{content:'';position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 0 2px var(--lac2)}
.roof h1{position:relative;margin:7px 0 0;font:400 25px/1.25 var(--head);color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:86%}
.ico{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold2);background:rgba(255,236,190,.06);display:grid;place-items:center;color:var(--gold);padding:0}
.ico svg,.act svg,.spinBtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ico:active,.act:active{transform:scale(.94)}

/* thông tin vòng và cây nến đếm bước */
.hud{display:flex;flex-direction:column;gap:9px;padding:0 2px}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:700 12px/1 var(--body);padding:7px 10px;color:var(--ink);background:var(--paper);clip-path:var(--cut6);white-space:nowrap}
.tag.steps{margin-left:auto;background:var(--gold)}
.tag.hintTag{background:#ffd9b0;color:var(--lac2)}
.tag[hidden]{display:none}
.candle{position:relative;height:14px;margin:5px 7px 0 0;border-radius:7px;background:rgba(255,236,190,.07);border:1px solid rgba(224,176,74,.4)}
.wax{position:absolute;left:2px;top:2px;bottom:2px;border-radius:5px;background:linear-gradient(#fff4d6,#e6bd72);transition:width .22s}
.candle.low .wax{background:linear-gradient(#ffd7c9,#d9674a)}
.flame{position:absolute;top:-12px;width:13px;height:19px;margin-left:-6px;pointer-events:none;transition:left .22s;
  background:radial-gradient(60% 55% at 50% 66%,#fff7cf,#ffb13b 60%,#e8561f);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  box-shadow:0 0 14px 4px rgba(255,177,59,.55);animation:flick .9s ease-in-out infinite alternate;transform-origin:50% 90%}
.candle.low .flame{animation-duration:.35s}
@keyframes flick{0%{transform:scale(1,1) rotate(-3deg)}100%{transform:scale(.92,1.12) rotate(3deg)}}

/* bàn chơi: khung đèn sơn son vát góc, giấy sáng từ bên trong */
.lanternWrap{filter:drop-shadow(0 10px 16px rgba(0,0,0,.55))}
.lantern{position:relative;display:flex;justify-content:center;padding:11px;background:linear-gradient(155deg,#b92d23,#6b130f);clip-path:var(--cut16);perspective:900px}
.lantern i{position:absolute;width:9px;height:9px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 0 2px var(--lac2)}
.lantern i:nth-of-type(1){left:3px;top:3px}.lantern i:nth-of-type(2){right:3px;top:3px}.lantern i:nth-of-type(3){left:3px;bottom:3px}.lantern i:nth-of-type(4){right:3px;bottom:3px}
.paperBox{position:relative;border:2px solid var(--gold);background:var(--paper2);box-shadow:inset 0 0 22px rgba(255,177,59,.55),inset 0 0 0 3px rgba(0,0,0,.28);display:flex}
.board{position:relative;transform-style:preserve-3d}
.board canvas{display:block;touch-action:none}
.board.spin{animation:spin .9s cubic-bezier(.45,0,.55,1)}
@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(90deg);filter:brightness(1.6)}50.01%{transform:rotateY(-90deg)}100%{transform:rotateY(0)}}
.board.fade{animation:fade .3s}
@keyframes fade{50%{opacity:.15}}
.board.caught{animation:caught .45s}
@keyframes caught{0%,100%{filter:none}30%{filter:sepia(1) saturate(4) hue-rotate(-40deg) brightness(.8)}}

/* băng giấy treo: mỗi bóng một hàng */
.strip{position:relative;display:flex;flex-direction:column;gap:5px;background:linear-gradient(var(--paper),var(--paper2));color:var(--ink);padding:9px 10px 8px;margin-top:6px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.strip::before,.strip::after{content:'';position:absolute;top:-9px;width:2px;height:9px;background:var(--gold2)}
.strip::before{left:22px}.strip::after{right:22px}
.track{display:flex;align-items:center;gap:8px;min-height:26px;user-select:none;-webkit-user-select:none}
.track[data-i]{cursor:pointer}
.track[data-i]:hover,.track.peek{background:rgba(168,34,27,.12)}
.track .who{flex:none;display:flex;align-items:center}
.track .who em{font-style:normal;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:var(--lac);color:#fff3d0;font-size:12px;font-weight:700;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--lac2)}
.track:last-child .who em{background:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.track .cells{display:flex;gap:2px;flex:1;min-width:0}
.track .cells span{flex:1;min-width:0;height:23px;display:grid;place-items:center;font-size:13px;font-weight:700;background:rgba(27,20,16,.07);color:var(--ink2);border-bottom:2px solid rgba(27,20,16,.18)}
.track .cells span.now{background:rgba(168,34,27,.16);border-bottom-color:var(--lac);color:var(--lac2)}
.track .cells span.done{background:rgba(143,106,34,.3);color:var(--ink);border-bottom-color:var(--gold2)}
.track .cells span.bump{background:var(--lac);color:#fff3d0;border-bottom-color:var(--lac2)}

.msg{min-height:22px;margin:0;font-size:13px;line-height:1.35;text-align:center;color:var(--muted)}
.msg b{color:var(--flame)}
.msg:empty{visibility:hidden}

/* điều khiển: bốn cánh hoa sen và nút chờ ở giữa */
.controls{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:auto}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,52px);gap:5px}
.pad button{border:2px solid var(--gold2);border-radius:50%;background:linear-gradient(#b92d23,#6b130f);color:var(--gold);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 #3d0a07}
.pad button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #3d0a07;filter:brightness(1.15)}
.pad .w{background:linear-gradient(#2a2430,#15101a);color:var(--paper)}
.pad .w svg{width:18px;height:18px;fill:currentColor;stroke:none}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .w{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}
.act{min-height:44px;border:0;background:linear-gradient(var(--paper),var(--paper2));color:var(--ink);display:flex;align-items:center;gap:6px;padding:0 8px;font:700 12px/1.15 var(--body);text-align:left;clip-path:var(--cut10)}
.act svg{width:18px;height:18px;flex:none}
.act.hintBtn{background:linear-gradient(#ffe29a,#f2b53f)}
.spinBtn{grid-column:1/-1;min-height:60px;border:0;background:linear-gradient(#ffd27a,#e8901e);color:var(--ink);font:700 16px/1.2 var(--body);display:flex;align-items:center;justify-content:center;gap:9px;clip-path:var(--cut10);box-shadow:inset 0 -4px 0 rgba(107,19,15,.35)}
.spinBtn svg{width:24px;height:24px;stroke-width:2.4}
.spinBtn:active{transform:translateY(2px)}
.spinBtn:disabled,.act:disabled{opacity:.38;cursor:default}

/* lớp phủ: cuộn giấy chọn màn, qua màn */
.layer{position:fixed;inset:0;background:rgba(7,8,22,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.layer.sheet{align-items:flex-end;padding:0}
.layer.show{display:flex}
.panel{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--paper);color:var(--ink);border:3px solid var(--gold2);padding:0 16px 22px;text-align:center;position:relative;box-shadow:0 0 0 2px var(--lac2),0 24px 50px rgba(0,0,0,.6)}
.panel::before{content:'';display:block;height:16px;margin:0 -16px 14px;background:linear-gradient(#8a5a2b,#4d2c10);border-bottom:3px solid var(--gold2)}
.panel h2{font:400 34px/1.25 var(--head);color:var(--lac);margin:0 0 2px}
.layer.sheet .panel{max-width:520px;max-height:90%;border-bottom:0}
.grab{display:none}
.sum{font-size:14px;color:var(--ink2);margin:0 0 12px}
.panel p{margin:6px 0 12px;color:var(--ink2)}
.panel h3{display:flex;align-items:center;gap:8px;font:700 14px/1.25 var(--body);color:var(--lac2);margin:18px 0 8px;text-align:left}
.panel h3::before{content:'';width:8px;height:8px;background:var(--lac);transform:rotate(45deg);flex:none}
.string{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.string[hidden]{display:none}
.intro{width:100%;margin-top:8px;min-height:48px;border:2px solid var(--gold2);background:rgba(27,20,16,.06);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 14px;clip-path:var(--cut10)}
.intro small{font-weight:500;color:var(--ink2)}
.intro svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.intro[aria-expanded=true] svg{transform:rotate(180deg)}
.lv{position:relative;aspect-ratio:1;border:2px solid var(--gold2);border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff3cf,var(--paper2));color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.lv b{font:700 20px/1 var(--body);color:var(--ink)}
.lv i{font-style:normal;font-size:9px;color:var(--lac);letter-spacing:1px}
.lv:active{transform:scale(.95)}
.lv:disabled{opacity:.4;cursor:default;background:#cdbb92}
.rndRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.rnd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;border:2px solid var(--gold2);background:rgba(27,20,16,.06);color:var(--ink);font-weight:700;clip-path:var(--cut10)}
.rnd small{font-weight:500;color:var(--ink2);min-height:14px}
.rnd:active{background:rgba(168,34,27,.15)}
.lant{width:34px;height:48px;overflow:visible}
.lant .cap{fill:var(--gold2)}.lant .tas{stroke:var(--gold2);fill:none;stroke-width:2;stroke-linecap:round}
.lant .body{fill:var(--lc,#c8372a);stroke:var(--gold2);stroke-width:1.5}
.lant .rib{stroke:rgba(255,236,190,.55);stroke-width:1.2;fill:none}
.lant.off .body{fill:#8a7d68}.lant.off .rib{stroke:rgba(255,255,255,.25)}
.lant.on{filter:drop-shadow(0 0 7px rgba(255,177,59,.9))}
.daily{width:100%;margin-top:10px;min-height:54px;border:2px solid var(--gold);background:linear-gradient(var(--lac),var(--lac2));color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 14px;clip-path:var(--cut10)}
.daily small{font-weight:500;color:#ffd7a0}
.daily .seal{font:700 12px/1 var(--body);color:var(--lac2);background:var(--paper);padding:6px 8px;clip-path:var(--cut6)}
.genMsg{min-height:20px;font-size:13px;color:var(--ink2);margin:8px 0 0}
.winL{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:10px 0 6px;min-height:64px}
.winL .lant{width:44px;height:62px}
.winL .lant:nth-child(2){width:52px;height:72px}
.winL .lant.on{animation:lightUp .5s both}
@keyframes lightUp{0%{opacity:.3;transform:translateY(8px) scale(.85)}100%{opacity:1;transform:none}}
.why{font-size:13px;text-align:left;margin:0 auto 12px;max-width:300px;padding-left:18px;color:var(--ink2)}
.note{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--lac2)}
.big{width:100%;min-height:54px;border:0;background:linear-gradient(var(--lac),var(--lac2));color:var(--gold);font-weight:700;font-size:16px;margin-top:6px;clip-path:var(--cut10)}
.ghost{width:100%;min-height:46px;border:2px solid var(--gold2);background:transparent;color:var(--ink);font-weight:700;margin-top:8px;clip-path:var(--cut10)}

@media (max-width:380px){
  .controls{gap:8px}
  .pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,46px);gap:4px}
  .pad button svg{width:22px;height:22px}
  .act{font-size:11.5px;padding:0 6px;gap:4px}.act svg{width:16px;height:16px}
  .spinBtn{font-size:14px;min-height:52px}
}
@media (orientation:landscape) and (max-height:560px){
  main{max-width:900px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;column-gap:16px}
  .top{grid-column:1/-1}
  .left{grid-row:2}.right{grid-row:2;display:flex;flex-direction:column;gap:8px;justify-content:center}
  .controls{margin-top:0}
}
.left,.right{display:flex;flex-direction:column;gap:10px}
.right{flex:1}
@media (prefers-reduced-motion:reduce){.flame{animation:none}.board.spin{animation:fade .3s}.winL .lant.on{animation:none}}
</style>

<body>
<main>
  <header class="top">
    <button class="ico" id="menuBtn" aria-label="Chọn màn" title="Chọn màn" data-no-scene><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
    <div class="roof"><svg viewBox="0 0 200 50" preserveAspectRatio="none" aria-hidden="true"><path d="M3 47 C6 39 16 37 25 35 L51 13 C80 -1 120 -1 149 13 L175 35 C184 37 194 39 197 47 Z" fill="#a8221b" stroke="#e0b04a" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M26 41 H174" stroke="#e0b04a" stroke-width="1.5" opacity=".55" vector-effect="non-scaling-stroke"/></svg><h1 id="lvTitle">Đèn kéo quân</h1></div>
    <button class="ico" id="tipBtn" aria-label="Nhắc lại luật của màn này" title="Luật" data-no-scene><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.8.4-1.1.9-1.1 1.7"/><path d="M12 17h.01"/></svg></button>
    <button class="ico" id="resetBtn" aria-label="Làm lại màn" title="Làm lại màn" data-no-scene><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </header>
  <div class="left">
    <div class="hud">
      <div class="tags"><span class="tag" id="loopTxt">Vòng 1</span><span class="tag" id="shTxt">Bóng 0/1</span><span class="tag hintTag" id="hintTag" hidden>Không tính điểm</span><span class="tag steps" id="stepTxt">0/12</span></div>
      <div class="candle" id="candle" aria-hidden="true"><span class="wax" id="wax"></span><span class="flame" id="flame"></span></div>
    </div>
    <div class="lanternWrap"><div class="lantern"><i></i><i></i><i></i><i></i><div class="paperBox"><div class="board" id="board"><canvas id="cv" aria-label="Bàn chơi" role="img"></canvas></div></div></div></div>
  </div>
  <div class="right">
    <div class="strip" id="strip" aria-label="Dải bước"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="controls">
      <div class="pad" role="group" aria-label="Di chuyển">
        <button class="u" data-a="U" aria-label="Lên"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="l" data-a="L" aria-label="Trái"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="w" data-a="W" aria-label="Đứng chờ một bước"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
        <button class="r" data-a="R" aria-label="Phải"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="d" data-a="D" aria-label="Xuống"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div class="acts">

<script>
(function () {
  'use strict';
  const C = window.DKQ, LEVELS = window.DKQ_LEVELS, GEN = window.DKQ_GEN;
  const SAVE = 'denkeoquan_v1';
  const ARROW = { U: '↑', D: '↓', L: '←', R: '→', W: '·' };
  const PLATE = { a: 'var(--a)', b: 'var(--b)', c: 'var(--c)' };
  const PLATE_HEX = { A: '#d9472b', B: '#2e7fbf', C: '#3f9a52' };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');

  let save = load();
  let lvIdx = 0, lv = null, g = null, mode = { kind: 'story' }, hintPath = null, hintState = null, solCache = null;
  let shadows = [], moves = '', sim = null, won = false, busy = false, hintUsed = false;
  let anim = null, vapNow = [], peek = -1, bumpAt = 0, tile = 48, dpr = 1, staticLayer = null;

  function load() {
    try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.stars) return s; } catch (e) {}
    return { unlocked: 0, stars: {}, steps: {} };
  }
  if (!save.rand) save.rand = {};
  if (!save.daily) save.daily = {};
  // Điểm bảng xếp hạng: tổng sao màn cốt truyện + mỗi đèn ngẫu nhiên đã qua (Vừa 1, Khó 2, Rất khó 3)
  function score() {
    const sum = o => Object.keys(o || {}).reduce((t, k) => t + (+o[k] || 0), 0);
    const w = { vua: 1, kho: 2, rkho: 3 };
    return sum(save.stars) + Object.keys(save.rand || {}).reduce((t, k) => t + (w[k] || 0) * save.rand[k], 0);
  }
  function submitScore() { try { if (window.Scores && score() > 0) Scores.submit('denkeoquan', score()); } catch (e) {} }
  function store() { try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) {} }

  // ---------- âm thanh tổng hợp ----------
  let ac = null;
  function tone(f, d, type, vol, slide) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
      o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
      gn.gain.setValueAtTime(vol || .12, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) {}
  }
  const sfx = {
    step: () => tone(880, .06, 'square', .04),
    bump: () => tone(160, .12, 'sine', .14),
    gate: () => tone(420, .1, 'triangle', .08, 620),
    crack: () => { tone(120, .18, 'sawtooth', .09, 50); setTimeout(() => tone(80, .2, 'triangle', .07, 40), 90); },
    spin: () => { for (let i = 0; i < 6; i++) setTimeout(() => tone(300 + i * 40, .05, 'square', .04), i * 120); setTimeout(() => tone(700, .25, 'sine', .08, 1200), 760); },
    caught: () => { tone(220, .12, 'square', .1); setTimeout(() => tone(140, .3, 'sawtooth', .08, 70), 110); },
    win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .22, 'triangle', .1), i * 110)),
  };

  // ---------- màn ----------
  function startLevel(i) { lvIdx = i; playLevel(LEVELS[i], { kind: 'story' }); }

  function playLevel(level, m) {
    lv = level; mode = m; g = C.parse(lv); solCache = lv.solution || null;
    shadows = []; moves = ''; won = false; peek = -1; anim = null; sim = null; busy = false; hintPath = null; hintState = null; hintUsed = false;
    $('lvTitle').textContent = m.kind === 'story' ? 'Màn ' + (lvIdx + 1)
      : m.kind === 'daily' ? 'Hôm nay ' + dayLabel(m.seed)
      : GEN.DIFF[m.key].label;
    $('lvTitle').title = m.kind === 'rand' ? 'Mã màn ' + m.seed : lv.name || '';
    $('lvTitle').dataset.seed = m.seed || '';
    recompute(false); layout();
    say(m.kind === 'story' ? lv.tip : '', false, 7000);
    if (m.kind === 'rand') prefetch(m.key);
    $('menu').classList.remove('show'); $('win').classList.remove('show');
  }

  const dayLabel = seed => (seed % 100) + '/' + (Math.floor(seed / 100) % 100);
  let genJob = 0;
  // Sinh màn từng chút một (mỗi lần ~25 ms) để trang không bị đứng.
  // Chơi thử lời giải đi kèm bằng chính bộ mô phỏng của trò chơi; màn nào không tới được vầng trăng thì bỏ.
  function solvable(level) {
    try {
      const s = level.solution, pg = C.parse(level);
      if (!s || s.shadows.length > level.maxShadows || s.moves.length > level.loop) return false;
      if (s.shadows.some(r => r.length > level.loop)) return false;
      const r = C.simulate(pg, s.shadows, s.moves);
      return r.win > 0 && !(r.caught > 0);
    } catch (e) { return false; }
  }

  function startGenerated(key, seed, kind, gen, tries) {
    const job = ++genJob;
    gen = gen || GEN.create(key, seed);
    const loading = key === 'rkho' ? 'Đang dựng màn, vài giây…' : 'Đang dựng màn…';
    $('genMsg').textContent = loading;
    if (!$('menu').classList.contains('show')) { $('win').classList.remove('show'); say(loading, true); }
    const tick = () => {
      if (job !== genJob) return;
      const level = gen.run(25);
      if (level === null) return setTimeout(tick, 0);
      $('genMsg').textContent = '';
      if (!level || !solvable(level)) {
        if (kind !== 'daily' && (tries || 0) < 3) return startGenerated(key, newSeed(), kind, null, (tries || 0) + 1);
        $('genMsg').textContent = 'Chưa dựng được màn, bấm lại.'; say($('genMsg').textContent); return;
      }
      playLevel(level, { kind, key, seed });
    };
    tick();
  }
  const newSeed = () => 1 + Math.floor(Math.random() * 999999);

  // Dựng sẵn màn kế tiếp trong lúc người chơi đang chơi, để bấm "Đèn mới" là có ngay.
  let pre = null;
  function prefetch(key) {
    if (pre && pre.key === key) return;
    const seed = newSeed(), p = pre = { key, seed, gen: GEN.create(key, seed), level: null };
    const tick = () => {
      if (pre !== p || p.level || p.taken) return;
      const l = p.gen.run(12);
      if (l === null) return setTimeout(tick, 40);
      if (!l || !solvable(l)) { pre = null; return; }
      p.level = l;
    };
    setTimeout(tick, 400);
  }
  function startRandom(key) {
    const p = pre;
    if (p && p.key === key) {
      pre = null;
      if (p.level) return playLevel(p.level, { kind: 'rand', key, seed: p.seed });
      p.taken = true;
      return startGenerated(key, p.seed, 'rand', p.gen);
    }
    startGenerated(key, newSeed(), 'rand');
  }

  // Bóng "vấp" = bước đã ghi bị một cánh cửa đóng chặn (va tường là việc đã có từ vòng ghi, không tính).
  function gateBump(frames, t, i, rec) {
    const a = rec[t], f = frames[t + 1];
    if (!a || a === 'W' || !f || !f.bumped[i]) return false;
    const p = frames[t].pos[i], d = C.DIRS[a];
    const c = C.cell(g, p[0] + d[0], p[1] + d[1]);
    return C.isDoor(c) || C.isCrumble(c);
  }

  function recompute(animate) {
    hintPath = null; hintState = null;
    const prev = sim ? sim.frames[sim.frames.length - 1] : null;
    sim = C.simulate(g, shadows, moves);
    const cur = sim.frames[sim.frames.length - 1];
    if (animate && prev && prev.pos.length === cur.pos.length) {
      const t = sim.frames.length - 2;
      const vap = shadows.map((r, i) => gateBump(sim.frames, t, i, r));
      anim = { from: prev.pos, to: cur.pos, gFrom: prev.guards, t0: performance.now() }; vapNow = vap;
      if (vap.some(Boolean)) { bumpAt = performance.now(); sfx.bump(); }
      else if (Object.keys(cur.fallen || {}).length > Object.keys(prev.fallen || {}).length) sfx.crack();
      else if (Object.keys(cur.open).join() !== Object.keys(prev.open).join()) sfx.gate();
      else sfx.step();
    } else anim = null;
    renderHud(); draw();
  }

  function act(a) {
    if (busy || won || !lv) return;
    if (moves.length >= lv.loop) { say('Hết bước. Quay đèn hoặc hoàn tác.'); return; }
    const h = hintState;
    moves += a; recompute(true);
    if (sim.win > 0) return winLevel();
    if (sim.caught > 0) return caughtByGuard();
    // đi đúng theo gợi ý thì giữ gợi ý cho các bước còn lại
    hintState = null;
    if (h && h.start === moves.length - 1 && h.path[0] === a && h.path.length > 1) { hintState = { start: h.start + 1, path: h.path.slice(1) }; showHint(); }
    if (moves.length >= lv.loop) {
      if (shadows.length < lv.maxShadows) setTimeout(() => { if (!won && moves.length >= lv.loop) spin(); }, 260);
      else say('Chưa tới trăng. Hoàn tác hoặc chơi lại vòng.', true);
    } else if (!checkStuck() && moves.length === 1) say('');
  }

  // Ở vòng cuối (đã dùng hết bóng): báo ngay khi không còn đường tới trăng, để người chơi không đi vô ích.
  function checkStuck() {
    if (won || shadows.length < lv.maxShadows) return false;
    if (C.solveFrom(g, shadows, moves) !== null) return false;
    if (moves.length && C.solveFrom(g, shadows, '') !== null)
      say('Hết đường trong vòng này. Hoàn tác nhé.', true);
    else if (shadows.length)
      say('Bóng này chưa ổn. Xoá bóng cuối rồi ghi lại.', true);
    else return false;
    return true;
  }

  // Gợi ý: chỉ đường cho vòng hiện tại bằng các số trên vách đèn.
  function hint() {
    if (busy || won) return;
    let start = 0, path = null, text = '';
    if (shadows.length >= lv.maxShadows || needShadows() <= shadows.length) {
      const rest = C.solveFrom(g, shadows, moves);
      if (rest !== null) { start = moves.length; path = rest; text = 'Đi theo số vàng.'; }
      else {
        const fresh = C.solveFrom(g, shadows, '');
        if (fresh !== null) { path = fresh; text = 'Lỡ bước rồi. Chơi lại vòng, rồi theo số vàng.'; }
        else { checkStuck(); return; }
      }
    } else {
      const sol = solution();
      if (!sol) return say('Chưa có gợi ý cho màn này.');
      const rec = sol.shadows[shadows.length];
      const sameStart = rec.startsWith(moves);
      start = sameStart ? moves.length : 0; path = sameStart ? rec.slice(moves.length) : rec;
      text = (sameStart ? 'Đi' : 'Chơi lại vòng, rồi đi') + ' theo số vàng tới ' + rec.length + ', rồi Quay đèn.';
    }
    hintState = { start, path };
    hintUsed = true; renderHud();
    showHint(); say(text);
  }
  function showHint() {
    const { start, path } = hintState;
    const s2 = C.simulate(g, shadows, moves.slice(0, start) + path);
    hintPath = [];
    for (let t = start + 1; t < s2.frames.length; t++) hintPath.push({ p: s2.frames[t].pos[shadows.length], t });
    draw();
  }
  function solution() {
    if (!solCache) solCache = C.solve(lv);
    return solCache;
  }
  function needShadows() { const s = solution(); return s ? s.shadows.length : lv.maxShadows; }

  function caughtByGuard() {
    busy = true; sfx.caught();
    if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
    const b = $('board'); b.classList.remove('caught'); void b.offsetWidth; b.classList.add('caught');
    say('Lính bắt! Về đầu vòng.');
    setTimeout(() => { busy = false; b.classList.remove('caught'); moves = ''; recompute(false); }, reduce ? 300 : 650);
  }

  function spin() {
    if (busy || won || !moves.length || shadows.length >= lv.maxShadows) return;
    busy = true; sfx.spin();
    const b = $('board'); b.classList.remove('spin', 'fade'); void b.offsetWidth;
    b.classList.add(reduce ? 'fade' : 'spin');
    setTimeout(() => {
      shadows.push(moves); moves = ''; recompute(false);
      checkStuck();
    }, reduce ? 150 : 450);
    setTimeout(() => { busy = false; b.classList.remove('spin', 'fade'); }, reduce ? 300 : 900);
  }

  function undo() {
    if (busy || won) return;
    if (moves.length) { moves = moves.slice(0, -1); recompute(false); }
    else if (shadows.length) { moves = shadows.pop(); recompute(false);  }
  }

  // đèn lồng nhỏ: dùng cho ba ngôi sao khi qua màn
  function lantSVG(color, on) {
    return '<svg class="lant ' + (on ? 'on' : 'off') + '" viewBox="0 0 40 56" aria-hidden="true" style="--lc:' + color + '"><path class="tas" d="M20 2v4"/><rect class="cap" x="12" y="6" width="16" height="5" rx="1"/>' +
      '<ellipse class="body" cx="20" cy="26" rx="16" ry="15"/><path class="rib" d="M20 11v30M12 13c-4 8-4 20 0 28M28 13c4 8 4 20 0 28"/><rect class="cap" x="13" y="41" width="14" height="4" rx="1"/><path class="tas" d="M20 45v6M17 51h6"/></svg>';
  }

  function winLevel() {
    won = true; sfx.win();
    const total = shadows.reduce((s, x) => s + x.length, 0) + moves.length;
    const st = C.stars(lv, shadows.length, total);
    const counted = !hintUsed;   // qua màn nhờ gợi ý thì không ghi sao, kỷ lục hay điểm bảng xếp hạng
    if (mode.kind === 'story') {
      if (counted) {
        save.stars[lvIdx] = Math.max(save.stars[lvIdx] || 0, st);
        save.steps[lvIdx] = Math.min(save.steps[lvIdx] || 9999, total);
      }
      save.unlocked = Math.max(save.unlocked, Math.min(lvIdx + 1, LEVELS.length - 1));
    } else if (mode.kind === 'rand') {
      if (counted) save.rand[mode.key] = (save.rand[mode.key] || 0) + 1;
    } else if (counted) {
      const d = save.daily[mode.seed];
      if (!d || st > d.st || (st === d.st && total < d.steps)) save.daily[mode.seed] = { st, steps: total };
    }
    store();
    if (counted) submitScore();
    setTimeout(() => {
      const lit = counted ? st : 0;
      $('winStars').innerHTML = [1, 2, 3].map(n => lantSVG(n <= lit ? '#e8561f' : '#8a7d68', n <= lit)).join('');
      $('winStars').setAttribute('aria-label', counted ? st + ' trên 3 đèn' : 'Không tính sao');
      $('winWhy').textContent = total + ' bước · chuẩn ' + lv.par.steps;
      $('winNote').hidden = counted;
      $('winNote').textContent = 'Đã dùng gợi ý nên màn này không tính sao và điểm.';
      const lastStory = mode.kind === 'story' && lvIdx >= LEVELS.length - 1;
      $('nextBtn').hidden = lastStory || mode.kind === 'daily';
      $('nextBtn').textContent = mode.kind === 'rand' ? 'Màn mới' : 'Tiếp';
      $('winH').textContent = lastStory ? 'Hết rồi!' : 'Xong!';
      $('win').classList.add('show'); ($('nextBtn').hidden ? $('againBtn') : $('nextBtn')).focus();
    }, reduce ? 200 : 700);
  }

  let sayT = 0;
  // sticky = giữ tới khi có lời khác; không thì tự tắt sau ms
  function say(html, sticky, ms) {
    clearTimeout(sayT); $('msg').innerHTML = html || '';
    if (html && !sticky) sayT = setTimeout(() => { $('msg').innerHTML = ''; }, ms || 4500);
  }

  // ---------- HUD ----------
  function renderHud() {
    const used = moves.length, L = lv.loop, left = L - used, frac = L ? left / L : 0;
    $('loopTxt').textContent = 'Vòng ' + (shadows.length + 1);
    $('stepTxt').textContent = used + '/' + L;
    $('shTxt').textContent = 'Bóng ' + shadows.length + '/' + lv.maxShadows;
    // cây nến ngắn dần theo số bước còn lại, ngọn lửa chạy theo đầu nến
    $('wax').style.width = 'calc((100% - 4px) * ' + frac + ')';
    $('flame').style.left = 'calc(2px + (100% - 4px) * ' + frac + ')';
    $('candle').classList.toggle('low', !!lv.maxShadows && left <= 3 && used > 0);
    $('hintTag').hidden = !hintUsed;
    // dải bóng
    let s = '';
    const pad = moves + 'W'.repeat(L - moves.length);
    const full = C.simulate(g, shadows, pad);
    shadows.forEach((rec, i) => {
      s += '<div class="track' + (peek === i ? ' peek' : '') + '" data-i="' + i + '" role="button" tabindex="0" aria-label="Bóng ' + (i + 1) + ': giữ để xem đường đi"><span class="who"><em>' + (i + 1) + '</em></span><span class="cells">';
      for (let t = 0; t < L; t++) {
        const a = rec[t] || '';
        const bumped = gateBump(full.frames, t, i, rec);
        s += '<span class="' + (t < used ? 'done' : '') + (t === used ? ' now' : '') + (bumped && t < used ? ' bump' : '') + '">' + (a ? (bumped && t < used ? '!' : ARROW[a]) : '') + '</span>';
      }
      s += '</span></div>';
    });
    s += '<div class="track"><span class="who"><em>★</em></span><span class="cells">';
    for (let t = 0; t < L; t++) s += '<span class="' + (t < used ? 'done' : '') + (t === used ? ' now' : '') + '">' + (moves[t] ? ARROW[moves[t]] : '') + '</span>';
    s += '</span></div>';
    $('strip').innerHTML = s;
    $('spinBtn').disabled = !lv.maxShadows || shadows.length >= lv.maxShadows || !moves.length;
    $('spinTxt').textContent = !lv.maxShadows ? 'Không cần quay' : shadows.length >= lv.maxShadows ? 'Đủ bóng' : 'Quay đèn';
    $('dropBtn').disabled = !shadows.length;
    $('undoBtn').disabled = !moves.length && !shadows.length;
    $('loopBtn').disabled = !moves.length;
  }

  // ---------- vẽ ----------
  function layout() {
    if (!g) return;
    const land = innerWidth > innerHeight && innerHeight < 560;
    const maxW = Math.min(innerWidth - 32, 488) - 32;
    const maxH = land ? innerHeight - 190 : Math.max(160, innerHeight - 480 - (shadows.length ? 36 : 0));
    tile = Math.max(24, Math.floor(Math.min(maxW / g.w, maxH / g.h)));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = g.w * tile * dpr; cv.height = g.h * tile * dpr;
    cv.style.width = g.w * tile + 'px'; cv.style.height = g.h * tile + 'px';
    buildStatic(); draw();
  }

  function buildStatic() {
    staticLayer = document.createElement('canvas');
    staticLayer.width = cv.width; staticLayer.height = cv.height;
    const c = staticLayer.getContext('2d'); c.scale(dpr, dpr);
    const W = g.w * tile, H = g.h * tile;
    const grd = c.createRadialGradient(W / 2, H * .55, tile, W / 2, H * .55, Math.max(W, H) * .75);
    grd.addColorStop(0, '#fbe6b8'); grd.addColorStop(1, '#e2a95c');
    c.fillStyle = grd; c.fillRect(0, 0, W, H);
    for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      const ch = g.rows[y][x], px = x * tile, py = y * tile;
      if (ch === '#') {
        c.fillStyle = '#3b2412'; c.fillRect(px, py, tile, tile);
        c.fillStyle = '#5d3a19';
        for (let k = 0; k < 3; k++) c.fillRect(px + tile * (.12 + k * .3), py, tile * .14, tile);
        c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(px, py + tile * .45, tile, tile * .08);
      } else {
        c.strokeStyle = 'rgba(122,72,28,.18)'; c.lineWidth = 1; c.strokeRect(px + .5, py + .5, tile - 1, tile - 1);
      }
      if (ch === 'E') {
        const r = tile * .36;
        const glow = c.createRadialGradient(px + tile / 2, py + tile / 2, r * .3, px + tile / 2, py + tile / 2, tile * .7);
        glow.addColorStop(0, 'rgba(255,240,190,.9)'); glow.addColorStop(1, 'rgba(255,240,190,0)');
        c.fillStyle = glow; c.fillRect(px - tile * .2, py - tile * .2, tile * 1.4, tile * 1.4);
        c.fillStyle = '#fff3c4'; c.beginPath(); c.arc(px + tile / 2, py + tile / 2, r, 0, 7); c.fill();
        c.fillStyle = 'rgba(220,180,90,.5)';
        c.beginPath(); c.arc(px + tile * .42, py + tile * .44, r * .2, 0, 7); c.arc(px + tile * .6, py + tile * .58, r * .14, 0, 7); c.fill();
      }
      if (ch === 'S') {
        c.strokeStyle = 'rgba(90,50,20,.45)'; c.setLineDash([4, 4]); c.lineWidth = 2;
        c.strokeRect(px + tile * .14, py + tile * .14, tile * .72, tile * .72); c.setLineDash([]);
      }
    }
    // vạch tuần tra của lính
    g.guards.forEach(tr => {
      c.strokeStyle = 'rgba(126,29,24,.55)'; c.lineWidth = Math.max(2, tile * .06); c.setLineDash([tile * .08, tile * .1]); c.lineCap = 'round';
      c.beginPath();
      tr.forEach(([x, y], i) => (i ? c.lineTo : c.moveTo).call(c, x * tile + tile / 2, y * tile + tile * .82));
      c.stroke(); c.setLineDash([]);
      tr.forEach(([x, y], i) => { if (i === 0 || i === tr.length - 1) { c.fillStyle = 'rgba(126,29,24,.55)'; c.beginPath(); c.arc(x * tile + tile / 2, y * tile + tile * .82, tile * .06, 0, 7); c.fill(); } });
    });
  }

  // Ván mục: tấm ván tre nứt; sụp thì thành hố tối.
  function drawPlank(c, x, y, fallen, loaded) {
    const px = x * tile, py = y * tile, m = tile * .08;
    if (fallen) {
      c.fillStyle = '#1a0f08'; c.fillRect(px + 1, py + 1, tile - 2, tile - 2);
      c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.ellipse(px + tile / 2, py + tile / 2, tile * .38, tile * .3, 0, 0, 7); c.fill();
      c.strokeStyle = '#6b4320'; c.lineWidth = Math.max(1.5, tile * .04);
      c.beginPath(); c.moveTo(px + m, py + tile * .25); c.lineTo(px + tile * .3, py + tile * .35);
      c.moveTo(px + tile - m, py + tile * .7); c.lineTo(px + tile * .72, py + tile * .62); c.stroke();
      return;
    }
    c.fillStyle = '#b57a3c'; c.fillRect(px + m, py + m, tile - 2 * m, tile - 2 * m);
    c.fillStyle = '#9a6430';
    for (let k = 1; k < 3; k++) c.fillRect(px + m, py + m + (tile - 2 * m) * k / 3 - 1, tile - 2 * m, 2);
    c.strokeStyle = loaded ? '#5a2a10' : 'rgba(70,35,12,.75)'; c.lineWidth = Math.max(1.5, tile * .035);
    c.beginPath();
    c.moveTo(px + tile * .3, py + m); c.lineTo(px + tile * .42, py + tile * .38); c.lineTo(px + tile * .34, py + tile * .55);
    c.moveTo(px + tile * .42, py + tile * .38); c.lineTo(px + tile * .66, py + tile * .46); c.lineTo(px + tile * .72, py + tile - m);
    c.stroke();
  }

  function drawPlate(c, x, y, ch, pressed) {
    const px = x * tile, py = y * tile, col = PLATE_HEX[ch.toUpperCase()];
    c.fillStyle = 'rgba(60,30,10,.25)'; c.beginPath(); c.ellipse(px + tile / 2, py + tile * .56, tile * .36, tile * .3, 0, 0, 7); c.fill();
    c.fillStyle = col; c.globalAlpha = pressed ? .65 : 1;
    c.beginPath(); c.ellipse(px + tile / 2, py + tile * (pressed ? .55 : .5), tile * .34, tile * .28, 0, 0, 7); c.fill();
    c.globalAlpha = 1;
    c.fillStyle = '#fff'; c.font = '700 ' + Math.round(tile * .3) + 'px Be Vietnam Pro, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch.toUpperCase(), px + tile / 2, py + tile * (pressed ? .56 : .51));
  }

  function drawGate(c, x, y, ch, open) {
    const px = x * tile, py = y * tile, L = C.doorLetter(ch), col = PLATE_HEX[L], inv = C.isInv(ch);
    c.fillStyle = col; c.globalAlpha = open ? .25 : 1;
    const top = open ? py : py, hgt = open ? tile * .16 : tile;
    c.fillRect(px + 2, top, tile - 4, tile * .12);
    for (let k = 0; k < 4; k++) c.fillRect(px + tile * (.12 + k * .22), top, tile * .1, hgt);
    c.globalAlpha = 1;
    if (open) {
      c.strokeStyle = col; c.lineWidth = Math.max(1.5, tile * .04); c.setLineDash([tile * .1, tile * .08]);
      c.strokeRect(px + tile * .08, py + tile * .08, tile * .84, tile * .84); c.setLineDash([]);
    }
    if (!open) {
      c.fillStyle = '#fff'; c.font = '700 ' + Math.round(tile * .26) + 'px Be Vietnam Pro, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.arc(px + tile / 2, py + tile / 2, tile * .18, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.fillText(L, px + tile / 2, py + tile * .51);
    }
    if (inv) {
      // cửa ngược: gạch chéo trên nền cửa (đóng khi bệ bị giẫm)
      c.strokeStyle = open ? 'rgba(255,255,255,.55)' : '#fff'; c.lineWidth = Math.max(2, tile * .07); c.lineCap = 'round';
      c.beginPath(); c.moveTo(px + tile * .2, py + tile * .2); c.lineTo(px + tile * .8, py + tile * .8); c.stroke();
      c.strokeStyle = col; c.lineWidth = Math.max(1, tile * .03);
      c.beginPath(); c.moveTo(px + tile * .2, py + tile * .2); c.lineTo(px + tile * .8, py + tile * .8); c.stroke();
    }
  }

  // Lính đèn: hình cắt giấy đỏ sẫm, mũ chóp, cầm giáo; mũi tên nhỏ báo hướng đi nhịp sau.
  function drawGuard(c, fx, fy, dir) {
    const cx = fx * tile + tile / 2, base = fy * tile + tile * .9, s = tile;
    c.fillStyle = '#7e1d18';
    c.beginPath(); c.moveTo(cx - s * .19, base); c.lineTo(cx - s * .1, base - s * .42); c.lineTo(cx + s * .1, base - s * .42); c.lineTo(cx + s * .19, base); c.closePath(); c.fill();
    c.beginPath(); c.arc(cx, base - s * .52, s * .12, 0, 7); c.fill();
    c.beginPath(); c.moveTo(cx - s * .13, base - s * .58); c.lineTo(cx, base - s * .82); c.lineTo(cx + s * .13, base - s * .58); c.closePath(); c.fill();
    c.strokeStyle = '#3b0f0c'; c.lineWidth = Math.max(1.5, s * .03);
    c.beginPath(); c.moveTo(cx - s * .24, base); c.lineTo(cx - s * .24, base - s * .78); c.stroke();
    c.fillStyle = '#3b0f0c'; c.beginPath(); c.moveTo(cx - s * .29, base - s * .74); c.lineTo(cx - s * .24, base - s * .88); c.lineTo(cx - s * .19, base - s * .74); c.closePath(); c.fill();
    if (dir) {
      const ax = cx + dir[0] * s * .36, ay = fy * tile + tile / 2 + dir[1] * s * .36;
      c.fillStyle = 'rgba(126,29,24,.9)'; c.beginPath();
      c.moveTo(ax + dir[0] * s * .1, ay + dir[1] * s * .1);
      c.lineTo(ax - dir[1] * s * .08 - dir[0] * s * .04, ay + dir[0] * s * .08 - dir[1] * s * .04);
      c.lineTo(ax + dir[1] * s * .08 - dir[0] * s * .04, ay - dir[0] * s * .08 - dir[1] * s * .04);
      c.closePath(); c.fill();
    }
  }

  function drawFigure(c, fx, fy, kind, num, shake) {
    const cx = fx * tile + tile / 2 + shake, base = fy * tile + tile * .9, s = tile;
    c.save();
    c.globalAlpha = kind === 'me' ? 1 : .5;
    c.fillStyle = kind === 'me' ? '#1a1310' : '#2b1d3f';
    // thân hình cắt giấy
    c.beginPath();
    c.moveTo(cx - s * .2, base); c.lineTo(cx - s * .11, base - s * .44); c.lineTo(cx + s * .11, base - s * .44); c.lineTo(cx + s * .2, base); c.closePath(); c.fill();
    c.beginPath(); c.arc(cx, base - s * .55, s * .13, 0, 7); c.fill();
    // nón lá
    c.beginPath(); c.moveTo(cx - s * .22, base - s * .6); c.lineTo(cx, base - s * .8); c.lineTo(cx + s * .22, base - s * .6); c.closePath(); c.fill();
    if (kind === 'me') {
      // cầm đèn ông sao
      c.strokeStyle = '#1a1310'; c.lineWidth = Math.max(1.5, s * .03);
      c.beginPath(); c.moveTo(cx + s * .1, base - s * .35); c.lineTo(cx + s * .3, base - s * .62); c.stroke();
      star(c, cx + s * .3, base - s * .62, s * .1, '#ffb13b');
    }
    c.restore();
    if (kind !== 'me') {
      c.fillStyle = '#fbecd0'; c.beginPath(); c.arc(cx + s * .24, base - s * .74, s * .13, 0, 7); c.fill();
      c.strokeStyle = '#2b1d3f'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#1a1310'; c.font = '700 ' + Math.round(s * .18) + 'px Be Vietnam Pro, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(num, cx + s * .24, base - s * .73);
    }
  }
  // Ghi số bước lên các ô; các nhịp liên tiếp đứng cùng một ô gộp thành "9-14".
  function drawLabels(pts, bg, fg) {
    ctx.font = '700 ' + Math.round(tile * .22) + 'px Be Vietnam Pro, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const runs = [];
    for (const { p, t } of pts) {
      const last = runs[runs.length - 1];
      if (last && last.p[0] === p[0] && last.p[1] === p[1]) last.b = t; else runs.push({ p, a: t, b: t });
    }
    const seen = {};
    for (const r of runs) {
      const key = r.p + '', row = (seen[key] = (seen[key] || 0) + 1) - 1;
      const label = r.a === r.b ? '' + r.a : r.a + '-' + r.b;
      const wdt = tile * (label.length > 2 ? .5 : .26), x = r.p[0] * tile + tile * .06, y = r.p[1] * tile + tile * (.06 + (row % 3) * .26);
      ctx.fillStyle = bg; ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, wdt, tile * .22, tile * .11); else ctx.rect(x, y, wdt, tile * .22);
      ctx.fill();
      ctx.fillStyle = fg; ctx.fillText(label, x + wdt / 2, y + tile * .115);
    }
  }

  function star(c, x, y, r, col) {
    c.fillStyle = col; c.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    c.closePath(); c.fill();
  }

  let raf = 0;
  function draw() {
    if (!g || !staticLayer || !sim) return;
    cancelAnimationFrame(raf);
    const now = performance.now();
    let k = 1;
    if (anim) { k = Math.min(1, (now - anim.t0) / (reduce ? 1 : 130)); k = 1 - (1 - k) * (1 - k); }
    const cur = sim.frames[sim.frames.length - 1];
    const pos = cur.pos.map((p, i) => anim ? [anim.from[i][0] + (p[0] - anim.from[i][0]) * k, anim.from[i][1] + (p[1] - anim.from[i][1]) * k] : p);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, g.w * tile, g.h * tile);
    ctx.drawImage(staticLayer, 0, 0, g.w * tile, g.h * tile);
    const occupied = (x, y) => cur.pos.some(p => p[0] === x && p[1] === y);
    for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      const ch = g.rows[y][x];
      if (C.isPlate(ch)) drawPlate(ctx, x, y, ch, occupied(x, y));
      if (C.isDoor(ch)) drawGate(ctx, x, y, ch, C.doorOpen(ch, cur.open) || occupied(x, y));
      if (C.isCrumble(ch)) drawPlank(ctx, x, y, cur.fallen && cur.fallen[x + ',' + y], occupied(x, y));
    }
    // xem trước đường đi của một bóng
    if (peek >= 0 && peek < shadows.length) {
      const full = C.simulate(g, shadows, moves + 'W'.repeat(lv.loop - moves.length));
      const pts = [];
      for (let t = moves.length + 1; t < full.frames.length; t++) pts.push({ p: full.frames[t].pos[peek], t });
      drawLabels(pts, 'rgba(43,29,63,.78)', '#fff');
    }
    if (hintPath && hintPath.length) drawLabels(hintPath, '#ffb13b', '#2a1606');
    const shakeT = (now - bumpAt) / 150;
    const n = shadows.length;
    for (let i = 0; i < n; i++) {
      const sh = shakeT < 1 && vapNow[i] ? Math.sin(shakeT * 30) * 3 * (1 - shakeT) : 0;
      drawFigure(ctx, pos[i][0], pos[i][1], 'shadow', i + 1, sh);
    }
    drawFigure(ctx, pos[n][0], pos[n][1], 'me', 0, 0);
    // lính tuần (vẽ sau cùng để luôn nhìn thấy)
    (cur.guards || []).forEach((st, gi) => {
      const tr = g.guards[gi], to = tr[st.i];
      const fromSt = anim && anim.gFrom ? anim.gFrom[gi] : st, from = tr[fromSt.i];
      let ni = st.i + st.d; if (ni < 0 || ni >= tr.length) ni = st.i - st.d;
      const nx = tr[ni], dir = [nx[0] - to[0], nx[1] - to[1]];
      drawGuard(ctx, from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k, dir);
    });
    if ((anim && k < 1) || shakeT < 1) raf = requestAnimationFrame(draw);
    else anim = null;
  }

  // ---------- menu ----------
  function showMenu() {
    let h = '';
    LEVELS.forEach((L, i) => {
      const st = save.stars[i] || 0, locked = i > save.unlocked;
      h += '<button class="lv" data-lv="' + i + '"' + (locked ? ' disabled aria-label="Màn ' + (i + 1) + ' chưa mở"' : ' aria-label="Màn ' + (i + 1) + ': ' + L.name + ', ' + st + ' sao"') + ' data-no-scene><b>' + (i + 1) + '</b><i>' + '●'.repeat(st) + '○'.repeat(3 - st) + '</i></button>';
    });
    $('levels').innerHTML = h;
    const got = Object.keys(save.stars).length;
    $('introInfo').textContent = ' · ' + got + '/' + LEVELS.length;
    // người mới (chưa chơi gì) thì mở sẵn Nhập môn; sau đó thu gọn
    const fresh = !got && !save.unlocked && !Object.keys(save.rand).length && !Object.keys(save.daily).length;
    setIntro(fresh);
    ['vua', 'kho', 'rkho'].forEach(k => { $('cnt-' + k).textContent = save.rand[k] ? ' · ' + save.rand[k] : ''; });
    const ds = GEN.dailySeed(), d = save.daily[ds];
    $('dailyInfo').textContent = d ? ' · ' + '★'.repeat(d.st) : '';
    $('dailySeal').textContent = dayLabel(ds);
    $('genMsg').textContent = '';
    $('menu').classList.add('show');
    const first = fresh ? $('levels').querySelector('.lv:not(:disabled)') : $('dailyBtn'); if (first) first.focus();
  }
  function setIntro(open) { $('levels').hidden = !open; $('introBtn').setAttribute('aria-expanded', open ? 'true' : 'false'); }
  $('introBtn').onclick = () => setIntro($('levels').hidden);
  $('levels').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b && !b.disabled) startLevel(+b.dataset.lv); });
  $('menuBtn').onclick = showMenu;
  $('rndRow').addEventListener('click', e => { const b = e.target.closest('.rnd'); if (b) startRandom(b.dataset.key); });
  $('dailyBtn').onclick = () => startGenerated('kho', GEN.dailySeed(), 'daily');
  $('nextBtn').onclick = () => mode.kind === 'rand' ? startRandom(mode.key) : startLevel(Math.min(lvIdx + 1, LEVELS.length - 1));
  $('againBtn').onclick = () => playLevel(lv, mode);

  // ---------- nút & phím ----------
  document.querySelector('.pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) act(b.dataset.a); });
  $('spinBtn').onclick = spin;
  $('undoBtn').onclick = undo;
  $('dropBtn').onclick = () => { if (busy || won || !shadows.length) return; shadows.pop(); moves = ''; recompute(false); };
  $('loopBtn').onclick = () => { if (busy || won) return; moves = ''; recompute(false); };
  $('resetBtn').onclick = () => { if (!busy) playLevel(lv, mode); };
  $('hintBtn').onclick = hint;
  $('tipBtn').onclick = () => say(lv && lv.tip || '', false, 9000);

  addEventListener('keydown', e => {
    if ($('menu').classList.contains('show') || $('win').classList.contains('show')) return;
    const k = e.key, map = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', ' ': 'W' };
    if (map[k]) { e.preventDefault(); if (!e.repeat || k !== ' ') act(map[k]); }
    else if (k === 'Enter' && e.target === document.body) { e.preventDefault(); spin(); }
    else if (k === 'z' || k === 'Z' || k === 'Backspace') { e.preventDefault(); undo(); }
    else if (k === 'r' || k === 'R') playLevel(lv, mode);
    else if (k === 'h' || k === 'H') hint();
  });

  // vuốt trên vách đèn
  let sw = null;
  cv.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('pointerup', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  });
  cv.addEventListener('pointercancel', () => { sw = null; });

  // giữ một dòng bóng để xem trước
  const strip = $('strip');
  const peekOn = i => { peek = i; renderHud(); draw(); };
  const peekOff = () => { if (peek >= 0) { peek = -1; renderHud(); draw(); } };
  strip.addEventListener('pointerdown', e => { const t = e.target.closest('.track[data-i]'); if (t) { e.preventDefault(); peekOn(+t.dataset.i); } });
  addEventListener('pointerup', peekOff); addEventListener('pointercancel', peekOff);
  strip.addEventListener('keydown', e => { const t = e.target.closest('.track[data-i]'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); peek === +t.dataset.i ? peekOff() : peekOn(+t.dataset.i); } });

  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); });

  startLevel(Math.min(save.unlocked, LEVELS.length - 1));
  showMenu();
})();
</script>
