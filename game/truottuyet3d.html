<!DOCTYPE html>
<html lang="vi">
<head>
<script>
/* Nếu trình duyệt chặn lưu trữ (chế độ riêng tư, webview hạn chế) thì dùng bộ nhớ tạm để game không bị lỗi */

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c4a6e">
<title>Trượt tuyết</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #game{position:absolute;inset:0}
  canvas{display:block}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 25%,rgba(0,0,30,0.7) 100%);opacity:0;transition:opacity .15s linear;z-index:5}
  #hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:6}
  .hud-top{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start}
  .stat{display:flex;flex-direction:column;gap:3px}
  .stat.right{align-items:flex-end}
  .stat-label{font-size:10px;letter-spacing:3px;color:rgba(0,40,80,0.65);font-weight:800;text-shadow:0 1px 2px rgba(255,255,255,0.6)}
  .stat-value{font-size:34px;font-weight:900;color:#fff;line-height:1;text-shadow:0 2px 12px rgba(56,189,248,0.8),0 0 20px rgba(255,255,255,0.4);font-variant-numeric:tabular-nums}
  .stat-sub{font-size:12px;font-weight:700;color:rgba(0,40,80,0.6);margin-top:2px;text-shadow:0 1px 2px rgba(255,255,255,0.6)}
  .lives{display:flex;gap:5px;margin-top:8px}
  .life{width:20px;height:20px}
  .speed-bar{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:8px;height:180px;background:rgba(0,40,80,0.15);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 4px rgba(0,0,0,0.2)}
  .speed-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#40a0ff,#ffaa40,#ff4060);border-radius:4px;box-shadow:0 0 12px rgba(255,64,96,0.6);transition:height 0.1s linear}
  .combo{position:absolute;top:100px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;color:#ffcc44;text-shadow:0 0 20px rgba(255,200,60,0.9),0 0 40px rgba(255,150,0,0.6);letter-spacing:2px;opacity:0;transition:opacity 0.2s;font-family:'Segoe UI',system-ui,sans-serif}
  .combo.show{opacity:1}
  .danger-label{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;letter-spacing:4px;color:#ff4040;text-shadow:0 0 15px rgba(255,60,60,0.9);opacity:0;transition:opacity 0.3s;text-transform:uppercase}
  .danger-label.show{opacity:1;animation:flash 0.8s ease-in-out infinite}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:0.4}}
  #slope-indicator{position:absolute;top:130px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:900;letter-spacing:2px;font-family:'Segoe UI',system-ui,sans-serif;opacity:0;transition:opacity 0.25s;text-shadow:0 0 15px currentColor}
  #overlay{position:absolute;inset:0;display:flex;padding:30px 22px;overflow-y:auto;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(20,40,80,0.75),rgba(5,10,30,0.96));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity 0.3s;z-index:10}
  #overlay.hidden{opacity:0;pointer-events:none}
  .screen{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:520px;width:100%;margin:auto}
  .screen.hidden{display:none}
  h1{font-size:clamp(42px,11vw,76px);font-weight:900;line-height:1.15;letter-spacing:5px;margin:0;padding:0.1em 0.1em 0.15em;background:linear-gradient(120deg,#7dd3fc 0%,#ffffff 45%,#38bdf8 90%,#7dd3fc 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 40px rgba(125,211,252,0.7));animation:titleGlow 4s ease-in-out infinite}
  @keyframes titleGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  h2{font-size:clamp(28px,7.5vw,48px);font-weight:900;letter-spacing:5px;color:#7dd3fc;text-shadow:0 0 30px rgba(125,211,252,0.8);line-height:1.25}
  .sub{font-size:13px;letter-spacing:6px;color:#7a88a8;font-weight:700;text-transform:uppercase}
  .hard-badge{font-size:10px;letter-spacing:4px;font-weight:900;text-transform:uppercase;color:#ff3a3a;padding:7px 18px;border:1px solid rgba(255,60,60,.4);border-radius:100px;background:rgba(255,40,40,.1);text-shadow:0 0 15px rgba(255,60,60,.7);box-shadow:0 0 20px rgba(255,40,40,.2);animation:hardPulse 1.5s ease-in-out infinite}
  @keyframes hardPulse{0%,100%{box-shadow:0 0 20px rgba(255,40,40,.2)}50%{box-shadow:0 0 30px rgba(255,40,40,.5)}}
  .goal-card{display:flex;flex-direction:column;gap:10px;padding:20px 26px;width:100%;max-width:400px;border-radius:16px;background:linear-gradient(135deg,rgba(125,211,252,0.12),rgba(56,189,248,0.06));border:1px solid rgba(125,211,252,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
  .goal-label{font-size:10px;letter-spacing:4px;color:#7dd3fc;font-weight:900}
  .goal-text{font-size:13.5px;line-height:1.6;color:#d0d8e8;text-align:left}
  .goal-text b{color:#fff}
  .goal-text .warn{color:#ff5c5c;font-weight:800}
  button{font-family:inherit;font-size:17px;font-weight:900;letter-spacing:5px;color:#051030;cursor:pointer;padding:18px 50px;border:none;border-radius:100px;background:linear-gradient(135deg,#bae6fd 0%,#7dd3fc 45%,#38bdf8 100%);background-size:200% 100%;box-shadow:0 0 0 1px rgba(125,211,252,0.4),0 0 40px rgba(125,211,252,0.5),0 10px 30px rgba(0,0,0,0.5);transition:transform 0.15s,box-shadow 0.25s;margin-top:8px;animation:btnGradient 3.5s linear infinite,btnPulse 2.2s ease-in-out infinite}
  button:hover{transform:translateY(-2px) scale(1.03)}
  button:active{transform:scale(0.98)}
  @keyframes btnGradient{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes btnPulse{0%,100%{box-shadow:0 0 0 1px rgba(125,211,252,0.4),0 0 40px rgba(125,211,252,0.5),0 10px 30px rgba(0,0,0,0.5)}50%{box-shadow:0 0 0 1px rgba(125,211,252,0.6),0 0 60px rgba(56,189,248,0.7),0 10px 30px rgba(0,0,0,0.5)}}
  .scoreBig{font-size:clamp(64px,17vw,112px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 50px rgba(125,211,252,0.9),0 4px 20px rgba(0,0,0,0.5);font-variant-numeric:tabular-nums}
  .best{font-size:14px;letter-spacing:2px;color:#8a96b0;font-weight:700}
  .stat-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .stat-item{display:flex;flex-direction:column;gap:3px;padding:12px 22px;background:rgba(125,211,252,0.08);border:1px solid rgba(125,211,252,0.25);border-radius:12px;min-width:110px}
  .stat-item .stat-label{font-size:9px;letter-spacing:2.5px;color:#6a7a9a;font-weight:800;text-shadow:none}
  .stat-item .stat-value{font-size:22px;font-weight:800;color:#fff;text-shadow:none}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#87ceeb,#c8e4f8);color:#fff;font-size:16px;font-weight:800;letter-spacing:5px;z-index:100;transition:opacity 0.4s;text-shadow:0 2px 8px rgba(0,0,0,0.3)}
  #loading.hidden{opacity:0;pointer-events:none}
  .speed-text{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:30px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,30,70,.55);line-height:1}
  .speed-text small{font-size:12px;letter-spacing:2px;margin-left:4px;color:rgba(255,255,255,.85)}
  #powder{position:absolute;top:156px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:3px;color:#ffb347;text-shadow:0 0 12px rgba(255,150,40,.8);opacity:0;transition:opacity .25s;white-space:nowrap}
  #powder.show{opacity:1}
  .back-btn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:20;width:42px;height:42px;padding:0;margin:0;border-radius:13px;font-size:20px;letter-spacing:0;color:#e0f2fe;background:rgba(10,25,50,.55);border:1px solid rgba(125,211,252,.35);box-shadow:none;animation:none;display:grid;place-items:center}
  .back-btn:hover{transform:none}
  #overlay.hidden ~ .back-btn{display:none}

  /* ===== Màn hình trước khi xuất phát: áp phích trượt tuyết + bảng chỉ dẫn bằng hình ===== */
  #overlay.menu-mode{padding:0;overflow:hidden;background:linear-gradient(180deg,rgba(9,32,58,.82) 0,rgba(9,32,58,.55) 26%,rgba(9,32,58,0) 46%);backdrop-filter:none;-webkit-backdrop-filter:none}
  #menuScreen{--ink:#0e2a47;--snow:#f4f8fb;--acc:#ff6a1f;max-width:none;width:100%;height:100%;margin:0;gap:0;justify-content:space-between;align-items:center}
  #menuScreen .mHead{display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(54px + env(safe-area-inset-top,0px)) 20px 0}
  #menuScreen h1{font-family:"Arial Black","Segoe UI Black","Segoe UI",system-ui,sans-serif;font-size:clamp(46px,14vw,72px);font-weight:900;line-height:1.12;letter-spacing:.01em;padding:.06em .1em .1em;margin:0;color:#fff;background:none;-webkit-text-fill-color:#fff;animation:none;transform:skewX(-7deg);text-shadow:3px 3px 0 var(--ink),0 8px 22px rgba(0,0,0,.35)}
  .piste{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(14,42,71,.35)}
  .piste svg{width:34px;height:34px;flex:none}
  .piste span{display:flex;flex-direction:column;text-align:left;font-size:12.5px;line-height:1.3;font-weight:600}
  .piste b{font-size:15px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
  .sheet{width:100%;max-width:520px;background:var(--snow);border-radius:22px 22px 0 0;padding:16px 14px calc(34px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.28)}
  .how{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .how figure{margin:0;display:flex;flex-direction:column;gap:6px;text-align:left}
  .pic{width:100%;height:auto;display:block;overflow:hidden;border-radius:10px}
  .how figcaption{display:flex;flex-direction:column;font-size:12px;line-height:1.35;color:#41566b;font-weight:600;padding:0 2px}
  .how figcaption b{font-size:14.5px;color:var(--ink);font-weight:900}
  .cta{display:flex;align-items:center;gap:12px;margin-top:14px}
  .lives{display:flex;gap:4px;flex:none}.lives svg{width:26px;height:24px}
  #menuScreen #startBtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;padding:0 20px;margin:0;border-radius:14px;font-size:18px;font-weight:900;letter-spacing:.08em;color:var(--ink);background:var(--acc);animation:none;box-shadow:0 4px 0 #b4440f;transition:transform .08s,box-shadow .08s}
  #menuScreen #startBtn svg{width:20px;height:20px}
  #menuScreen #startBtn:hover{transform:none}
  #menuScreen #startBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b4440f}
  #menuScreen #startBtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  /* chuyển động của các hình mô phỏng */
  .tL,.tR{opacity:.12}.tL{animation:tPulse 2s steps(1) infinite}.tR{animation:tPulse 2s steps(1) infinite 1s}
  @keyframes tPulse{0%{opacity:.55}50%{opacity:.12}}
  .thumb{animation:tThumb 2s steps(1) infinite}
  @keyframes tThumb{0%{transform:translateX(0)}50%{transform:translateX(15px)}}
  .dFast{animation:dFast 1s linear infinite}.dSlow{animation:dSlow 2.6s linear infinite}
  @keyframes dFast{from{transform:translateY(0);opacity:1}85%{opacity:1}to{transform:translateY(38px);opacity:0}}
  @keyframes dSlow{from{transform:translate(0,0);opacity:1}85%{opacity:1}to{transform:translate(21px,36px);opacity:0}}
  .dSway{animation:dSway 2.4s ease-in-out infinite}
  @keyframes dSway{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
  .dWeave{animation:dWeave 3s ease-in-out infinite}
  @keyframes dWeave{0%{transform:translate(0,0);opacity:0}8%{opacity:1}35%{transform:translate(-16px,-18px)}68%{transform:translate(2px,-30px)}92%{opacity:1}100%{transform:translate(2px,-46px);opacity:0}}
  @media (max-height:700px){#menuScreen .mHead{padding-top:calc(46px + env(safe-area-inset-top,0px));gap:8px}#menuScreen h1{font-size:44px}.sheet{padding-top:12px}.how{gap:8px}.how figcaption{font-size:11.5px}.how figcaption b{font-size:13.5px}.cta{margin-top:10px}}
  /* khổ ngang: tiêu đề bên trái, bảng chỉ dẫn bên phải */
  @media (max-height:500px) and (orientation:landscape){
    #overlay.menu-mode{background:linear-gradient(90deg,rgba(9,32,58,.8) 0,rgba(9,32,58,.5) 38%,rgba(9,32,58,0) 58%)}
    #menuScreen{flex-direction:row;align-items:stretch;justify-content:flex-start}
    #menuScreen .mHead{flex:1;min-width:0;justify-content:center;padding:0 12px 0 64px}
    #menuScreen h1{font-size:44px}
    .sheet{flex:none;width:min(520px,62vw);max-width:none;border-radius:20px 0 0 20px;padding:12px 12px 26px;display:flex;flex-direction:column;justify-content:center;box-shadow:-6px 0 24px rgba(0,0,0,.28)}
    .how{grid-template-columns:repeat(4,1fr);gap:8px}
    .how figcaption{font-size:10.5px;line-height:1.25}.how figcaption b{font-size:12px}
    .cta{margin-top:10px}#menuScreen #startBtn{height:48px;font-size:16px}.lives svg{width:22px;height:20px}
  }
  @media (prefers-reduced-motion:reduce){.tL,.tR,.thumb,.dFast,.dSlow,.dSway,.dWeave{animation:none}.tL{opacity:.5}.dFast{transform:translateY(20px)}.dSlow{transform:translate(10px,18px)}.dWeave{transform:translate(2px,-30px)}}
</style>
</head>
<body>
<div id="game"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="hud-top">
    <div class="stat">
      <div class="stat-label">ĐIỂM</div>
      <div class="stat-value" id="scoreVal">0</div>
      <div class="stat-sub" id="distanceVal">0 m</div>
    </div>
    <div class="stat right">
      <div class="stat-label">MẠNG</div>
      <div class="lives" id="livesVal"></div>
    </div>
  </div>
  <div class="speed-bar"><div class="speed-fill" id="speedFill"></div></div>
  <div class="combo" id="comboVal"></div>
  <div class="danger-label" id="dangerLabel">⚠ ĐOẠN DỐC GẮT ⚠</div>
  <div id="slope-indicator"></div>
  <div id="powder">TUYẾT DÀY · RA KHỎI ĐƯỜNG TRƯỢT</div>
  <div class="speed-text"><span id="speedVal">0</span><small>KM/H</small></div>
</div>

<div id="overlay" class="menu-mode">
  <div class="screen" id="menuScreen">
    <header class="mHead">
      <h1>TRƯỢT<br>TUYẾT</h1>
      <div class="piste"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1.5" y="1.5" width="31" height="31" rx="6" fill="#fff" stroke="#0e2a47" stroke-width="2.4"/><path d="M17 5 L22.5 11.5 L17 18 L11.5 11.5Z M17 16 L22.5 22.5 L17 29 L11.5 22.5Z" fill="#0e2a47"/></svg><span><b>Đường đen</b>Đổ núi · 2 mạng</span></div>
    </header>
    <section class="sheet" aria-label="Hướng dẫn chơi">
      <div class="how">
        <figure>
          <svg class="pic" viewBox="0 0 120 64" aria-hidden="true">
            <rect x="2" y="2" width="116" height="60" rx="10" fill="#e6f1f9"/>
            <rect x="43" y="5" width="34" height="54" rx="6" fill="#fff" stroke="#0e2a47" stroke-width="2.4"/>
            <rect class="tL" x="45.5" y="11" width="14" height="42" fill="#ff6a1f"/><rect class="tR" x="60.5" y="11" width="14" height="42" fill="#ff6a1f"/>
            <line x1="60" y1="11" x2="60" y2="53" stroke="#0e2a47" stroke-width="1.6" stroke-dasharray="3 3"/>
            <path d="M33 32H21M26 26L20 32L26 38M87 32H99M94 26L100 32L94 38" fill="none" stroke="#0e2a47" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle class="thumb" cx="52.5" cy="44" r="5.5" fill="#ff6a1f" stroke="#0e2a47" stroke-width="2"/>
          </svg>
          <figcaption><b>Bẻ ván</b>Chạm trái · phải (← →)</figcaption>
        </figure>
        <figure>
          <svg class="pic" viewBox="0 0 120 64" aria-hidden="true">
            <rect x="2" y="2" width="116" height="60" rx="10" fill="#e6f1f9"/>
            <line x1="60" y1="8" x2="60" y2="56" stroke="#b9cfe0" stroke-width="2" stroke-dasharray="3 4"/>
            <path d="M30 10V50M23 43L30 52L37 43" fill="none" stroke="#ff6a1f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M76 12L98 48M97 38L99 50L88 47" fill="none" stroke="#0e2a47" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
            <circle class="dFast" cx="30" cy="10" r="4.6" fill="#0e2a47"/><circle class="dSlow" cx="76" cy="12" r="4.6" fill="#0e2a47"/>
          </svg>
          <figcaption><b>Lao thẳng</b>Càng thẳng càng nhanh</figcaption>
        </figure>
        <figure>
          <svg class="pic" viewBox="0 0 120 64" aria-hidden="true">
            <defs><pattern id="mHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="6" height="6" fill="#cfe0ee"/><line x1="0" y1="0" x2="0" y2="6" stroke="#a9c3d8" stroke-width="2"/></pattern></defs>
            <rect x="2" y="2" width="116" height="60" rx="10" fill="url(#mHatch)"/>
            <path d="M46 2H74L82 62H38Z" fill="#fff" stroke="#0e2a47" stroke-width="2" stroke-dasharray="5 4"/>
            <path d="M15 34l5-11 5 11ZM11 46l6-12 6 12Z M98 30l5-11 5 11ZM94 48l6-12 6 12Z" fill="#1f6b4a" stroke="#0e2a47" stroke-width="1.6" stroke-linejoin="round"/>
            <circle class="dSway" cx="60" cy="38" r="5" fill="#ff6a1f" stroke="#0e2a47" stroke-width="2"/>
          </svg>
          <figcaption><b>Giữ đường cán</b>Ra ngoài là tuyết dày</figcaption>
        </figure>
        <figure>
          <svg class="pic" viewBox="0 0 120 64" aria-hidden="true">
            <rect x="2" y="2" width="116" height="60" rx="10" fill="#e6f1f9"/>
            <path d="M16 36l6-13 6 13ZM13 48l9-15 9 15Z" fill="#1f6b4a" stroke="#0e2a47" stroke-width="1.6" stroke-linejoin="round"/>
            <ellipse cx="98" cy="46" rx="9" ry="6.5" fill="#8a97a6" stroke="#0e2a47" stroke-width="2"/>
            <rect x="82" y="14" width="22" height="7" rx="3" fill="#a8743a" stroke="#0e2a47" stroke-width="1.8" transform="rotate(-18 93 17)"/>
            <path d="M50 34V14M78 34V14" stroke="#0e2a47" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M50 14L62 19L50 24ZM78 14L66 19L78 24Z" fill="#ff6a1f" stroke="#0e2a47" stroke-width="1.6" stroke-linejoin="round"/>
            <circle class="dWeave" cx="64" cy="58" r="4.6" fill="#0e2a47"/>
          </svg>
          <figcaption><b>Né &amp; qua cổng</b>Tránh cây, đá, gỗ</figcaption>
        </figure>

  return 34 * Math.sin(z * 0.0032) + 16 * Math.sin(z * 0.0013 + 1.3);

  h += Math.sin(x * 0.05) * 0.5 + Math.cos(z * 0.05) * 0.6 + Math.sin(x * 0.12 + z * 0.08) * 0.35;
  h += Math.sin(z * 0.018 + x * 0.004) * 1.6 + Math.cos(z * 0.028 + 1.1) * 1.1;
  const d = x - pisteCenter(z);
  h += d * d * 0.0012 + Math.max(0, Math.abs(d) - PISTE_HALF) * 0.12;

const SNOW_COUNT = isMobile ? 900 : 1500;

const snowSpeeds = new Float32Array(SNOW_COUNT);
const snowPhases = new Float32Array(SNOW_COUNT);
for (let i = 0; i < SNOW_COUNT; i++) {

  snowPhases[i] = Math.random() * Math.PI * 2;
}
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));
function makeSnowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 32;

  const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.5, 'rgba(255,255,255,0.6)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 32, 32);

}
const snowMat = new THREE.PointsMaterial({ map: makeSnowTexture(), color: 0xffffff, size: 0.22, transparent: true, opacity: 0.8, depthWrite: false, sizeAttenuation: true });

function updateSnow(dt) {
  const pos = snowGeo.attributes.position.array;
  const windX = Math.sin(windPhase) * 2.5 + Math.sin(windPhase * 2.3) * 1.2;
  const windZ = Math.cos(windPhase * 0.7) * 1.8;
  for (let i = 0; i < SNOW_COUNT; i++) {
    const k = i * 3;
    pos[k] += (windX + Math.sin(time * 1.5 + snowPhases[i]) * 0.6) * dt;
    pos[k + 1] -= snowSpeeds[i] * dt;
    pos[k + 2] += windZ * dt;
    const rx = pos[k] - camPos.x, ry = pos[k + 1] - camPos.y, rz = pos[k + 2] - camPos.z;
    if (ry < SNOW_BOX.bottom) {
      pos[k + 1] = camPos.y + SNOW_BOX.top;
      pos[k] = camPos.x + (Math.random() - 0.5) * SNOW_BOX.halfW * 2;
      pos[k + 2] = camPos.z + (Math.random() - 0.5) * SNOW_BOX.halfD * 2;
    }
    if (ry > SNOW_BOX.top + 5) pos[k + 1] -= (SNOW_BOX.top - SNOW_BOX.bottom);
    if (rx < -SNOW_BOX.halfW) pos[k] += SNOW_BOX.halfW * 2;
    if (rx > SNOW_BOX.halfW) pos[k] -= SNOW_BOX.halfW * 2;
    if (rz < -SNOW_BOX.halfD) pos[k + 2] += SNOW_BOX.halfD * 2;
    if (rz > SNOW_BOX.halfD) pos[k + 2] -= SNOW_BOX.halfD * 2;
  }
  snowGeo.attributes.position.needsUpdate = true;
  snowGeo.setDrawRange(0, Math.floor(SNOW_COUNT * weatherIntensity));
  snowMat.opacity = 0.5 + weatherIntensity * 0.4;
}
function updateWeather(dt) {
  weatherTimer -= dt;
  if (weatherTimer <= 0) {
    weatherTimer = 8 + Math.random() * 12;
    const r = Math.random();
    weatherTarget = r < 0.25 ? 0.0 : r < 0.55 ? 0.25 : r < 0.85 ? 0.6 : 1.0;
  }
  weatherIntensity += (weatherTarget - weatherIntensity) * Math.min(1, 0.6 * dt);
  windPhase += dt * 0.3;
}

const TRAIL_N = 160, TRAIL_LIFE = 3.2, TRAIL_W = 0.07;
function makeRibbon() {
  const pos = new Float32Array(TRAIL_N * 2 * 3);
  const col = new Float32Array(TRAIL_N * 2 * 4);
  const idx = [];
  for (let i = 0; i < TRAIL_N - 1; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 4).setUsage(THREE.DynamicDrawUsage));
  geo.setIndex(idx);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, pos, col, pts: [] };
}
const ribbons = [makeRibbon(), makeRibbon()];
function resetRibbons() { for (const r of ribbons) { r.pts.length = 0; r.col.fill(0); r.mesh.geometry.attributes.color.needsUpdate = true; } }
function pushRibbon(r, x, z, dirX, dirZ) {
  const last = r.pts[0];
  if (last && (last.x - x) * (last.x - x) + (last.z - z) * (last.z - z) < 0.25) { last.x = x; last.z = z; return; }
  r.pts.unshift({ x, z, nx: -dirZ, nz: dirX, t: time });
  if (r.pts.length > TRAIL_N) r.pts.length = TRAIL_N;
}
function updateRibbon(r) {
  const { pos, col, pts } = r;
  for (let i = 0; i < TRAIL_N; i++) {
    const p = pts[i] || pts[pts.length - 1];
    const k = i * 6, c = i * 8;
    if (!p) { col[c + 3] = 0; col[c + 7] = 0; continue; }
    const y = getTerrainHeight(p.x, p.z) + 0.03;
    pos[k] = p.x - p.nx * TRAIL_W; pos[k + 1] = y; pos[k + 2] = p.z - p.nz * TRAIL_W;
    pos[k + 3] = p.x + p.nx * TRAIL_W; pos[k + 4] = y; pos[k + 5] = p.z + p.nz * TRAIL_W;
    const a = pts[i] ? Math.max(0, 1 - (time - p.t) / TRAIL_LIFE) * 0.38 : 0;
    col[c] = col[c + 4] = 0.55; col[c + 1] = col[c + 5] = 0.66; col[c + 2] = col[c + 6] = 0.8;
    col[c + 3] = col[c + 7] = a;
  }
  r.mesh.geometry.attributes.position.needsUpdate = true;
  r.mesh.geometry.attributes.color.needsUpdate = true;
}

// ÂM THANH
let audioCtx = null, windGain = null, windFilter = null;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // tiếng gió rít theo tốc độ: nhiễu trắng qua bộ lọc
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    windFilter = audioCtx.createBiquadFilter();
    windFilter.type = 'bandpass'; windFilter.frequency.value = 500; windFilter.Q.value = 0.7;
    windGain = audioCtx.createGain(); windGain.gain.value = 0;
    src.connect(windFilter); windFilter.connect(windGain); windGain.connect(audioCtx.destination);
    src.start();
  } catch (e) {}
}
function beep(freq, dur, type, vol) {
  if (!audioCtx || audioCtx.state === 'suspended') return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), t + dur);
  gain.gain.setValueAtTime(vol || 0.06, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function updateWindSound() {
  if (!windGain || !audioCtx) return;
  const playing = state.mode === 'playing';
  const r = playing ? Math.min(1, player.speed / 36) : 0;
  windGain.gain.setTargetAtTime(r * r * 0.05, audioCtx.currentTime, 0.2);
  windFilter.frequency.setTargetAtTime(350 + r * 1100, audioCtx.currentTime, 0.2);
}

// Rừng hai bên đường trượt mọc sẵn từ đầu
function growEdgeForest(untilZ) {
  while (state.edgeNextZ > untilZ) {
    const z = state.edgeNextZ;
    const c = pisteCenter(z);
    for (const side of [-1, 1]) {
      const n = 1 + (Math.random() < 0.6 ? 1 : 0);
      for (let i = 0; i < n; i++) {
        const off = PISTE_HALF + 2.5 + Math.pow(Math.random(), 1.4) * 55;
        placeTree(c + side * off, z + (Math.random() - 0.5) * 4, 2.3 + Math.random() * 1.6, true);
      }
    }
    // cây lẻ lác đác sát mép trong đường trượt
    if (Math.random() < 0.08) {
      const side = Math.random() < 0.5 ? -1 : 1;
      placeTree(c + side * (PISTE_HALF - 2 - Math.random() * 3), z, 2.0 + Math.random() * 0.8, true);
    }
    state.edgeNextZ -= 5;
  }
}

function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  state.mode = 'playing';
  Object.assign(player, { x: pisteCenter(0), z: 0, heading: 0, speed: START_SPEED, omega: 0, pitch: 0, roll: 0, lean: 0 });
  player.y = getTerrainHeight(player.x, player.z);
  Object.assign(state, {
    distance: 0, score: 0, bonusScore: 0, lives: INITIAL_LIVES, gates: 0, combo: 0, comboTimer: 0,
    invincible: 1.2, shake: 0, spawnTimer: 1.2, gateTimer: 2.5, flakeTimer: 2, decoTimer: 6, topSpeed: 0, offPiste: false
  });
  deathCamActive = false; deathT = 0;
  resetPools();
  state.edgeNextZ = 30;
  growEdgeForest(-SPAWN_AHEAD);
  updateCameraRig();
  camYaw = 0; camRoll = 0;
  snapCamera();
  camera.fov = baseFov; camera.updateProjectionMatrix();
  playerRoot.visible = true;
  weatherTarget = 0.3; weatherIntensity = 0.3; weatherTimer = 6;
  overlay.classList.add('hidden');
  overlay.classList.remove('menu-mode');
  hud.style.display = 'block';
  vignetteEl.style.opacity = 0;
  dangerLabelEl.classList.remove('show');
  slopeIndicatorEl.style.opacity = 0;
  powderEl.classList.remove('show');
  updatePlayerTransform(0);

}

function gameOver() {
  state.mode = 'over';
  if (state.score > best) { best = state.score; try { localStorage.setItem('ski3d_best', best); } catch (e) {} }
  if (window.Scores) Scores.submit('truottuyet3d', state.score);
  beep(180, 0.4, 'sawtooth', 0.08);
  setTimeout(() => beep(100, 0.5, 'sine', 0.08), 100);
  setTimeout(() => {
    if (state.mode !== 'over') return;
    document.getElementById('finalScore').textContent = formatNum(state.score);
    document.getElementById('finalBest').textContent = 'Kỷ lục: ' + formatNum(best);
    document.getElementById('finalDistance').textContent = formatNum(Math.floor(state.distance)) + ' m';
    document.getElementById('finalSpeed').textContent = Math.round(state.topSpeed * 3.6) + ' km/h';
    document.getElementById('finalGates').textContent = state.gates;
    menuScreen.classList.add('hidden');
    overlay.classList.remove('menu-mode');
    overScreen.classList.remove('hidden');
    overlay.classList.remove('hidden');
    hud.style.display = 'none';
    vignetteEl.style.opacity = 0;
  }, 1600);
}

// SINH VẬT CẢN (trên đường trượt, nhắm vào hướng người chơi sắp tới)
// ============================================================
const aheadZ = () => player.z - SPAWN_AHEAD;
function clampToPiste(x, z, margin) {
  const c = pisteCenter(z), lim = PISTE_HALF - (margin || 0);
  return Math.max(c - lim, Math.min(c + lim, x));
}
function predictX() {
  const t = SPAWN_AHEAD / Math.max(8, player.speed);
  return player.x + Math.sin(player.heading) * player.speed * Math.min(t, 2.5) * 0.6;
}
function obstacleX(spread) {
  const z = aheadZ();
  let x;
  if (state.distance > 120 && Math.random() < 0.55) x = predictX() + (Math.random() - 0.5) * 14;
  else x = pisteCenter(z) + (Math.random() - 0.5) * PISTE_HALF * 2 * (spread || 1);
  return clampToPiste(x, z, 1);
}
function spawnTreeObstacle(x, s) { placeTree(x, aheadZ() + (Math.random() - 0.5) * 6, s || (2.0 + Math.random() * 1.0), false); }
function spawnRock(x, big) {
  const r = rockPool.find(r => !r.active);
  if (!r) return;
  const s = big ? 2.2 + Math.random() * 0.6 : 1.0 + Math.random() * 0.6;
  r.active = true; r.worldX = x; r.worldZ = aheadZ();
  r.mesh.scale.setScalar(s);
  r.mesh.position.set(x, getTerrainHeight(x, r.worldZ) - 0.1, r.worldZ);
  r.mesh.rotation.y = Math.random() * Math.PI * 2;
  r.radius = 0.8 * s; r.mesh.visible = true;
}
function spawnLog(x) {
  const l = logPool.find(l => !l.active);
  if (!l) return;
  const len = 3 + Math.random() * 2.5;
  l.active = true; l.worldX = x; l.worldZ = aheadZ(); l.length = len;
  l.mesh.scale.set(len / 3.5, 1, 1);
  l.mesh.position.set(x, getTerrainHeight(x, l.worldZ), l.worldZ);
  l.mesh.rotation.y = (Math.random() - 0.5) * 0.3;
  l.mesh.visible = true;
}
function spawnTreeCluster() {
  const x = obstacleX(0.8);
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 4.5;
    placeTree(clampToPiste(x + Math.cos(a) * r, aheadZ(), 0), aheadZ() + Math.sin(a) * r, 2.0 + Math.random() * 1.3, false);
  }
}
function spawnPair() {
  const x = obstacleX();
  const gap = 5.5 + Math.random() * 2.5;
  spawnTreeObstacle(x - gap / 2);
  spawnTreeObstacle(x + gap / 2);
}
function spawnWave() {
  const d = state.distance, r = Math.random();
  if (d < D_WARMUP) {
    if (r < 0.75) spawnTreeObstacle(obstacleX());
    else spawnRock(obstacleX());
    return;
  }
  if (d < D_MID) {
    if (r < 0.5) spawnTreeObstacle(obstacleX());
    else if (r < 0.75) spawnRock(obstacleX());
    else if (r < 0.9) spawnLog(obstacleX());
    else spawnTreeCluster();
    return;
  }
  if (r < 0.34) spawnTreeObstacle(obstacleX());
  else if (r < 0.52) spawnRock(obstacleX(), Math.random() < 0.3);
  else if (r < 0.68) spawnLog(obstacleX());
  else if (r < 0.84) spawnPair();
  else spawnTreeCluster();
}
function getSpawnGap() {
  const k = Math.min(1, state.distance / 2500);
  return Math.max(16, 34 - k * 16);   // khoảng cách (m) giữa hai đợt vật cản
}
function spawnGate() {
  const g = gatePool.find(g => !g.active);
  if (!g) return;
  const z = aheadZ();
  g.active = true; g.passed = false;
  g.worldX = clampToPiste(pisteCenter(z) + (Math.random() - 0.5) * (PISTE_HALF - 6) * 2, z, 4);
  g.worldZ = z; g.prevPlayerZ = player.z;
  g.mesh.position.set(g.worldX, getTerrainHeight(g.worldX, z), z);
  g.mesh.rotation.y = 0;
  g.mesh.visible = true;
}
function spawnFlakes() {
  const z = aheadZ();
  const count = 2 + Math.floor(Math.random() * 3);
  const baseX = clampToPiste(pisteCenter(z) + (Math.random() - 0.5) * 30, z, 3);
  for (let i = 0; i < count; i++) {
    const f = flakePool.find(f => !f.active);
    if (!f) return;
    f.active = true; f.worldX = baseX + (Math.random() - 0.5) * 1.2; f.worldZ = z - i * 4;
    f.phase = Math.random() * Math.PI * 2;
    f.mesh.position.set(f.worldX, getTerrainHeight(f.worldX, f.worldZ) + f.baseY, f.worldZ);
    f.mesh.visible = true;
  }
}
function spawnHouseCluster() {
  const z = aheadZ() - Math.random() * 20;
  const side = Math.random() < 0.5 ? -1 : 1;
  const c = pisteCenter(z);
  const count = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < count; i++) {
    const h = housePool.find(h => !h.active);
    if (!h) return;
    h.active = true;
    h.worldX = c + side * (PISTE_HALF + 9 + i * 9 + Math.random() * 4);
    h.worldZ = z - i * 7;
    // dọn chỗ: bỏ cây đè lên nhà
    for (const t of trees) if (t.active && Math.abs(t.worldX - h.worldX) < 7 && Math.abs(t.worldZ - h.worldZ) < 7) hideTree(t);
    h.mesh.position.set(h.worldX, getTerrainHeight(h.worldX, h.worldZ) - 0.3, h.worldZ);
    h.mesh.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;   // quay mặt ra đường trượt
    h.mesh.visible = true;
  }
}
function spawnCableCar() {
  const c = cableCarPool.find(c => !c.active);
  if (!c) return;
  const z = aheadZ() - 15;
  c.active = true; c.worldZ = z; c.worldX = pisteCenter(z);
  for (const t of trees) if (t.active && Math.abs(t.worldZ - z) < 3 && Math.abs(Math.abs(t.worldX - c.worldX) - CABLE_SPAN / 2) < 3) hideTree(t);
  c.mesh.position.set(c.worldX, getTerrainHeight(c.worldX, z), z);
  c.phase = Math.random() * Math.PI * 2;
  c.mesh.visible = true;
}
function spawnDecorations() {
  if (state.distance < DECO_MIN_DISTANCE) return;
  if (Math.random() < 0.6) spawnHouseCluster(); else spawnCableCar();
}

// ============================================================
// CẬP NHẬT KHI ĐANG TRƯỢT
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function updatePlaying(dt) {
  // --- Lái: bẻ ván làm đổi hướng trượt, thả tay thì ván tự trôi về hướng đổ dốc ---
  let tIn = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) tIn -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) tIn += 1;
  if (tIn === 0 && (touchActive || mouseControl)) tIn = inputX;
  const target = tIn * MAX_HEADING;
  const rate = Math.abs(tIn) > 0.05 ? STEER_RATE * (0.55 + 0.45 * Math.abs(tIn)) : RETURN_RATE;
  const prevHeading = player.heading;
  player.heading += clamp(target - player.heading, -rate * dt, rate * dt);
  const omega = (player.heading - prevHeading) / Math.max(dt, 1e-4);
  player.omega += (omega - player.omega) * Math.min(1, 10 * dt);

  // --- Vật lý: trọng lực dọc sườn dốc, ma sát, cản gió, mất tốc khi ôm cua ---
  const sx = Math.sin(player.heading), sz = -Math.cos(player.heading);   // hướng trượt (x, z)
  const e = 1.0;
  const hx = (getTerrainHeight(player.x + e, player.z) - getTerrainHeight(player.x - e, player.z)) / (2 * e);
  const hz = (getTerrainHeight(player.x, player.z + e) - getTerrainHeight(player.x, player.z - e)) / (2 * e);
  const dhds = hx * sx + hz * sz;                     // độ cao đổi bao nhiêu khi đi 1 m theo hướng trượt
  const offset = player.x - pisteCenter(player.z);
  state.offPiste = Math.abs(offset) > PISTE_HALF + 0.5;
  const mu = state.offPiste ? MU_POWDER : MU_PISTE;
  const tuck = clamp(player.speed / 30, 0, 1) * (Math.abs(tIn) < 0.2 ? 1 : 0.4);
  const drag = DRAG * (1 - 0.25 * tuck);
  let a = -G * dhds / Math.sqrt(1 + dhds * dhds) - mu * G - drag * player.speed * player.speed
        - CARVE_LOSS * Math.abs(player.omega) * player.speed;
  player.speed = clamp(player.speed + a * dt, MIN_SPEED, MAX_SPEED);
  state.topSpeed = Math.max(state.topSpeed, player.speed);
  state.grade = Math.max(0, hz);

  const prevZ = player.z;
  player.x += sx * player.speed * dt;
  player.z += sz * player.speed * dt;
  const progress = Math.max(0, prevZ - player.z);
  state.distance += progress;
  state.score = Math.floor(state.distance) + state.bonusScore;

  growEdgeForest(aheadZ());
  updatePlayerTransform(dt, tIn);

  // --- Mặt đất, núi, mặt trời đi theo người chơi ---
  ground.position.set(player.x, 0, player.z);
  mountainsFar.position.set(player.x * 0.6, player.y - 160, player.z - 520);
  mountainsNear.position.set(player.x * 0.8, player.y - 150, player.z - 400);
  sunSprite.position.set(player.x + 160, player.y + 120, player.z - 420);
  sun.position.set(player.x + 30, player.y + 40, player.z + 10);
  sun.target.position.set(player.x, player.y, player.z);

  // --- Thu hồi vật đã đi qua ---
  const recycleZ = player.z + RECYCLE_BEHIND;
  for (const t of trees) if (t.active && t.worldZ > recycleZ) hideTree(t);
  for (const pool of [rockPool, logPool]) for (const o of pool) if (o.active && o.worldZ > recycleZ) { o.active = false; o.mesh.visible = false; }
  for (const g of gatePool) {
    if (!g.active) continue;
    if (!g.passed && g.prevPlayerZ > g.worldZ && player.z <= g.worldZ) checkGatePass(g);
    g.prevPlayerZ = player.z;
    if (g.worldZ > recycleZ) { g.active = false; g.mesh.visible = false; }
  }
  for (const f of flakePool) {
    if (!f.active) continue;
    f.phase += dt * 4;
    f.mesh.position.y = getTerrainHeight(f.worldX, f.worldZ) + f.baseY + Math.sin(f.phase) * 0.25;
    f.mesh.rotation.y += dt * 3; f.mesh.rotation.x += dt * 2;
    if (f.worldZ > recycleZ) { f.active = false; f.mesh.visible = false; }
  }
  for (const h of housePool) if (h.active && h.worldZ > recycleZ + 40) { h.active = false; h.mesh.visible = false; }
  for (const c of cableCarPool) {
    if (!c.active) continue;
    c.phase += dt * 0.25;
    if (c.cabin) {
      c.cabin.position.x = Math.sin(c.phase) * (CABLE_SPAN / 2 - 3);
      c.cabin.rotation.z = Math.sin(c.phase * 3.1) * 0.03;
    }
    if (c.worldZ > recycleZ + 40) { c.active = false; c.mesh.visible = false; }
  }

  // --- Vệt ván và tuyết bắn ---
  for (let i = 0; i < 2; i++) {
    const side = i === 0 ? -1 : 1;
    const lx = player.x + (-sz) * side * 0.17 * PLAYER_SCALE, lz = player.z + sx * side * 0.17 * PLAYER_SCALE;
    pushRibbon(ribbons[i], lx, lz, sx, sz);
  }
  const carve = Math.abs(player.omega) * player.speed;
  if ((carve > 6 || state.offPiste) && Math.random() < 0.8) {
    const n = state.offPiste ? 3 : Math.min(4, Math.floor(carve / 6));
    const outward = Math.sign(player.omega) || 1;
    for (let i = 0; i < n; i++) {
      spawnParticle(
        player.x + (Math.random() - 0.5) * 0.6, player.y + 0.1 + Math.random() * 0.2, player.z + (Math.random() - 0.5) * 0.6,
        -sz * outward * (2 + Math.random() * 3) + sx * player.speed * 0.3, 1 + Math.random() * 2.5, sx * outward * (2 + Math.random() * 3) + sz * player.speed * 0.3,
        0.4 + Math.random() * 0.3);
    }
  }

  // --- Sinh vật cản theo quãng đường đã đi ---
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnWave();
    state.spawnTimer = (getSpawnGap() / Math.max(8, player.speed)) * (0.7 + Math.random() * 0.6);
  }
  state.gateTimer -= dt;
  if (state.gateTimer <= 0) { spawnGate(); state.gateTimer = GATE_INTERVAL_MIN + Math.random() * (GATE_INTERVAL_MAX - GATE_INTERVAL_MIN); }
  state.flakeTimer -= dt;
  if (state.flakeTimer <= 0) { spawnFlakes(); state.flakeTimer = 4 + Math.random() * 3; }
  state.decoTimer -= dt;
  if (state.decoTimer <= 0) { spawnDecorations(); state.decoTimer = DECO_MIN_INTERVAL + Math.random() * (DECO_MAX_INTERVAL - DECO_MIN_INTERVAL); }

  // --- Va chạm ---
  if (state.invincible <= 0) checkCollisions();
  else {
    state.invincible -= dt;
    playerRoot.visible = Math.floor(state.invincible * 15) % 2 === 0;
  }
  if (state.invincible <= 0) playerRoot.visible = true;

  if (state.comboTimer > 0) { state.comboTimer -= dt; if (state.comboTimer <= 0) { state.combo = 0; updateComboUI(); } }
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 45);

  const sr = clamp((player.speed - 15) / 25, 0, 1);
  const tf = baseFov + sr * 14;
  if (Math.abs(camera.fov - tf) > 0.1) { camera.fov += (tf - camera.fov) * Math.min(1, 2 * dt); camera.updateProjectionMatrix(); }
  vignetteEl.style.opacity = Math.min(0.7, Math.max(0, (sr - 0.45) * 1.3));

  dangerLabelEl.classList.toggle('show', state.grade > 0.33);
  const deg = Math.round(Math.atan(state.grade) * 180 / Math.PI);
  slopeIndicatorEl.textContent = '▼ DỐC ' + deg + '°';
  slopeIndicatorEl.style.color = state.grade > 0.33 ? '#ff8a5b' : '#e0f2fe';
  slopeIndicatorEl.style.opacity = 0.85;
  powderEl.classList.toggle('show', state.offPiste);
  updateHUD();
}

function updatePlayerTransform(dt, tIn) {
  const sx = Math.sin(player.heading), sz = -Math.cos(player.heading);
  const f = 0.9;
  const hF = getTerrainHeight(player.x + sx * f, player.z + sz * f);
  const hB = getTerrainHeight(player.x - sx * f, player.z - sz * f);
  const hL = getTerrainHeight(player.x + sz * 0.4, player.z - sx * 0.4);
  const hR = getTerrainHeight(player.x - sz * 0.4, player.z + sx * 0.4);
  const ty = (hF + hB + hL + hR) / 4;
  const k = dt > 0 ? Math.min(1, 25 * dt) : 1;
  player.y += (ty - player.y) * k;
  // ván áp theo mặt dốc: mũi ván chúi xuống khi đổ dốc
  const tPitch = Math.atan2(hF - hB, 2 * f);
  const tRoll = Math.atan2(hL - hR, 0.8);
  player.pitch += (tPitch - player.pitch) * k;
  player.roll += (tRoll - player.roll) * k;
  // nghiêng người vào cua theo lực hướng tâm
  const tLean = clamp(-Math.atan(player.speed * player.omega / G) * 0.6, -0.45, 0.45);
  player.lean += (tLean - player.lean) * (dt > 0 ? Math.min(1, 8 * dt) : 1);

  playerRoot.position.set(player.x, player.y, player.z);
  playerRoot.rotation.set(-player.pitch, -player.heading, -player.roll);
  skiGroup.rotation.set(0, 0, 0);
  bodyGroup.rotation.set(0, 0, player.lean);
  // tư thế trượt: gập gối và gập người về trước khi lao nhanh
  const tuck = clamp(player.speed / 32, 0, 1) * (tIn && Math.abs(tIn) > 0.2 ? 0.5 : 1);
  torsoGroup.rotation.x = -(0.25 + 0.5 * tuck);
  torsoGroup.position.y = 0.88 - 0.18 * tuck;
  for (const l of legs) l.rotation.x = -0.15 - 0.25 * tuck;
}

function checkGatePass(g) {
  const half = GATE_GAP / 2;
  const lp = g.worldX - half, rp = g.worldX + half, px = player.x;
  if (Math.abs(px - lp) < GATE_COLLISION_DIST + 0.45 || Math.abs(px - rp) < GATE_COLLISION_DIST + 0.45) {
    crash();
    g.active = false; g.mesh.visible = false;
    return;
  }
  if (px > lp && px < rp) {
    g.passed = true;
    state.gates++; state.combo++; state.comboTimer = 4;
    state.bonusScore += 50 * state.combo;
    updateComboUI();
    beep(600 + state.combo * 60, 0.1, 'sine', 0.05);
    const gy = getTerrainHeight(g.worldX, g.worldZ);
    for (let i = 0; i < 10; i++) spawnParticle(g.worldX + (Math.random() - 0.5) * GATE_GAP, gy + 1 + Math.random() * 1.5, g.worldZ,
      (Math.random() - 0.5) * 5, 2 + Math.random() * 4, (Math.random() - 0.5) * 5, 0.5);
  }
}

function burst(x, y, z, n) {
  for (let i = 0; i < n; i++) spawnParticle(x + (Math.random() - 0.5) * 1.5, y + 0.5 + Math.random() * 2, z,
    (Math.random() - 0.5) * 8, 3 + Math.random() * 5, (Math.random() - 0.5) * 8, 0.7);
}
function checkCollisions() {
  const px = player.x, pz = player.z, pr = 0.35;
  for (const t of trees) {
    if (!t.active) continue;
    const dx = t.worldX - px, dz = t.worldZ - pz, r = pr + t.radius;
    if (dx * dx + dz * dz < r * r) { crash(); burst(t.worldX, t.y + 2, t.worldZ, 18); hideTree(t); return; }
  }
  for (const o of rockPool) {
    if (!o.active) continue;
    const dx = o.worldX - px, dz = o.worldZ - pz, r = pr + o.radius;
    if (dx * dx + dz * dz < r * r) { crash(); o.active = false; o.mesh.visible = false; return; }
  }
  for (const l of logPool) {
    if (!l.active) continue;
    if (Math.abs(l.worldX - px) < l.length / 2 + pr && Math.abs(l.worldZ - pz) < l.radius + pr) { crash(); l.active = false; l.mesh.visible = false; return; }
  }
  for (const f of flakePool) {
    if (!f.active) continue;
    const dx = f.worldX - px, dz = f.worldZ - pz;
    if (dx * dx + dz * dz < 1.2 * 1.2) {
      f.active = false; f.mesh.visible = false;
      state.bonusScore += 15;
      beep(1000 + Math.random() * 300, 0.06, 'triangle', 0.04);
      for (let i = 0; i < 6; i++) spawnParticle(f.worldX, f.mesh.position.y, f.worldZ, (Math.random() - 0.5) * 3, Math.random() * 2, (Math.random() - 0.5) * 3, 0.4);
    }
  }
}

function crash() {
  state.lives--;
  state.shake = 32;
  state.invincible = CRASH_INVINCIBILITY;
  state.combo = 0; state.comboTimer = 0;
  player.speed = Math.max(MIN_SPEED, player.speed * CRASH_SPEED_KEEP);
  player.heading *= 0.3;
  // đứng dậy: nếu ngã trong rừng thì quay lại mép đường trượt, dọn chỗ phía trước cho khỏi ngã liên tiếp
  player.x = clampToPiste(player.x, player.z, 3);
  for (const t of trees) if (t.active && t.worldZ < player.z + 2 && t.worldZ > player.z - 14 && Math.abs(t.worldX - player.x) < 5) hideTree(t);
  for (const pool of [rockPool, logPool]) for (const o of pool) if (o.active && o.worldZ < player.z + 2 && o.worldZ > player.z - 14 && Math.abs(o.worldX - player.x) < 5) { o.active = false; o.mesh.visible = false; }
  updateComboUI();
  beep(150, 0.35, 'sawtooth', 0.09);
  burst(player.x, player.y, player.z, 22);
  if (state.lives <= 0) {
    deathCamActive = true; deathT = 0;
    state.shake = 50;
    gameOver();
  }
}

function updateParticles(dt) {
  for (const p of particlePool) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; p.mesh.visible = false; continue; }
    p.mesh.position.addScaledVector(p.vel, dt);
    p.vel.y -= 10 * dt; p.vel.x *= 0.97; p.vel.z *= 0.97;
    const k = p.life / p.maxLife;
    p.mesh.material.opacity = k;
    p.mesh.scale.setScalar(0.6 + (1 - k) * 1.2);
  }
}

// ============================================================
// CAMERA: bám sau lưng, cao ngang vai một chút, nhìn xuống dốc phía trước
// ============================================================
const _look = new THREE.Vector3();
function camTarget(out) {
  const sr = clamp((player.speed - 15) / 25, 0, 1);
  const dist = camDist + sr * 1.2;
  const bx = player.x - Math.sin(camYaw) * dist, bz = player.z + Math.cos(camYaw) * dist;
  const gy = getTerrainHeight(bx, bz);
  out.set(bx, Math.max(gy + camHeight, player.y + camHeight * 0.9), bz);
  return out;
}
function lookTarget(out) {
  const ahead = 13;
  const lx = player.x + Math.sin(camYaw) * ahead, lz = player.z - Math.cos(camYaw) * ahead;
  out.set(lx, getTerrainHeight(lx, lz) + 1.6, lz);
  return out;
}
const _ct = new THREE.Vector3();
function snapCamera() {
  camPos.copy(camTarget(_ct));
  camera.position.copy(camPos);
  camera.lookAt(lookTarget(_look));
}
function updateCamera(dt) {
  if (deathCamActive) {
    // máy quay vượt lên trước rồi quay lại nhìn người vừa ngã
    deathT += dt;
    const k = Math.min(1, deathT / 1.4);
    const tx = player.x + 3, tz = player.z - 9 * k, ty = getTerrainHeight(tx, tz) + 2.2;
    camPos.x += (tx - camPos.x) * Math.min(1, 3 * dt);
    camPos.y += (ty - camPos.y) * Math.min(1, 3 * dt);
    camPos.z += (tz - camPos.z) * Math.min(1, 3 * dt);
    camera.position.copy(camPos);
    camera.lookAt(player.x, player.y + 0.6, player.z);
    return;
  }
  camYaw += (player.heading * 0.75 - camYaw) * Math.min(1, 3.2 * dt);
  camTarget(_ct);
  camPos.x += (_ct.x - camPos.x) * Math.min(1, 9 * dt);
  camPos.y += (_ct.y - camPos.y) * Math.min(1, 7 * dt);
  camPos.z += (_ct.z - camPos.z) * Math.min(1, 9 * dt);
  let shx = 0, shy = 0;
  if (state.shake > 0.3) { shx = (Math.random() - 0.5) * state.shake * 0.015; shy = (Math.random() - 0.5) * state.shake * 0.015; }
  // rung nhẹ khi lao nhanh trên tuyết
  const buzz = clamp((player.speed - 22) / 20, 0, 1) * 0.02;
  camera.position.set(camPos.x + shx + (Math.random() - 0.5) * buzz, camPos.y + shy + (Math.random() - 0.5) * buzz, camPos.z);
  camera.lookAt(lookTarget(_look));
  camRoll += (player.lean * 0.12 - camRoll) * Math.min(1, 4 * dt);
  camera.rotateZ(camRoll);
}

function updateHUD() {
  scoreValEl.textContent = formatNum(state.score);
  distanceValEl.textContent = formatNum(Math.floor(state.distance)) + ' m';
  let lh = '';
  for (let i = 0; i < INITIAL_LIVES; i++) {
    const on = i < state.lives;
    lh += `<svg class="life" viewBox="0 0 16 16" fill="${on ? '#7dd3fc' : 'none'}" stroke="${on ? 'none' : 'rgba(120,150,180,0.45)'}" stroke-width="1.5"><path d="M8 1l2 4 4 .5-3 3 1 4-4-2-4 2 1-4-3-3 4-.5z"/></svg>`;
  }
  livesValEl.innerHTML = lh;
  speedFillEl.style.height = (clamp(player.speed / MAX_SPEED, 0, 1) * 100) + '%';
  speedValEl.textContent = Math.round(player.speed * 3.6);
}
function updateComboUI() {
  if (state.combo >= 2) { comboValEl.textContent = 'x' + state.combo + ' CỔNG'; comboValEl.classList.add('show'); }
  else comboValEl.classList.remove('show');
}

// Màn chờ: máy quay lướt chậm dọc đường trượt làm nền
function updateMenu(dt) {
  player.z -= 9 * dt;
  player.x = pisteCenter(player.z);
  player.speed = 9; player.heading = 0;
  growEdgeForest(aheadZ());
  const recycleZ = player.z + RECYCLE_BEHIND;
  for (const t of trees) if (t.active && t.worldZ > recycleZ) hideTree(t);
  updatePlayerTransform(dt, 0);
  ground.position.set(player.x, 0, player.z);
  mountainsFar.position.set(player.x * 0.6, player.y - 160, player.z - 520);
  mountainsNear.position.set(player.x * 0.8, player.y - 150, player.z - 400);
  sunSprite.position.set(player.x + 160, player.y + 120, player.z - 420);
  sun.position.set(player.x + 30, player.y + 40, player.z + 10);
  sun.target.position.set(player.x, player.y, player.z);
  pushRibbon(ribbons[0], player.x - 0.15, player.z, 0, -1);
  pushRibbon(ribbons[1], player.x + 0.15, player.z, 0, -1);
}

function update(dt) {
  time += dt;
  if (state.mode === 'playing') updatePlaying(dt);
  else if (state.mode === 'menu') updateMenu(dt);
  updateParticles(dt);
  updateRibbon(ribbons[0]); updateRibbon(ribbons[1]);
  updateWeather(dt);
  updateSnow(dt);
  updateCamera(dt);
  updateWindSound();
  if (treesDirty) { for (const p of treeParts) p.mesh.instanceMatrix.needsUpdate = true; treesDirty = false; }
}

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  updateCameraRig();
  if (state.mode !== 'playing') camera.fov = baseFov;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// khởi tạo cảnh nền cho màn chờ
updateCameraRig();
camera.fov = baseFov; camera.updateProjectionMatrix();
player.x = pisteCenter(0); player.y = getTerrainHeight(player.x, 0);
state.edgeNextZ = 30;
growEdgeForest(-SPAWN_AHEAD);
updatePlayerTransform(0, 0);
snapCamera();
document.getElementById('loading').classList.add('hidden');
requestAnimationFrame(loop);
</script>
