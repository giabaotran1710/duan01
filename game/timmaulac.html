    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Chủ đề: bàn vẽ của họa sĩ. Mặt bàn gỗ óc chó, bảng pha màu gỗ phong, mỗi ô là một vệt sơn dày. */
        :root {
            --desk: #3a2417;          /* gỗ óc chó */
            --desk-2: #2c1a10;
            --maple: #dcae74;         /* bảng pha màu */
            --maple-2: #c08a4f;
            --maple-edge: #8c5a2c;
            --canvas: #f3eee4;        /* vải bố */
            --ink: #2a1a10;
            --muted: #6e5440;
            --red: #c8322a;           /* đỏ cadimi */
            --red-deep: #8f1f19;
            --green: #1f7a5c;         /* lục viridian */
            --yellow: #f0b42a;        /* vàng cadimi */
            --danger: #c8322a;
            --shadow: 0 14px 28px -10px rgba(0, 0, 0, .55);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255, 220, 160, .16), transparent 60%),
                repeating-linear-gradient(92deg, rgba(0,0,0,.0) 0 14px, rgba(0,0,0,.10) 15px 17px, rgba(255,255,255,.03) 18px 30px),
                repeating-linear-gradient(88deg, var(--desk) 0 60px, var(--desk-2) 61px 63px, var(--desk) 64px 140px);
            font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--ink); padding: 20px 16px 28px;
            -webkit-tap-highlight-color: transparent;
        }
        .stage { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; flex-direction: column; gap: 0; }
        .brand h1 {
            font-family: 'Pacifico', cursive; font-weight: 400; font-size: 30px; margin: 0; line-height: 1.35;
            color: #fff6e6; text-shadow: 0 2px 0 var(--red-deep), 0 4px 10px rgba(0,0,0,.45);
        }
        .brand span { font-size: 13px; color: #e8cfae; font-weight: 700; }
        .lives { display: flex; gap: 6px; }
        .drop { width: 22px; height: 26px; position: relative; filter: drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
        .drop svg { width: 100%; height: 100%; display: block; }
        .drop.lost { filter: none; animation: splat 0.5s ease forwards; }
        @keyframes splat {
            0% { transform: scale(1); opacity: 1; }
            35% { transform: scale(1.3) rotate(-8deg); opacity: 1; }
            100% { transform: scale(0.65) rotate(6deg); opacity: 0.55; }
        }
        #scoreNum.bump { animation: scoreBump .12s ease; }
        @keyframes scoreBump { 50% { transform: scale(1.35); } }

        /* thanh chỉ số: mảnh băng keo giấy dán trên bàn */
        .statbar {
            background: linear-gradient(180deg, #efe2c4, #e2d0a8); border-radius: 3px; padding: 10px 18px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 6px 12px -6px rgba(0,0,0,.6); transform: rotate(-.6deg);
            clip-path: polygon(0 6%, 2% 0, 98% 4%, 100% 0, 99% 100%, 97% 94%, 3% 100%, 0 95%);
        }
        .stat { display: flex; flex-direction: column; gap: 2px; min-width: 56px; }
        .stat .num { font-weight: 900; font-size: 22px; line-height: 1; }
        .stat .lbl { font-size: 12px; color: var(--muted); font-weight: 800; }
        .stat.level .num { color: var(--red); }
        .stat.score .num { color: var(--green); }
        .stat.best .num { color: #a8740f; }

        /* bảng pha màu: tấm gỗ phong có lỗ xỏ ngón cái */
        .card {
            background:
                radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.22), transparent 55%),
                repeating-linear-gradient(100deg, rgba(140, 90, 44, .0) 0 22px, rgba(140, 90, 44, .16) 23px 25px, rgba(140, 90, 44, 0) 26px 48px),
                linear-gradient(160deg, var(--maple), var(--maple-2));
            border-radius: 36px 64px 44px 72px / 40px 52px 60px 46px; padding: 46px 20px 22px;
            box-shadow: inset 0 -6px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.35), 0 0 0 3px var(--maple-edge), var(--shadow);
            position: relative; overflow: hidden; min-height: 65vh;
        }
        .card::before {   /* lỗ ngón cái */
            content: ''; position: absolute; top: 12px; right: 22px; width: 34px; height: 26px; border-radius: 50%;
            background: var(--desk-2); box-shadow: inset 0 3px 4px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.35);
        }
        .prompt { text-align: left; font-weight: 800; font-size: 15px; color: var(--ink); margin: -30px 52px 18px 4px; line-height: 1.4; }
        .prompt b { color: var(--red-deep); }
        .grid { display: grid; gap: 12px; width: 100%; }
        /* mỗi ô là một vệt sơn dày, hình hơi méo như nặn ra từ tuýp */
        .tile {
            aspect-ratio: 1/1; border: none; cursor: pointer; position: relative; outline-offset: 3px;
            border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%;
            box-shadow: inset -5px -7px 0 rgba(0,0,0,.16), inset 5px 6px 0 rgba(255,255,255,.26), 0 4px 0 rgba(60, 30, 10, .35);
            transition: transform 0.12s ease;
        }
        .tile:nth-child(3n+2) { border-radius: 58% 42% 46% 54% / 44% 56% 44% 56%; }
        .tile:nth-child(4n+3) { border-radius: 50% 50% 38% 62% / 56% 40% 60% 44%; }
        .tile:nth-child(5n+4) { border-radius: 42% 58% 60% 40% / 50% 58% 42% 50%; }
        .tile::after {   /* vệt bóng của sơn ướt */
            content: ''; position: absolute; left: 22%; top: 16%; width: 26%; height: 14%; border-radius: 50%;
            background: rgba(255,255,255,.35); transform: rotate(-24deg); pointer-events: none;
        }
        .tile:active { transform: scale(0.92); }
        .tile:focus-visible { outline: 3px solid var(--ink); }
        .tile.correct-pulse { animation: goodpop 0.45s ease; }
        @keyframes goodpop {
            0% { box-shadow: 0 0 0 0 rgba(255, 246, 230, .9); }
            70% { box-shadow: 0 0 0 14px rgba(255, 246, 230, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 246, 230, 0); }
        }
        .tile.wrong-shake { animation: badshake 0.4s ease; }
        @keyframes badshake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px) scale(0.97); }
            40% { transform: translateX(6px) scale(0.97); }
            60% { transform: translateX(-4px) scale(0.97); }
            80% { transform: translateX(4px) scale(0.97); }
        }
        .tile.faded { opacity: 0; pointer-events: none; transform: scale(0.6); }
        .splat { position: absolute; inset: 0; border-radius: 16px; pointer-events: none; }
        .toast {
            position: absolute; top: 10px; left: 50%; transform: translate(-50%, -130%);
            background: var(--ink); color: #fff; font-weight: 800; font-size: 14px;
            padding: 8px 16px; border-radius: 10px; opacity: 0;
            transition: transform 0.25s ease, opacity 0.25s ease; white-space: nowrap; z-index: 5;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }
        .toast.good { background: var(--green); }
        .toast.bad { background: var(--danger); }
        /* màn bắt đầu / kết thúc: tấm vải bố ghim trên bảng */
        .overlay {
            position: absolute; inset: 14px;
            background:
                repeating-linear-gradient(0deg, rgba(120, 100, 70, .06) 0 1px, transparent 1px 3px),
                repeating-linear-gradient(90deg, rgba(120, 100, 70, .06) 0 1px, transparent 1px 3px),
                var(--canvas);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 10px; padding: 24px; border-radius: 6px; z-index: 10;
            box-shadow: 0 0 0 6px #b98a52, 0 10px 18px rgba(0,0,0,.35);
        }
        .overlay.hidden { display: none; }
        .overlay .big { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 30px; margin: 0; line-height: 1.4; color: var(--ink); }
        .overlay.gameover .big { color: var(--danger); }
        .overlay .sub { color: var(--muted); font-size: 15px; font-weight: 700; max-width: 280px; margin: 0 0 6px; line-height: 1.5; }
        .overlay .resultscore { font-weight: 900; font-size: 46px; color: var(--red); line-height: 1; margin: 4px 0; }
        .overlay .icon { font-size: 46px; line-height: 1; margin-bottom: 2px; color: var(--red); }
        .btn {
            border: none; cursor: pointer; font-family: inherit; font-weight: 900; font-size: 17px;
            min-height: 48px; padding: 12px 30px; border-radius: 14px;
            background: linear-gradient(180deg, #e0463b, var(--red)); color: #fff;
            box-shadow: inset 0 2px 0 rgba(255,255,255,.3), 0 5px 0 var(--red-deep), 0 10px 16px -6px rgba(0,0,0,.45);
            transition: transform 0.12s ease, box-shadow .12s ease;
        }
        .btn:active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.3), 0 1px 0 var(--red-deep); }
        .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { .tile, .btn, .toast { transition: none; } .tile.correct-pulse, .tile.wrong-shake, .drop.lost { animation: none; } }
        footer{ position: fixed; bottom: 5px; left: 10px; font-size: 10px; color: #c9a982; opacity: 0.7; font-family: Tahoma; }
    </style>

<body>

<div class="stage">
    <div class="topbar">
        <div class="brand">
            <h1>Tìm Màu Lạc</h1>
            <span>Chạm vào ô màu khác biệt</span>
        </div>
        <div class="lives" id="lives"></div>
    </div>
    <div class="statbar">
        <div class="stat level"><div class="num" id="levelNum">1</div><div class="lbl">Cấp độ</div></div>
        <div class="stat score"><div class="num" id="scoreNum">0</div><div class="lbl">Điểm</div></div>
          <div class="stat best"><div class="num" id="bestNum">0</div><div class="lbl">Kỷ lục</div></div>
    </div>

    <div class="card">
        <p class="prompt">Tìm ô có <b>màu khác</b> với các ô còn lại</p>
        <div class="toast" id="toast"></div>
        <div class="grid" id="grid"></div>

        <div class="overlay" id="startOverlay">
            <div class="icon"><i class="fa-solid fa-palette" aria-hidden="true"></i></div>
            <p class="big">Sẵn sàng chưa?</p>
            <p class="sub">Tìm ô màu lạc trong lưới. Bạn có 3 lượt sai. Càng lên cấp, màu càng giống nhau!</p>
            <button class="btn" id="startBtn">Bắt đầu chơi</button>
        </div>

        <div class="overlay gameover hidden" id="overOverlay">
            <div class="icon"><i class="fa-solid fa-ban" aria-hidden="true"></i></div>
            <p class="big">Hết lượt rồi!</p>
            <div class="resultscore" id="finalScore">0</div>
            <p class="sub" id="overSub">điểm</p>
            <button class="btn" id="retryBtn">Chơi lại</button>
        </div>
    </div>

 </div>

<script>
    (function () {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playCorrectSound() {
    const now = audioCtx.currentTime;

    [880, 1320].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0.3, now + i * 0.05);
        gain.gain.linearRampToValueAtTime(0.12, now + i * 0.05 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.041, now + i * 0.05 + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + i * 0.05);
        osc.stop(now + i * 0.05 + 0.12);
    });
}

function playWrongSound() {
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(700, now);
    osc.frequency.exponentialRampToValueAtTime(51, now + 0.35);

    gain.gain.setValueAtTime(0.6, now);
    gain.gain.exponentialRampToValueAtTime(0.051, now + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.35);
}
        const gridEl = document.getElementById('grid');
        const livesEl = document.getElementById('lives');
        const levelNumEl = document.getElementById('levelNum');
        const scoreNumEl = document.getElementById('scoreNum');
        const bestNumEl = document.getElementById('bestNum');
        const toastEl = document.getElementById('toast');
        const startOverlay = document.getElementById('startOverlay');
        const overOverlay = document.getElementById('overOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const overSub = document.getElementById('overSub');
        const startBtn = document.getElementById('startBtn');
        const retryBtn = document.getElementById('retryBtn');

        const createDropSVG = (fill) =>
            `<svg viewBox="0 0 24 28"><path fill="${fill}" d="M12 0C12 0 2 13.5 2 19.5C2 24.2 6.5 28 12 28C17.5 28 22 24.2 22 19.5C22 13.5 12 0 12 0Z"/></svg>`;

                const TIME_LIMIT = 10;          // giây
        const MAX_SCORE = 5000;
        const MIN_SCORE = 250;

        let level = 1;
        let score = 0;
        let best = 0;
        let lives = 3;
        let busy = false;
        let oddIndex = -1;

        // Biến mới cho thời gian
        let roundStartTime = 0;
        let timerInterval = null;
        let timeoutId = null;
        let bonusDisplayEl = null;       // sẽ gán sau

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function renderLives() {
            livesEl.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const alive = i < lives;
                const div = document.createElement('div');
                div.className = 'drop' + (alive ? '' : ' lost');
                div.innerHTML = createDropSVG(alive ? '#c8322a' : '#6b4a33');
                livesEl.appendChild(div);
            }
        }

        function showToast(msg, kind) {
            toastEl.textContent = msg;
            toastEl.className = 'toast show ' + kind;
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => { toastEl.className = 'toast ' + kind; }, 650);
        }

        function gridSizeForLevel(lv) { return clamp(2 + Math.floor((lv - 1) / 2), 2, 6); }
        function lightnessDiffForLevel(lv) {
    return clamp(18 - (lv - 1) * 0.85, 2, 18);
}
function animateScore(addScore){
    const start = score;
    const end = score + addScore;
    const duration = 400;
    const startTime = performance.now();

    function update(now){
        const t = Math.min((now-startTime)/duration,1);
        const value = Math.round(start+(end-start)*t);

        scoreNumEl.textContent=value;

        scoreNumEl.classList.remove("bump");
        void scoreNumEl.offsetWidth;
        scoreNumEl.classList.add("bump");

        if(t<1){
            requestAnimationFrame(update);
        }else{
            score=end;
            scoreNumEl.textContent=score;
        }
    }

    requestAnimationFrame(update);
}
        
                function newRound() {
            // Xóa timer cũ
            if (timerInterval) clearInterval(timerInterval);
            if (timeoutId) clearTimeout(timeoutId);

            busy = false;
            gridEl.innerHTML = '';
            const cols = gridSizeForLevel(level);
            const total = cols * cols;
            oddIndex = Math.floor(Math.random() * total);
   const hue = Math.floor(Math.random() * 360);
const sat = 55 + Math.random() * 15;   // ít biến động hơn
const baseL = 42 + Math.random() * 10;  // gom sát nhau hơn

const diff = lightnessDiffForLevel(level);
const sign = Math.random() < 0.5 ? -1 : 1;
const oddL = clamp(baseL + sign * diff, 35, 55);

// chỉ lệch rất nhẹ, gần như cùng màu
const hueOffset = (Math.random() - 0.5) * 2;   // ±1 độ
const satOffset = (Math.random() - 0.5) * 4;   // ±2%
const oddSat = clamp(sat + satOffset, 50, 75);
const oddHue = (hue + hueOffset + 360) % 360;
            gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            for (let i = 0; i < total; i++) {
                const btn = document.createElement('button');
                btn.className = 'tile';
                btn.setAttribute('aria-label', i === oddIndex ? 'ô màu khác' : 'ô màu thường');
                btn.style.background = `hsl(${i === oddIndex ? oddHue : hue} ${i === oddIndex ? oddSat : sat}% ${i === oddIndex ? oddL : baseL}%)`;
                btn.addEventListener('click', () => handlePick(i, btn));
                gridEl.appendChild(btn);
            }

            // Bắt đầu tính giờ cho câu mới
            roundStartTime = Date.now();
            bonusDisplayEl = document.getElementById('bonusNum');
            updateBonusDisplay();

            timerInterval = setInterval(updateBonusDisplay, 100);

            // Hết giờ sau TIME_LIMIT giây
            timeoutId = setTimeout(() => {
                if (!busy) {  // nếu chưa chọn
                    timeoutRound();
                }
            }, TIME_LIMIT * 1000);
        }
                function updateBonusDisplay() {
            if (!bonusDisplayEl) return;
            const elapsed = (Date.now() - roundStartTime) / 1000;
            let currentBonus = MAX_SCORE - (elapsed / TIME_LIMIT) * (MAX_SCORE - MIN_SCORE);
            currentBonus = Math.max(MIN_SCORE, Math.min(MAX_SCORE, Math.round(currentBonus)));
            bonusDisplayEl.textContent = currentBonus;
        }

                function handlePick(i, btn) {
    if (busy) return;
    busy = true;

    // Xóa timer
    if (timerInterval) clearInterval(timerInterval);
    if (timeoutId) clearTimeout(timeoutId);

    if (i === oddIndex) {
        // Tính điểm theo thời gian
        const elapsed = (Date.now() - roundStartTime) / 1000;
        let earned = MAX_SCORE - (elapsed / TIME_LIMIT) * (MAX_SCORE - MIN_SCORE);
        earned = Math.max(MIN_SCORE, Math.min(MAX_SCORE, Math.round(earned)));

        btn.classList.add("correct-pulse");
        playCorrectSound();

        animateScore(earned);

        showToast("+" + earned, "good");

        level++;
        levelNumEl.textContent = level;

        setTimeout(newRound, 450);

    } else {

        // Ô bấm sai
        btn.classList.add("wrong-shake");
        playWrongSound();

        // Highlight ô đúng
        const correctTile = gridEl.children[oddIndex];
        correctTile.style.outline = "5px solid #fff6e6";
        correctTile.style.outlineOffset = "-5px";
        correctTile.classList.add("correct-pulse");

        lives--;
        renderLives();

        showToast("Sai rồi ", "bad");

        if (lives <= 0) {
            setTimeout(gameOver, 900);
        } else {
            setTimeout(() => {
                newRound();
            }, 900);
        }
    }
}
                

        function gameOver() {
            best = Math.max(best, score);
            bestNumEl.textContent = best;
            finalScoreEl.textContent = score;
            overSub.textContent = score >= best && score > 0
                ? 'Kỷ lục mới! Chơi lại để vượt qua chính mình '
                : 'Thử lại để phá kỷ lục nhé';
            overOverlay.classList.remove('hidden');
        }

         function startGame() {
            // Xóa timer cũ
            if (timerInterval) clearInterval(timerInterval);
            if (timeoutId) clearTimeout(timeoutId);

            level = 1; score = 0; lives = 3; busy = false;
            levelNumEl.textContent = level;
            scoreNumEl.textContent = score;
            renderLives();
            startOverlay.classList.add('hidden');
            overOverlay.classList.add('hidden');
            newRound();
        }

        startBtn.addEventListener('click', startGame);
        retryBtn.addEventListener('click', startGame);
        renderLives();
    })();
</script>
