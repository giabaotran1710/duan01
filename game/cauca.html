<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<script src="../maintenance.js?v=20261123a" data-game="cauca"></script>
<script src="../scene.js" data-game="cauca"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1d2a">
<title>Câu cá</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Kế hoạch thiết kế: CÂU CÁ PIXEL - một bến câu nhìn từ sau lưng người câu, cả màn hình là tranh pixel.
   - Không có thanh tiêu đề. Tên vùng là lá cờ vải treo trên cột tre ở góc trái trên (chạm để mở bản đồ).
   - Góc phải trên là "đồng hồ mặt trời": ô pixel ghi giờ, khung giờ và thời tiết; chạm để chờ thêm một giờ.
   - Sổ tay câu cá là cuốn sổ bìa da nằm trên bờ ở góc trái dưới, có nhãn dán số loài đã có.
   - Vòng cung câu cá vẽ thẳng trên tranh pixel, nằm trên mặt nước, kim đỏ chạy qua lại.
   - Khung chữ kiểu hộp thoại game 8-bit: viền bậc thang (không bo tròn), chữ VT323.
   Màu: mực #1b1d2a, giấy #f4ead0, gỗ #8a6238, vàng #ffd23f (chỉ dùng cho điểm vàng và nút chính), đỏ phao #e04a3a. */
:root{
  --ink:#1b1d2a; --ink2:#39405a; --paper:#f4ead0; --paper2:#e4d6b0; --wood:#8a6238; --wood2:#5a3c22;
  --gold:#ffd23f; --gold2:#c89a10; --red:#e04a3a; --sea:#2f6fa8; --leaf:#4f8a3a;
  --px:3px; --f:'VT323','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font:20px/1.15 var(--f);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
/* hộp pixel: viền bậc thang bằng box-shadow */
.px{background:var(--paper);position:relative;
  box-shadow:0 calc(-1*var(--px)) 0 0 var(--ink),0 var(--px) 0 0 var(--ink),calc(-1*var(--px)) 0 0 0 var(--ink),var(--px) 0 0 0 var(--ink),
    inset 0 calc(-1*var(--px)) 0 0 var(--paper2)}
.px.dark{background:#2a2f44;color:var(--paper);box-shadow:0 calc(-1*var(--px)) 0 0 var(--ink),0 var(--px) 0 0 var(--ink),calc(-1*var(--px)) 0 0 0 var(--ink),var(--px) 0 0 0 var(--ink),inset 0 calc(-1*var(--px)) 0 0 #20243a,inset 0 var(--px) 0 0 #3a4160}
.btn{display:inline-block;padding:6px 16px 7px;background:var(--gold);color:var(--ink);font-size:24px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -4px 0 0 var(--gold2),inset 0 3px 0 0 #fff2a0}
.btn:active{transform:translateY(2px);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 3px 0 0 var(--gold2)}
.btn.alt{background:var(--paper);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -4px 0 0 var(--paper2)}
.btn:focus-visible,.hud:focus-visible,.tab:focus-visible,.node:focus-visible{outline:3px dashed var(--gold);outline-offset:5px}

/* ---- HUD ---- */
.hud{position:fixed;z-index:5}
#flag{left:calc(10px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:flex-start;gap:0;text-align:left}
#flag .pole{width:6px;height:62px;background:linear-gradient(90deg,#c8a050 0 2px,#9a7a32 2px 4px,#6a5022 4px);box-shadow:0 0 0 2px var(--ink)}
#flag .cloth{margin-top:4px;padding:3px 12px 5px 9px;background:var(--red);color:#fff6e0;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 #a82a22;
  clip-path:polygon(0 -4px,100% -4px,calc(100% - 9px) 50%,100% calc(100% + 4px),0 calc(100% + 4px));padding-right:22px;animation:wave 3.2s steps(4) infinite}
#flag b{display:block;font-size:26px;font-weight:400;letter-spacing:.5px;text-shadow:2px 2px 0 #7a1c16}
#flag small{display:block;font-size:17px;opacity:.9}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-2deg)}}
#clock{right:calc(12px + env(safe-area-inset-right,0px));top:calc(11px + env(safe-area-inset-top,0px));padding:5px 9px 6px;min-width:118px;text-align:right}
#clock .row{display:flex;align-items:center;justify-content:flex-end;gap:7px}
#clock .t{font-size:30px;line-height:1}
#clock canvas{width:27px;height:21px;image-rendering:pixelated}
#clock .s{font-size:17px;color:#cfd4e8}
#clock .wait{font-size:15px;color:var(--gold);margin-top:2px;white-space:pre;display:flex;align-items:center;justify-content:flex-end}
#clock .wait canvas{width:12px;height:12px;margin-left:0}
#clock.ff .t{color:var(--gold)}
#snd{right:calc(14px + env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));width:36px;height:32px;display:grid;place-items:center}
#snd canvas{width:24px;height:21px;image-rendering:pixelated}
#shore{left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:10px}
#bookBtn{display:flex;align-items:flex-end;gap:6px}
.shoreBtn canvas{width:48px;height:48px;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
.shoreBtn{display:flex;flex-direction:column;align-items:center;color:#fff;font-size:17px;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink)}
.shoreBtn:focus-visible{outline:3px dashed var(--gold);outline-offset:4px}
#wallet{left:calc(14px + env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));padding:3px 9px 5px;display:flex;flex-direction:column;gap:1px;text-align:left;font-size:20px;min-width:118px}
#wallet .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
#wallet canvas{width:16px;height:16px;image-rendering:pixelated;flex:none}
#wallet small{font-size:15px;color:#cfd4e8}
#wallet.low .en{color:#ff8a7a}
#wallet.flash{animation:bump .5s steps(3)}
/* Event: vé đổi quà treo dưới ô năng lượng, khía hai bên như vé hội chợ */
#evBtn{left:calc(14px + env(safe-area-inset-left,0px));top:calc(140px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:7px;padding:4px 14px 5px 10px;
  background:var(--red);color:#fff6e0;text-align:left;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 #a82a22,inset 0 3px 0 0 #f87a5a;
  -webkit-mask:radial-gradient(circle 5px at 0 50%,transparent 4px,#000 5px) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,transparent 4px,#000 5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle 5px at 0 50%,transparent 4px,#000 5px) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,transparent 4px,#000 5px) right/51% 100% no-repeat}
#evBtn canvas{width:28px;height:28px;image-rendering:pixelated;flex:none}
#evBtn b{display:block;font-weight:400;font-size:22px;line-height:.9;letter-spacing:1px;color:var(--gold);text-shadow:2px 2px 0 #7a1c16}
#evBtn small{display:flex;align-items:center;gap:3px;font-size:15px;line-height:1;color:#ffe0d0;white-space:nowrap}
#evBtn small canvas{width:12px;height:12px}
#evBtn.k2{background:#2f7f86;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),inset 0 -3px 0 0 #1f5a60,inset 0 3px 0 0 #5ab0b8}
#evBtn.k2 b{color:#ffe9a0;text-shadow:2px 2px 0 #14393d}
#evBtn.k2 small{color:#d4f0f0}
#event.k2 .top{background:#1f5a60;box-shadow:inset 0 -3px 0 0 #14393d}
.evTabs{display:flex;gap:6px;padding:8px 12px 0}
.evTab{padding:2px 12px 4px;font-size:21px;background:var(--wood2);color:var(--paper);box-shadow:0 0 0 2px var(--ink);opacity:.8}
.evTab.on{background:var(--paper);color:var(--ink);opacity:1}
.evTab.live::after{content:' ●';color:#e8503a;font-size:14px}
.tk.nolim::after{display:none}
.tk.nolim .mini{margin-top:10px}
.tk.wide{grid-column:1/-1}
.tk .lrow{display:flex;gap:8px;margin-top:6px}
.tk .lrow .mini{flex:1;justify-content:center;margin-top:0}
#evBtn.bump{animation:bump .5s steps(3)}
#evBtn .dot{position:absolute;right:6px;top:4px;width:6px;height:6px;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
#event .px{width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;padding:0;background:var(--wood);color:var(--paper)}
#event .top{padding:10px 48px 8px 14px;background:var(--wood2);box-shadow:inset 0 -3px 0 0 #3a2614}
#event h3{margin:0;font-weight:400;font-size:30px;line-height:1;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
#event .cd{font-size:18px;color:#f0dcb8}
#event .x{color:var(--paper)}
#event .bag{display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px 4px}
#event .bag span{display:flex;align-items:center;gap:6px;padding:2px 10px 3px 6px;background:#2a2f44;font-size:21px;box-shadow:0 0 0 2px var(--ink)}
#event .bag canvas{width:24px;height:24px;image-rendering:pixelated}
#event .how{padding:2px 14px 6px;font-size:17px;color:#f4e4c4;line-height:1.1}
.evList{overflow-y:auto;flex:1;padding:8px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px 10px;align-content:start;
  background:repeating-linear-gradient(0deg,#7a5430 0 2px,#8a6238 2px 22px)}
.tk{position:relative;background:var(--paper);color:var(--ink);padding:12px 9px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 0 2px var(--ink),3px 4px 0 0 rgba(0,0,0,.3);transform:rotate(var(--r,0deg))}
.tk::before{content:'';position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;background:var(--red);box-shadow:0 0 0 2px var(--ink),inset -2px -2px 0 0 #a82a22}
.tk::after{content:'';position:absolute;left:6px;right:6px;bottom:38px;border-top:2px dashed #b8a47c}
.tk .hd{display:flex;align-items:center;gap:8px}
.tk .hd canvas{width:36px;height:36px;image-rendering:pixelated;background:#efe2bf;box-shadow:0 0 0 2px var(--ink);flex:none}
.tk b{font-weight:400;font-size:20px;line-height:1}
.tk .lim{font-size:16px;color:#5a4a34;margin-bottom:12px}
.tk .lim.out{color:#a83a2a}
.tk .mini{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:4px}
.tk .mini canvas{width:16px;height:16px;image-rendering:pixelated}
.tk.done{opacity:.6}
#card .evGot{display:flex;gap:8px;justify-content:center;margin-top:6px}
#card .evGot span{display:flex;align-items:center;gap:4px;padding:1px 8px 2px 4px;font-size:18px;background:#2a2f44;color:var(--paper);box-shadow:0 0 0 2px var(--ink)}
#card .evGot canvas{width:18px;height:18px;image-rendering:pixelated}
#hookMark{position:fixed;z-index:5;pointer-events:none;transform:translate(-50%,-100%);font-size:44px;line-height:1;color:var(--gold);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink);animation:hook .18s steps(2) infinite alternate}
@keyframes hook{to{transform:translate(-50%,-112%)}}
#card .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#card .acts .btn{margin:0;font-size:22px;padding:5px 12px 6px}
#card .acts .btn[disabled]{opacity:.5;cursor:default}
#card .coin{color:#7a5a10}
/* cửa hàng */
#shop .px,#tank .px{width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;padding:12px 12px 10px}
#shop h3,#tank h3{margin:0;font-weight:400;font-size:30px;padding-right:40px}
.purse{font-size:20px;color:#5a4a34;margin:2px 0 6px;display:flex;gap:14px;flex-wrap:wrap}
.shopList{overflow-y:auto;flex:1;padding:4px 4px 6px;display:flex;flex-direction:column;gap:8px}
.shopList h4{margin:6px 0 0;font-weight:400;font-size:22px;color:var(--wood2)}
.item{display:flex;align-items:center;gap:10px;background:#fbf4e0;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 0 var(--paper2);padding:6px 8px}
.item canvas{width:40px;height:40px;image-rendering:pixelated;flex:none;background:#efe2bf}
.item .tx{flex:1;min-width:0}
.item b{font-weight:400;font-size:21px;display:block;line-height:1}
.item span{font-size:16px;color:#5a4a34}
.item .bs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini{padding:2px 9px 4px;font-size:18px;background:var(--gold);box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 0 var(--gold2);white-space:nowrap}
.mini.alt{background:var(--paper2);box-shadow:0 0 0 2px var(--ink)}
.mini.on{background:var(--leaf);color:#fff}
.mini[disabled]{opacity:.45;cursor:default}
/* năng lực */
#skill .px{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;padding:12px 12px 10px}
#skill h3{margin:0;font-weight:400;font-size:30px;padding-right:40px}
.skillList{overflow-y:auto;flex:1;padding:4px 4px 6px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.sk{background:#fbf4e0;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 0 var(--paper2);padding:8px 10px 8px;display:flex;flex-direction:column;gap:5px}
.sk .hd{display:flex;align-items:center;gap:8px}
.sk .hd canvas{width:36px;height:36px;image-rendering:pixelated;flex:none;background:#efe2bf;box-shadow:0 0 0 2px var(--ink)}
.sk .hd b{font-weight:400;font-size:21px;line-height:1;flex:1}
.sk .hd em{font-style:normal;font-size:17px;color:#5a4a34;white-space:nowrap}
.sk .pips{display:flex;gap:3px}
.sk .pip{flex:1;height:8px;background:#d8c8a0;box-shadow:0 0 0 1px var(--ink)}
.sk .pip.on{background:var(--gold)}
.sk .now{font-size:18px;line-height:1.05}
.sk .nx{font-size:16px;color:#4a6a2a;line-height:1.05;min-height:17px}
.sk .nx.mx{color:#8a6a10}
.sk .mini{align-self:stretch;text-align:center}
@media (max-width:560px){.skillList{grid-template-columns:1fr}}
/* bể cá */
#tankCv{width:100%;image-rendering:pixelated;display:block;box-shadow:0 0 0 3px var(--ink),0 0 0 7px #6a4a2a;margin:8px 0 10px;background:#2f6f9a}
@media (max-width:520px){.item{flex-wrap:wrap}.item .tx{flex:1 1 60%}.item .bs{flex-basis:100%}}
.tankRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

#bookBtn canvas{width:60px;height:48px;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
#bookBtn .tagn{padding:1px 7px 3px;font-size:20px;transform:rotate(-4deg);margin-bottom:6px}
#bookBtn.bump canvas{animation:bump .5s steps(3)}
@keyframes bump{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
#hint{position:fixed;left:50%;transform:translateX(-50%);z-index:4;color:#fff;font-size:24px;text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);
  pointer-events:none;white-space:nowrap;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#say{position:fixed;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center;white-space:nowrap}
#say span{display:inline-block;padding:3px 12px 5px;font-size:24px}
#say.pop span{animation:pop .3s steps(3)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;width:max-content;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;padding:5px 14px 7px;font-size:21px;max-width:calc(100vw - 30px);text-align:center;
  opacity:0;transition:opacity .25s steps(3);pointer-events:none}
#toast.on{opacity:1}
/* đang mở bảng: toast nổi lên trên lớp phủ, sát đáy màn hình để không che nội dung bảng */
body.ovOpen #toast{bottom:calc(22px + env(safe-area-inset-bottom,0px))}

/* ---- lớp phủ ---- */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(14,16,28,.62);padding:16px}
.ov.on{display:flex}
.ov.on>.px{animation:in .22s steps(3)}
@keyframes in{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;right:8px;top:6px;width:34px;height:34px;font-size:30px;line-height:30px;text-align:center}

/* màn mở đầu */
#title{background:transparent;flex-direction:column;gap:20px;text-align:center}
#title h1{margin:0;font-weight:400;font-size:clamp(64px,17vw,120px);line-height:.85;color:var(--gold);letter-spacing:4px;
  text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink),-4px 4px 0 var(--ink),4px -4px 0 var(--ink),-4px -4px 0 var(--ink),8px 8px 0 #7a1c16}
#title .sub{color:#fff;font-size:22px;text-shadow:2px 2px 0 var(--ink)}
#title .menu{display:flex;flex-direction:column;gap:16px;align-items:center;margin-top:6px}
#title .stat{padding:4px 12px 6px;font-size:20px}
#title a{color:#fff;font-size:20px;text-shadow:2px 2px 0 var(--ink)}

/* thẻ cá vừa câu */
#card .px{width:min(370px,100%);padding:16px 18px 18px;text-align:center;max-height:100%;overflow-y:auto}
#card .rib{position:absolute;left:-10px;top:12px;background:var(--red);color:#fff;padding:2px 10px 4px;font-size:20px;transform:rotate(-8deg);box-shadow:0 0 0 3px var(--ink)}
#card .rec{position:absolute;right:-8px;top:14px;background:var(--gold);padding:2px 9px 4px;font-size:19px;transform:rotate(7deg);box-shadow:0 0 0 3px var(--ink)}
#card .stage{height:170px;display:grid;place-items:center;margin:8px 0 0;background:repeating-linear-gradient(0deg,#e8dcb8 0 3px,#efe4c4 3px 6px);box-shadow:inset 0 0 0 3px var(--paper2)}
#card .stage canvas{image-rendering:pixelated;animation:flop 1.1s steps(2) infinite}
@keyframes flop{50%{transform:translateY(-3px) rotate(-2deg)}}
#card .ruler{height:16px;margin:6px 4px 0;background:
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 12px) bottom/100% 8px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 60px) bottom/100% 14px no-repeat,#f8d870;box-shadow:0 0 0 2px var(--ink)}
#card h2{margin:10px 0 0;font-weight:400;font-size:34px;line-height:1}
#card .rar{display:inline-block;margin-top:4px;padding:0 8px 2px;font-size:18px;color:#fff}
#card .size{font-size:26px;margin-top:6px}
#card .note{font-size:19px;color:#5a4a34;margin-top:6px;min-height:20px}
#card .btn{margin-top:12px}
.r-thuong{background:#5a7a4a}.r-hiem{background:#3f6fb8}.r-hiemco{background:#a83ab8}.r-rac{background:#7a7a72}

/* sổ tay */
#book .px{width:min(760px,100%);height:min(640px,100%);display:flex;flex-direction:column;padding:12px 12px 10px}
#book h3{margin:0 0 4px;font-weight:400;font-size:30px;padding-right:40px}
#book .prog{font-size:19px;color:#5a4a34;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#book .bar{flex:1;min-width:100px;height:12px;background:#d8c8a0;box-shadow:0 0 0 2px var(--ink);position:relative}
#book .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--leaf)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px -2px 8px;padding:4px 4px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:2px 10px 4px;font-size:20px;background:var(--paper2);box-shadow:0 0 0 2px var(--ink)}
.tab[aria-selected="true"]{background:var(--wood);color:#fff6e0}
.tab em{font-style:normal;opacity:.75;font-size:16px;margin-left:4px}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;padding:4px 4px 8px;align-content:start}
.ent{background:#fbf4e0;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 0 var(--paper2);padding:6px 7px 7px;display:flex;flex-direction:column;gap:2px}
.ent .pic{height:56px;display:grid;place-items:center;background:#efe2bf}
.ent .pic canvas{image-rendering:pixelated}
.ent b{font-weight:400;font-size:20px;line-height:1}
.ent .meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:16px;color:#5a4a34}
.ent .meta canvas{width:22px;height:16px;image-rendering:pixelated;background:#2a2f44;padding:2px;box-sizing:content-box}
.ent .big{font-size:17px;color:#2a4a2a}
.ent.no b{color:#8a7a5a}
.ent .rar{font-size:14px;color:#fff;padding:0 5px 1px;align-self:flex-start}
.lockmsg{grid-column:1/-1;font-size:20px;color:#7a5a34;padding:4px}

/* bản đồ */
#map .px{width:min(440px,100%);max-height:100%;padding:12px;display:flex;flex-direction:column;overflow-y:auto}
#map h3{margin:0 0 6px;font-weight:400;font-size:30px}
#map .wrap{position:relative;flex:none;aspect-ratio:3/5;margin:0 auto;width:100%;box-shadow:0 0 0 3px var(--ink)}
#map .wrap canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.node{position:absolute;transform:translate(-50%,-50%);padding:1px 7px 3px;font-size:18px;white-space:nowrap;background:var(--paper);box-shadow:0 0 0 2px var(--ink),0 4px 0 0 rgba(0,0,0,.35)}
.node.here{background:var(--gold)}
.node.lock{background:#b8b0a0;color:#4a4436}
.node small{display:block;font-size:14px;line-height:1;opacity:.8}
#map .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:18px}
#map .foot a{color:var(--ink)}

/* màn ngang thấp (điện thoại xoay ngang, chế độ máy tính): thẻ cá chia hai cột, tiêu đề một dòng */
@media (orientation:landscape) and (max-height:520px){
  .ov{padding:10px}
  #card .px{width:min(660px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;align-items:center;align-content:center;padding:12px 16px 14px}
  #card .stage{grid-column:1;grid-row:1/7;height:min(170px,calc(100vh - 90px));margin:0}
  #card .ruler{grid-column:1;grid-row:7;margin:6px 4px 0}
  #card .stage canvas{max-width:100%;max-height:100%;object-fit:contain}
  #card h2,#card .rar,#card .size,#card .note,#card .evGot,#card .acts{grid-column:2}
  #card h2{margin:0;font-size:30px}
  #card .rar{justify-self:center}
  #card .size{font-size:24px;margin-top:4px}
  #card .note{font-size:18px;margin-top:4px}
  #card .acts{margin-top:8px;gap:8px}
  #card .acts .btn{font-size:20px}
  #title{gap:min(20px,3vh);overflow-y:auto;justify-content:safe center}
  #title h1{font-size:clamp(44px,min(17vw,20vh),120px)}
  #title h1 br{display:none}
  #title .sub{font-size:20px}
  #title .menu{gap:min(16px,2.5vh);margin-top:0}
}
@media (prefers-reduced-motion:reduce){#hookMark,#flag .cloth,#hint,#card .stage canvas,.ov.on>.px{animation:none}}

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d');
  var SAVE_KEY = 'cauca_v1', MIN_PER_SEC = 2; // 1 giờ trong game = 30 giây
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- lưu ----------
  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
    if (!s || typeof s !== 'object') s = {};
    if (typeof s.min !== 'number' || !isFinite(s.min)) s.min = 6 * 60;
    if (!s.found || typeof s.found !== 'object') s.found = {};
    if (!CC.REGIONS.some(function (r) { return r.id === s.reg; })) s.reg = 'ao';
    if (typeof s.sound !== 'boolean') s.sound = true;
    function num(v, d, lo, hi) { v = typeof v === 'number' && isFinite(v) ? v : d; return Math.max(lo, Math.min(hi, v)); }
    s.coins = Math.floor(num(s.coins, 0, 0, 1e9));
    if (!s.up || typeof s.up !== 'object') s.up = {};
    CC.UPGRADES.forEach(function (u) { s.up[u.id] = Math.floor(num(s.up[u.id], 0, 0, u.max)); });
    s.en = Math.floor(num(s.en, CC.energyMax(s.up), 0, CC.drinkCap(s.up)));
    s.enT = num(s.enT, Date.now(), 0, 1e15);
    // Bản cũ lưu một loại nước (hồi 30): đổi sang 1 lon Lớn (hồi 30) cho mỗi lon cũ, không mất đồ.
    var dr = s.drinks && typeof s.drinks === 'object' ? s.drinks : {};
    if (typeof s.drinks === 'number') dr = { l: s.drinks };
    s.drinks = {}; CC.ENERGY.drinks.forEach(function (d) { s.drinks[d.id] = Math.floor(num(dr[d.id], 0, 0, 999)); });
    var bt = s.dBuy && typeof s.dBuy === 'object' ? s.dBuy : {};
    s.dBuy = { d: Math.floor(num(bt.d, 0, 0, 1e7)), n: {} };
    CC.ENERGY.drinks.forEach(function (d) { s.dBuy.n[d.id] = Math.floor(num(bt.n && bt.n[d.id], 0, 0, d.day)); });
    if (!s.baits || typeof s.baits !== 'object') s.baits = {};
    Object.keys(CC.BAITS).forEach(function (k) { s.baits[k] = Math.floor(num(s.baits[k], 0, 0, 9999)); });
    if (!CC.BAITS[s.bait] || (s.bait !== 'giun' && !s.baits[s.bait])) s.bait = 'giun';
    s.slots = Math.floor(num(s.slots, CC.TANK.start, CC.TANK.start, CC.TANK.max));
    if (!Array.isArray(s.tank)) s.tank = [];
    s.tank = s.tank.filter(function (f) { return f && CC.byId[f.id] && CC.byId[f.id].r !== 'rac' && typeof f.cm === 'number'; }).slice(0, s.slots);
    if (!s.decos || typeof s.decos !== 'object') s.decos = {};
    if (!s.decoOn || typeof s.decoOn !== 'object') s.decoOn = {};
    var ev = s.ev && typeof s.ev === 'object' ? s.ev : {};
    s.ev = { w: Math.floor(num(ev.w, 0, 0, 1e6)), vo: Math.floor(num(ev.vo, 0, 0, 1e6)), ngoc: Math.floor(num(ev.ngoc, 0, 0, 1e6)), got: {} };
    CC.EVENT.rewards.forEach(function (r) { s.ev.got[r.id] = Math.floor(num(ev.got && ev.got[r.id], 0, 0, r.lim)); });
    var e2 = s.ev2 && typeof s.ev2 === 'object' ? s.ev2 : {};
    s.ev2 = { items: {}, got: {} };
    Object.keys(CC.EVENT2.items).forEach(function (k) { s.ev2.items[k] = Math.floor(num(e2.items && e2.items[k], 0, 0, 1e6)); });
    CC.EVENT2.rewards.forEach(function (r) { s.ev2.got[r.id] = Math.floor(num(e2.got && e2.got[r.id], 0, 0, r.lim || 1e6)); });
    return s;
  }
  var S = load();
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
  function nCreatures() { var n = 0; for (var id in S.found) if (CC.byId[id] && CC.byId[id].r !== 'rac') n++; return n; }
  function nFound() { var n = 0; for (var id in S.found) if (CC.byId[id]) n++; return n; }
  function unlocked(r) { return nCreatures() >= r.need; }
  function region() { return CC.REGIONS.filter(function (r) { return r.id === S.reg; })[0]; }
  if (!unlocked(region())) S.reg = 'ao';
  if (!S.ev.w) S.ev.w = CC.eventWeek(Date.now());

  // ---------- năng lượng: hồi 1 mỗi 5 phút theo giờ thật, tính cả lúc tắt game ----------
  var EN = CC.ENERGY;
  function enMax() { return CC.energyMax(S.up); }          // tối đa theo cấp Năng lực
  function regenMs() { return CC.regenMs(S.up); }          // số mili giây để hồi 1 năng lượng
  function drinkCap() { return CC.drinkCap(S.up); }
  function drinkTotal() { var n = 0; EN.drinks.forEach(function (d) { n += S.drinks[d.id]; }); return n; }
  function drinkSync() { var d = CC.dayOfVN(Date.now()); if (S.dBuy.d !== d) { S.dBuy.d = d; EN.drinks.forEach(function (x) { S.dBuy.n[x.id] = 0; }); } }
  function drinkLeft(D) { drinkSync(); return D.day - S.dBuy.n[D.id]; }        // nước tăng lực nạp được tới mức này
  function mods() { return CC.upMods(S.up); }              // hệ số cỡ cá, cá hiếm, giá rác
  function syncEnergy() {
    var now = Date.now(), mx = enMax(), rg = regenMs();
    if (now < S.enT) S.enT = now; // đồng hồ máy bị chỉnh lùi
    if (S.en >= mx) { S.enT = now; return; }
    var n = Math.floor((now - S.enT) / rg);
    if (n > 0) { S.en = Math.min(mx, S.en + n); S.enT += n * rg; if (S.en >= mx) S.enT = now; }
  }
  function nextIn() { return S.en >= enMax() ? 0 : regenMs() - (Date.now() - S.enT); }
  function fullIn() { return S.en >= enMax() ? 0 : nextIn() + (enMax() - S.en - 1) * regenMs(); }
  function mmss(ms) { var t = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(t / 60), x = t % 60; return m + ':' + (x < 10 ? '0' : '') + x; }
  function hm(ms) { var m = Math.ceil(ms / 60000), h = Math.floor(m / 60); return h ? h + ' giờ ' + (m % 60) + ' phút' : m + ' phút'; }
  function money(v) { return v.toLocaleString('vi-VN'); }
  syncEnergy();

  // ---------- âm thanh ----------
  var snd = S.sound;
  if (window.SFX) SFX.gate(function () { return snd; });
  function sfx(n, o) { if (window.SFX) SFX.play(n, o); }
  var amb = { ac: null, w: null, r: null, master: null, loading: false };
  function ambStart() {
    if (amb.ac || amb.loading) return;
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    amb.loading = true;
    try { amb.ac = new A(); } catch (e) { return; }
    var ac = amb.ac;
    amb.master = ac.createGain(); amb.master.gain.value = snd ? 1 : 0; amb.master.connect(ac.destination);
    function loop(url, gain) {
      var g = ac.createGain(); g.gain.value = 0; g.connect(amb.master);
      fetch(url).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
        return new Promise(function (ok, no) { var p = ac.decodeAudioData(b, ok, no); if (p && p.then) p.then(ok, no); });
      }).then(function (buf) {
        var s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = .06; s.loopEnd = buf.duration - .06;
        s.connect(g); s.start(0, .06); ambMix();
      }).catch(function () {});
      return g;
    }
    amb.w = loop('../audio/cauca/nuoc.mp3?v=1');
    amb.r = loop('../audio/cauca/mua.mp3?v=1');
  }
  function ambMix() {
    if (!amb.ac) return;
    var t = amb.ac.currentTime, wx = G.wx, rain = wx === 'mua' ? .32 : wx === 'giong' ? .5 : 0;
    amb.w.gain.setTargetAtTime(/^(bien|ran|vinh|sau)$/.test(G.reg) ? .3 : G.reg === 'suoi' ? .34 : .2, t, .8);
    amb.r.gain.setTargetAtTime(rain, t, 1.2);
    amb.master.gain.setTargetAtTime(snd && !document.hidden ? 1 : 0, t, .15);
  }
  document.addEventListener('visibilitychange', function () {
    if (!amb.ac) return;
    if (document.hidden) amb.ac.suspend(); else { amb.ac.resume(); ambMix(); }
  });
  ['pointerdown', 'keydown'].forEach(function (ev) { window.addEventListener(ev, function () { ambStart(); if (amb.ac && amb.ac.state === 'suspended' && !document.hidden) amb.ac.resume(); }, { capture: true, passive: true }); });

  // ---------- trạng thái chơi ----------
  var G = {
    state: 'title',   // title | idle | cast | wait | bite | reel | ff
    reg: S.reg, wx: 'nang', slot: 'binhminh', t: 0,
    bob: null,        // phao: { x, y, sx, sy, t0, dur }
    pick: null, size: null, biteAt: 0, nibbles: [], shadow: null,
    arc: null, ripples: [], splash: [], flash: 0, bolt: null, nextBolt: 6,
    ff: null, overlay: false, reel: null, wxOverride: null, hookUntil: 0, catchE: null, catchSize: null
  };
  var LW = 0, LH = 0, PX = 3, HY = 0, FY = 0, tip = { x: 0, y: 0 }, hand = { x: 0, y: 0 }, fisherPos = { x: 0, y: 0 };
  var skyCv = null, sceneCv = null, fisherCv = null, clouds = [], cacheKey = '', bodyPos = null;

  function hour() { return (S.min / 60) % 24; }
  function curWx() { return G.wxOverride || CC.weatherAt(S.min, G.reg); }
  function curTide() { return G.tideOverride || CC.tideAt(S.min, G.reg); }

  function resize() {
    var W = innerWidth, H = innerHeight;
    PX = Math.max(2, Math.round(Math.min(W, H) / 150));
    LW = Math.ceil(W / PX); LH = Math.ceil(H / PX);
    cv.width = LW; cv.height = LH;
    cv.style.width = LW * PX + 'px'; cv.style.height = LH * PX + 'px';
    var land = W > H;
    HY = Math.round(LH * (land ? .42 : .4));
    FY = LH - Math.round(LH * (land ? .17 : .15));
    fisherPos = { x: Math.round(LW * (land ? .74 : .7)), y: FY - 13 };
    hand = { x: fisherPos.x + 1, y: fisherPos.y + 8 };
    tip = { x: Math.round(hand.x - LW * (land ? .16 : .3)), y: Math.round(hand.y - (FY - HY) * (land ? .62 : .5)) };
    document.documentElement.style.setProperty('--px', Math.max(2, Math.min(4, PX)) + 'px');
    cacheKey = '';
    layoutDom();
  }
  function layoutDom() {
    $('hint').style.top = (HY + (FY - HY) * .45) * PX + 'px';
    $('say').style.top = Math.max(60, (arcY() - arcR() - 8) * PX - 44) + 'px';
  }
  function arcY() { return Math.min(FY - 8, HY + arcR() + 10); }

      var B = CC.BAITS[k], have = k === 'giun' ? '∞' : S.baits[k], using = S.bait === k, btns = [];
      if (k !== 'giun') btns.push({ label: 'Mua ' + B.pack + ' · ' + B.price + ' xu', fn: function () { if (buy(B.price)) S.baits[k] += B.pack; } });
      btns.push({ label: using ? 'Đang dùng' : 'Dùng', cls: using ? 'on' : 'alt', disabled: using || (k !== 'giun' && !S.baits[k]), fn: function () { S.bait = k; sfx('select'); } });
      list.appendChild(itemRow(k, B.name + ' (có ' + have + ')', B.desc, btns));
    });
    h('Năng lượng');
    drinkSync();
    EN.drinks.forEach(function (D) {
      var left = D.day - S.dBuy.n[D.id];
      list.appendChild(itemRow('drink_' + D.id, D.name + ' (có ' + S.drinks[D.id] + ')', 'Hồi ' + D.gain + ' năng lượng ngay, được vượt mức ' + enMax() + ' (tối đa ' + drinkCap() + '). Mua trong ngày ' + left + '/' + D.day + '.', [
        { label: left > 0 ? 'Mua · ' + D.price + ' xu' : 'Hết lượt', disabled: left <= 0, fn: function () { if (drinkLeft(D) > 0 && buy(D.price)) { S.drinks[D.id]++; S.dBuy.n[D.id]++; } } },
        { label: 'Uống', cls: 'alt', disabled: !S.drinks[D.id] || S.en >= drinkCap(), fn: function () { drink(D.id); } }
      ]));
    });
    h('Bể cá');
    var full = S.slots >= CC.TANK.max, cost = CC.TANK.cost(S.slots);
    list.appendChild(itemRow('slot', 'Thêm chỗ trong bể (' + S.slots + '/' + CC.TANK.max + ')', 'Mỗi chỗ trưng bày được một con cá.', [
      { label: full ? 'Đã tối đa' : 'Mua · ' + money(cost) + ' xu', disabled: full, fn: function () { if (S.slots < CC.TANK.max && buy(cost)) S.slots++; } }
    ]));
    h('Trang trí bể');
    CC.DECOS.forEach(function (d) {
      if (d.ev) return;
      var own = !!S.decos[d.id];
      list.appendChild(itemRow(d.id === 'cat' ? sandIcon() : CA.deco(d.id), d.name, own ? 'Đã có, bật tắt trong bể cá.' : 'Đặt vào bể cá.', [
        { label: own ? 'Đã có' : 'Mua · ' + money(d.price) + ' xu', disabled: own, fn: function () { if (!S.decos[d.id] && buy(d.price)) { S.decos[d.id] = 1; S.decoOn[d.id] = true; } } }
      ]));
    });
    list.scrollTop = top;
  }
  function sandIcon() { var P = CA.painter(12, 12, false); P.ell(6, 8, 6, 4, '#f0e8d0'); P.rect(3, 7, 1, 1, '#d8ccae'); P.rect(8, 9, 1, 1, '#d8ccae'); return P.done('#1b1d2a'); }
  function drink(id) {
    if (!id) { var best = null; EN.drinks.forEach(function (d) { if (S.drinks[d.id] && !best) best = d.id; }); id = best; }   // chạm ô năng lượng: dùng lon nhỏ nhất đang có
    if (!id || !S.drinks[id] || S.en >= drinkCap()) return;
    var D = EN.byId[id];
    syncEnergy();
    S.drinks[id]--; S.en = Math.min(drinkCap(), S.en + D.gain);
    sfx('level', { vol: .6 }); toast('+' + D.gain + ' năng lượng!', 1400);
  }
  function openShop() { sfx('select'); openOv('shop'); renderShop(); }
  $('shopBtn').addEventListener('click', function () { if (G.state === 'bite' || G.state === 'hook' || G.state === 'reel') return; openShop(); });
  $('wallet').addEventListener('click', function () {
    if (G.state === 'bite' || G.state === 'hook' || G.state === 'reel') return;
    syncEnergy();
    if (drinkTotal() && S.en < enMax()) { drink(); save(); wallet(true); return; }
    openShop();
  });
  $('shopX').addEventListener('click', function () { closeOv(); });
  $('shop').addEventListener('pointerdown', function (ev) { if (ev.target === $('shop')) closeOv(); });

  // ---------- năng lực ----------
  function upgradeTo(u) {
    var lv = S.up[u.id];
    if (lv >= u.max) return;
    var cost = u.cost(lv);
    if (!buy(cost)) return;
    syncEnergy();
    var full = S.en >= enMax();
    S.up[u.id] = lv + 1;
    if (u.id === 'nl' && full) S.enT = Date.now();     // đang đầy thì tính hồi từ lúc này, không tặng năng lượng
    sfx('level', { vol: .6 }); toast(u.name + ' lên cấp ' + (lv + 1) + '!', 1500);
  }
  function renderSkill() {
    if (openId !== 'skill') return;
    syncEnergy();
    var list = $('skillList'), top = list.scrollTop; list.innerHTML = '';
    $('skillPurse').textContent = 'Xu: ' + money(S.coins);
    CC.UPGRADES.forEach(function (u) {
      var lv = S.up[u.id], max = lv >= u.max, card = document.createElement('div'); card.className = 'sk';
      var hd = document.createElement('div'); hd.className = 'hd';
      var ic = CA.item('up_' + u.id), c = document.createElement('canvas'); c.width = ic.width; c.height = ic.height; c.getContext('2d').drawImage(ic, 0, 0);
      var nm = document.createElement('b'); nm.textContent = u.name;
      var lvEl = document.createElement('em'); lvEl.textContent = lv + '/' + u.max;
      hd.appendChild(c); hd.appendChild(nm); hd.appendChild(lvEl);
      var pips = document.createElement('div'); pips.className = 'pips';
      for (var i = 0; i < u.max; i++) { var p = document.createElement('span'); p.className = 'pip' + (i < lv ? ' on' : ''); pips.appendChild(p); }
      var now = document.createElement('div'); now.className = 'now'; now.textContent = u.text(u.val(lv));
      var nx = document.createElement('div'); nx.className = 'nx' + (max ? ' mx' : '');
      nx.textContent = max ? 'Đã đạt cấp tối đa' : 'Cấp sau: ' + u.text(u.val(lv + 1));
      var b = document.createElement('button'), cost = max ? 0 : u.cost(lv), can = !max && S.coins >= cost;
      b.className = 'mini' + (can ? '' : ' alt'); b.setAttribute('data-no-scene', '');
      b.textContent = max ? 'Tối đa' : 'Nâng cấp · ' + money(cost) + ' xu'; if (max) b.disabled = true;
      b.addEventListener('click', function () { upgradeTo(u); save(); wallet(true); renderSkill(); });
      card.appendChild(hd); card.appendChild(pips); card.appendChild(now); card.appendChild(nx); card.appendChild(b);
      list.appendChild(card);
    });
    list.scrollTop = top;
  }
  $('skillBtn').addEventListener('click', function () {
    if (G.state === 'bite' || G.state === 'hook' || G.state === 'reel') return;
    sfx('select'); openOv('skill'); renderSkill();
  });
  $('skillX').addEventListener('click', function () { closeOv(); });
  $('skill').addEventListener('pointerdown', function (ev) { if (ev.target === $('skill')) closeOv(); });
  $('evBtn').addEventListener('click', function () { if (G.state === 'bite' || G.state === 'hook' || G.state === 'reel') return; openEvent(); });
  ['vo', 'kho'].forEach(function (k) { $('evTab_' + k).addEventListener('click', function () { evTab = k; sfx('select'); renderEvent(); }); });
  $('evX').addEventListener('click', function () { closeOv(); });
  $('event').addEventListener('pointerdown', function (ev) { if (ev.target === $('event')) closeOv(); });

  // ---------- bể cá ----------
  var tankFish = [], tankRaf = 0;
  function tankSync() {
    var c = $('tankCv'), w = c.width, h = c.height;
    tankFish = S.tank.map(function (f, i) {
      var old = tankFish[i];
      if (old && old.id === f.id && old.cm === f.cm) return old;
      return { id: f.id, e: CC.byId[f.id], cm: f.cm, x: 20 + Math.random() * (w - 40), y: 12 + Math.random() * (h - 32), dir: Math.random() < .5 ? -1 : 1, sp: 5 + Math.random() * 6, turn: 4 + Math.random() * 7, vx: 0, face: 0, ph: Math.random() * 6 };
    });
  }
  var tankCtx = null, tankLast = 0, tankAcc = 0;
  function tankCtx2d() {
    var c = $('tankCv');
    if (!tankCtx || tankCtx.canvas !== c) tankCtx = c.getContext('2d', { willReadFrequently: true });
    return tankCtx;
  }
  function tankStep(f, dt, t, w, h) {
    f.turn -= dt;
    if (f.turn <= 0) { f.dir = -f.dir; f.turn = 5 + Math.random() * 9; }
    if (f.x < 22) f.dir = 1; else if (f.x > w - 22) f.dir = -1;
    if (!f.face) { f.vx = f.dir * f.sp; f.face = f.dir; }
    f.vx += (f.dir * f.sp - f.vx) * Math.min(1, dt * 2.5);
    if (f.vx * f.face < -f.sp * .25) f.face = f.vx < 0 ? -1 : 1;
    if (!reduce) f.x += f.vx * dt;
    f.x = Math.max(12, Math.min(w - 12, f.x));
    f.y += Math.sin(t * .7 + f.ph) * dt * 3;
    f.y = Math.max(10, Math.min(h - 20, f.y));
    // làm tròn có trễ: cá chỉ nhích 1 điểm ảnh khi đã lệch rõ, không nhảy qua lại giữa 2 hàng
    if (f.rx == null || Math.abs(f.x - f.rx) > .8) f.rx = Math.round(f.x);
    if (f.ry == null || Math.abs(f.y - f.ry) > .8) f.ry = Math.round(f.y);
  }
  function tankDraw() {
    var c = $('tankCv'), x = tankCtx2d(), w = c.width, h = c.height, t = performance.now() / 1000;
    var on = {}; for (var k in S.decoOn) if (S.decoOn[k] && S.decos[k]) on[k] = true;
    CA.tank(x, w, h, tankFish, on, reduce ? 0 : t);
  }
  function tankLoop(now) {
    tankRaf = 0;
    if (openId !== 'tank') return;
    tankRaf = requestAnimationFrame(tankLoop);   // luôn đặt lịch trước, lỗi một khung không làm đứng bể
    var dt = Math.min(.05, (now - (tankLast || now)) / 1000); tankLast = now;
    tankAcc += dt;
    if (tankAcc < 1 / 30 - .004) return;               // 30 khung/giây là đủ cho pixel art, nhẹ máy hơn
    dt = tankAcc; tankAcc = 0;
    try {
      var c = $('tankCv'), w = c.width, h = c.height;
      tankFish.forEach(function (f) { tankStep(f, dt, now / 1000, w, h); });
      tankDraw();
    } catch (e) { if (window.console) console.error(e); }
  }
  function tankStart() {
    if (tankRaf) cancelAnimationFrame(tankRaf);
    tankLast = 0; tankAcc = 0;
    tankRaf = requestAnimationFrame(tankLoop);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && openId === 'tank') { tankStart(); } });
  function renderTank() {
    var c = $('tankCv'), wide = innerWidth > innerHeight;
    c.width = 160; c.height = wide ? 64 : 90;
    tankSync();
    try { tankDraw(); } catch (e) { }
    $('tankInfo').textContent = 'Đang trưng bày ' + S.tank.length + '/' + S.slots + ' con · Xu: ' + money(S.coins);
    var deco = $('tankDeco'); deco.innerHTML = '';
    CC.DECOS.forEach(function (d) {
      if (!S.decos[d.id]) return;
      var b = document.createElement('button'), on = !!S.decoOn[d.id];
      b.className = 'mini' + (on ? ' on' : ' alt'); b.setAttribute('data-no-scene', ''); b.textContent = d.name;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.addEventListener('click', function () { S.decoOn[d.id] = !S.decoOn[d.id]; save(); sfx('select'); renderTank(); });
      deco.appendChild(b);
    });
    if (!deco.children.length) { var n = document.createElement('span'); n.style.fontSize = '17px'; n.textContent = 'Mua đồ trang trí ở Cửa hàng để làm đẹp bể.'; deco.appendChild(n); }
    var list = $('tankList'); list.innerHTML = '';
    if (!S.tank.length) { var m = document.createElement('div'); m.style.fontSize = '19px'; m.textContent = 'Bể còn trống. Câu được cá thì chọn "Thả vào bể".'; list.appendChild(m); }
    S.tank.forEach(function (f, i) {
      var e = CC.byId[f.id], v = CC.price(e, f.cm, mods());
      list.appendChild(itemRow(CA.sprite(e), e.name, sizeText(f.cm, f.kg) + ' · ' + CC.RARITY[e.r].name, [
        { label: 'Bán · ' + money(v) + ' xu', fn: function () { S.tank.splice(i, 1); S.coins += v; sfx('coin', { vol: .6, pitch: 1.2 }); renderTank(); } },
        { label: 'Thả về nước', cls: 'alt', fn: function () { S.tank.splice(i, 1); sfx('splash', { vol: .5 }); renderTank(); } }
      ]));
    });
    save(); wallet(true);
  }
  $('tankBtn').addEventListener('click', function () {
    if (G.state === 'bite' || G.state === 'hook' || G.state === 'reel') return;
    sfx('splash', { vol: .4 }); openOv('tank'); renderTank();
    tankStart();
  });
  $('tankX').addEventListener('click', function () { closeOv(); });
  $('tank').addEventListener('pointerdown', function (ev) { if (ev.target === $('tank')) closeOv(); });

  // ---------- khởi động ----------
  function titleStat() {
    $('titleStat').textContent = nFound() ? 'Sổ tay: ' + nFound() + '/' + CC.ALL.length + ' · ' + money(S.coins) + ' xu' : 'Sổ tay đang trống, đi câu thôi!';
  }
  G.slot = CC.slotOf(hour()); G.wx = curWx(); G.tide = curTide();
  resize(); hudStatic(); titleStat(); showHud(false); showHint(false);
  openId = 'title'; G.overlay = true;
  addEventListener('resize', function () { resize(); });
  addEventListener('pagehide', save);
  requestAnimationFrame(frame);

  // móc kiểm thử
  window.__cc = {
    G: G, S: S, save: save,
    setTime: function (h) { S.min = Math.floor(S.min / 1440) * 1440 + h * 60; },
    setWx: function (w) { G.wxOverride = w || null; },
    setTide: function (t) { G.tideOverride = t || null; },
    region: function (id) { G.reg = S.reg = id; G.wx = curWx(); G.tide = curTide(); cacheKey = ''; hudStatic(); },
    bite: function (id, cm) {
      if (!G.bob) { G.bob = { x: LW * .45, y: HY + (FY - HY) * .5, tx: LW * .45, ty: HY + (FY - HY) * .5 }; }
      G.state = 'wait'; G.pick = CC.byId[id]; G.size = CC.roll(G.pick); if (cm) { G.size.cm = cm; G.size.kg = G.pick.k * cm * cm * cm * 1e-5; }
      bite();
    },
    arc: function () { return G.arc && { g: G.arc.g, zc: G.arc.zc, zw: G.arc.zw, speed: G.arc.speed, tries: G.arc.tries }; },
    strike: strike, act: act, openBook: openBook, openMap: openMap, openShop: openShop, openSkill: function () { openOv('skill'); renderSkill(); }, upgradeTo: upgradeTo, renderTank: renderTank,
    hook: function (id, cm) {
      if (!G.bob) { G.bob = { x: LW * .45, y: HY + (FY - HY) * .5, tx: LW * .45, ty: HY + (FY - HY) * .5 }; }
      G.state = 'wait'; G.pick = CC.byId[id]; G.size = CC.roll(G.pick); if (cm) { G.size.cm = cm; G.size.kg = G.pick.k * cm * cm * cm * 1e-5; }
      hook();
    },
    openEvent: openEvent, setKind: function (k) { CC.EVENT2.force = k || null; lastEv = ''; wallet(true); }, evSync: evSync, sync: syncEnergy, wallet: function () { wallet(true); },
    low: function () { return { LW: LW, LH: LH, PX: PX, HY: HY, FY: FY }; }
  };
})();
</script>
