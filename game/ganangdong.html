if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = Math.min(Array.isArray(r) ? r[0] : (r || 0), w / 2, h / 2);
        this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();

<script>
        (function() {
            // ==================== DOM ELEMENTS ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playJumpSound() {
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";      // Có thể đổi: sine, triangle, sawtooth
    osc.frequency.setValueAtTime(9000, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(3000, audioCtx.currentTime + 0.08);

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.151, audioCtx.currentTime + 0.08);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}
            const container = document.getElementById('gameContainer');

            // ==================== GAME CONSTANTS ====================
            const CONSTANTS = {
                STAMINA_MAX: 6,
                STAMINA_REGEN_TIME: 0.65,
                GRAVITY: 2000,
                JUMP_VELOCITY: -570,
                GAME_SPEED_INITIAL: 320,
                GAME_SPEED_MAX: 1000,
                GAME_SPEED_INCREMENT: 4,
                GROUND_RATIO: 0.62,
                BG_SCALE: 0.8,
                SIZE_SCALE: 0.75,
                CHICKEN_WIDTH: 64,
                CHICKEN_HEIGHT: 70,
                RESTART_BUTTON_WIDTH: 200,
                RESTART_BUTTON_HEIGHT: 65
            };

            // ==================== GAME STATE VARIABLES ====================
            let canvasWidth, canvasHeight, groundY;
            let terrainOffset = 0;
            // Chu kỳ ngày đêm
            let dayTimer = 0;
            const DAY_DURATION = 45;      // mỗi cảnh 45 giây
            const TRANSITION_TIME = 8;    // chuyển cảnh 8 giây
            let terrainTarget = 0;
            let terrainProgress = 1;
            let terrainStart = 0;
            function getGroundY() {
                return groundY + terrainOffset;
            }
            let gameState = 'waiting'; // 'waiting' | 'playing' | 'falling' | 'gameover'
            let score = 0;
            let gameSpeed = CONSTANTS.GAME_SPEED_INITIAL;
            let stamina = CONSTANTS.STAMINA_MAX;
            let staminaTimer = 0;
            let isBlocked = false;

            // Game objects
            let chicken;
            let obstacles = [];
            let holes = [];
            let items = [];
            let eagles = [];
            let platforms = [];
            let spikes = [];
            let bgElements;
            let weatherManager;

            // Timing & tracking
            let lastTime = 0;
            let frameCount = 0;
            let hasStartedPlaying = false;
            let gameOverAnimTimer = 0;

            // Best score (persisted in localStorage)
            let bestScore = 0;
            try { bestScore = parseInt(localStorage.getItem('chickenRunBest_v26') || '0') || 0; } catch (e) {}

            // Restart button position (calculated on resize)
            let restartButton = {
                x: 0,
                y: 0,
                w: CONSTANTS.RESTART_BUTTON_WIDTH,
                h: CONSTANTS.RESTART_BUTTON_HEIGHT
            };

            // Spawn timers
            let spawnTimer = 0;
            let nextSpawnDelay = 1.2;
            let itemSpawnTimer = 0;
            let eagleSpawnTimer = 0;

            // ==================== HELPER: ROUNDRECT POLYFILL ====================
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    ctx.beginPath();
                    ctx.moveTo(x + r.tl, y);
                    ctx.lineTo(x + w - r.tr, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    ctx.lineTo(x + w, y + h - r.br);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    ctx.lineTo(x + r.bl, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    ctx.lineTo(x, y + r.tl);
                    ctx.quadraticCurveTo(x, y, x + r.tl, y);
                    ctx.closePath();
                };
            }

            // ==================== ART HELPERS ====================
            const ART_DPR = Math.min(window.devicePixelRatio || 1, 2);
            function makeRng(seed) {
                let s = seed >>> 0;
                return function() {
                    s = (s + 0x6D2B79F5) >>> 0;
                    let t = s;
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }
            function hash01(k) { return ((Math.imul(k | 0, 2654435761) >>> 8) & 255) / 255; }
            function parseRGB(c) {
                if (c[0] === '#') { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
                const m = c.match(/[\d.]+/g);
                return [+m[0], +m[1], +m[2]];
            }
            function mixColor(a, b, t) {
                const A = parseRGB(a), B = parseRGB(b);
                return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
            }
            function makeSprite(w, h, fn) {
                const c = document.createElement('canvas');
                c.width = Math.ceil(w * ART_DPR);
                c.height = Math.ceil(h * ART_DPR);
                const g = c.getContext('2d');
                g.scale(ART_DPR, ART_DPR);
                fn(g, w, h);
                return { c, w, h };
            }

            // Thùng gỗ có khung, ván, thanh chéo, đinh
            function drawCrate(ctx, x, y, w, h, v) {
                const S = CONSTANTS.SIZE_SCALE;
                const T = [['#D2A46B', '#B58750', '#8A5E37'], ['#C7965E', '#A97A46', '#7C5330'], ['#D8AE78', '#BB8D57', '#93663D']][v % 3];
                const b = Math.max(3.2 * S, w * 0.13);
                let g = ctx.createLinearGradient(x, y, x + w, y);
                g.addColorStop(0, T[0]); g.addColorStop(0.55, T[1]); g.addColorStop(1, T[2]);
                ctx.fillStyle = g;
                ctx.fillRect(x, y, w, h);

                const n = 3, ph = (h - 2 * b) / n;
                for (let i = 0; i < n; i++) {
                    const py = y + b + i * ph;
                    ctx.fillStyle = i % 2 ? 'rgba(60,30,10,0.10)' : 'rgba(255,235,200,0.08)';
                    ctx.fillRect(x + b, py, w - 2 * b, ph);
                    ctx.fillStyle = 'rgba(35,18,6,0.6)';
                    ctx.fillRect(x + b, py + ph - 0.6, w - 2 * b, 1.2);
                    ctx.strokeStyle = 'rgba(80,45,18,0.30)';
                    ctx.lineWidth = 0.7;
                    ctx.beginPath();
                    ctx.moveTo(x + b + 1, py + ph * (0.3 + 0.1 * ((v + i) % 3)));
                    ctx.quadraticCurveTo(x + w * 0.5, py + ph * 0.15, x + w - b - 1, py + ph * 0.5);
                    ctx.stroke();
                }

                ctx.save();
                ctx.beginPath(); ctx.rect(x + b, y + b, w - 2 * b, h - 2 * b); ctx.clip();
                ctx.strokeStyle = T[2]; ctx.lineWidth = b * 0.95; ctx.lineCap = 'butt';
                ctx.beginPath(); ctx.moveTo(x + b * 0.3, y + h - b * 0.3); ctx.lineTo(x + w - b * 0.3, y + b * 0.3); ctx.stroke();
                ctx.strokeStyle = 'rgba(255,225,180,0.28)'; ctx.lineWidth = 0.9;
                ctx.beginPath(); ctx.moveTo(x + b * 0.3, y + h - b * 0.8); ctx.lineTo(x + w - b * 0.3, y - b * 0.2); ctx.stroke();
                ctx.restore();

                ctx.fillStyle = '#93673C';
                ctx.fillRect(x, y, w, b);
                ctx.fillRect(x, y + h - b, w, b);
                ctx.fillRect(x, y, b, h);
                ctx.fillRect(x + w - b, y, b, h);
                ctx.fillStyle = 'rgba(255,230,190,0.35)';
                ctx.fillRect(x, y, w, 1);
                ctx.fillRect(x, y, 1, h);
                ctx.fillStyle = 'rgba(30,15,5,0.45)';
                ctx.fillRect(x, y + h - 1, w, 1);
                ctx.fillRect(x + w - 1, y, 1, h);
                ctx.strokeStyle = 'rgba(30,15,5,0.65)'; ctx.lineWidth = 1;
                ctx.strokeRect(x + b, y + b, w - 2 * b, h - 2 * b);

                for (let c = 0; c < 4; c++) {
                    const nx = c % 2 ? x + w - b / 2 : x + b / 2;
                    const ny = c < 2 ? y + b / 2 : y + h - b / 2;
                    ctx.fillStyle = '#2f2a26';
                    ctx.beginPath(); ctx.arc(nx, ny, 1.15 * S + 0.4, 0, 6.2832); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.55)';
                    ctx.beginPath(); ctx.arc(nx - 0.4, ny - 0.4, 0.45, 0, 6.2832); ctx.fill();
                }

                const lg = ctx.createLinearGradient(x, 0, x + w, 0);
                lg.addColorStop(0, 'rgba(255,240,210,0.16)');
                lg.addColorStop(0.4, 'rgba(255,255,255,0)');
                lg.addColorStop(1, 'rgba(0,0,0,0.22)');
                ctx.fillStyle = lg;
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#3B2412'; ctx.lineWidth = 1.4;
                ctx.strokeRect(x, y, w, h);
            }

            // ==================== CLASS: WEATHER MANAGER ====================
            class WeatherManager {
                constructor() {
                    this.raindrops = [];
                    this.leaves = [];
                    this.init();
                }

                init() {
                    this.raindrops = [];
                    this.leaves = [];

                    // Create raindrops
                    for (let i = 0; i < 120; i++) {
                        this.raindrops.push({
                            x: Math.random() * canvasWidth,
                            y: Math.random() * canvasHeight,
                            speed: 500 + Math.random() * 400,
                            length: 10 + Math.random() * 20,
                            opacity: 0.1 + Math.random() * 0.2
                        });
                    }

                    // Create falling leaves
                    for (let i = 0; i < 18; i++) {
                        this.leaves.push({
                            x: Math.random() * canvasWidth,
                            y: Math.random() * canvasHeight,
                            speed: 40 + Math.random() * 80,
                            rotation: Math.random() * Math.PI * 2,
                            rotSpeed: (Math.random() - 0.5) * 2,
                            size: 4 + Math.random() * 6,
                            opacity: 0.5 + Math.random() * 0.3,
                            sway: Math.random() * Math.PI * 2,
                            swaySpeed: 1 + Math.random() * 2
                        });
                    }
                }

                update(dt) {
                    // Update raindrops
                    for (let drop of this.raindrops) {
                        drop.y += drop.speed * dt;
                        drop.x -= 30 * dt;
                        if (drop.y > canvasHeight) {
                            drop.y = -10;
                            drop.x = Math.random() * canvasWidth;
                        }
                        if (drop.x < -20) drop.x = canvasWidth + 20;
                    }

                    // Update leaves
                    for (let leaf of this.leaves) {
                        leaf.x -= leaf.speed * dt;
                        leaf.y += Math.sin(leaf.sway) * 20 * dt;
                        leaf.sway += leaf.swaySpeed * dt;
                        leaf.rotation += leaf.rotSpeed * dt;
                        if (leaf.x < -20) {
                            leaf.x = canvasWidth + 20;
                            leaf.y = Math.random() * canvasHeight;
                        }
                    }
                }

                draw(ctx) {
                    // Subtle atmospheric overlay
                    ctx.fillStyle = 'rgba(200,220,230,0.04)';
                    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                    // Draw fog patches
                    for (let i = 0; i < 3; i++) {
                        let fogX = (i * canvasWidth * 0.4 + frameCount * 10) % (canvasWidth + 200) - 100;
                        let fogY = getGroundY() - 100 - i * 40;
                        let gradient = ctx.createRadialGradient(fogX, fogY, 50, fogX, fogY, 300);
                        gradient.addColorStop(0, 'rgba(220,230,240,0.08)');
                        gradient.addColorStop(1, 'rgba(220,230,240,0)');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(fogX - 300, fogY - 300, 600, 600);
                    }

                    // Draw leaves
                    for (let leaf of this.leaves) {
                        ctx.save();
                        ctx.translate(leaf.x, leaf.y);
                        ctx.rotate(leaf.rotation);
                        ctx.fillStyle = `rgba(180,150,100,${leaf.opacity})`;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, leaf.size, leaf.size * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(120,90,60,0.3)';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }

            // ==================== CLASS: CHICKEN (PLAYER) ====================
            class Chicken {
                constructor() {
                    this.width = CONSTANTS.CHICKEN_WIDTH * CONSTANTS.SIZE_SCALE;
                    this.height = CONSTANTS.CHICKEN_HEIGHT * CONSTANTS.SIZE_SCALE;
                    this.x = canvasWidth * 0.16;
                    this.y = getGroundY() - this.height;
                    this.velocityY = 0;
                    this.isOnGround = true;
                    this.currentPlatform = null;
                    this.airJumpsUsed = 0;
                    this.animFrame = 0;
                    this.animTimer = 0;
                    this.eyeBlinkTimer = 0;
                    this.isBlinking = false;
                    this.trailParticles = [];
                    this.jumpCooldown = 0;
                    this.shieldTimer = 0;
                    this.invincibleTimer = 0;
                    this.wingFlapPhase = 0;
                    this.fallingInHole = false;
                    this.fallTimer = 0;
                }

                update(dt) {
                    // Handle falling into hole state
                    if (this.fallingInHole) {
                        this.fallTimer += dt;
                        this.y += 400 * dt;
                        this.wingFlapPhase += dt * 10;
                        if (this.y > canvasHeight + 50) gameOver();
                        return;
                    }

                    // Cooldowns
                    if (this.jumpCooldown > 0) this.jumpCooldown -= dt;
                    if (this.shieldTimer > 0) this.shieldTimer -= dt;
                    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;

                    // Check if current platform is still valid
                    if (this.currentPlatform) {
                        let p = this.currentPlatform;
                        if (!p.active || p.x + p.width < this.x || p.x > this.x + this.width) {
                            this.currentPlatform = null;
                            this.isOnGround = false;
                        } else {
                            this.y = p.y - this.height;
                            this.velocityY = 0;
                        }
                    }

                    // Physics if not on a platform
                    if (!this.currentPlatform || !this.isOnGround) {
                        if (!this.isOnGround) {
                            this.velocityY += CONSTANTS.GRAVITY * dt;
                            this.y += this.velocityY * dt;

                            const currentGround = getGroundY();

                            // Rơi xuống chạm đất
                            if (this.y >= currentGround - this.height) {
                                this.y = currentGround - this.height;
                                this.velocityY = 0;
                                this.isOnGround = true;
                                this.currentPlatform = null;
                                this.airJumpsUsed = 0;
                                this.spawnLandingDust();
                            } else {
                                // Va chạm platform khi đang rơi
                                for (let p of platforms) {
                                    if (
                                        p.active &&
                                        this.velocityY > 0 &&
                                        this.x + this.width > p.x &&
                                        this.x < p.x + p.width &&
                                        this.y + this.height >= p.y &&
                                        this.y + this.height - this.velocityY * dt <= p.y + 5
                                    ) {
                                        this.y = p.y - this.height;
                                        this.velocityY = 0;
                                        this.isOnGround = true;
                                        this.currentPlatform = p;
                                        this.airJumpsUsed = 0;
                                        this.spawnLandingDust();
                                        break;
                                    }
                                }
                            }
                        }

                        this.wingFlapPhase += this.isOnGround ? 0 : dt * 12;
                    }

                    // Nếu đang đứng trên đất và chưa dính platform thì bám sát địa hình
                    if (this.isOnGround && !this.currentPlatform) {
                        this.y = getGroundY() - this.height;
                    }

                    // Animation
                    this.animTimer += dt;
                    if (this.isOnGround && this.animTimer > 0.08) {
                        this.animTimer = 0;
                        this.animFrame = (this.animFrame + 1) % 4;
                    }
                    if (!this.isOnGround) this.animFrame = 4;

                    // Eye blinking
                    this.eyeBlinkTimer += dt;
                    if (this.eyeBlinkTimer > 2.5 + Math.random() * 2) {
                        this.isBlinking = true;
                        this.eyeBlinkTimer = 0;
                    }
                    if (this.isBlinking && this.eyeBlinkTimer > 0.1) {
                        this.isBlinking = false;
                        this.eyeBlinkTimer = 0;
                    }

                    // Update trail particles
                    for (let i = this.trailParticles.length - 1; i >= 0; i--) {
                        let p = this.trailParticles[i];
                        p.life -= dt;
                        p.y += p.vy * dt;
                        p.x += p.vx * dt;
                        if (p.life <= 0) this.trailParticles.splice(i, 1);
                    }

                    // Spawn dust particles when running
                    if (this.isOnGround && gameState === 'playing' && Math.random() < 0.6) {
                        this.trailParticles.push({
                            x: this.x + 5 * CONSTANTS.SIZE_SCALE + Math.random() * 10 * CONSTANTS.SIZE_SCALE,
                            y: this.y + this.height - 2 * CONSTANTS.SIZE_SCALE,
                            vx: -20 * CONSTANTS.SIZE_SCALE - Math.random() * 35 * CONSTANTS.SIZE_SCALE,
                            vy: -15 * CONSTANTS.SIZE_SCALE - Math.random() * 30 * CONSTANTS.SIZE_SCALE,
                            life: 0.25 + Math.random() * 0.35,
                            size: 1.5 * CONSTANTS.SIZE_SCALE + Math.random() * 3 * CONSTANTS.SIZE_SCALE,
                            color: 'rgba(170,140,110,0.7)'
                        });
                    }
                }

                spawnLandingDust() {
                    for (let i = 0; i < 10; i++) {
                        this.trailParticles.push({
                            x: this.x + Math.random() * this.width,
                            y: this.y + this.height,
                            vx: (Math.random() - 0.5) * 70 * CONSTANTS.SIZE_SCALE,
                            vy: -50 * CONSTANTS.SIZE_SCALE - Math.random() * 70 * CONSTANTS.SIZE_SCALE,
                            life: 0.3 + Math.random() * 0.5,
                            size: 2 * CONSTANTS.SIZE_SCALE + Math.random() * 5 * CONSTANTS.SIZE_SCALE,
                            color: 'rgba(190,160,130,0.8)'
                        });
                    }
                }

                jump() {
                    // Check jump conditions
                    if (this.fallingInHole || gameState === 'falling' || gameState === 'gameover') return false;
                    if (stamina <= 0 || this.jumpCooldown > 0) return false;

                    // Perform jump
                    if (this.isOnGround) {
                        this.velocityY = CONSTANTS.JUMP_VELOCITY;
                        this.isOnGround = false;
                        this.currentPlatform = null;
                        this.airJumpsUsed = 0;
                    } else {
                        this.velocityY = CONSTANTS.JUMP_VELOCITY * 0.85;
                        this.airJumpsUsed++;
                    }

                    stamina--;
                    this.jumpCooldown = 0.08;
                        playJumpSound();

                    // Jump particles
                    for (let i = 0; i < 12; i++) {
                        this.trailParticles.push({
                            x: this.x + Math.random() * this.width,
                            y: this.y + this.height,
                            vx: (Math.random() - 0.5) * 90 * CONSTANTS.SIZE_SCALE,
                            vy: -90 * CONSTANTS.SIZE_SCALE - Math.random() * 110 * CONSTANTS.SIZE_SCALE,
                            life: 0.2 + Math.random() * 0.35,
                            size: 2 * CONSTANTS.SIZE_SCALE + Math.random() * 5 * CONSTANTS.SIZE_SCALE,
                            color: 'rgba(255,230,160,0.9)'
                        });
                    }
                    return true;
                }

                getCollisionBox() {
                    const m = 8 * CONSTANTS.SIZE_SCALE;
                    const n = 6 * CONSTANTS.SIZE_SCALE;
                    return {
                        x: this.x + m,
                        y: this.y + n,
                        width: this.width - 2 * m,
                        height: this.height - 2 * n
                    };
                }

                draw(ctx) {
                    const S = CONSTANTS.SIZE_SCALE;
                    const W = this.width, H = this.height;
                    const cx = this.x + W / 2;
                    const groundLine = this.currentPlatform ? this.currentPlatform.y : getGroundY();
                    const air = Math.min(1, Math.max(0, (groundLine - (this.y + H)) / (120 * S)));
                    ctx.save();

                    // Bóng đổ mềm, nhỏ dần khi nhảy cao
                    if (this.currentPlatform || !isOverHole(cx - 2, 4)) {
                        ctx.save();
                        ctx.translate(cx, groundLine + 1 * S);
                        ctx.scale(1 - air * 0.35, 0.16);
                        const sg = ctx.createRadialGradient(0, 0, 1, 0, 0, W * 0.5);
                        sg.addColorStop(0, `rgba(0,0,0,${0.42 * (1 - air * 0.6)})`);
                        sg.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = sg;
                        ctx.beginPath(); ctx.arc(0, 0, W * 0.5, 0, Math.PI * 2); ctx.fill();
                        ctx.restore();
                    }

                    // Khiên bảo vệ dạng bong bóng
                    if (this.shieldTimer > 0 || this.invincibleTimer > 0) {
                        const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.2);
                        const R = W * 0.8, mx = cx, my = this.y + H / 2;
                        const bg = ctx.createRadialGradient(mx - R * 0.3, my - R * 0.3, R * 0.1, mx, my, R);
                        bg.addColorStop(0, 'rgba(210,245,255,0.12)');
                        bg.addColorStop(0.75, `rgba(90,190,255,${0.2 + pulse * 0.1})`);
                        bg.addColorStop(1, `rgba(170,230,255,${0.5 + pulse * 0.2})`);
                        ctx.fillStyle = bg;
                        ctx.beginPath(); ctx.arc(mx, my, R, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                        ctx.lineWidth = 1.5 * S;
                        ctx.stroke();
                        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
                        ctx.lineWidth = 2 * S;
                        ctx.beginPath(); ctx.arc(mx, my, R * 0.82, -2.6, -1.6); ctx.stroke();
                    }

                    const running = this.isOnGround && gameState === 'playing';
                    const bob = running ? Math.sin(this.animFrame * Math.PI / 2) * 2.2 * S : 0;
                    const bx = cx - W * 0.05;
                    const by = this.y + H * 0.56 + bob;
                    const rx = W * 0.42, ry = H * 0.35;
                    const wf = !this.isOnGround ? Math.sin(this.wingFlapPhase) : Math.sin(this.animFrame * Math.PI / 2) * 0.25;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    // ---- CHÂN (bàn chân luôn bám đất, thân nhún) ----
                    const leg = (hx, hy, fx, fy, near) => {
                        ctx.strokeStyle = near ? '#EE8B2B' : '#C56A1B';
                        ctx.lineWidth = 2.3 * S;
                        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(fx, fy); ctx.stroke();
                        ctx.lineWidth = 1.7 * S;
                        ctx.beginPath();
                        ctx.moveTo(fx, fy); ctx.lineTo(fx + 6 * S, fy + 0.4 * S);
                        ctx.moveTo(fx, fy); ctx.lineTo(fx + 4.6 * S, fy - 1.9 * S);
                        ctx.moveTo(fx, fy); ctx.lineTo(fx + 4.2 * S, fy + 2.1 * S);
                        ctx.moveTo(fx, fy); ctx.lineTo(fx - 2.6 * S, fy + 0.2 * S);
                        ctx.stroke();
                    };
                    const footBase = this.y + H;
                    for (let i = 0; i < 2; i++) {
                        const hx = bx + (i ? -4 : 3) * S, hy = by + ry * 0.7;
                        let fx, fy;
                        if (running) {
                            const ph = this.animFrame * Math.PI / 2 + i * Math.PI;
                            fx = hx + Math.sin(ph) * 6 * S;
                            fy = footBase - Math.max(0, Math.cos(ph)) * 5 * S;
                        } else if (this.isOnGround) {
                            fx = hx; fy = footBase;
                        } else {
                            fx = hx - 4 * S + i * 3 * S; fy = by + ry + 5 * S;
                        }
                        leg(hx, hy, fx, fy, i === 1);
                    }

                    // ---- CÁNH XA + ĐUÔI LÔNG TƠ (phía sau thân) ----
                    ctx.fillStyle = '#EFB22A';
                    ctx.save();
                    ctx.translate(bx + 3 * S, by - ry * 0.55);
                    ctx.rotate(-0.15 - wf * 0.5);
                    ctx.beginPath(); ctx.ellipse(-3 * S, 0, 9 * S, 4.5 * S, -0.2, 0, 6.2832); ctx.fill();
                    ctx.restore();
                    ctx.fillStyle = '#F0B526';
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.ellipse(bx - rx * 0.86 - i * 1.2 * S, by - ry * 0.32 + i * 3.4 * S, 4.6 * S, 3 * S, -0.5 + i * 0.35, 0, 6.2832);
                        ctx.fill();
                    }

                    // ---- THÂN: viền mượt, không gai ----
                    ctx.fillStyle = '#EDAA1C';
                    ctx.beginPath(); ctx.ellipse(bx, by + 0.4 * S, rx + 0.8 * S, ry + 0.8 * S, 0, 0, 6.2832); ctx.fill();
                    const bodyGrad = ctx.createRadialGradient(bx + rx * 0.25, by - ry * 0.35, 2 * S, bx, by, rx * 1.15);
                    bodyGrad.addColorStop(0, '#FFF3A6');
                    bodyGrad.addColorStop(0.55, '#FFD94A');
                    bodyGrad.addColorStop(1, '#EDAA1C');
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath(); ctx.ellipse(bx, by, rx, ry, 0, 0, 6.2832); ctx.fill();

                    // Vân lông (nét ngắn theo góc vàng)
                    ctx.lineWidth = 0.9 * S;
                    ctx.strokeStyle = 'rgba(214,140,15,0.16)';
                    ctx.beginPath();
                    for (let i = 0; i < 22; i++) {
                        const a = i * 2.399, r = Math.sqrt((i + 0.5) / 22);
                        const px = bx + Math.cos(a) * r * rx * 0.85, py = by + Math.sin(a) * r * ry * 0.85;
                        if (py > by - ry * 0.1) { ctx.moveTo(px, py); ctx.quadraticCurveTo(px - 1 * S, py + 1.5 * S, px - 1.4 * S, py + 2 * S); }
                    }
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,252,215,0.22)';
                    ctx.beginPath();
                    for (let i = 0; i < 22; i++) {
                        const a = i * 2.399 + 1, r = Math.sqrt((i + 0.5) / 22);
                        const px = bx + Math.cos(a) * r * rx * 0.85, py = by + Math.sin(a) * r * ry * 0.85;
                        if (py <= by - ry * 0.1) { ctx.moveTo(px, py); ctx.quadraticCurveTo(px - 1 * S, py + 1.5 * S, px - 1.4 * S, py + 2 * S); }
                    }
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,250,200,0.35)';
                    ctx.beginPath(); ctx.ellipse(bx + W * 0.06, by + H * 0.08, W * 0.26, H * 0.2, 0, 0, 6.2832); ctx.fill();

                    // ---- CÁNH GẦN ----
                    ctx.save();
                    ctx.translate(bx - W * 0.03, by - H * 0.05);
                    ctx.rotate(0.25 + wf * 1.3);
                    const wg = ctx.createLinearGradient(-16 * S, 0, 2 * S, 0);
                    wg.addColorStop(0, '#EFAA1E'); wg.addColorStop(1, '#FFDD55');
                    ctx.fillStyle = wg;
                    ctx.beginPath();
                    ctx.moveTo(2 * S, -1 * S);
                    ctx.bezierCurveTo(0, -8 * S, -10 * S, -8 * S, -16 * S, -3 * S);
                    ctx.bezierCurveTo(-11 * S, 1 * S, -6 * S, 6 * S, 2 * S, 5 * S);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = 'rgba(190,110,0,0.5)'; ctx.lineWidth = 0.8 * S; ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.quadraticCurveTo(-7 * S, -3 * S, -13 * S, -2.5 * S);
                    ctx.moveTo(0, 1.5 * S); ctx.quadraticCurveTo(-6 * S, 0, -12 * S, 0.5 * S);
                    ctx.moveTo(0, 3 * S); ctx.quadraticCurveTo(-5 * S, 2.5 * S, -9 * S, 3 * S);
                    ctx.stroke();
                    ctx.restore();

                    // ---- ĐẦU ----
                    const headX = bx + W * 0.22, headY = by - H * 0.23, headR = W * 0.26;
                    ctx.fillStyle = '#FFD84A';
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.ellipse(headX - 2.5 * S + i * 2.6 * S, headY - headR - 0.8 * S + Math.abs(i - 1) * 0.9 * S, 1.7 * S, 2.6 * S, -0.4 + i * 0.4, 0, 6.2832);
                        ctx.fill();
                    }
                    const hg = ctx.createRadialGradient(headX + headR * 0.3, headY - headR * 0.35, 2 * S, headX, headY, headR * 1.1);
                    hg.addColorStop(0, '#FFFBD0'); hg.addColorStop(0.6, '#FFE066'); hg.addColorStop(1, '#F2B622');
                    ctx.fillStyle = hg;
                    ctx.beginPath(); ctx.arc(headX, headY, headR, 0, 6.2832); ctx.fill();

                    // Má hồng
                    ctx.fillStyle = 'rgba(255,135,105,0.42)';
                    ctx.beginPath(); ctx.ellipse(headX + 0.5 * S, headY + 5.2 * S, 3.4 * S, 2.3 * S, 0, 0, 6.2832); ctx.fill();

                    // Mắt bóng
                    const ex = headX + 5.5 * S, ey = headY - 1.5 * S;
                    if (!this.isBlinking) {
                        ctx.fillStyle = '#1a1208';
                        ctx.beginPath(); ctx.arc(ex, ey, 3.1 * S, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(ex - 1 * S, ey - 1.2 * S, 1.2 * S, 0, 6.2832); ctx.fill();
                        ctx.beginPath(); ctx.arc(ex + 1.2 * S, ey + 1.2 * S, 0.6 * S, 0, 6.2832); ctx.fill();
                    } else {
                        ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 1.6 * S;
                        ctx.beginPath(); ctx.arc(ex, ey + 1.5 * S, 3 * S, 3.6, 5.8); ctx.stroke();
                    }

                    // Mỏ (hàm trên + hàm dưới)
                    const mx0 = headX + headR - 1 * S;
                    const bgd = ctx.createLinearGradient(0, headY - 3 * S, 0, headY + 3 * S);
                    bgd.addColorStop(0, '#FFB83F'); bgd.addColorStop(1, '#F08A14');
                    ctx.fillStyle = bgd;
                    ctx.beginPath();
                    ctx.moveTo(mx0, headY - 2.8 * S);
                    ctx.quadraticCurveTo(mx0 + 7 * S, headY - 2 * S, mx0 + 10.5 * S, headY + 1.6 * S);
                    ctx.lineTo(mx0, headY + 2.6 * S);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#E27A0E';
                    ctx.beginPath();
                    ctx.moveTo(mx0, headY + 2.6 * S);
                    ctx.lineTo(mx0 + 8 * S, headY + 2.2 * S);
                    ctx.quadraticCurveTo(mx0 + 4 * S, headY + 6 * S, mx0, headY + 5.2 * S);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = 'rgba(120,50,0,0.6)';
                    ctx.beginPath(); ctx.arc(mx0 + 4 * S, headY - 0.6 * S, 0.6 * S, 0, 6.2832); ctx.fill();

                    ctx.restore();

                    // Hạt bụi / hiệu ứng nhảy (giữ nguyên logic cũ)
                    for (let p of this.trailParticles) {
                        const alpha = p.life / 0.6;
                        ctx.fillStyle = p.color.replace('0.7', String(alpha * 0.7))
                            .replace('0.8', String(alpha * 0.8))
                            .replace('0.9', String(alpha * 0.9));
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ==================== CLASS: OBSTACLE ====================
            class Obstacle {
                constructor(type, platform = null) {
                    this.type = type;
                    this.platform = platform;

                    // Set dimensions based on type
                    switch (type) {
                        case 'haystack':
                            this.width = 48 * CONSTANTS.SIZE_SCALE;
                            this.height = 40 * CONSTANTS.SIZE_SCALE;
                            break;
                        case 'crate':
                            this.width = 42 * CONSTANTS.SIZE_SCALE;
                            this.height = 88 * CONSTANTS.SIZE_SCALE;
                            break;
                        case 'crate_triple':
                            this.width = 42 * CONSTANTS.SIZE_SCALE;
                            this.height = 132 * CONSTANTS.SIZE_SCALE;
                            break;
                        case 'crate_triangle':
                            this.width = 70 * CONSTANTS.SIZE_SCALE;
                            this.height = 70 * CONSTANTS.SIZE_SCALE;
                            break;
                    }

                    this.x = platform ?
                        platform.x + platform.width + 20 * CONSTANTS.SIZE_SCALE :
                        canvasWidth + 50 * CONSTANTS.SIZE_SCALE;
                    this.y = platform ? platform.y - this.height : getGroundY() - this.height;
                    this.passed = false;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;

                    if (!this.platform) {
                        this.y = getGroundY() - this.height;
                    } else {
                        this.y = this.platform.y - this.height;
                    }
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionBox() {
                    const m = 5 * CONSTANTS.SIZE_SCALE;
                    return {
                        x: this.x + m,
                        y: this.y + m,
                        width: this.width - 2 * m,
                        height: this.height - 2 * m
                    };
                }

                draw(ctx) {
                    ctx.save();
                    if (this.type === 'haystack') {
                        this.drawHaystack(ctx, this.x, this.y);
                    } else if (this.type === 'crate' || this.type === 'crate_triple') {
                        this.drawCrateStack(ctx, this.x, this.y);
                    } else if (this.type === 'crate_triangle') {
                        this.drawCrateTriangle(ctx, this.x, this.y);
                    }
                    ctx.restore();
                }

                shadow(ctx, cx, y, rx) {
                    const S = CONSTANTS.SIZE_SCALE;
                    ctx.save();
                    ctx.translate(cx, y + 1 * S);
                    ctx.scale(1, 0.16);
                    const sg = ctx.createRadialGradient(0, 0, 1, 0, 0, rx);
                    sg.addColorStop(0, 'rgba(0,0,0,0.42)');
                    sg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = sg;
                    ctx.beginPath(); ctx.arc(0, 0, rx, 0, 6.2832); ctx.fill();
                    ctx.restore();
                }

                drawHaystack(ctx, x, y) {
                    const S = CONSTANTS.SIZE_SCALE;
                    const w = this.width, h = this.height, cx = x + w / 2;
                    if (!this._straw) {
                        const r = makeRng(Math.floor(Math.random() * 99999));
                        this._straw = [];
                        for (let i = 0; i < 70; i++) {
                            const fx = r(), fy = r();
                            this._straw.push({ fx, fy, len: 4 + r() * 7, tone: r(), lean: (fx - 0.5) * 0.9 });
                        }
                    }
                    this.shadow(ctx, cx, y + h, w * 0.7);

                    const body = () => {
                        ctx.beginPath();
                        ctx.moveTo(x - 1 * S, y + h);
                        ctx.bezierCurveTo(x - 2 * S, y + h * 0.5, cx - w * 0.2, y + h * 0.12, cx, y);
                        ctx.bezierCurveTo(cx + w * 0.2, y + h * 0.12, x + w + 2 * S, y + h * 0.5, x + w + 1 * S, y + h);
                        ctx.quadraticCurveTo(cx, y + h + 3 * S, x - 1 * S, y + h);
                        ctx.closePath();
                    };
                    const g = ctx.createLinearGradient(x, 0, x + w, 0);
                    g.addColorStop(0, '#F5D878'); g.addColorStop(0.45, '#DDB24B'); g.addColorStop(1, '#A6792A');
                    ctx.fillStyle = g;
                    body(); ctx.fill();

                    ctx.save();
                    body(); ctx.clip();
                    ctx.lineWidth = 0.9; ctx.lineCap = 'round';
                    for (const s of this._straw) {
                        const px = x + s.fx * w, py = y + h * 0.08 + s.fy * h * 0.92;
                        ctx.strokeStyle = s.tone < 0.35 ? 'rgba(255,236,150,0.85)' : s.tone < 0.7 ? 'rgba(200,152,50,0.75)' : 'rgba(120,82,24,0.6)';
                        ctx.beginPath();
                        ctx.moveTo(px, py);
                        ctx.lineTo(px + Math.sin(s.lean) * s.len * 0.5 - s.len * 0.3, py + s.len * 0.9);
                        ctx.stroke();
                    }
                    const vg = ctx.createLinearGradient(0, y, 0, y + h);
                    vg.addColorStop(0, 'rgba(255,250,200,0.28)');
                    vg.addColorStop(0.5, 'rgba(255,255,255,0)');
                    vg.addColorStop(1, 'rgba(60,35,5,0.4)');
                    ctx.fillStyle = vg;
                    ctx.fillRect(x - 3, y, w + 6, h + 4);
                    // Dây buộc rơm
                    ctx.strokeStyle = '#6E4F1A'; ctx.lineWidth = 1.8;
                    ctx.beginPath(); ctx.moveTo(x, y + h * 0.58); ctx.quadraticCurveTo(cx, y + h * 0.72, x + w, y + h * 0.58); ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,225,140,0.45)'; ctx.lineWidth = 0.8;
                    ctx.beginPath(); ctx.moveTo(x, y + h * 0.58 + 2); ctx.quadraticCurveTo(cx, y + h * 0.72 + 2, x + w, y + h * 0.58 + 2); ctx.stroke();
                    ctx.restore();

                    // Chóp rơm xù ở đỉnh
                    ctx.lineWidth = 1; ctx.lineCap = 'round';
                    for (let i = 0; i < 7; i++) {
                        ctx.strokeStyle = i % 2 ? '#E8C55A' : '#C9962F';
                        ctx.beginPath();
                        ctx.moveTo(cx + (i - 3) * 1.2 * S, y + 3 * S);
                        ctx.quadraticCurveTo(cx + (i - 3) * 2.4 * S, y - 3 * S, cx + (i - 3) * 3.2 * S, y - (3 + (i % 3)) * S);
                        ctx.stroke();
                    }
                }

                drawCrateStack(ctx, x, y) {
                    const S = CONSTANTS.SIZE_SCALE;
                    if (this._v === undefined) this._v = Math.floor(Math.random() * 3);
                    const layers = this.type === 'crate' ? 2 : 3;
                    const ch = this.height / layers;
                    this.shadow(ctx, x + this.width / 2, y + this.height, this.width * 0.75);
                    for (let i = layers - 1; i >= 0; i--) {
                        const off = (((i + this._v) % 3) - 1) * 0.7 * S;
                        drawCrate(ctx, x + off, y + i * ch, this.width, ch, i + this._v);
                    }
                }

                drawCrateTriangle(ctx, x, y) {
                    const S = CONSTANTS.SIZE_SCALE;
                    if (this._v === undefined) this._v = Math.floor(Math.random() * 3);
                    const bw = 28 * S, bh = 28 * S;
                    this.shadow(ctx, x + this.width / 2, y + this.height, this.width * 0.75);
                    drawCrate(ctx, x + 2 * S, y + this.height - bh, bw, bh, this._v);
                    drawCrate(ctx, x + this.width - bw - 2 * S, y + this.height - bh, bw, bh, this._v + 1);
                    drawCrate(ctx, x + this.width / 2 - bw / 2, y + this.height - bh * 2 + 2 * S, bw, bh, this._v + 2);
                }
            }

            // ==================== CLASS: HOLE ====================
            class Hole {
                constructor() {
                    this.isLarge = Math.random() < 0.35;

                    if (this.isLarge) {
                        this.width = (130 + Math.random() * 70) * CONSTANTS.SIZE_SCALE;
                    } else {
                        this.width = (90 + Math.random() * 50) * CONSTANTS.SIZE_SCALE;
                    }

                    // Occasionally create very wide holes
                    if (Math.random() < 0.2) {
                        this.width = 400 + Math.random() * 1600;
                    }

                    this.x = canvasWidth + 60 * CONSTANTS.SIZE_SCALE;
                    this.y = getGroundY();
                    this.depth = canvasHeight - getGroundY() + 15 * CONSTANTS.SIZE_SCALE;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;

                    this.y = getGroundY();
                    this.depth = canvasHeight - this.y + 15 * CONSTANTS.SIZE_SCALE;
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionZone() {
                    return {
                        x: this.x + 8 * CONSTANTS.SIZE_SCALE,
                        y: this.y,
                        width: this.width - 16 * CONSTANTS.SIZE_SCALE,
                        height: this.depth
                    };
                }

                drawWall(ctx, ex, y, ww, dir) {
                    const S = CONSTANTS.SIZE_SCALE;
                    const inner = ex + dir * ww, hw = 130 * S;
                    const x = Math.min(ex, inner);
                    const g = ctx.createLinearGradient(ex, 0, inner, 0);
                    g.addColorStop(0, dir > 0 ? '#8A5B30' : '#5E3B1D');
                    g.addColorStop(0.55, dir > 0 ? '#5E3B1D' : '#3E2411');
                    g.addColorStop(1, 'rgba(20,10,4,0)');
                    ctx.fillStyle = g;
                    ctx.fillRect(x, y - 2, ww, hw);
                    // Đá sỏi + rễ cây trên vách
                    for (let i = 0; i < 6; i++) {
                        const px = ex + dir * ww * (0.12 + hash01(this._seed + i * 3) * 0.6);
                        const py = y + (10 + hash01(this._seed + i * 7 + 1) * 90) * S;
                        const r = (1.4 + hash01(this._seed + i * 5 + 2) * 2.4) * S;
                        ctx.fillStyle = '#6f5c48';
                        ctx.beginPath(); ctx.ellipse(px, py, r * 1.2, r, 0, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = 'rgba(255,240,210,0.35)';
                        ctx.beginPath(); ctx.ellipse(px - r * 0.3, py - r * 0.3, r * 0.5, r * 0.35, 0, 0, 6.2832); ctx.fill();
                    }
                    ctx.strokeStyle = '#7b5a35'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(ex + dir * 1, y + 4 * S);
                    ctx.quadraticCurveTo(ex + dir * ww * 0.5, y + 14 * S, ex + dir * ww * 0.35, y + 30 * S);
                    ctx.stroke();
                    // Mờ dần vào bóng tối
                    const vg = ctx.createLinearGradient(0, y + hw * 0.25, 0, y + hw);
                    vg.addColorStop(0, 'rgba(12,6,2,0)');
                    vg.addColorStop(1, 'rgba(12,6,2,1)');
                    ctx.fillStyle = vg;
                    ctx.fillRect(x, y + hw * 0.25, ww, hw * 0.75);
                    // Cỏ rủ qua mép hố
                    ctx.strokeStyle = '#4FA044'; ctx.lineWidth = 1.6;
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.moveTo(ex - dir * i * 3 * S, y - 2);
                        ctx.quadraticCurveTo(ex + dir * (1 + i) * S, y - 3 * S, ex + dir * (4 + i * 2) * S, y + (5 + i * 1.5) * S);
                        ctx.stroke();
                    }
                }

                draw(ctx) {
                    const S = CONSTANTS.SIZE_SCALE;
                    if (this._seed === undefined) this._seed = Math.floor(Math.random() * 1000);
                    const y = this.y, W = canvasWidth, H = this.depth;
                    const x0 = Math.max(-2, this.x), x1 = Math.min(W + 2, this.x + this.width);
                    if (x1 <= x0) return;

                    let g = ctx.createLinearGradient(0, y, 0, y + H);
                    g.addColorStop(0, '#4a2f18'); g.addColorStop(0.12, '#2a180b'); g.addColorStop(0.45, '#0f0803'); g.addColorStop(1, '#000');
                    ctx.fillStyle = g;
                    ctx.fillRect(x0, y - 2, x1 - x0, H + 2);

                    // Các lớp đất ở vách sau
                    ctx.lineWidth = 1.2;
                    for (let i = 0; i < 3; i++) {
                        ctx.strokeStyle = `rgba(150,105,60,${0.22 - i * 0.06})`;
                        ctx.beginPath();
                        for (let x = x0; x <= x1 + 24; x += 24) {
                            const yy = y + (8 + i * 14) * S + Math.sin((x - this.x) * 0.05 + i * 2) * 2 * S;
                            if (x === x0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
                        }
                        ctx.stroke();
                    }
                    const sh = ctx.createLinearGradient(0, y, 0, y + 40 * S);
                    sh.addColorStop(0, 'rgba(0,0,0,0.6)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = sh;
                    ctx.fillRect(x0, y, x1 - x0, 40 * S);

                    const ww = Math.min(18 * S, this.width * 0.16);
                    if (this.x > -ww - 5) this.drawWall(ctx, this.x, y, ww, 1);
                    if (this.x + this.width < W + ww + 5) this.drawWall(ctx, this.x + this.width, y, ww, -1);

                    // Mép sau của hố có cỏ
                    ctx.fillStyle = '#7A5A32';
                    ctx.fillRect(x0, y - 3, x1 - x0, 4);
                    ctx.lineWidth = 1.3; ctx.lineCap = 'round';
                    const step = 7 * S;
                    for (let k = Math.ceil((x0 - this.x) / step); this.x + k * step <= x1; k++) {
                        const gx = this.x + k * step, gh = (3 + hash01(k + this._seed) * 4) * S;
                        ctx.strokeStyle = k % 2 ? '#5DB050' : '#3F8F3A';
                        ctx.beginPath();
                        ctx.moveTo(gx, y - 2);
                        ctx.quadraticCurveTo(gx + 1, y - gh * 0.6, gx + 2, y - gh);
                        ctx.stroke();
                    }
                }
            }

            // ==================== CLASS: SPIKE ====================
            class Spike {
                constructor() {
                    this.x = canvasWidth + 30 * CONSTANTS.SIZE_SCALE;
                    this.y = getGroundY();
                    this.width = 34 * CONSTANTS.SIZE_SCALE;
                    this.height = 22 * CONSTANTS.SIZE_SCALE;
                    this.passed = false;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;
                    this.y = getGroundY();
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionBox() {
                    return {
                        x: this.x - 2 * CONSTANTS.SIZE_SCALE,
                        y: this.y - this.height,
                        width: this.width + 4 * CONSTANTS.SIZE_SCALE,
                        height: this.height
                    };
                }

                draw(ctx) {
                    const S = CONSTANTS.SIZE_SCALE;
                    const x = this.x, y = this.y, w = this.width, h = this.height;
                    ctx.save();
                    ctx.translate(x + w / 2, y + 3 * S);
                    ctx.scale(1, 0.16);
                    const sg = ctx.createRadialGradient(0, 0, 1, 0, 0, w * 0.7);
                    sg.addColorStop(0, 'rgba(0,0,0,0.45)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = sg;
                    ctx.beginPath(); ctx.arc(0, 0, w * 0.7, 0, 6.2832); ctx.fill();
                    ctx.restore();

                    // Đế gỗ + đinh tán
                    const bg = ctx.createLinearGradient(0, y - 1 * S, 0, y + 6 * S);
                    bg.addColorStop(0, '#8B6238'); bg.addColorStop(1, '#4E3320');
                    ctx.fillStyle = bg;
                    ctx.fillRect(x - 2 * S, y - 1 * S, w + 4 * S, 6 * S);
                    ctx.fillStyle = 'rgba(255,225,170,0.3)';
                    ctx.fillRect(x - 2 * S, y - 1 * S, w + 4 * S, 1);
                    ctx.strokeStyle = 'rgba(30,15,5,0.4)'; ctx.lineWidth = 0.7;
                    ctx.beginPath(); ctx.moveTo(x, y + 2 * S); ctx.lineTo(x + w, y + 2 * S + 0.6); ctx.stroke();
                    for (const rx of [x - 0.5 * S, x + w + 0.5 * S]) {
                        ctx.fillStyle = '#2b2b2b';
                        ctx.beginPath(); ctx.arc(rx, y + 2 * S, 1 * S, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = '#9a9a9a';
                        ctx.beginPath(); ctx.arc(rx - 0.3, y + 1.6 * S, 0.4, 0, 6.2832); ctx.fill();
                    }

                    // Gai thép hai mặt sáng/tối
                    const n = 5, sw = w / n, tipY = y - h, baseY = y - 1 * S;
                    const gL = ctx.createLinearGradient(0, tipY, 0, baseY);
                    gL.addColorStop(0, '#F4F7F9'); gL.addColorStop(0.5, '#AAB6BE'); gL.addColorStop(1, '#6C777F');
                    const gR = ctx.createLinearGradient(0, tipY, 0, baseY);
                    gR.addColorStop(0, '#B6C1C8'); gR.addColorStop(0.5, '#6E7A82'); gR.addColorStop(1, '#3E474E');
                    ctx.lineJoin = 'round';
                    for (let i = 0; i < n; i++) {
                        const sx = x + i * sw, tx = sx + sw / 2;
                        ctx.fillStyle = gL;
                        ctx.beginPath(); ctx.moveTo(sx, baseY); ctx.lineTo(tx, tipY); ctx.lineTo(tx, baseY); ctx.closePath(); ctx.fill();
                        ctx.fillStyle = gR;
                        ctx.beginPath(); ctx.moveTo(tx, tipY); ctx.lineTo(sx + sw, baseY); ctx.lineTo(tx, baseY); ctx.closePath(); ctx.fill();
                        ctx.strokeStyle = '#2f363b'; ctx.lineWidth = 0.8;
                        ctx.beginPath(); ctx.moveTo(sx, baseY); ctx.lineTo(tx, tipY); ctx.lineTo(sx + sw, baseY); ctx.stroke();
                        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 0.9;
                        ctx.beginPath(); ctx.moveTo(tx - 0.4, tipY + 1.5); ctx.lineTo(tx - 0.9, tipY + h * 0.45); ctx.stroke();
                    }
                }
            }

            // ==================== CLASS: PLATFORM ====================
            class Platform {
                constructor(x, y, width) {
                    this.width = width || (120 + Math.random() * 100) * CONSTANTS.SIZE_SCALE;
                    this.height = 15 * CONSTANTS.SIZE_SCALE;
                    this.x = x || canvasWidth + 30 * CONSTANTS.SIZE_SCALE;
                    this.y = y || getGroundY() - 80 * CONSTANTS.SIZE_SCALE - Math.random() * 50 * CONSTANTS.SIZE_SCALE;

                    this.heightAboveGround = getGroundY() - this.y;
                    this.active = true;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;
                    this.y = getGroundY() - this.heightAboveGround;
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                draw(ctx) {
                    const S = CONSTANTS.SIZE_SCALE;
                    const x = this.x, y = this.y, w = this.width, h = this.height;
                    if (this._s === undefined) this._s = Math.floor(Math.random() * 997);
                    const gyy = getGroundY();
                    if (gyy - y > 10 && !isOverHole(x + w / 2, 2)) {
                        ctx.save();
                        ctx.translate(x + w / 2, gyy + 2);
                        ctx.scale(1, 0.12);
                        const sg = ctx.createRadialGradient(0, 0, 1, 0, 0, w * 0.55);
                        sg.addColorStop(0, 'rgba(0,0,0,0.3)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = sg;
                        ctx.beginPath(); ctx.arc(0, 0, w * 0.55, 0, 6.2832); ctx.fill();
                        ctx.restore();
                    }

                    // Dây leo rủ bên dưới
                    ctx.strokeStyle = '#4a7a35'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
                    for (let k = 0; k < 3; k++) {
                        const vx = x + w * [0.2, 0.55, 0.82][k], len = (8 + hash01(this._s + k) * 9) * S;
                        const sway = Math.sin(frameCount * 0.05 + k * 1.7) * 2;
                        ctx.beginPath();
                        ctx.moveTo(vx, y + h - 1);
                        ctx.quadraticCurveTo(vx + sway, y + h + len * 0.5, vx + sway * 1.5, y + h + len);
                        ctx.stroke();
                        ctx.fillStyle = '#5d9a40';
                        ctx.beginPath(); ctx.ellipse(vx + sway * 1.5, y + h + len, 2.2, 1.2, 0.6, 0, 6.2832); ctx.fill();
                    }

                    const g = ctx.createLinearGradient(0, y, 0, y + h);
                    g.addColorStop(0, '#A9743C'); g.addColorStop(0.35, '#8B5A2B'); g.addColorStop(1, '#4F311A');
                    ctx.fillStyle = g;
                    ctx.beginPath(); ctx.roundRect(x, y, w, h, 2 * S); ctx.fill();

                    const pw = 34 * S;
                    for (let px = x + pw; px < x + w - 4; px += pw) {
                        ctx.fillStyle = 'rgba(25,12,4,0.55)';
                        ctx.fillRect(px, y + 1, 1.2, h - 1);
                        ctx.fillStyle = '#2f2a26';
                        ctx.beginPath(); ctx.arc(px - 3 * S, y + h * 0.5, 0.9, 0, 6.2832); ctx.fill();
                        ctx.beginPath(); ctx.arc(px + 4 * S, y + h * 0.5, 0.9, 0, 6.2832); ctx.fill();
                    }
                    ctx.strokeStyle = 'rgba(50,25,8,0.3)'; ctx.lineWidth = 0.7;
                    ctx.beginPath();
                    ctx.moveTo(x + 3, y + h * 0.45); ctx.quadraticCurveTo(x + w * 0.5, y + h * 0.3, x + w - 3, y + h * 0.55);
                    ctx.moveTo(x + 3, y + h * 0.75); ctx.quadraticCurveTo(x + w * 0.5, y + h * 0.65, x + w - 3, y + h * 0.8);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,225,170,0.35)';
                    ctx.fillRect(x + 1, y + 1, w - 2, 1);

                    // Lớp cỏ / rêu phủ mặt trên
                    const cg = ctx.createLinearGradient(0, y - 3 * S, 0, y + 2 * S);
                    cg.addColorStop(0, '#7CCB57'); cg.addColorStop(1, '#3F8F3A');
                    ctx.fillStyle = cg;
                    ctx.beginPath(); ctx.roundRect(x - 1, y - 3 * S, w + 2, 5 * S, 2 * S); ctx.fill();
                    ctx.lineWidth = 1.2;
                    for (let k = 0; k * 5 * S < w; k++) {
                        const gx = x + k * 5 * S + 1, gh = (3 + hash01(k + this._s) * 4) * S;
                        ctx.strokeStyle = k % 2 ? '#5DB050' : '#3F8F3A';
                        ctx.beginPath();
                        ctx.moveTo(gx, y - 2 * S);
                        ctx.quadraticCurveTo(gx + 1, y - 2 * S - gh * 0.6, gx + 2, y - 2 * S - gh);
                        ctx.stroke();
                    }
                }
            }

            // ==================== CLASS: ITEM ====================
            class Item {
                constructor(type) {
                    this.type = type;
                    this.width = 24 * CONSTANTS.SIZE_SCALE;
                    this.height = 24 * CONSTANTS.SIZE_SCALE;
                    this.x = canvasWidth + 30 * CONSTANTS.SIZE_SCALE;
                    this.heightAboveGround =
                        this.height +
                        5 * CONSTANTS.SIZE_SCALE +
                        Math.random() * 25 * CONSTANTS.SIZE_SCALE;

                    this.y = getGroundY() - this.heightAboveGround;
                    this.collected = false;
                    this.bobOffset = 0;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;

                    this.y = getGroundY() - this.heightAboveGround;

                    this.bobOffset =
                        Math.sin(frameCount * 0.06 + this.x * 0.01) *
                        2 * CONSTANTS.SIZE_SCALE;
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionBox() {
                    return {
                        x: this.x,
                        y: this.y + this.bobOffset,
                        width: this.width,
                        height: this.height
                    };
                }

                draw(ctx) {
                    const S = CONSTANTS.SIZE_SCALE;
                    const y = this.y + this.bobOffset;
                    const cx = this.x + this.width / 2, cy = y + this.height / 2;
                    const r = this.width * 0.5;
                    const col = this.type === 'gold' ? '255,210,80' : this.type === 'stamina' ? '0,229,255' : '128,216,255';
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.scale(1.3, 1.3);   // chỉ phóng to hình vẽ, hitbox giữ nguyên

                    const gg = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2);
                    gg.addColorStop(0, `rgba(${col},0.35)`); gg.addColorStop(1, `rgba(${col},0)`);
                    ctx.fillStyle = gg;
                    ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, 6.2832); ctx.fill();

                    if (this.type === 'gold') {
                        const sx = Math.max(0.18, Math.abs(Math.cos(frameCount * 0.07 + this.x * 0.02)));
                        ctx.save();
                        ctx.scale(sx, 1);
                        const rim = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
                        rim.addColorStop(0, '#FFF3B0'); rim.addColorStop(0.5, '#FFD23F'); rim.addColorStop(1, '#B8830A');
                        ctx.fillStyle = rim;
                        ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
                        ctx.strokeStyle = '#8A5A00'; ctx.lineWidth = 0.9; ctx.stroke();
                        const face = ctx.createLinearGradient(-r, -r, r, r);
                        face.addColorStop(0, '#E8A800'); face.addColorStop(1, '#FFDC55');
                        ctx.fillStyle = face;
                        ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, 6.2832); ctx.fill();
                        ctx.strokeStyle = '#A66F00'; ctx.lineWidth = 0.7; ctx.stroke();
                        ctx.fillStyle = '#FFF0A0';
                        ctx.beginPath();
                        for (let i = 0; i < 10; i++) {
                            const rr = i % 2 ? r * 0.16 : r * 0.38, a = -Math.PI / 2 + i * Math.PI / 5;
                            ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
                        }
                        ctx.closePath(); ctx.fill();
                        ctx.strokeStyle = '#B07800'; ctx.lineWidth = 0.5; ctx.stroke();
                        ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.2;
                        ctx.beginPath(); ctx.arc(0, 0, r * 0.86, -2.5, -1.3); ctx.stroke();
                        ctx.restore();
                        const tw = Math.max(0, Math.sin(frameCount * 0.05 + this.x * 0.03));
                        if (tw > 0.2) {
                            ctx.strokeStyle = `rgba(255,255,255,${tw})`; ctx.lineWidth = 1;
                            const k = r * 0.5 * tw;
                            ctx.beginPath();
                            ctx.moveTo(r * 0.55 - k, -r * 0.65); ctx.lineTo(r * 0.55 + k, -r * 0.65);
                            ctx.moveTo(r * 0.55, -r * 0.65 - k); ctx.lineTo(r * 0.55, -r * 0.65 + k);
                            ctx.stroke();
                        }
                    } else if (this.type === 'stamina') {
                        // Bình năng lượng bằng thủy tinh
                        ctx.fillStyle = '#B5835A';
                        ctx.beginPath(); ctx.roundRect(-r * 0.24, -r * 1.05, r * 0.48, r * 0.3, 1); ctx.fill();
                        ctx.fillStyle = 'rgba(220,240,250,0.85)';
                        ctx.fillRect(-r * 0.2, -r * 0.78, r * 0.4, r * 0.4);
                        const lq = ctx.createLinearGradient(0, -r * 0.3, 0, r);
                        lq.addColorStop(0, '#7DF3FF'); lq.addColorStop(1, '#0091EA');
                        ctx.fillStyle = 'rgba(200,235,250,0.55)';
                        ctx.beginPath(); ctx.arc(0, r * 0.22, r * 0.78, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = lq;
                        ctx.beginPath(); ctx.arc(0, r * 0.22, r * 0.68, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.moveTo(r * 0.12, -r * 0.3); ctx.lineTo(-r * 0.3, r * 0.3); ctx.lineTo(-r * 0.02, r * 0.3);
                        ctx.lineTo(-r * 0.14, r * 0.78); ctx.lineTo(r * 0.32, r * 0.1); ctx.lineTo(r * 0.04, r * 0.1);
                        ctx.closePath(); ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.arc(0, r * 0.22, r * 0.78, 3.4, 4.5); ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,255,0.7)';
                        ctx.beginPath(); ctx.arc(r * 0.35, r * 0.55, 0.9, 0, 6.2832); ctx.fill();
                    } else if (this.type === 'shield') {
                        const shape = () => {
                            ctx.beginPath();
                            ctx.moveTo(0, -r); ctx.lineTo(r * 0.85, -r * 0.62); ctx.lineTo(r * 0.85, r * 0.1);
                            ctx.quadraticCurveTo(r * 0.8, r * 0.7, 0, r * 1.05);
                            ctx.quadraticCurveTo(-r * 0.8, r * 0.7, -r * 0.85, r * 0.1);
                            ctx.lineTo(-r * 0.85, -r * 0.62);
                            ctx.closePath();
                        };
                        const sgd = ctx.createLinearGradient(0, -r, 0, r);
                        sgd.addColorStop(0, '#7FDBFF'); sgd.addColorStop(1, '#1E6FD0');
                        ctx.fillStyle = sgd; shape(); ctx.fill();
                        ctx.save(); shape(); ctx.clip();
                        ctx.fillStyle = 'rgba(255,255,255,0.28)';
                        ctx.fillRect(-r, -r, r, r * 2.2);
                        ctx.restore();
                        ctx.strokeStyle = '#F2C230'; ctx.lineWidth = 1.6; shape(); ctx.stroke();
                        ctx.fillStyle = '#FFE066';
                        ctx.beginPath();
                        for (let i = 0; i < 10; i++) {
                            const rr = i % 2 ? r * 0.16 : r * 0.4, a = -Math.PI / 2 + i * Math.PI / 5;
                            ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 1.05 + r * 0.05);
                        }
                        ctx.closePath(); ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // ==================== CLASS: EAGLE ====================
            class Eagle {
                constructor() {
                    this.width = 70 * CONSTANTS.SIZE_SCALE;
                    this.height = 50 * CONSTANTS.SIZE_SCALE;
                    this.x = canvasWidth + 200 * CONSTANTS.SIZE_SCALE;
                    this.y = getGroundY() * (0.15 + Math.random() * 0.5);
                    this.speed = gameSpeed * 2.8;
                    this.passed = false;
                    this.warning = 3.0; // Warning time before attack
                    this.active = false;
                }

                update(dt) {
                    if (this.warning > 0) {
                        this.warning -= dt;
                        this.x -= gameSpeed * 0.3 * dt;
                    } else {
                        this.active = true;
                        this.x -= this.speed * dt;
                    }
                }

                isOffScreen() {
                    return this.x < -this.width - 30 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionBox() {
                    return {
                        x: this.x + 10 * CONSTANTS.SIZE_SCALE,
                        y: this.y + 5 * CONSTANTS.SIZE_SCALE,
                        width: this.width - 20 * CONSTANTS.SIZE_SCALE,
                        height: this.height - 10 * CONSTANTS.SIZE_SCALE
                    };
                }

                wing(ctx, sx, sy, ang, u, dark) {
                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(ang);
                    ctx.scale(u, u);
                    const tips = [[3, -41], [9, -38], [14, -32], [18, -25], [20, -17], [18, -9], [13, -3]];
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-9, -10, -9, -28, -4, -42);
                    for (let i = 0; i < tips.length; i++) {
                        ctx.lineTo(tips[i][0], tips[i][1]);
                        if (i < tips.length - 1) {
                            ctx.lineTo((tips[i][0] + tips[i + 1][0]) / 2 - 3.2, (tips[i][1] + tips[i + 1][1]) / 2 + 1.5);
                        }
                    }
                    ctx.lineTo(6, 0);
                    ctx.closePath();
                    const g = ctx.createLinearGradient(-8, 0, 16, -30);
                    g.addColorStop(0, dark ? '#2A180C' : '#4A2F1B');
                    g.addColorStop(1, dark ? '#1B0F07' : '#2E1B10');
                    ctx.fillStyle = g; ctx.fill();
                    ctx.strokeStyle = 'rgba(15,8,3,0.8)'; ctx.lineWidth = 0.9; ctx.stroke();
                    ctx.fillStyle = dark ? 'rgba(110,75,45,0.35)' : 'rgba(150,105,65,0.5)';
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.bezierCurveTo(-7, -8, -6, -18, -3, -22);
                    ctx.quadraticCurveTo(8, -20, 11, -8); ctx.lineTo(5, 0);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    for (const t of tips) { ctx.moveTo(1, -6); ctx.lineTo(t[0] - 1, t[1] + 2); }
                    ctx.stroke();
                    ctx.restore();
                }

                draw(ctx) {
                    const S = CONSTANTS.SIZE_SCALE;
                    const w = this.width, h = this.height;
                    const t = frameCount * (this.active ? 0.34 : 0.2);
                    const flap = Math.sin(t);
                    const cx = this.x + w * 0.55, cy = this.y + h * 0.5 - flap * 1.5 * S;

                    // Bóng của đại bàng trên mặt đất
                    const gyy = getGroundY();
                    if (!isOverHole(cx, 2)) {
                        ctx.save();
                        ctx.translate(cx, gyy + 2);
                        ctx.scale(1, 0.12);
                        const sg = ctx.createRadialGradient(0, 0, 1, 0, 0, w * 0.6);
                        sg.addColorStop(0, 'rgba(0,0,0,0.22)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = sg;
                        ctx.beginPath(); ctx.arc(0, 0, w * 0.6, 0, 6.2832); ctx.fill();
                        ctx.restore();
                    }

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.scale(S, S);
                    ctx.rotate(this.active ? 0.06 : 0);
                    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

                    const A = flap * 1.1 + 0.7;
                    this.wing(ctx, -3, -4, A - 0.35, 0.85, true);   // cánh xa

                    // Đuôi trắng
                    const tg = ctx.createLinearGradient(10, 0, 32, 0);
                    tg.addColorStop(0, '#F4F1EA'); tg.addColorStop(1, '#D2CEC2');
                    ctx.fillStyle = tg;
                    ctx.beginPath();
                    ctx.moveTo(10, -3); ctx.lineTo(30, -8); ctx.lineTo(33, -2); ctx.lineTo(33, 3); ctx.lineTo(30, 8); ctx.lineTo(10, 3);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = 'rgba(120,115,100,0.55)'; ctx.lineWidth = 0.7;
                    ctx.beginPath();
                    ctx.moveTo(12, -1); ctx.lineTo(32, -5); ctx.moveTo(12, 0); ctx.lineTo(33, 0); ctx.moveTo(12, 1); ctx.lineTo(32, 5);
                    ctx.stroke();

                    // Chân + móng vuốt
                    ctx.strokeStyle = '#F2C230'; ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(2, 6); ctx.lineTo(-1, 13); ctx.moveTo(6, 6); ctx.lineTo(4, 13);
                    ctx.stroke();
                    ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(-1, 13); ctx.lineTo(-4, 15); ctx.moveTo(-1, 13); ctx.lineTo(0, 16);
                    ctx.moveTo(4, 13); ctx.lineTo(1, 15); ctx.moveTo(4, 13); ctx.lineTo(5, 16);
                    ctx.stroke();

                    // Thân nâu sẫm
                    const bg = ctx.createLinearGradient(0, -9, 0, 9);
                    bg.addColorStop(0, '#6A4528'); bg.addColorStop(1, '#2B190E');
                    ctx.fillStyle = bg;
                    ctx.beginPath(); ctx.ellipse(-2, 0, 22, 8.5, 0.05, 0, 6.2832); ctx.fill();
                    ctx.fillStyle = '#7A5230';
                    ctx.beginPath(); ctx.ellipse(5, 5, 6, 3.8, 0, 0, 6.2832); ctx.fill();
                    ctx.strokeStyle = 'rgba(160,115,70,0.45)'; ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) { ctx.moveTo(-14 + i * 5, -2); ctx.quadraticCurveTo(-12 + i * 5, 1, -14 + i * 5, 4); }
                    ctx.stroke();

                    // Cổ + đầu trắng
                    const hg = ctx.createRadialGradient(-23, -6, 1, -22, -3, 9);
                    hg.addColorStop(0, '#FFFFFF'); hg.addColorStop(1, '#DAD5C8');
                    ctx.fillStyle = hg;
                    ctx.beginPath(); ctx.ellipse(-16, -2, 8, 7, 0, 0, 6.2832); ctx.fill();
                    ctx.beginPath(); ctx.arc(-22, -3, 7.5, 0, 6.2832); ctx.fill();

                    // Mỏ khoằm vàng
                    const kg = ctx.createLinearGradient(0, -7, 0, 3);
                    kg.addColorStop(0, '#FFD54A'); kg.addColorStop(1, '#E3A20F');
                    ctx.fillStyle = kg;
                    ctx.beginPath();
                    ctx.moveTo(-27.5, -5.5);
                    ctx.bezierCurveTo(-34, -7, -38.5, -3, -37.5, 2.5);
                    ctx.lineTo(-36, 1);
                    ctx.bezierCurveTo(-34, -0.5, -31, 0.8, -28, 1.5);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = '#B47A0A'; ctx.lineWidth = 0.7; ctx.stroke();
                    ctx.fillStyle = '#7a5208';
                    ctx.beginPath(); ctx.arc(-30.5, -3.6, 0.7, 0, 6.2832); ctx.fill();

                    // Mắt dữ + lông mày
                    ctx.fillStyle = '#FFD23F';
                    ctx.beginPath(); ctx.arc(-24, -5, 2.3, 0, 6.2832); ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(-24.4, -5, 1.15, 0, 6.2832); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(-24.9, -5.5, 0.4, 0, 6.2832); ctx.fill();
                    ctx.strokeStyle = '#8a7756'; ctx.lineWidth = 1.7;
                    ctx.beginPath(); ctx.moveTo(-20.5, -9.2); ctx.lineTo(-27, -6.6); ctx.stroke();

                    this.wing(ctx, -2, -3, A, 1, false);   // cánh gần
                    ctx.restore();
                }
            }

            function getSkyState() {
                const total = DAY_DURATION + TRANSITION_TIME;
                const cycle = total * 4;

                let t = ((dayTimer % cycle) + cycle) % cycle;

                const skies = [
                    {
                        top:"#FDBA74",
                        mid:"#FDE68A",
                        bottom:"#FFF7D6",
                        sun:"#FFD54F",
                        sunY:0.22,
                        stars:false,
                        moon:false
                    },
                    {
                        top:"#7EC8E3",
                        mid:"#A8D8EA",
                        bottom:"#DAF0F7",
                        sun:"#FFD54F",
                        sunY:0.12,
                        stars:false,
                        moon:false
                    },
                    {
                        top:"#FF8A65",
                        mid:"#F48FB1",
                        bottom:"#9575CD",
                        sun:"#FFB74D",
                        sunY:0.28,
                        stars:false,
                        moon:false
                    },
                    {
                        top:"#08142E",
                        mid:"#13294B",
                        bottom:"#223B63",
                        sun:"#FFFFFF",
                        sunY:0.15,
                        stars:true,
                        moon:true
                    }
                ];

                const DK = [0, 0, 0.22, 1], WM = [0.16, 0, 0.2, 0];
                skies.forEach((s, i) => { s.dark = DK[i]; s.warm = WM[i]; });

                let phase = Math.floor(t / total);

                let local = t % total;

                if(local < DAY_DURATION){
                    return skies[phase];
                }

                let next = (phase + 1) % 4;

                let p = (local - DAY_DURATION) / TRANSITION_TIME;

                const lerpColor = (a,b)=>{
                    const ca=parseInt(a.slice(1),16);
                    const cb=parseInt(b.slice(1),16);

                    const ar=(ca>>16)&255;
                    const ag=(ca>>8)&255;
                    const ab=ca&255;

                    const br=(cb>>16)&255;
                    const bg=(cb>>8)&255;
                    const bb=cb&255;

                    const r=Math.round(ar+(br-ar)*p);
                    const g=Math.round(ag+(bg-ag)*p);
                    const bl=Math.round(ab+(bb-ab)*p);

                    return `rgb(${r},${g},${bl})`;
                };

                return {
                    top:lerpColor(skies[phase].top,skies[next].top),
                    mid:lerpColor(skies[phase].mid,skies[next].mid),
                    bottom:lerpColor(skies[phase].bottom,skies[next].bottom),
                    sun:lerpColor(skies[phase].sun,skies[next].sun),
                    sunY: skies[phase].sunY + (skies[next].sunY - skies[phase].sunY) * p,
                    stars: p > 0.5 ? skies[next].stars : skies[phase].stars,
                    moon: p > 0.5 ? skies[next].moon : skies[phase].moon,
                    dark: skies[phase].dark + (skies[next].dark - skies[phase].dark) * p,
                    warm: skies[phase].warm + (skies[next].warm - skies[phase].warm) * p
                };
            }
