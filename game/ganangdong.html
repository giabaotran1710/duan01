            // ==================== CLASS: BACKGROUND MANAGER (làng quê) ====================
            class BackgroundManager {
                constructor() {
                    this.dist = 0;
                    this._sky = null;
                    this.init();
                }

                init() {
                    const rng = makeRng(20260630);
                    const W = canvasWidth, S = CONSTANTS.BG_SCALE;
                    this.bandH = 30 * S;

                    // Các lớp núi đồi (hàm tuần hoàn để cuộn liền mạch)
                    const P = Math.max(W * 1.7, 1100);
                    const ridged = (u, k, ph) => 1 - Math.abs(Math.sin(Math.PI * (k * u + ph)));
                    const sm = (u, k, ph) => Math.sin(2 * Math.PI * (k * u + ph));
                    this.ridges = [
                        { P, par: 0.025, amp: 0.42, haze: 0.72, col: '#8FA6C4', fn: u => 0.6 * ridged(u, 2, 0.3) + 0.3 * ridged(u, 5, 0.1) + 0.1 * ridged(u, 11, 0.6) },
                        { P, par: 0.05, amp: 0.34, haze: 0.58, col: '#6F8DB0', fn: u => 0.55 * ridged(u, 3, 0.1) + 0.30 * ridged(u, 7, 0.4) + 0.15 * ridged(u, 13, 0.7) },
                        { P, par: 0.10, amp: 0.20, haze: 0.42, col: '#5E8C86', fn: u => 0.5 + 0.3 * sm(u, 2, 0.2) + 0.2 * sm(u, 5, 0.6) },
                        { P, par: 0.18, amp: 0.09, haze: 0.26, col: '#3F7A45', step: 5, fn: u => 0.5 + 0.28 * sm(u, 3, 0.1) + 0.12 * sm(u, 8, 0.5) + 0.10 * sm(u, 37, 0.3) + 0.06 * sm(u, 61, 0.8) }
                    ];

                    // Sao
                    this.stars = [];
                    for (let i = 0; i < 90; i++) this.stars.push({ x: rng() * W, y: rng() * groundY * 0.85, r: 0.6 + rng() * 1.3, ph: rng() * 6.28 });

                    // Mây (sprite vẽ sẵn)
                    this.cloudSprites = [];
                    for (let v = 0; v < 4; v++) {
                        this.cloudSprites.push(makeSprite(220, 100, (g, w, h) => {
                            const r2 = makeRng(v * 77 + 3), base = h * 0.78, n = 90;
                            const lobes = [0.2 + r2() * 0.1, 0.5 + r2() * 0.1, 0.75 + r2() * 0.08];
                            const env = f => { let e = 0.16; for (const c of lobes) e = Math.max(e, 1 - Math.abs(f - c) * 3.2); return e; };
                            for (let i = 0; i < n; i++) {
                                const f = 0.14 + r2() * 0.72, top = base - env(f) * h * 0.46;
                                const py = top + Math.pow(r2(), 0.7) * (base - top), px = w * f;
                                const r = h * (0.09 + r2() * 0.09) * (0.75 + env(f) * 0.5);
                                const t = Math.min(1, Math.max(0, (py - (base - h * 0.46)) / (h * 0.46)));
                                const col = mixColor('#FFFFFF', '#D3DFEF', Math.pow(t, 1.6) * 0.85);
                                const [cr, cg, cb] = parseRGB(col);
                                const gr = g.createRadialGradient(px, py, 0, px, py, r);
                                gr.addColorStop(0, `rgba(${cr|0},${cg|0},${cb|0},1)`);
                                gr.addColorStop(0.6, `rgba(${cr|0},${cg|0},${cb|0},0.85)`);
                                gr.addColorStop(1, `rgba(${cr|0},${cg|0},${cb|0},0)`);
                                g.fillStyle = gr;
                                g.beginPath(); g.arc(px, py, r, 0, 6.2832); g.fill();
                            }
                        }));
                    }
                    this.clouds = [];
                    for (let i = 0; i < Math.floor(W / 250) + 4; i++) {
                        const dw = (110 + rng() * 150) * S;
                        this.clouds.push({
                            x: rng() * W, y: 25 + rng() * (canvasHeight * 0.3), w: dw, h: dw * 100 / 220,
                            spr: this.cloudSprites[Math.floor(rng() * 4)], opacity: 0.6 + rng() * 0.4, speed: 8 + rng() * 22
                        });
                    }

                    // Cây (sprite): cây lá rộng + cây dừa, lớp xa hơi nhạt màu
                    this.treeSprites = { near: [], far: [] };
                    for (const layer of ['near', 'far']) {
                        const haze = layer === 'near' ? 0 : 0.42;
                        for (let v = 0; v < 3; v++) this.treeSprites[layer].push(this.makeBroadleaf(rng, haze));
                        for (let v = 0; v < 2; v++) this.treeSprites[layer].push(this.makePalm(rng, haze));
                    }
                    this.trees = [];
                    for (const d of [{ layer: 'far', scale: 0.42, gap: 170, par: 0.2 }, { layer: 'near', scale: 0.72, gap: 230, par: 0.36 }]) {
                        const n = Math.floor(W / d.gap) + 3, arr = this.treeSprites[d.layer];
                        for (let i = 0; i < n; i++) {
                            this.trees.push({
                                layer: d.layer, spr: arr[Math.floor(rng() * arr.length)], x: i * d.gap + rng() * d.gap * 0.6,
                                scale: d.scale * (0.85 + rng() * 0.3), par: d.par, span: n * d.gap + d.gap * 0.4,
                                flip: rng() < 0.5, sway: rng() * 6.28
                            });
                        }
                    }

                    // Bụi cây + hoa
                    this.bushSprites = [];
                    for (let v = 0; v < 3; v++) this.bushSprites.push(this.makeBush(rng));
                    this.bushes = [];
                    for (let i = 0; i < Math.floor(W / 100) + 5; i++) {
                        const dw = (46 + rng() * 44) * S;
                        this.bushes.push({ x: i * 90 + rng() * 50, w: dw, spr: this.bushSprites[Math.floor(rng() * 3)], span: (Math.floor(W / 100) + 5) * 90 + 60 });
                    }
                    this.flowers = [];
                    const fc = ['#FFFFFF', '#FFD93D', '#FF7C8A', '#FF5A5A', '#C9A7FF'];
                    for (let i = 0; i < Math.floor(W / 130) + 5; i++) {
                        this.flowers.push({ x: i * 110 + rng() * 80, col: fc[Math.floor(rng() * fc.length)], size: (3 + rng() * 3) * S, h: (7 + rng() * 8) * S, sway: rng() * 6.28, span: (Math.floor(W / 130) + 5) * 110 + 80 });
                    }

                    // Sỏi trên đường đất
                    this.roadP = W + 300;
                    this.pebbles = [];
                    for (let i = 0; i < 90; i++) {
                        const tone = rng();
                        this.pebbles.push({
                            x: rng() * this.roadP, d: Math.pow(rng(), 0.85), s: rng(),
                            col: mixColor('#6E5030', '#C9AE7C', tone), hi: mixColor('#A88C5C', '#F1E0B8', tone)
                        });
                    }
                }

                makeBroadleaf(rng, haze) {
                    return makeSprite(150, 235, (g, w, h) => {
                        const mc = c => haze ? mixColor(c, '#A9C4C2', haze) : c;
                        const bx = w / 2, base = h - 3, trunkH = h * 0.44;
                        const tg = g.createLinearGradient(bx - 12, 0, bx + 12, 0);
                        tg.addColorStop(0, mc('#4A2C15')); tg.addColorStop(0.55, mc('#8A5A30')); tg.addColorStop(1, mc('#5A3618'));
                        g.fillStyle = tg;
                        g.beginPath();
                        g.moveTo(bx - 13, base);
                        g.quadraticCurveTo(bx - 7, base - 12, bx - 6, base - trunkH * 0.5);
                        g.quadraticCurveTo(bx - 5, base - trunkH * 0.9, bx - 3, base - trunkH);
                        g.lineTo(bx + 3, base - trunkH);
                        g.quadraticCurveTo(bx + 5, base - trunkH * 0.9, bx + 6, base - trunkH * 0.5);
                        g.quadraticCurveTo(bx + 7, base - 12, bx + 13, base);
                        g.closePath(); g.fill();
                        g.strokeStyle = 'rgba(30,15,5,0.35)'; g.lineWidth = 1;
                        for (let i = 0; i < 6; i++) {
                            const ox = -4 + i * 1.6;
                            g.beginPath(); g.moveTo(bx + ox, base - 4);
                            g.quadraticCurveTo(bx + ox + (rng() - 0.5) * 4, base - trunkH * 0.5, bx + ox * 0.7, base - trunkH + 4);
                            g.stroke();
                        }
                        const ccx = bx, ccy = h * 0.36, rx = w * 0.37, ry = h * 0.27;
                        g.strokeStyle = mc('#5A3618'); g.lineWidth = 4; g.lineCap = 'round';
                        for (const b of [[-30, -0.15], [30, -0.1], [-12, -0.32], [14, -0.3]]) {
                            g.beginPath(); g.moveTo(bx, base - trunkH * 0.92);
                            g.quadraticCurveTo(bx + b[0] * 0.3, base - trunkH * 1.05, bx + b[0], ccy + ry * b[1] * 2); g.stroke();
                        }
                        g.fillStyle = 'rgba(0,0,0,0.28)';
                        g.beginPath(); g.ellipse(bx, ccy + ry * 0.85, 12, 5, 0, 0, 6.2832); g.fill();

                        this.paintFoliage(g, rng, ccx, ccy, rx, ry, 560, 7, 14, mc);
                    });
                }

                // Mảng lá: nhiều đốm nhỏ, màu theo ánh sáng chung (sáng trên-phải, tối dưới) + viền mờ
                paintFoliage(g, rng, cx, cy, rx, ry, n, rMin, rMax, mc) {
                    const shade = (px, py) => Math.min(1, Math.max(0, 0.5 + (py - cy) / (2 * ry) * 0.9 - (px - cx) / rx * 0.18));
                    const pts = [];
                    for (let i = 0; i < n; i++) {
                        const a = rng() * 6.2832, d = Math.pow(rng(), 0.6);
                        const wob = 1 + 0.16 * Math.sin(a * 5 + 1) + 0.1 * Math.sin(a * 9);
                        pts.push({ x: cx + Math.cos(a) * d * rx * 0.9 * wob, y: cy + Math.sin(a) * d * ry * 0.9 * wob, r: rMin + rng() * (rMax - rMin) });
                    }
                    pts.sort((a, b) => a.y - b.y);
                    for (const p of pts) {
                        const t = Math.min(1, Math.max(0, shade(p.x, p.y) + (rng() - 0.5) * 0.14));
                        const [r, gg, b] = parseRGB(mc(mixColor(mixColor('#9CCB5C', '#5FA03C', Math.min(1, t * 1.6)), '#255A26', Math.max(0, t - 0.4) * 1.5)));
                        const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
                        gr.addColorStop(0, `rgba(${r|0},${gg|0},${b|0},1)`);
                        gr.addColorStop(0.82, `rgba(${r|0},${gg|0},${b|0},0.96)`);
                        gr.addColorStop(1, `rgba(${r|0},${gg|0},${b|0},0)`);
                        g.fillStyle = gr;
                        g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.2832); g.fill();
                    }
                    // Lá li ti tạo texture
                    for (let i = 0; i < n * 0.9; i++) {
                        const a = rng() * 6.2832, d = Math.pow(rng(), 0.55);
                        const px = cx + Math.cos(a) * d * rx * 0.92, py = cy + Math.sin(a) * d * ry * 0.92;
                        const t = shade(px, py), lit = rng() < 0.55 - t * 0.35;
                        g.fillStyle = lit ? mc(mixColor('#D2F090', '#7DB84A', t)) : mc(mixColor('#3F7F30', '#183F1E', t));
                        g.globalAlpha = 0.55;
                        g.beginPath(); g.ellipse(px, py, 1.8 + rng() * 2.2, 0.9 + rng() * 1.1, rng() * 3.14, 0, 6.2832); g.fill();
                    }
                    g.globalAlpha = 1;
                }

                makePalm(rng, haze) {
                    return makeSprite(130, 250, (g, w, h) => {
                        const mc = c => haze ? mixColor(c, '#A9C4C2', haze) : c;
                        const bx = w * 0.42, base = h - 3, topX = w * 0.6, topY = h * 0.24, c1x = bx - 8, c1y = h * 0.6;
                        const pt = t => ({ x: (1 - t) * (1 - t) * bx + 2 * (1 - t) * t * c1x + t * t * topX, y: (1 - t) * (1 - t) * base + 2 * (1 - t) * t * c1y + t * t * topY });
                        g.lineCap = 'butt';
                        for (let i = 0; i < 40; i++) {
                            const p = pt(i / 40), q = pt((i + 1) / 40);
                            g.strokeStyle = mc(i % 4 < 1 ? '#6B5A48' : '#8C7A66');
                            g.lineWidth = 11 - 5 * (i / 40);
                            g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
                        }
                        g.strokeStyle = 'rgba(255,240,210,0.22)'; g.lineWidth = 2;
                        g.beginPath();
                        for (let i = 0; i <= 40; i++) { const p = pt(i / 40); const ox = 2.2 - 1.2 * (i / 40); if (i) g.lineTo(p.x + ox, p.y); else g.moveTo(p.x + ox, p.y); }
                        g.stroke();
                        g.lineCap = 'round';
                        for (let k = 0; k < 9; k++) {
                            const ang = -Math.PI + (k + 0.5) * Math.PI / 9 + (rng() - 0.5) * 0.2, L = 42 + rng() * 14;
                            const ex = topX + Math.cos(ang) * L, ey = topY + Math.sin(ang) * L + 16 * Math.abs(Math.cos(ang));
                            const cx2 = topX + Math.cos(ang) * L * 0.55, cy2 = topY + Math.sin(ang) * L * 0.55 - 14;
                            g.strokeStyle = mc('#3d6b2a'); g.lineWidth = 1.6;
                            g.beginPath(); g.moveTo(topX, topY); g.quadraticCurveTo(cx2, cy2, ex, ey); g.stroke();
                            for (let t = 0.15; t <= 1; t += 0.07) {
                                const px = (1 - t) * (1 - t) * topX + 2 * (1 - t) * t * cx2 + t * t * ex;
                                const py = (1 - t) * (1 - t) * topY + 2 * (1 - t) * t * cy2 + t * t * ey;
                                const tx = 2 * (1 - t) * (cx2 - topX) + 2 * t * (ex - cx2), ty = 2 * (1 - t) * (cy2 - topY) + 2 * t * (ey - cy2);
                                const ta = Math.atan2(ty, tx), ll = 13 * (1 - t * 0.6);
                                for (const sd of [-1, 1]) {
                                    const la = ta + sd * 1.05 + 0.25;
                                    g.strokeStyle = mc(sd < 0 ? '#2E7D32' : '#5BA83C'); g.lineWidth = 1.5;
                                    g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(la) * ll, py + Math.sin(la) * ll + 3); g.stroke();
                                }
                            }
                        }
                        g.fillStyle = mc('#5A3E22');
                        for (const c of [[-3, 5], [2, 7], [5, 3]]) { g.beginPath(); g.arc(topX + c[0], topY + c[1], 3.2, 0, 6.2832); g.fill(); }
                    });
                }

                makeBush(rng) {
                    return makeSprite(80, 52, (g, w, h) => {
                        this.paintFoliage(g, rng, w / 2, h * 0.58, w * 0.44, h * 0.34, 95, 4, 8, c => c);
                        const fcs = ['#FFFFFF', '#FFD93D', '#FF7C8A'];
                        for (let i = 0; i < 9; i++) {
                            g.fillStyle = fcs[i % 3];
                            g.beginPath(); g.arc(w * (0.2 + rng() * 0.6), h * (0.3 + rng() * 0.45), 1.2, 0, 6.2832); g.fill();
                        }
                    });
                }

                update(dt) {
                    const speed = (gameState === 'playing' || gameState === 'falling') ?
                        gameSpeed : (gameState === 'gameover' ? gameSpeed * 0.3 : 0);
                    const W = canvasWidth;
                    this.dist += speed * dt;

                    for (let t of this.trees) {
                        t.x -= speed * t.par * dt;
                        if (t.x < -t.spr.w * t.scale) t.x += t.span;
                    }
                    for (let b of this.bushes) {
                        b.x -= speed * 0.5 * dt;
                        if (b.x < -b.w) b.x += b.span;
                    }
                    for (let f of this.flowers) {
                        f.x -= speed * 0.45 * dt;
                        f.sway += dt * 1.6;
                        if (f.x < -10) f.x += f.span;
                    }
                    for (let c of this.clouds) {
                        c.x -= c.speed * dt;
                        if (c.x < -c.w - 30) { c.x = W + Math.random() * 50; c.y = 25 + Math.random() * (canvasHeight * 0.3); }
                    }
                }

                drawRidge(ctx, L, gy, sky) {
                    const W = canvasWidth, off = (this.dist * L.par) % L.P, step = L.step || 10;
                    const baseY = gy - this.bandH * 0.5, amp = L.amp * gy;
                    const col = mixColor(L.col, sky.bottom, L.haze);
                    const g = ctx.createLinearGradient(0, baseY - amp, 0, baseY);
                    g.addColorStop(0, col);
                    g.addColorStop(1, mixColor(col, sky.bottom, 0.55));
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.moveTo(0, gy);
                    for (let x = 0; x <= W + step; x += step) {
                        const u = ((x + off) % L.P) / L.P;
                        ctx.lineTo(x, baseY - amp * L.fn(u));
                    }
                    ctx.lineTo(W + step, gy);
                    ctx.closePath();
                    ctx.fill();
                }

                drawTrees(ctx, layer, baseY) {
                    for (const t of this.trees) {
                        if (t.layer !== layer) continue;
                        const sw = t.spr.w * t.scale;
                        if (t.x > canvasWidth + sw) continue;
                        ctx.save();
                        ctx.translate(t.x, baseY);
                        ctx.transform(1, 0, Math.sin(frameCount * 0.02 + t.sway) * 0.015, 1, 0, 0);
                        ctx.scale(t.flip ? -t.scale : t.scale, t.scale);
                        ctx.drawImage(t.spr.c, -t.spr.w / 2, -t.spr.h, t.spr.w, t.spr.h);
                        ctx.restore();
                    }
                }

                drawPaddy(ctx, gy, sky) {
                    const W = canvasWidth, bh = this.bandH, top = gy - bh;
                    const g = ctx.createLinearGradient(0, top, 0, gy);
                    g.addColorStop(0, mixColor('#A5CC62', sky.bottom, 0.25));
                    g.addColorStop(1, '#5F9B34');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, top, W, bh);
                    ctx.strokeStyle = 'rgba(30,80,20,0.2)'; ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let r = 1; r < 6; r++) { const yy = top + bh * Math.pow(r / 6, 1.4); ctx.moveTo(0, yy); ctx.lineTo(W, yy); }
                    ctx.stroke();
                    // Sóng lúa gợn theo gió
                    ctx.strokeStyle = 'rgba(220,245,140,0.35)'; ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    const off = (this.dist * 0.28) % 44;
                    for (let r = 0; r < 3; r++) {
                        const yy = top + bh * (0.25 + r * 0.28);
                        for (let x = -off; x < W; x += 44) {
                            const sx = x + r * 15 + Math.sin(frameCount * 0.03 + x * 0.05) * 3;
                            ctx.moveTo(sx, yy); ctx.lineTo(sx + 12, yy - 0.8);
                        }
                    }
                    ctx.stroke();
                }

                drawGrassLine(ctx, gy) {
                    const W = canvasWidth;
                    const g = ctx.createLinearGradient(0, gy - 6, 0, gy + 5);
                    g.addColorStop(0, '#5CB055'); g.addColorStop(1, '#357F35');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, gy - 3, W, 8);
                    ctx.lineCap = 'round';
                    for (const L of [{ step: 7, col: '#3E8E3A', h0: 5, hv: 7, lw: 1.5 }, { step: 11, col: '#6DBB4A', h0: 3, hv: 5, lw: 1.3 }]) {
                        ctx.strokeStyle = L.col; ctx.lineWidth = L.lw;
                        ctx.beginPath();
                        for (let k = Math.floor(this.dist / L.step); k * L.step - this.dist < W + L.step; k++) {
                            const x = k * L.step - this.dist, hh = L.h0 + hash01(k) * L.hv;
                            const sw = Math.sin(frameCount * 0.04 + k * 0.7) * 1.6;
                            ctx.moveTo(x, gy - 1);
                            ctx.quadraticCurveTo(x + 1 + sw * 0.4, gy - hh * 0.6, x + 2.5 + sw, gy - hh);
                        }
                        ctx.stroke();
                    }
                }

                drawRoad(ctx, gy) {
                    const W = canvasWidth, H = canvasHeight, rh = H - gy;
                    let g = ctx.createLinearGradient(0, gy, 0, H);
                    g.addColorStop(0, '#CDAE78'); g.addColorStop(0.08, '#B8965F'); g.addColorStop(0.5, '#8D6B3E'); g.addColorStop(1, '#5D4225');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, gy, W, rh);
                    for (const r of [0.3, 0.66]) {
                        const yy = gy + rh * r, hh = rh * 0.12 * (0.6 + r);
                        const rg = ctx.createLinearGradient(0, yy - hh, 0, yy + hh);
                        rg.addColorStop(0, 'rgba(45,28,10,0)'); rg.addColorStop(0.5, 'rgba(45,28,10,0.28)'); rg.addColorStop(1, 'rgba(45,28,10,0)');
                        ctx.fillStyle = rg;
                        ctx.fillRect(0, yy - hh, W, hh * 2);
                    }
                    const P = this.roadP;
                    for (const p of this.pebbles) {
                        const mul = 0.7 + p.d * 1.1;
                        const px = (((p.x - this.dist * mul) % P) + P) % P - 150;
                        if (px > W + 20) continue;
                        const py = gy + 8 + p.d * (rh - 12);
                        const s = (1.2 + p.s * 2.6) * (0.55 + p.d * 1.5);
                        ctx.fillStyle = 'rgba(0,0,0,0.22)';
                        ctx.beginPath(); ctx.ellipse(px + s * 0.25, py + s * 0.35, s * 1.6, s * 0.7, 0, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = p.col;
                        ctx.beginPath(); ctx.ellipse(px, py, s * 1.5, s * 0.85, 0, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = p.hi;
                        ctx.beginPath(); ctx.ellipse(px - s * 0.3, py - s * 0.25, s * 0.7, s * 0.3, 0, 0, 6.2832); ctx.fill();
                    }
                    const cs = ctx.createLinearGradient(0, gy + 3, 0, gy + 17);
                    cs.addColorStop(0, 'rgba(30,18,5,0.4)'); cs.addColorStop(1, 'rgba(30,18,5,0)');
                    ctx.fillStyle = cs;
                    ctx.fillRect(0, gy + 3, W, 14);
                }

                draw(ctx) {
                    const W = canvasWidth, H = canvasHeight, S = CONSTANTS.BG_SCALE;
                    const gy = getGroundY();
                    const sky = getSkyState();
                    this._sky = sky;

                    const skyGrad = ctx.createLinearGradient(0, 0, 0, gy);
                    skyGrad.addColorStop(0, sky.top); skyGrad.addColorStop(0.5, sky.mid); skyGrad.addColorStop(1, sky.bottom);
                    ctx.fillStyle = skyGrad;
                    ctx.fillRect(0, 0, W, gy + 2);

                    // Sao lấp lánh
                    if (sky.dark > 0.03) {
                        ctx.fillStyle = '#fff';
                        for (const s of this.stars) {
                            ctx.globalAlpha = sky.dark * (0.45 + 0.55 * Math.sin(frameCount * 0.05 + s.ph));
                            ctx.fillRect(s.x, s.y, s.r, s.r);
                        }
                        ctx.globalAlpha = 1;
                    }

                    // Mặt trời
                    const fade = 1 - sky.dark;
                    const sunX = W * 0.83, sunY = H * sky.sunY, sunR = 40 * S;
                    if (fade > 0.02) {
                        ctx.globalAlpha = fade;
                        const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.5, sunX, sunY, sunR * 4);
                        glow.addColorStop(0, 'rgba(255,250,215,0.85)');
                        glow.addColorStop(0.35, 'rgba(255,225,150,0.35)');
                        glow.addColorStop(1, 'rgba(255,180,80,0)');
                        ctx.fillStyle = glow;
                        ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 4, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = 'rgba(255,240,180,0.07)';
                        for (let i = 0; i < 10; i++) {
                            const a = i * 0.6283 + frameCount * 0.002;
                            ctx.beginPath();
                            ctx.moveTo(sunX, sunY);
                            ctx.lineTo(sunX + Math.cos(a - 0.09) * sunR * 7, sunY + Math.sin(a - 0.09) * sunR * 7);
                            ctx.lineTo(sunX + Math.cos(a + 0.09) * sunR * 7, sunY + Math.sin(a + 0.09) * sunR * 7);
                            ctx.fill();
                        }
                        const sg = ctx.createRadialGradient(sunX - 4, sunY - 4, 4, sunX, sunY, sunR);
                        sg.addColorStop(0, '#FFFDE7'); sg.addColorStop(0.4, '#FFE082'); sg.addColorStop(1, sky.sun);
                        ctx.fillStyle = sg;
                        ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, 6.2832); ctx.fill();
                        ctx.globalAlpha = 1;
                    }

                    // Trăng
                    if (sky.dark > 0.03) {
                        const mx = W * 0.18, my = H * 0.16, mr = 24;
                        ctx.globalAlpha = sky.dark;
                        const mg = ctx.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 3);
                        mg.addColorStop(0, 'rgba(220,230,255,0.35)'); mg.addColorStop(1, 'rgba(220,230,255,0)');
                        ctx.fillStyle = mg;
                        ctx.beginPath(); ctx.arc(mx, my, mr * 3, 0, 6.2832); ctx.fill();
                        const dg = ctx.createRadialGradient(mx - 6, my - 6, 3, mx, my, mr);
                        dg.addColorStop(0, '#FFFFF2'); dg.addColorStop(1, '#D5DCEA');
                        ctx.fillStyle = dg;
                        ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.2832); ctx.fill();
                        ctx.fillStyle = 'rgba(150,160,185,0.35)';
                        for (const c of [[-8, -6, 5], [7, -9, 3.5], [5, 6, 6], [-10, 8, 3]]) { ctx.beginPath(); ctx.arc(mx + c[0], my + c[1], c[2], 0, 6.2832); ctx.fill(); }
                        ctx.globalAlpha = 1;
                    }

                    // Mây
                    for (const c of this.clouds) {
                        ctx.globalAlpha = c.opacity * (1 - 0.55 * sky.dark);
                        ctx.drawImage(c.spr.c, c.x, c.y, c.w, c.h);
                    }
                    ctx.globalAlpha = 1;

                    // Ánh hoàng hôn / bình minh sát đường chân trời
                    if (sky.warm > 0.01) {
                        const hg = ctx.createLinearGradient(0, gy - 120 * S, 0, gy);
                        hg.addColorStop(0, 'rgba(255,175,95,0)');
                        hg.addColorStop(1, `rgba(255,175,95,${Math.min(0.4, sky.warm * 2.2)})`);
                        ctx.fillStyle = hg;
                        ctx.fillRect(0, gy - 120 * S, W, 120 * S);
                    }

                    // Núi đồi -> hàng cây xa -> ruộng lúa -> cây gần
                    for (let i = 0; i < this.ridges.length; i++) this.drawRidge(ctx, this.ridges[i], gy, sky);
                    this.drawTrees(ctx, 'far', gy - this.bandH * 0.9);
                    this.drawPaddy(ctx, gy, sky);
                    this.drawTrees(ctx, 'near', gy);

                    for (const b of this.bushes) {
                        if (b.x > W + b.w) continue;
                        ctx.drawImage(b.spr.c, b.x, gy - b.w * 0.62, b.w, b.w * 0.65);
                    }

                    ctx.lineCap = 'round';
                    for (const f of this.flowers) {
                        if (f.x > W + 10) continue;
                        const sw = Math.sin(f.sway) * 1.5, fx = f.x + sw, fy = gy - f.h;
                        ctx.strokeStyle = '#3F8F3A'; ctx.lineWidth = 1.2;
                        ctx.beginPath(); ctx.moveTo(f.x, gy); ctx.quadraticCurveTo(f.x + sw * 0.3, gy - f.h * 0.5, fx, fy); ctx.stroke();
                        ctx.fillStyle = f.col;
                        for (let p = 0; p < 5; p++) {
                            const a = (p / 5) * 6.2832;
                            ctx.beginPath(); ctx.arc(fx + Math.cos(a) * f.size * 0.6, fy + Math.sin(a) * f.size * 0.6, f.size * 0.42, 0, 6.2832); ctx.fill();
                        }
                        ctx.fillStyle = '#FFB300';
                        ctx.beginPath(); ctx.arc(fx, fy, f.size * 0.35, 0, 6.2832); ctx.fill();
                    }

                    this.drawRoad(ctx, gy);
                    this.drawGrassLine(ctx, gy);
                }

                // Phủ ánh sáng theo thời điểm trong ngày + vignette (vẽ sau các vật thể)
                drawTint(ctx) {
                    const sky = this._sky;
                    if (!sky) return;
                    const W = canvasWidth, H = canvasHeight;
                    if (sky.dark > 0.01) {
                        ctx.fillStyle = `rgba(12,24,60,${0.36 * sky.dark})`;
                        ctx.fillRect(0, 0, W, H);
                    }
                    if (sky.warm > 0.01) {
                        ctx.fillStyle = `rgba(255,140,60,${sky.warm * 0.35})`;
                        ctx.fillRect(0, 0, W, H);
                    }
                    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
                    vg.addColorStop(0, 'rgba(0,0,0,0)');
                    vg.addColorStop(1, 'rgba(0,0,0,0.28)');
                    ctx.fillStyle = vg;
                    ctx.fillRect(0, 0, W, H);
                }
            }

            // ==================== GAME FUNCTIONS ====================

            function resizeCanvas() {
                canvasWidth = container.clientWidth;
                canvasHeight = container.clientHeight;

                canvas.width = canvasWidth * (window.devicePixelRatio || 1);
                canvas.height = canvasHeight * (window.devicePixelRatio || 1);
                canvas.style.width = canvasWidth + 'px';
                canvas.style.height = canvasHeight + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

                groundY = canvasHeight * CONSTANTS.GROUND_RATIO;
                restartButton.x = canvasWidth / 2 - restartButton.w / 2;
                restartButton.y = canvasHeight / 2 + 30;

                if (chicken && !hasStartedPlaying) {
                    chicken.y = getGroundY() - chicken.height;
                    chicken.x = canvasWidth * 0.16;
                }

                if (bgElements) bgElements.init();
                if (weatherManager) weatherManager.init();
            }
function playLoseSound() {
    if (audioCtx.state === "suspended") audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";

    // Tiếng hét từ cao xuống thấp
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
        2000,
        audioCtx.currentTime + 0.5
    );

    gain.gain.setValueAtTime(0.48, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.0053,
        audioCtx.currentTime + 0.9
    );

    // Rung nhẹ giống tiếng la
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();

    lfo.frequency.value = 15;
    lfoGain.gain.value = 100;

    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    lfo.start();
    osc.start();

    lfo.stop(audioCtx.currentTime + 0.9);
    osc.stop(audioCtx.currentTime + 0.9);
}

            function resetGame() {
                gameSpeed = CONSTANTS.GAME_SPEED_INITIAL;
                stamina = CONSTANTS.STAMINA_MAX;
                staminaTimer = 0;
                score = 0;
                obstacles = [];
                holes = [];
                items = [];
                eagles = [];
                platforms = [];
                spikes = [];
                hasStartedPlaying = false;
                gameOverAnimTimer = 0;

                chicken = new Chicken();
                chicken.y = getGroundY() - chicken.height;
                chicken.x = canvasWidth * 0.16;

                bgElements = new BackgroundManager();
                weatherManager = new WeatherManager();
                gameState = 'waiting';
            }

            // REPLACED startGame
            function startGame() {
                resizeCanvas();

                if (gameState === 'gameover' || gameState === 'falling') {
                    resetGame();
                }

                gameState = 'playing';
                hasStartedPlaying = true;
                lastTime = performance.now();
            }

            function gameOver() {
                if (gameState === 'gameover') return;
                gameState = 'gameover';
                playLoseSound();
                if (window.Scores) Scores.submit('ganangdong', Math.floor(score));
                gameOverAnimTimer = 0;

                if (score > bestScore) {
                    bestScore = Math.floor(score);
                    try { localStorage.setItem('chickenRunBest_v26', bestScore); } catch (e) {}
                }
            }

            function jump() {
                if (isBlocked || !chicken || chicken.fallingInHole ||
                    gameState === 'falling' || gameState === 'gameover') return;

                if (gameState === 'waiting') {
                    startGame();
                    chicken.jump();
                } else if (gameState === 'playing') {
                    chicken.jump();
                }
            }

            function isPositionClear(x, y, w, h) {
                const allObjects = [...obstacles, ...holes, ...spikes, ...platforms];

                for (let obj of allObjects) {
                    let obsBox;
                    if (obj.getCollisionBox) {
                        obsBox = obj.getCollisionBox();
                    } else if (obj.getCollisionZone) {
                        obsBox = obj.getCollisionZone();
                    } else {
                        obsBox = { x: obj.x, y: obj.y, width: obj.width, height: obj.height };
                    }

                    if (obsBox &&
                        x < obsBox.x + obsBox.width &&
                        x + w > obsBox.x &&
                        y < obsBox.y + obsBox.height &&
                        y + h > obsBox.y) {
                        return false;
                    }
                }
                return true;
            }

            function isOverHole(x, w) {
                for (let hole of holes) {
                    if (x < hole.x + hole.width && x + w > hole.x) {
                        return true;
                    }
                }
                return false;
            }

            function checkCollisions() {
                if (!chicken || gameState !== 'playing' || chicken.fallingInHole) return;
                if (chicken.invincibleTimer > 0) return;

                const box = chicken.getCollisionBox();

                for (let obs of obstacles) {
                    const oBox = obs.getCollisionBox();
                    if (box.x < oBox.x + oBox.width &&
                        box.x + box.width > oBox.x &&
                        box.y < oBox.y + oBox.height &&
                        box.y + box.height > oBox.y) {

                        if (chicken.shieldTimer > 0) {
                            chicken.shieldTimer = 0;
                            chicken.invincibleTimer = 0.5;
                            obs.passed = true;
                            continue;
                        }
                        gameOver();
                        return;
                    }
                    if (!obs.passed && obs.x + obs.width < box.x) {
                        obs.passed = true;
                        score += 10;
                    }
                }

                for (let hole of holes) {
                    const hZone = hole.getCollisionZone();
                    if (chicken.isOnGround && !chicken.currentPlatform &&
                        box.x + box.width > hZone.x + 4 * CONSTANTS.SIZE_SCALE &&
                        box.x < hZone.x + hZone.width - 4 * CONSTANTS.SIZE_SCALE) {

                        if (chicken.shieldTimer > 0) {
                            chicken.shieldTimer = 0;
                            chicken.invincibleTimer = 0.5;
                            hole.passed = true;
                            continue;
                        }
                        gameState = 'falling';
                        chicken.fallingInHole = true;
                        chicken.fallTimer = 0;
                        return;
                    }
                    if (!hole.passed && hole.x + hole.width < box.x) {
                        hole.passed = true;
                        score += 15;
                    }
                }

                for (let spike of spikes) {
                    const sBox = spike.getCollisionBox();
                    if (box.x < sBox.x + sBox.width &&
                        box.x + box.width > sBox.x &&
                        box.y < sBox.y + sBox.height &&
                        box.y + box.height > sBox.y) {

                        if (chicken.shieldTimer > 0) {
                            chicken.shieldTimer = 0;
                            chicken.invincibleTimer = 0.5;
                            spike.passed = true;
                            continue;
                        }
                        gameOver();
                        return;
                    }
                    if (!spike.passed && spike.x + spike.width < box.x) {
                        spike.passed = true;
                        score += 5;
                    }
                }

                for (let eagle of eagles) {
                    if (!eagle.active) continue;
                    const eBox = eagle.getCollisionBox();
                    if (box.x < eBox.x + eBox.width &&
                        box.x + box.width > eBox.x &&
                        box.y < eBox.y + eBox.height &&
                        box.y + box.height > eBox.y) {

                        if (chicken.shieldTimer > 0) {
                            chicken.shieldTimer = 0;
                            chicken.invincibleTimer = 0.5;
                            eagle.passed = true;
                            continue;
                        }
                        gameOver();
                        return;
                    }
                }

                for (let item of items) {
                    if (item.collected) continue;
                    const iBox = item.getCollisionBox();
                    if (box.x < iBox.x + iBox.width &&
                        box.x + box.width > iBox.x &&
                        box.y < iBox.y + iBox.height &&
                        box.y + box.height > iBox.y) {

                        item.collected = true;
                        if (item.type === 'gold') {
                            score += 50;
                        } else if (item.type === 'stamina') {
                            stamina = Math.min(CONSTANTS.STAMINA_MAX, stamina + 2);
                        } else if (item.type === 'shield') {
                            chicken.shieldTimer = 5;
                        }
                    }
                }
            }

            function spawnObstacle() {
                const r = Math.random();

                if (r < 0.3) {
                    let obs = new Obstacle('haystack');
                    if (!isOverHole(obs.x, obs.width) && isPositionClear(obs.x, obs.y, obs.width, obs.height)) {
                        obstacles.push(obs);
                    }
                } else if (r < 0.5) {
                    let obs = new Obstacle('crate');
                    if (!isOverHole(obs.x, obs.width) && isPositionClear(obs.x, obs.y, obs.width, obs.height)) {
                        obstacles.push(obs);
                    }
                } else if (r < 0.58) {
                    let obs = new Obstacle('crate_triple');
                    if (!isOverHole(obs.x, obs.width) && isPositionClear(obs.x, obs.y, obs.width, obs.height)) {
                        obstacles.push(obs);
                    }
                } else if (r < 0.75) {
                    let obs = new Obstacle('crate_triangle');
                    if (!isOverHole(obs.x, obs.width) && isPositionClear(obs.x, obs.y, obs.width, obs.height)) {
                        obstacles.push(obs);
                    }
                } else if (r < 0.9) {
                    let sp = new Spike();
                    if (!isOverHole(sp.x, sp.width) && isPositionClear(sp.x, sp.y, sp.width, sp.height)) {
                        spikes.push(sp);
                    }
                } else {
                    let hole = new Hole();
                    if (isPositionClear(hole.x, hole.y, hole.width, hole.depth)) {
                        holes.push(hole);

                        if (hole.width > 400 * CONSTANTS.SIZE_SCALE) {
                            let platformWidth = 100 * CONSTANTS.SIZE_SCALE;
                            let gap = 130 * CONSTANTS.SIZE_SCALE;
                            let startX = hole.x + 60 * CONSTANTS.SIZE_SCALE;
                            let endX = hole.x + hole.width - 60 * CONSTANTS.SIZE_SCALE - platformWidth;
                            let currentX = startX;

                            while (currentX < endX && platforms.length < 8) {
                                let plat = new Platform(
                                    currentX,
                                    getGroundY() - 90 * CONSTANTS.SIZE_SCALE,
                                    platformWidth
                                );
                                if (isPositionClear(plat.x, plat.y, plat.width, plat.height)) {
                                    platforms.push(plat);
                                }
                                currentX += platformWidth + gap;
                            }
                        }
                    }
                }
            }

            function spawnItem() {
                const types = ['gold', 'gold', 'stamina', 'shield'];
                const type = types[Math.floor(Math.random() * types.length)];
                const newItem = new Item(type);
                if (isPositionClear(newItem.x, newItem.y, newItem.width, newItem.height)) {
                    items.push(newItem);
                }
            }

            function spawnEagle() {
                eagles.push(new Eagle());
            }

            function updateTerrain(dt) {
                if (terrainProgress >= 1 && Math.random() < dt * 0.25) {
                    terrainStart = terrainOffset;
                    terrainTarget =
    (Math.floor(Math.random() * 9) - 4) * 35;
// -140 -105 -70 -35 0 35 70 105 140
                    terrainProgress = 0;
                }

                if (terrainProgress < 1) {
                    terrainProgress += dt * 0.22;
                    if (terrainProgress > 1) terrainProgress = 1;
                    const t = terrainProgress;
                    const smooth = (1 - Math.cos(Math.PI * t)) / 2;
                    terrainOffset = terrainStart + (terrainTarget - terrainStart) * smooth;
                }
            }

            function update(dt) {
                if (isBlocked) return;

                if (gameState === 'gameover') {
                    gameOverAnimTimer += dt;
                }

                if (gameState === 'falling') {
                    if (chicken) chicken.update(dt);
                    return;
                }

                if (gameState === 'playing') {
                    dayTimer += dt;
                    updateTerrain(dt);
                    if (chicken && chicken.fallingInHole) {
                        chicken.update(dt);
                        return;
                    }

                    gameSpeed = Math.min(CONSTANTS.GAME_SPEED_MAX,
                        gameSpeed + CONSTANTS.GAME_SPEED_INCREMENT * dt);

                    staminaTimer += dt;
                    if (staminaTimer >= CONSTANTS.STAMINA_REGEN_TIME && stamina < CONSTANTS.STAMINA_MAX) {
                        stamina++;
                        staminaTimer -= CONSTANTS.STAMINA_REGEN_TIME;
                        if (stamina > CONSTANTS.STAMINA_MAX) stamina = CONSTANTS.STAMINA_MAX;
                    }
                    if (stamina >= CONSTANTS.STAMINA_MAX) staminaTimer = 0;

                    spawnTimer += dt;
                    if (spawnTimer >= nextSpawnDelay) {
                        spawnTimer = 0;
                        spawnObstacle();

                        const baseDelay = 0.9;
                        const variation = Math.random() * 0.9;
                        nextSpawnDelay = baseDelay + variation * (1 - gameSpeed / CONSTANTS.GAME_SPEED_MAX * 0.4);

                        if (Math.random() < 0.15 && gameSpeed > 350) {
                            setTimeout(() => {
                                if (gameState === 'playing') spawnObstacle();
                            }, 150 + Math.random() * 250);
                        }
                    }

                    itemSpawnTimer += dt;
                    if (itemSpawnTimer > 4 + Math.random() * 3) {
                        itemSpawnTimer = 0;
                        if (items.length < 2) spawnItem();
                    }

                    eagleSpawnTimer += dt;
                    if (eagleSpawnTimer > 15 + Math.random() * 10 && gameSpeed > 350) {
                        eagleSpawnTimer = 0;
                        if (eagles.length === 0) spawnEagle();
                    }

                    score += gameSpeed * dt * 0.05;
                }

                if (chicken && !chicken.fallingInHole) chicken.update(dt);

                for (let o of obstacles) o.update(dt);
                for (let h of holes) h.update(dt);
                for (let s of spikes) s.update(dt);
                for (let p of platforms) p.update(dt);
                for (let item of items) item.update(dt);
                for (let eagle of eagles) eagle.update(dt);

                obstacles = obstacles.filter(o => !o.isOffScreen());
                holes = holes.filter(h => !h.isOffScreen());
                spikes = spikes.filter(s => !s.isOffScreen());
                platforms = platforms.filter(p => !p.isOffScreen());
                items = items.filter(i => !i.isOffScreen() && !i.collected);
                eagles = eagles.filter(e => !e.isOffScreen());

                if (bgElements) bgElements.update(dt);
                if (weatherManager) weatherManager.update(dt);

                if (gameState === 'playing') checkCollisions();
            }

            // ==================== MAIN DRAW FUNCTION (ADDED BACK) ====================
            function draw(ctx) {
                // Draw background
                if (bgElements) bgElements.draw(ctx);

                // Draw game objects (z-order: back to front)
                for (let h of holes) h.draw(ctx);
                for (let o of obstacles) o.draw(ctx);
                for (let s of spikes) s.draw(ctx);
                for (let p of platforms) p.draw(ctx);
                for (let item of items) item.draw(ctx);
                for (let eagle of eagles) eagle.draw(ctx);

                // Draw player
                if (chicken) chicken.draw(ctx);

                // Ánh sáng theo thời điểm trong ngày
                if (bgElements) bgElements.drawTint(ctx);

                // Draw weather effects (foreground)
                if (weatherManager) weatherManager.draw(ctx);

                // ---- UI: STAMINA BAR ----
                const boltWidth = 28;
                const boltHeight = 36;
                const boltGap = 6;
                const startX = 20;
                const startY = 20;

                for (let i = 0; i < CONSTANTS.STAMINA_MAX; i++) {
                    const bx = startX + i * (boltWidth + boltGap);
                    const by = startY;
                    const bw = boltWidth;
                    const bh = boltHeight;

                    // Background slot
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath();
                    ctx.roundRect(bx, by, bw, bh, 6);
                    ctx.fill();

                    // Filled slot
                    if (i < stamina) {
                        const cx = bx + bw / 2;
                        const cy = by + bh / 2;

                        // Glow effect
                        const glow = ctx.createRadialGradient(cx, cy, bw * 0.2, cx, cy, bw * 0.8);
                        glow.addColorStop(0, 'rgba(100,255,218,0.8)');
                        glow.addColorStop(0.5, 'rgba(0,200,255,0.4)');
                        glow.addColorStop(1, 'rgba(0,150,255,0)');
                        ctx.fillStyle = glow;
                        ctx.beginPath();
                        ctx.arc(cx, cy, bw * 0.8, 0, Math.PI * 2);
                        ctx.fill();

                        // Lightning bolt shape
                        const bolt = ctx.createLinearGradient(0, by, 0, by + bh);
                        bolt.addColorStop(0, '#E0FFFF');
                        bolt.addColorStop(0.3, '#00E5FF');
                        bolt.addColorStop(0.5, '#00B8D4');
                        bolt.addColorStop(0.7, '#0091EA');
                        bolt.addColorStop(1, '#0066CC');
                        ctx.fillStyle = bolt;
                        ctx.beginPath();
                        ctx.moveTo(cx, by + 3);
                        ctx.lineTo(cx - bw * 0.35, cy - 2);
                        ctx.lineTo(cx - 3, cy - 4);
                        ctx.lineTo(cx - bw * 0.15, by + bh - 3);
                        ctx.lineTo(cx + bw * 0.35, cy + 2);
                        ctx.lineTo(cx + 3, cy + 4);
                        ctx.lineTo(cx + bw * 0.15, by + 3);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        // Center highlight
                        ctx.fillStyle = '#FFF';
                        ctx.beginPath();
                        ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // ---- UI: SCORE PANEL ----
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.roundRect(canvasWidth - 155, 15, 140, 45, 12);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 19px "Segoe UI"';
                ctx.textAlign = 'right';
                ctx.fillText(`🏆 ${Math.floor(score)}`, canvasWidth - 30, 45);

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = '11px "Segoe UI"';
                ctx.fillText(`Best: ${Math.floor(bestScore)}`, canvasWidth - 30, 60);

                // ---- UI: SHIELD / INVINCIBILITY TIMER ----
                if (chicken && (chicken.shieldTimer > 0 || chicken.invincibleTimer > 0)) {
                    const timerValue = chicken.shieldTimer > 0 ? chicken.shieldTimer : chicken.invincibleTimer;
                    ctx.fillStyle = 'rgba(100,200,255,0.8)';
                    ctx.font = 'bold 12px "Segoe UI"';
                    ctx.textAlign = 'left';
                    ctx.fillText(`🛡️ ${timerValue.toFixed(1)}s`, 20, 80);
                }

                // ---- UI: WAITING STATE ----
                if (gameState === 'waiting') {
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.font = 'bold 20px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('👆 Chạm để bắt đầu!', canvasWidth / 2, canvasHeight * 0.42);
                }

                // ---- UI: GAME OVER OVERLAY ----
                if (gameState === 'gameover') {
                    const overlayAlpha = Math.min(0.8, gameOverAnimTimer * 2);
                    ctx.fillStyle = `rgba(0,0,0,${overlayAlpha})`;
                    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                    const panelW = 300;
                    const panelH = 190;
                    const targetPanelY = canvasHeight / 2 - panelH / 2 - 20;
                    const slideOffset = Math.max(0, (1 - gameOverAnimTimer * 3) * 200);
                    const panelX = canvasWidth / 2 - panelW / 2;
                    const panelY = targetPanelY + slideOffset;

                    // Panel background
                    ctx.fillStyle = 'rgba(255,255,255,0.95)';
                    ctx.beginPath();
                    ctx.roundRect(panelX, panelY, panelW, panelH, 20);
                    ctx.fill();
                    ctx.strokeStyle = '#FF8F00';
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    // Game over title (with bounce animation)
                    const scale = 1 + Math.sin(gameOverAnimTimer * 8) * 0.03;
                    ctx.save();
                    ctx.translate(canvasWidth / 2, panelY + 45);
                    ctx.scale(scale, scale);
                    ctx.fillStyle = '#E53935';
                    ctx.font = 'bold 26px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('💔 Thua rồi!', 0, 0);
                    ctx.restore();

                    // Score display
                    ctx.fillStyle = '#333';
                    ctx.font = '18px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText(`Điểm: ${Math.floor(score)}`, canvasWidth / 2, panelY + 85);
                    ctx.fillText(`Kỷ lục: ${Math.floor(bestScore)}`, canvasWidth / 2, panelY + 115);

                    // Restart button (with pulse animation)
                    const btnX = restartButton.x;
                    const btnY = restartButton.y;
                    const btnW = restartButton.w;
                    const btnH = restartButton.h;
                    const pulse = 1 + Math.sin(gameOverAnimTimer * 5) * 0.05;

                    ctx.save();
                    ctx.translate(btnX + btnW / 2, btnY + btnH / 2);
                    ctx.scale(pulse, pulse);

                    const grad = ctx.createLinearGradient(-btnW / 2, -btnH / 2, btnW / 2, btnH / 2);
                    grad.addColorStop(0, '#FFB300');
                    grad.addColorStop(1, '#FF8F00');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(-btnW / 2, -btnH / 2, btnW, btnH, 35);
                    ctx.fill();

                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 22px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('CHƠI LẠI', 0, 8);
                    ctx.restore();

                    // Decorative particles around game over screen
                    for (let i = 0; i < 10; i++) {
                        const angle = (i / 10) * Math.PI * 2 + gameOverAnimTimer * 2;
                        const radius = 120 + Math.sin(gameOverAnimTimer * 3 + i) * 30;
                        const px = canvasWidth / 2 + Math.cos(angle) * radius;
                        const py = canvasHeight / 2 - 20 + Math.sin(angle) * radius * 0.6;
                        const alpha = 0.5 + Math.sin(gameOverAnimTimer * 4 + i) * 0.3;
                        ctx.fillStyle = `rgba(255,215,0,${alpha})`;
                        ctx.beginPath();
                        ctx.arc(px, py, 4 + Math.sin(gameOverAnimTimer * 5 + i) * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ==================== INPUT HANDLING ====================

            function handleCanvasClick(e) {
                if (isBlocked) return;

                const rect = canvas.getBoundingClientRect();
                const scaleX = canvasWidth / rect.width;
                const scaleY = canvasHeight / rect.height;

                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;

                if (gameState === 'gameover') {
                    if (
                        x >= restartButton.x &&
                        x <= restartButton.x + restartButton.w &&
                        y >= restartButton.y &&
                        y <= restartButton.y + restartButton.h
                    ) {
                        e.preventDefault();
                        resetGame();
                        startGame();
                        if (chicken) chicken.jump();
                    }
                    return;
                }

                e.preventDefault();

                if (gameState === 'waiting') {
                    startGame();
                    chicken.jump();
                    return;
                }

                jump();
            }

            canvas.addEventListener('click', handleCanvasClick);
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleCanvasClick(e);
            }, { passive: false });

            document.addEventListener('keydown', (e) => {
                if (isBlocked) return;

                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    e.preventDefault();

                    if (gameState === 'gameover') {
                        resetGame();
                        startGame();
                        if (chicken) chicken.jump();
                    } else {
                        jump();
                    }
                }
            });

            // REPLACED gameLoop
            function gameLoop(ts) {
                if (!lastTime) lastTime = ts;

                let dt = Math.max(0, Math.min(0.15, (ts - lastTime) / 1000));
                lastTime = ts;
                frameCount++;

                update(dt);

                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                try {
                    draw(ctx);
                } catch (err) {
                    console.error('DRAW ERROR:', err);
                    ctx.fillStyle = '#07111f';
                    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText('Lỗi vẽ màn hình. Mở Console để xem chi tiết.', 20, 40);
                }

                requestAnimationFrame(gameLoop);
            }

            resizeCanvas();
            resetGame();
            requestAnimationFrame(gameLoop);
        })();
    </script>
