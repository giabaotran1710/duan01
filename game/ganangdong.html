<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>
    <footer> Version:D20260630-H22M52T6113 »»» developed by Tran Gia Bao</footer>

    <script>
        (function() {
            // ==================== DOM ELEMENTS ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playJumpSound() {
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";      // Có thể đổi: sine, triangle, sawtooth
    osc.frequency.setValueAtTime(9000, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(3000, audioCtx.currentTime + 0.08);

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.151, audioCtx.currentTime + 0.08);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}
            const container = document.getElementById('gameContainer');

            // ==================== GAME CONSTANTS ====================
            const CONSTANTS = {
                STAMINA_MAX: 6,
                STAMINA_REGEN_TIME: 0.65,
                GRAVITY: 2000,
                JUMP_VELOCITY: -570,
                GAME_SPEED_INITIAL: 320,
                GAME_SPEED_MAX: 1000,
                GAME_SPEED_INCREMENT: 4,
                GROUND_RATIO: 0.62,
                BG_SCALE: 0.8,
                SIZE_SCALE: 0.75,
                CHICKEN_WIDTH: 64,
                CHICKEN_HEIGHT: 70,
                RESTART_BUTTON_WIDTH: 200,
                RESTART_BUTTON_HEIGHT: 65
            };

            // ==================== GAME STATE VARIABLES ====================
            let canvasWidth, canvasHeight, groundY;
            let terrainOffset = 0;
            // Chu kỳ ngày đêm
            let dayTimer = 0;
            const DAY_DURATION = 45;      // mỗi cảnh 45 giây
            const TRANSITION_TIME = 8;    // chuyển cảnh 8 giây
            let terrainTarget = 0;
            let terrainProgress = 1;
            let terrainStart = 0;
            function getGroundY() {
                return groundY + terrainOffset;
            }
            let gameState = 'waiting'; // 'waiting' | 'playing' | 'falling' | 'gameover'
            let score = 0;
            let gameSpeed = CONSTANTS.GAME_SPEED_INITIAL;
            let stamina = CONSTANTS.STAMINA_MAX;
            let staminaTimer = 0;
            let isBlocked = false;

            // Game objects
            let chicken;
            let obstacles = [];
            let holes = [];
            let items = [];
            let eagles = [];
            let platforms = [];
            let spikes = [];
            let bgElements;
            let weatherManager;

            // Timing & tracking
            let lastTime = 0;
            let frameCount = 0;
            let hasStartedPlaying = false;
            let gameOverAnimTimer = 0;

            // Best score (persisted in localStorage)
            let bestScore = parseInt(localStorage.getItem('chickenRunBest_v26') || '0');

            // Restart button position (calculated on resize)
            let restartButton = {
                x: 0,
                y: 0,
                w: CONSTANTS.RESTART_BUTTON_WIDTH,
                h: CONSTANTS.RESTART_BUTTON_HEIGHT
            };

            // Spawn timers
            let spawnTimer = 0;
            let nextSpawnDelay = 1.2;
            let itemSpawnTimer = 0;
            let eagleSpawnTimer = 0;

            // ==================== HELPER: ROUNDRECT POLYFILL ====================
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    ctx.beginPath();
                    ctx.moveTo(x + r.tl, y);
                    ctx.lineTo(x + w - r.tr, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    ctx.lineTo(x + w, y + h - r.br);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    ctx.lineTo(x + r.bl, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    ctx.lineTo(x, y + r.tl);
                    ctx.quadraticCurveTo(x, y, x + r.tl, y);
                    ctx.closePath();
                };
            }

            // ==================== CLASS: WEATHER MANAGER ====================
            class WeatherManager {
                constructor() {
                    this.raindrops = [];
                    this.leaves = [];
                    this.init();
                }

                init() {
                    this.raindrops = [];
                    this.leaves = [];

                    // Create raindrops
                    for (let i = 0; i < 120; i++) {
                        this.raindrops.push({
                            x: Math.random() * canvasWidth,
                            y: Math.random() * canvasHeight,
                            speed: 500 + Math.random() * 400,
                            length: 10 + Math.random() * 20,
                            opacity: 0.1 + Math.random() * 0.2
                        });
                    }

                    // Create falling leaves
                    for (let i = 0; i < 18; i++) {
                        this.leaves.push({
                            x: Math.random() * canvasWidth,
                            y: Math.random() * canvasHeight,
                            speed: 40 + Math.random() * 80,
                            rotation: Math.random() * Math.PI * 2,
                            rotSpeed: (Math.random() - 0.5) * 2,
                            size: 4 + Math.random() * 6,
                            opacity: 0.5 + Math.random() * 0.3,
                            sway: Math.random() * Math.PI * 2,
                            swaySpeed: 1 + Math.random() * 2
                        });
                    }
                }

                update(dt) {
                    // Update raindrops
                    for (let drop of this.raindrops) {
                        drop.y += drop.speed * dt;
                        drop.x -= 30 * dt;
                        if (drop.y > canvasHeight) {
                            drop.y = -10;
                            drop.x = Math.random() * canvasWidth;
                        }
                        if (drop.x < -20) drop.x = canvasWidth + 20;
                    }

                    // Update leaves
                    for (let leaf of this.leaves) {
                        leaf.x -= leaf.speed * dt;
                        leaf.y += Math.sin(leaf.sway) * 20 * dt;
                        leaf.sway += leaf.swaySpeed * dt;
                        leaf.rotation += leaf.rotSpeed * dt;
                        if (leaf.x < -20) {
                            leaf.x = canvasWidth + 20;
                            leaf.y = Math.random() * canvasHeight;
                        }
                    }
                }

                draw(ctx) {
                    // Subtle atmospheric overlay
                    ctx.fillStyle = 'rgba(200,220,230,0.04)';
                    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                    // Draw fog patches
                    for (let i = 0; i < 3; i++) {
                        let fogX = (i * canvasWidth * 0.4 + frameCount * 10) % (canvasWidth + 200) - 100;
                        let fogY = getGroundY() - 100 - i * 40;
                        let gradient = ctx.createRadialGradient(fogX, fogY, 50, fogX, fogY, 300);
                        gradient.addColorStop(0, 'rgba(220,230,240,0.08)');
                        gradient.addColorStop(1, 'rgba(220,230,240,0)');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(fogX - 300, fogY - 300, 600, 600);
                    }

                    // Draw raindrops
                    for (let drop of this.raindrops) {
                        ctx.strokeStyle = `rgba(180,200,220,${drop.opacity})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(drop.x, drop.y);
                        ctx.lineTo(drop.x + 2, drop.y + drop.length);
                        ctx.stroke();
                    }

                    // Draw leaves
                    for (let leaf of this.leaves) {
                        ctx.save();
                        ctx.translate(leaf.x, leaf.y);
                        ctx.rotate(leaf.rotation);
                        ctx.fillStyle = `rgba(180,150,100,${leaf.opacity})`;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, leaf.size, leaf.size * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(120,90,60,0.3)';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }

            // ==================== CLASS: CHICKEN (PLAYER) ====================
            class Chicken {
                constructor() {
                    this.width = CONSTANTS.CHICKEN_WIDTH * CONSTANTS.SIZE_SCALE;
                    this.height = CONSTANTS.CHICKEN_HEIGHT * CONSTANTS.SIZE_SCALE;
                    this.x = canvasWidth * 0.16;
                    this.y = getGroundY() - this.height;
                    this.velocityY = 0;
                    this.isOnGround = true;
                    this.currentPlatform = null;
                    this.airJumpsUsed = 0;
                    this.animFrame = 0;
                    this.animTimer = 0;
                    this.eyeBlinkTimer = 0;
                    this.isBlinking = false;
                    this.trailParticles = [];
                    this.jumpCooldown = 0;
                    this.shieldTimer = 0;
                    this.invincibleTimer = 0;
                    this.wingFlapPhase = 0;
                    this.fallingInHole = false;
                    this.fallTimer = 0;
                }

                update(dt) {
                    // Handle falling into hole state
                    if (this.fallingInHole) {
                        this.fallTimer += dt;
                        this.y += 400 * dt;
                        this.wingFlapPhase += dt * 10;
                        if (this.y > canvasHeight + 50) gameOver();
                        return;
                    }

                    // Cooldowns
                    if (this.jumpCooldown > 0) this.jumpCooldown -= dt;
                    if (this.shieldTimer > 0) this.shieldTimer -= dt;
                    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;

                    // Check if current platform is still valid
                    if (this.currentPlatform) {
                        let p = this.currentPlatform;
                        if (!p.active || p.x + p.width < this.x || p.x > this.x + this.width) {
                            this.currentPlatform = null;
                            this.isOnGround = false;
                        } else {
                            this.y = p.y - this.height;
                            this.velocityY = 0;
                        }
                    }

                    // Physics if not on a platform
                    if (!this.currentPlatform || !this.isOnGround) {
                        if (!this.isOnGround) {
                            this.velocityY += CONSTANTS.GRAVITY * dt;
                            this.y += this.velocityY * dt;

                            const currentGround = getGroundY();

                            // Rơi xuống chạm đất
                            if (this.y >= currentGround - this.height) {
                                this.y = currentGround - this.height;
                                this.velocityY = 0;
                                this.isOnGround = true;
                                this.currentPlatform = null;
                                this.airJumpsUsed = 0;
                                this.spawnLandingDust();
                            } else {
                                // Va chạm platform khi đang rơi
                                for (let p of platforms) {
                                    if (
                                        p.active &&
                                        this.velocityY > 0 &&
                                        this.x + this.width > p.x &&
                                        this.x < p.x + p.width &&
                                        this.y + this.height >= p.y &&
                                        this.y + this.height - this.velocityY * dt <= p.y + 5
                                    ) {
                                        this.y = p.y - this.height;
                                        this.velocityY = 0;
                                        this.isOnGround = true;
                                        this.currentPlatform = p;
                                        this.airJumpsUsed = 0;
                                        this.spawnLandingDust();
                                        break;
                                    }
                                }
                            }
                        }

                        this.wingFlapPhase += this.isOnGround ? 0 : dt * 12;
                    }

                    // Nếu đang đứng trên đất và chưa dính platform thì bám sát địa hình
                    if (this.isOnGround && !this.currentPlatform) {
                        this.y = getGroundY() - this.height;
                    }

                    // Animation
                    this.animTimer += dt;
                    if (this.isOnGround && this.animTimer > 0.08) {
                        this.animTimer = 0;
                        this.animFrame = (this.animFrame + 1) % 4;
                    }
                    if (!this.isOnGround) this.animFrame = 4;

                    // Eye blinking
                    this.eyeBlinkTimer += dt;
                    if (this.eyeBlinkTimer > 2.5 + Math.random() * 2) {
                        this.isBlinking = true;
                        this.eyeBlinkTimer = 0;
                    }
                    if (this.isBlinking && this.eyeBlinkTimer > 0.1) {
                        this.isBlinking = false;
                        this.eyeBlinkTimer = 0;
                    }

                    // Update trail particles
                    for (let i = this.trailParticles.length - 1; i >= 0; i--) {
                        let p = this.trailParticles[i];
                        p.life -= dt;
                        p.y += p.vy * dt;
                        p.x += p.vx * dt;
                        if (p.life <= 0) this.trailParticles.splice(i, 1);
                    }

                    // Spawn dust particles when running
                    if (this.isOnGround && gameState === 'playing' && Math.random() < 0.6) {
                        this.trailParticles.push({
                            x: this.x + 5 * CONSTANTS.SIZE_SCALE + Math.random() * 10 * CONSTANTS.SIZE_SCALE,
                            y: this.y + this.height - 2 * CONSTANTS.SIZE_SCALE,
                            vx: -20 * CONSTANTS.SIZE_SCALE - Math.random() * 35 * CONSTANTS.SIZE_SCALE,
                            vy: -15 * CONSTANTS.SIZE_SCALE - Math.random() * 30 * CONSTANTS.SIZE_SCALE,
                            life: 0.25 + Math.random() * 0.35,
                            size: 1.5 * CONSTANTS.SIZE_SCALE + Math.random() * 3 * CONSTANTS.SIZE_SCALE,
                            color: 'rgba(170,140,110,0.7)'
                        });
                    }
                }

                spawnLandingDust() {
                    for (let i = 0; i < 10; i++) {
                        this.trailParticles.push({
                            x: this.x + Math.random() * this.width,
                            y: this.y + this.height,
                            vx: (Math.random() - 0.5) * 70 * CONSTANTS.SIZE_SCALE,
                            vy: -50 * CONSTANTS.SIZE_SCALE - Math.random() * 70 * CONSTANTS.SIZE_SCALE,
                            life: 0.3 + Math.random() * 0.5,
                            size: 2 * CONSTANTS.SIZE_SCALE + Math.random() * 5 * CONSTANTS.SIZE_SCALE,
                            color: 'rgba(190,160,130,0.8)'
                        });
                    }
                }

                jump() {
                    // Check jump conditions
                    if (this.fallingInHole || gameState === 'falling' || gameState === 'gameover') return false;
                    if (stamina <= 0 || this.jumpCooldown > 0) return false;

                    // Perform jump
                    if (this.isOnGround) {
                        this.velocityY = CONSTANTS.JUMP_VELOCITY;
                        this.isOnGround = false;
                        this.currentPlatform = null;
                        this.airJumpsUsed = 0;
                    } else {
                        this.velocityY = CONSTANTS.JUMP_VELOCITY * 0.85;
                        this.airJumpsUsed++;
                    }

                    stamina--;
                    this.jumpCooldown = 0.08;
                        playJumpSound();

                    // Jump particles
                    for (let i = 0; i < 12; i++) {
                        this.trailParticles.push({
                            x: this.x + Math.random() * this.width,
                            y: this.y + this.height,
                            vx: (Math.random() - 0.5) * 90 * CONSTANTS.SIZE_SCALE,
                            vy: -90 * CONSTANTS.SIZE_SCALE - Math.random() * 110 * CONSTANTS.SIZE_SCALE,
                            life: 0.2 + Math.random() * 0.35,
                            size: 2 * CONSTANTS.SIZE_SCALE + Math.random() * 5 * CONSTANTS.SIZE_SCALE,
                            color: 'rgba(255,230,160,0.9)'
                        });
                    }
                    return true;
                }

                getCollisionBox() {
                    const m = 8 * CONSTANTS.SIZE_SCALE;
                    const n = 6 * CONSTANTS.SIZE_SCALE;
                    return {
                        x: this.x + m,
                        y: this.y + n,
                        width: this.width - 2 * m,
                        height: this.height - 2 * n
                    };
                }

                draw(ctx) {
                    ctx.save();

                    const cx = this.x + this.width / 2;
                    const shadowY = this.currentPlatform
                        ? this.currentPlatform.y
                        : getGroundY();

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(cx, shadowY, this.width * 0.4, 4 * CONSTANTS.SIZE_SCALE, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Shield / invincibility effect
                    if (this.shieldTimer > 0 || this.invincibleTimer > 0) {
                        ctx.fillStyle =
                            `rgba(100,200,255,${0.35 + Math.sin(frameCount * 0.2) * 0.15})`;
                        ctx.beginPath();
                        ctx.arc(cx, this.y + this.height / 2, this.width * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                        ctx.lineWidth = 3 * CONSTANTS.SIZE_SCALE;
                        ctx.stroke();
                    }

                    // Body positioning
                    const bodyX = cx - this.width * 0.05;
                    const bodyY = this.y + this.height * 0.56;
                    const bob = (this.isOnGround && gameState === 'playing') ?
                        Math.sin(this.animFrame * Math.PI / 2) * 3 * CONSTANTS.SIZE_SCALE :
                        0;

                    const bx = bodyX;
                    const by = bodyY + bob;

                    // ---- LEGS ----
                    ctx.strokeStyle = '#E8751A';
                    ctx.lineWidth = 3.2 * CONSTANTS.SIZE_SCALE;
                    ctx.lineCap = 'round';

                    if (this.isOnGround && gameState === 'playing') {
                        const phase = this.animFrame % 2;

                        // Left leg
                        ctx.beginPath();
                        ctx.moveTo(bx - 7 * CONSTANTS.SIZE_SCALE, by + 18 * CONSTANTS.SIZE_SCALE);
                        ctx.lineTo(bx - 11 * CONSTANTS.SIZE_SCALE + (phase ? -2 : 2) * CONSTANTS.SIZE_SCALE,
                            by + 30 * CONSTANTS.SIZE_SCALE);
                        ctx.stroke();

                        // Right leg
                        ctx.beginPath();
                        ctx.moveTo(bx + 1 * CONSTANTS.SIZE_SCALE, by + 18 * CONSTANTS.SIZE_SCALE);
                        ctx.lineTo(bx + 5 * CONSTANTS.SIZE_SCALE + (phase ? 2 : -2) * CONSTANTS.SIZE_SCALE,
                            by + 30 * CONSTANTS.SIZE_SCALE);
                        ctx.stroke();
                    } else {
                        // Hanging legs when in air
                        ctx.beginPath();
                        ctx.moveTo(bx - 7 * CONSTANTS.SIZE_SCALE, by + 18 * CONSTANTS.SIZE_SCALE);
                        ctx.lineTo(bx - 10 * CONSTANTS.SIZE_SCALE, by + 26 * CONSTANTS.SIZE_SCALE);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(bx + 1 * CONSTANTS.SIZE_SCALE, by + 18 * CONSTANTS.SIZE_SCALE);
                        ctx.lineTo(bx + 4 * CONSTANTS.SIZE_SCALE, by + 26 * CONSTANTS.SIZE_SCALE);
                        ctx.stroke();
                    }

                    // ---- BODY ----
                    const bodyGrad = ctx.createRadialGradient(
                        bx - 4 * CONSTANTS.SIZE_SCALE, by - 4 * CONSTANTS.SIZE_SCALE, 2 * CONSTANTS.SIZE_SCALE,
                        bx, by, this.width * 0.6
                    );
                    bodyGrad.addColorStop(0, '#FFF9C4');
                    bodyGrad.addColorStop(0.55, '#FFE082');
                    bodyGrad.addColorStop(1, '#F9A825');

                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    ctx.ellipse(bx, by, this.width * 0.42, this.height * 0.35, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#E6A020';
                    ctx.lineWidth = 1.5 * CONSTANTS.SIZE_SCALE;
                    ctx.stroke();

                    // ---- LEFT WING ----
                    const wf = !this.isOnGround ?
                        Math.sin(this.wingFlapPhase) * 0.7 :
                        Math.sin(this.animFrame * Math.PI / 2) * 0.3;

                    ctx.fillStyle = '#FFF176';
                    ctx.save();
                    ctx.translate(bx - this.width * 0.24, by - 5 * CONSTANTS.SIZE_SCALE);
                    ctx.rotate(-0.45 + wf * 0.9);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 14 * CONSTANTS.SIZE_SCALE, 8 * CONSTANTS.SIZE_SCALE, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#E6A020';
                    ctx.lineWidth = 1.1 * CONSTANTS.SIZE_SCALE;
                    ctx.stroke();
                    ctx.restore();

                    // ---- RIGHT WING ----
                    ctx.fillStyle = '#FFE57F';
                    ctx.save();
                    ctx.translate(bx + this.width * 0.16, by - 6 * CONSTANTS.SIZE_SCALE);
                    ctx.rotate(0.55 - wf * 0.7);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 10 * CONSTANTS.SIZE_SCALE, 6 * CONSTANTS.SIZE_SCALE, 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#E6A020';
                    ctx.lineWidth = 1 * CONSTANTS.SIZE_SCALE;
                    ctx.stroke();
                    ctx.restore();

                    // ---- HEAD ----
                    const headX = bx + this.width * 0.22;
                    const headY = by - this.height * 0.23;
                    const headR = this.width * 0.26;

                    const headGrad = ctx.createRadialGradient(
                        headX - 2 * CONSTANTS.SIZE_SCALE, headY - 3 * CONSTANTS.SIZE_SCALE, 2 *
                        CONSTANTS.SIZE_SCALE,
                        headX, headY, headR
                    );
                    headGrad.addColorStop(0, '#FFFEF5');
                    headGrad.addColorStop(0.6, '#FFE082');
                    headGrad.addColorStop(1, '#F9A825');

                    ctx.fillStyle = headGrad;
                    ctx.beginPath();
                    ctx.arc(headX, headY, headR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#E6A020';
                    ctx.lineWidth = 1.5 * CONSTANTS.SIZE_SCALE;
                    ctx.stroke();

                    // ---- COMB (MÀO) ----
                    ctx.fillStyle = '#E53935';
                    ctx.beginPath();
                    ctx.arc(headX - 2 * CONSTANTS.SIZE_SCALE, headY - headR - 2 * CONSTANTS.SIZE_SCALE,
                        5 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(headX + 5 * CONSTANTS.SIZE_SCALE, headY - headR - 4 * CONSTANTS.SIZE_SCALE,
                        4.5 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(headX + 11 * CONSTANTS.SIZE_SCALE, headY - headR - 1 * CONSTANTS.SIZE_SCALE,
                        3.5 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                    ctx.fill();

                    // ---- EYE ----
                    const eyeX = headX + 6 * CONSTANTS.SIZE_SCALE;
                    const eyeY = headY - 2 * CONSTANTS.SIZE_SCALE;
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(eyeX, eyeY, 7 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1.2 * CONSTANTS.SIZE_SCALE;
                    ctx.stroke();

                    if (!this.isBlinking) {
                        // Open eye
                        ctx.fillStyle = '#1A1A1A';
                        ctx.beginPath();
                        ctx.arc(eyeX + 1.5 * CONSTANTS.SIZE_SCALE, eyeY, 3.5 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                        ctx.fill();
                        // Eye highlight
                        ctx.fillStyle = '#FFF';
                        ctx.beginPath();
                        ctx.arc(eyeX - 0.5 * CONSTANTS.SIZE_SCALE, eyeY - 1.5 * CONSTANTS.SIZE_SCALE,
                            1.8 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Blinking (closed eye)
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 2 * CONSTANTS.SIZE_SCALE;
                        ctx.beginPath();
                        ctx.moveTo(eyeX - 5 * CONSTANTS.SIZE_SCALE, eyeY);
                        ctx.lineTo(eyeX + 5 * CONSTANTS.SIZE_SCALE, eyeY);
                        ctx.stroke();
                    }

                    // ---- BEAK (MỎ) ----
                    ctx.fillStyle = '#FF8F00';
                    ctx.beginPath();
                    ctx.moveTo(headX + headR -0 * CONSTANTS.SIZE_SCALE, headY - 3 * CONSTANTS.SIZE_SCALE);
                    ctx.lineTo(headX + headR + 14 * CONSTANTS.SIZE_SCALE, headY + 3 * CONSTANTS.SIZE_SCALE);
                    ctx.lineTo(headX + headR -0 * CONSTANTS.SIZE_SCALE, headY + 8 * CONSTANTS.SIZE_SCALE);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#E65100';
                    ctx.lineWidth = 1.2 * CONSTANTS.SIZE_SCALE;
                    ctx.stroke();

                    // ---- CHEEK BLUSH ----
                    ctx.fillStyle = 'rgba(255,150,150,0.5)';
                    ctx.beginPath();
                    ctx.arc(headX - 4 * CONSTANTS.SIZE_SCALE, headY + 4 * CONSTANTS.SIZE_SCALE,
                        4 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                    ctx.fill();

                    // ---- TAIL ----
                    ctx.fillStyle = '#FFE082';
                    ctx.beginPath();
                    ctx.moveTo(bx - this.width * 0.35, by - 5 * CONSTANTS.SIZE_SCALE);
                    ctx.quadraticCurveTo(bx - this.width * 0.55, by - 18 * CONSTANTS.SIZE_SCALE,
                        bx - this.width * 0.45, by - 20 * CONSTANTS.SIZE_SCALE);
                    ctx.quadraticCurveTo(bx - this.width * 0.3, by - 10 * CONSTANTS.SIZE_SCALE,
                        bx - this.width * 0.35, by - 5 * CONSTANTS.SIZE_SCALE);
                    ctx.fill();
                    ctx.strokeStyle = '#E6A020';
                    ctx.lineWidth = 1 * CONSTANTS.SIZE_SCALE;
                    ctx.stroke();

                    ctx.restore();

                    // Draw trail particles
                    for (let p of this.trailParticles) {
                        const alpha = p.life / 0.6;
                        ctx.fillStyle = p.color.replace('0.7', String(alpha * 0.7))
                            .replace('0.8', String(alpha * 0.8))
                            .replace('0.9', String(alpha * 0.9));
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ==================== CLASS: OBSTACLE ====================
            class Obstacle {
                constructor(type, platform = null) {
                    this.type = type;
                    this.platform = platform;

                    // Set dimensions based on type
                    switch (type) {
                        case 'haystack':
                            this.width = 48 * CONSTANTS.SIZE_SCALE;
                            this.height = 40 * CONSTANTS.SIZE_SCALE;
                            break;
                        case 'crate':
                            this.width = 42 * CONSTANTS.SIZE_SCALE;
                            this.height = 88 * CONSTANTS.SIZE_SCALE;
                            break;
                        case 'crate_triple':
                            this.width = 42 * CONSTANTS.SIZE_SCALE;
                            this.height = 132 * CONSTANTS.SIZE_SCALE;
                            break;
                        case 'crate_triangle':
                            this.width = 70 * CONSTANTS.SIZE_SCALE;
                            this.height = 70 * CONSTANTS.SIZE_SCALE;
                            break;
                    }

                    this.x = platform ?
                        platform.x + platform.width + 20 * CONSTANTS.SIZE_SCALE :
                        canvasWidth + 50 * CONSTANTS.SIZE_SCALE;
                    this.y = platform ? platform.y - this.height : getGroundY() - this.height;
                    this.passed = false;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;

                    if (!this.platform) {
                        this.y = getGroundY() - this.height;
                    } else {
                        this.y = this.platform.y - this.height;
                    }
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionBox() {
                    const m = 5 * CONSTANTS.SIZE_SCALE;
                    return {
                        x: this.x + m,
                        y: this.y + m,
                        width: this.width - 2 * m,
                        height: this.height - 2 * m
                    };
                }

                draw(ctx) {
                    ctx.save();
                    const x = this.x;
                    const y = this.y;

                    if (this.type === 'haystack') {
                        this.drawHaystack(ctx, x, y);
                    } else if (this.type === 'crate' || this.type === 'crate_triple') {
                        this.drawCrateStack(ctx, x, y);
                    } else if (this.type === 'crate_triangle') {
                        this.drawCrateTriangle(ctx, x, y);
                    }

                    ctx.restore();
                }

                drawHaystack(ctx, x, y) {
                    const cx = x + this.width / 2;
                    const cy = y + this.height / 2;

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(cx, y + this.height + 2 * CONSTANTS.SIZE_SCALE,
                        this.width * 0.45, 6 * CONSTANTS.SIZE_SCALE, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Main body
                    let grad = ctx.createLinearGradient(x, 0, x + this.width, 0);
                    grad.addColorStop(0, '#D4A030');
                    grad.addColorStop(0.3, '#F0D060');
                    grad.addColorStop(0.6, '#E8C848');
                    grad.addColorStop(1, '#B88828');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, this.width / 2 - 2 * CONSTANTS.SIZE_SCALE,
                        this.height / 2 - 2 * CONSTANTS.SIZE_SCALE, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#8B6914';
                    ctx.lineWidth = 2.5 * CONSTANTS.SIZE_SCALE;
                    ctx.stroke();

                    // Vertical lines
                    for (let i = 0; i < 5; i++) {
                        let lx = x + 6 * CONSTANTS.SIZE_SCALE + i * (this.width / 7);
                        ctx.strokeStyle = '#B88828';
                        ctx.lineWidth = 0.9 * CONSTANTS.SIZE_SCALE;
                        ctx.beginPath();
                        ctx.moveTo(lx, y + 4 * CONSTANTS.SIZE_SCALE);
                        ctx.quadraticCurveTo(lx + 2 * CONSTANTS.SIZE_SCALE,
                            cy + Math.sin(i) * 3 * CONSTANTS.SIZE_SCALE,
                            lx, y + this.height - 4 * CONSTANTS.SIZE_SCALE);
                        ctx.stroke();
                    }

                    // Horizontal dashed lines
                    ctx.strokeStyle = '#A07830';
                    ctx.lineWidth = 1 * CONSTANTS.SIZE_SCALE;
                    ctx.setLineDash([8 * CONSTANTS.SIZE_SCALE, 4 * CONSTANTS.SIZE_SCALE]);
                    for (let j = 0; j < 3; j++) {
                        let ly = y + 8 * CONSTANTS.SIZE_SCALE + j * (this.height / 3.5);
                        ctx.beginPath();
                        ctx.moveTo(x + 3 * CONSTANTS.SIZE_SCALE, ly);
                        ctx.quadraticCurveTo(cx, ly + (j % 2 ? 2 : -2) * CONSTANTS.SIZE_SCALE,
                            x + this.width - 3 * CONSTANTS.SIZE_SCALE, ly);
                        ctx.stroke();
                    }
                    ctx.setLineDash([]);

                    // Straw details
                    for (let i = 0; i < 5; i++) {
                        let sx = x + 4 * CONSTANTS.SIZE_SCALE + Math.random() * (this.width - 8 * CONSTANTS.SIZE_SCALE);
                        let sy = y + 3 * CONSTANTS.SIZE_SCALE + Math.random() * (this.height - 5 * CONSTANTS.SIZE_SCALE);
                        ctx.strokeStyle = '#E8C860';
                        ctx.lineWidth = 0.8 * CONSTANTS.SIZE_SCALE;
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(sx + (Math.random() - 0.5) * 12 * CONSTANTS.SIZE_SCALE,
                            sy + (Math.random() - 0.5) * 8 * CONSTANTS.SIZE_SCALE);
                        ctx.stroke();
                    }
                }

                drawCrateStack(ctx, x, y) {
                    let layers = this.type === 'crate' ? 2 : 3;
                    let crateH = this.height / layers;

                    for (let i = 0; i < layers; i++) {
                        let cy = y + i * crateH;

                        // Crate body
                        let crateGrad = ctx.createLinearGradient(x, cy, x + this.width, cy);
                        crateGrad.addColorStop(0, '#8B6340');
                        crateGrad.addColorStop(0.3, '#C49A6C');
                        crateGrad.addColorStop(0.5, '#D4AA7A');
                        crateGrad.addColorStop(0.7, '#B88458');
                        crateGrad.addColorStop(1, '#7A4E30');
                        ctx.fillStyle = crateGrad;
                        ctx.fillRect(x + 2 * CONSTANTS.SIZE_SCALE, cy + 3 * CONSTANTS.SIZE_SCALE,
                            this.width - 4 * CONSTANTS.SIZE_SCALE, crateH - 6 * CONSTANTS.SIZE_SCALE);

                        // Inner border
                        ctx.strokeStyle = '#5D3A1F';
                        ctx.lineWidth = 2.5 * CONSTANTS.SIZE_SCALE;
                        ctx.strokeRect(x + 2 * CONSTANTS.SIZE_SCALE, cy + 3 * CONSTANTS.SIZE_SCALE,
                            this.width - 4 * CONSTANTS.SIZE_SCALE, crateH - 6 * CONSTANTS.SIZE_SCALE);

                        // Wood grain vertical lines
                        ctx.strokeStyle = '#8B5E3C';
                        ctx.lineWidth = 0.8 * CONSTANTS.SIZE_SCALE;
                        for (let vx = x + 8 * CONSTANTS.SIZE_SCALE; vx < x + this.width - 4 * CONSTANTS
                            .SIZE_SCALE; vx += 9 * CONSTANTS.SIZE_SCALE) {
                            ctx.beginPath();
                            ctx.moveTo(vx, cy + 4 * CONSTANTS.SIZE_SCALE);
                            ctx.lineTo(vx, cy + crateH - 4 * CONSTANTS.SIZE_SCALE);
                            ctx.stroke();
                        }

                        // Horizontal lines
                        for (let j = 0; j < 3; j++) {
                            let ly = cy + 8 * CONSTANTS.SIZE_SCALE + j * (crateH / 3.5);
                            ctx.beginPath();
                            ctx.moveTo(x + 4 * CONSTANTS.SIZE_SCALE, ly);
                            ctx.lineTo(x + this.width - 4 * CONSTANTS.SIZE_SCALE, ly);
                            ctx.stroke();
                        }

                        // Nails
                        for (let c = 0; c < 4; c++) {
                            let nx = c % 2 === 0 ? x + 7 * CONSTANTS.SIZE_SCALE : x + this.width - 7 * CONSTANTS
                                .SIZE_SCALE;
                            let ny = c < 2 ? cy + 6 * CONSTANTS.SIZE_SCALE : cy + crateH - 9 * CONSTANTS.SIZE_SCALE;
                            ctx.fillStyle = '#3A3A3A';
                            ctx.beginPath();
                            ctx.arc(nx, ny, 2.8 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.strokeStyle = '#999';
                            ctx.lineWidth = 0.8 * CONSTANTS.SIZE_SCALE;
                            ctx.stroke();
                        }

                        // Outer border
                        ctx.strokeStyle = '#4A2A15';
                        ctx.lineWidth = 3 * CONSTANTS.SIZE_SCALE;
                        ctx.strokeRect(x, cy, this.width, crateH);
                    }
                }

                drawCrateTriangle(ctx, x, y) {
                    let bw = 28 * CONSTANTS.SIZE_SCALE;
                    let bh = 28 * CONSTANTS.SIZE_SCALE;
                    let positions = [
                        [x + 2 * CONSTANTS.SIZE_SCALE, y + this.height - bh],
                        [x + this.width - bw - 2 * CONSTANTS.SIZE_SCALE, y + this.height - bh],
                        [x + this.width / 2 - bw / 2, y + this.height - bh * 2 + 2 * CONSTANTS.SIZE_SCALE]
                    ];

                    for (let pos of positions) {
                        let crateGrad = ctx.createLinearGradient(pos[0], pos[1], pos[0] + bw, pos[1]);
                        crateGrad.addColorStop(0, '#8B6340');
                        crateGrad.addColorStop(0.5, '#D4AA7A');
                        crateGrad.addColorStop(1, '#7A4E30');
                        ctx.fillStyle = crateGrad;
                        ctx.fillRect(pos[0], pos[1], bw, bh);

                        ctx.strokeStyle = '#4A2A15';
                        ctx.lineWidth = 2 * CONSTANTS.SIZE_SCALE;
                        ctx.strokeRect(pos[0], pos[1], bw, bh);

                        ctx.strokeStyle = '#8B5E3C';
                        ctx.lineWidth = 0.8 * CONSTANTS.SIZE_SCALE;
                        for (let vx = pos[0] + 4 * CONSTANTS.SIZE_SCALE; vx < pos[0] + bw - 4 * CONSTANTS
                            .SIZE_SCALE; vx += 6 * CONSTANTS.SIZE_SCALE) {
                            ctx.beginPath();
                            ctx.moveTo(vx, pos[1] + 2 * CONSTANTS.SIZE_SCALE);
                            ctx.lineTo(vx, pos[1] + bh - 2 * CONSTANTS.SIZE_SCALE);
                            ctx.stroke();
                        }
                    }
                }
            }

            // ==================== CLASS: HOLE ====================
            class Hole {
                constructor() {
                    this.isLarge = Math.random() < 0.35;

                    if (this.isLarge) {
                        this.width = (130 + Math.random() * 70) * CONSTANTS.SIZE_SCALE;
                    } else {
                        this.width = (90 + Math.random() * 50) * CONSTANTS.SIZE_SCALE;
                    }

                    // Occasionally create very wide holes
                    if (Math.random() < 0.2) {
                        this.width = 400 + Math.random() * 1600;
                    }

                    this.x = canvasWidth + 60 * CONSTANTS.SIZE_SCALE;
                    this.y = getGroundY();
                    this.depth = canvasHeight - getGroundY() + 15 * CONSTANTS.SIZE_SCALE;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;

                    this.y = getGroundY();
                    this.depth = canvasHeight - this.y + 15 * CONSTANTS.SIZE_SCALE;
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionZone() {
                    return {
                        x: this.x + 8 * CONSTANTS.SIZE_SCALE,
                        y: this.y,
                        width: this.width - 16 * CONSTANTS.SIZE_SCALE,
                        height: this.depth
                    };
                }

                draw(ctx) {
                    let x = this.x;
                    let y = this.y;

                    // Dark hole
                    ctx.fillStyle = '#0a0500';
                    ctx.beginPath();
                    ctx.rect(x, y, this.width, this.depth);
                    ctx.fill();

                    // Depth gradient
                    let grad = ctx.createLinearGradient(0, y, 0, y + this.depth);
                    grad.addColorStop(0, '#1a0a00');
                    grad.addColorStop(1, '#000');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.rect(x + 6 * CONSTANTS.SIZE_SCALE, y, this.width - 12 * CONSTANTS.SIZE_SCALE, this.depth);
                    ctx.fill();
                }
            }

            // ==================== CLASS: SPIKE ====================
            class Spike {
                constructor() {
                    this.x = canvasWidth + 30 * CONSTANTS.SIZE_SCALE;
                    this.y = getGroundY();
                    this.width = 34 * CONSTANTS.SIZE_SCALE;
                    this.height = 22 * CONSTANTS.SIZE_SCALE;
                    this.passed = false;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;
                    this.y = getGroundY();
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionBox() {
                    return {
                        x: this.x - 2 * CONSTANTS.SIZE_SCALE,
                        y: this.y - this.height,
                        width: this.width + 4 * CONSTANTS.SIZE_SCALE,
                        height: this.height
                    };
                }

                draw(ctx) {
                    // Bóng
                    ctx.fillStyle = "rgba(0,0,0,0.22)";
                    ctx.beginPath();
                    ctx.ellipse(
                        this.x + this.width / 2,
                        this.y + 3,
                        this.width * 0.45,
                        4,
                        0,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();

                    const spikeCount = 5;
                    const spikeWidth = this.width / spikeCount;

                    for (let i = 0; i < spikeCount; i++) {
                        const sx = this.x + i * spikeWidth;

                        const grad = ctx.createLinearGradient(
                            sx,
                            this.y - this.height,
                            sx,
                            this.y
                        );

                        grad.addColorStop(0, "#EEEEEE");
                        grad.addColorStop(0.45, "#B0BEC5");
                        grad.addColorStop(1, "#616161");

                        ctx.fillStyle = grad;

                        ctx.beginPath();
                        ctx.moveTo(sx, this.y);
                        ctx.lineTo(sx + spikeWidth / 2, this.y - this.height);
                        ctx.lineTo(sx + spikeWidth, this.y);
                        ctx.closePath();
                        ctx.fill();

                        ctx.strokeStyle = "#424242";
                        ctx.lineWidth = 1.2;
                        ctx.stroke();

                        // Vệt sáng
                        ctx.strokeStyle = "rgba(255,255,255,0.55)";
                        ctx.beginPath();
                        ctx.moveTo(sx + spikeWidth / 2, this.y - this.height);
                        ctx.lineTo(sx + spikeWidth / 2, this.y - this.height * 0.45);
                        ctx.stroke();
                    }

                    // Đế gỗ
                    ctx.fillStyle = "#6D4C41";
                    ctx.fillRect(
                        this.x,
                        this.y,
                        this.width,
                        5 * CONSTANTS.SIZE_SCALE
                    );
                }
            }

            // ==================== CLASS: PLATFORM ====================
            class Platform {
                constructor(x, y, width) {
                    this.width = width || (120 + Math.random() * 100) * CONSTANTS.SIZE_SCALE;
                    this.height = 15 * CONSTANTS.SIZE_SCALE;
                    this.x = x || canvasWidth + 30 * CONSTANTS.SIZE_SCALE;
                    this.y = y || getGroundY() - 80 * CONSTANTS.SIZE_SCALE - Math.random() * 50 * CONSTANTS.SIZE_SCALE;

                    this.heightAboveGround = getGroundY() - this.y;
                    this.active = true;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;
                    this.y = getGroundY() - this.heightAboveGround;
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                draw(ctx) {
                    // Main platform
                    ctx.fillStyle = '#8B5A2B';
                    ctx.fillRect(this.x, this.y, this.width, this.height);

                    // Darker top edge
                    ctx.fillStyle = '#6B4226';
                    ctx.fillRect(this.x, this.y, this.width, this.height * 0.3);

                    // Grass on top
                    ctx.fillStyle = '#4CAF50';
                    for (let gx = this.x; gx < this.x + this.width; gx += 8 * CONSTANTS.SIZE_SCALE) {
                        ctx.fillRect(gx, this.y - 2 * CONSTANTS.SIZE_SCALE,
                            4 * CONSTANTS.SIZE_SCALE, 3 * CONSTANTS.SIZE_SCALE);
                    }
                }
            }

            // ==================== CLASS: ITEM ====================
            class Item {
                constructor(type) {
                    this.type = type;
                    this.width = 24 * CONSTANTS.SIZE_SCALE;
                    this.height = 24 * CONSTANTS.SIZE_SCALE;
                    this.x = canvasWidth + 30 * CONSTANTS.SIZE_SCALE;
                    this.heightAboveGround =
                        this.height +
                        5 * CONSTANTS.SIZE_SCALE +
                        Math.random() * 25 * CONSTANTS.SIZE_SCALE;

                    this.y = getGroundY() - this.heightAboveGround;
                    this.collected = false;
                    this.bobOffset = 0;
                }

                update(dt) {
                    this.x -= gameSpeed * dt;

                    this.y = getGroundY() - this.heightAboveGround;

                    this.bobOffset =
                        Math.sin(frameCount * 0.06 + this.x * 0.01) *
                        2 * CONSTANTS.SIZE_SCALE;
                }

                isOffScreen() {
                    return this.x < -this.width - 20 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionBox() {
                    return {
                        x: this.x,
                        y: this.y + this.bobOffset,
                        width: this.width,
                        height: this.height
                    };
                }

                draw(ctx) {
                    const y = this.y + this.bobOffset;
                    const cx = this.x + this.width / 2;
                    const cy = y + this.height / 2;

                    if (this.type === 'gold') {
                        // Gold coin
                        ctx.fillStyle = '#FFD700';
                        ctx.shadowColor = '#FFA000';
                        ctx.shadowBlur = 6 * CONSTANTS.SIZE_SCALE;
                        ctx.beginPath();
                        ctx.arc(cx, cy, this.width * 0.4, 0, Math.PI * 2);
                        ctx.fill();

                        // Highlight
                        ctx.fillStyle = '#FFF8E1';
                        ctx.beginPath();
                        ctx.arc(cx - 2 * CONSTANTS.SIZE_SCALE, cy - 2 * CONSTANTS.SIZE_SCALE,
                            this.width * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                    } else if (this.type === 'stamina') {
                        // Stamina potion
                        ctx.fillStyle = '#00E5FF';
                        ctx.shadowColor = '#0066CC';
                        ctx.shadowBlur = 5 * CONSTANTS.SIZE_SCALE;
                        ctx.beginPath();
                        ctx.roundRect(this.x, y, this.width, this.height, 4 * CONSTANTS.SIZE_SCALE);
                        ctx.fill();

                        ctx.fillStyle = '#FFF';
                        ctx.font = `bold ${12 * CONSTANTS.SIZE_SCALE}px "Segoe UI"`;
                        ctx.textAlign = 'center';
                        ctx.fillText('⚡', cx, cy + 4 * CONSTANTS.SIZE_SCALE);
                        ctx.shadowBlur = 0;

                    } else if (this.type === 'shield') {
                        // Shield
                        ctx.fillStyle = '#80D8FF';
                        ctx.shadowColor = '#0091EA';
                        ctx.shadowBlur = 5 * CONSTANTS.SIZE_SCALE;
                        ctx.beginPath();
                        ctx.arc(cx, cy, this.width * 0.45, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#FFF';
                        ctx.font = `bold ${12 * CONSTANTS.SIZE_SCALE}px "Segoe UI"`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🛡️', cx, cy + 4 * CONSTANTS.SIZE_SCALE);
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // ==================== CLASS: EAGLE ====================
            class Eagle {
                constructor() {
                    this.width = 70 * CONSTANTS.SIZE_SCALE;
                    this.height = 50 * CONSTANTS.SIZE_SCALE;
                    this.x = canvasWidth + 200 * CONSTANTS.SIZE_SCALE;
                    this.y = getGroundY() * (0.15 + Math.random() * 0.5);
                    this.speed = gameSpeed * 2.8;
                    this.passed = false;
                    this.warning = 3.0; // Warning time before attack
                    this.active = false;
                }

                update(dt) {
                    if (this.warning > 0) {
                        this.warning -= dt;
                        this.x -= gameSpeed * 0.3 * dt;
                    } else {
                        this.active = true;
                        this.x -= this.speed * dt;
                    }
                }

                isOffScreen() {
                    return this.x < -this.width - 30 * CONSTANTS.SIZE_SCALE;
                }

                getCollisionBox() {
                    return {
                        x: this.x + 10 * CONSTANTS.SIZE_SCALE,
                        y: this.y + 5 * CONSTANTS.SIZE_SCALE,
                        width: this.width - 20 * CONSTANTS.SIZE_SCALE,
                        height: this.height - 10 * CONSTANTS.SIZE_SCALE
                    };
                }

                draw(ctx) {
                    const x = this.x;
                    const y = this.y;
                    const w = this.width;
                    const h = this.height;

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.beginPath();
                    ctx.ellipse(x + w / 2, y + h + 3 * CONSTANTS.SIZE_SCALE,
                        w * 0.4, 4 * CONSTANTS.SIZE_SCALE, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Body
                    ctx.fillStyle = '#4E342E';
                    ctx.beginPath();
                    ctx.moveTo(x + 15 * CONSTANTS.SIZE_SCALE, y + 10 * CONSTANTS.SIZE_SCALE);
                    ctx.quadraticCurveTo(x + 30 * CONSTANTS.SIZE_SCALE, y - 15 * CONSTANTS.SIZE_SCALE,
                        x + w - 10 * CONSTANTS.SIZE_SCALE, y + 5 * CONSTANTS.SIZE_SCALE);
                    ctx.lineTo(x + w - 20 * CONSTANTS.SIZE_SCALE, y + 20 * CONSTANTS.SIZE_SCALE);
                    ctx.quadraticCurveTo(x + 40 * CONSTANTS.SIZE_SCALE, y + 5 * CONSTANTS.SIZE_SCALE,
                        x + 10 * CONSTANTS.SIZE_SCALE, y + 20 * CONSTANTS.SIZE_SCALE);
                    ctx.closePath();
                    ctx.fill();

                    // Tail
                    ctx.fillStyle = '#3E2723';
                    ctx.beginPath();
                    ctx.moveTo(x + 20 * CONSTANTS.SIZE_SCALE, y + 20 * CONSTANTS.SIZE_SCALE);
                    ctx.quadraticCurveTo(x + 40 * CONSTANTS.SIZE_SCALE, y + 40 * CONSTANTS.SIZE_SCALE,
                        x + w - 15 * CONSTANTS.SIZE_SCALE, y + 25 * CONSTANTS.SIZE_SCALE);
                    ctx.lineTo(x + w - 15 * CONSTANTS.SIZE_SCALE, y + 35 * CONSTANTS.SIZE_SCALE);
                    ctx.quadraticCurveTo(x + 50 * CONSTANTS.SIZE_SCALE, y + 45 * CONSTANTS.SIZE_SCALE,
                        x + 25 * CONSTANTS.SIZE_SCALE, y + 30 * CONSTANTS.SIZE_SCALE);
                    ctx.closePath();
                    ctx.fill();

                    // Wing
                    ctx.fillStyle = '#5D4037';
                    ctx.beginPath();
                    ctx.ellipse(x + w * 0.5, y + h * 0.5,
                        w * 0.2, h * 0.25, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Head
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(x + 10 * CONSTANTS.SIZE_SCALE, y + 10 * CONSTANTS.SIZE_SCALE,
                        12 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                    ctx.fill();

                    // Eye
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(x + 6 * CONSTANTS.SIZE_SCALE, y + 8 * CONSTANTS.SIZE_SCALE,
                        3 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                    ctx.fill();

                    // Eye highlight
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(x + 5 * CONSTANTS.SIZE_SCALE, y + 7 * CONSTANTS.SIZE_SCALE,
                        1.2 * CONSTANTS.SIZE_SCALE, 0, Math.PI * 2);
                    ctx.fill();

                    // Beak
                    ctx.fillStyle = '#FFC107';
                    ctx.beginPath();
                    ctx.moveTo(x - 2 * CONSTANTS.SIZE_SCALE, y + 12 * CONSTANTS.SIZE_SCALE);
                    ctx.lineTo(x - 16 * CONSTANTS.SIZE_SCALE, y + 10 * CONSTANTS.SIZE_SCALE);
                    ctx.lineTo(x - 2 * CONSTANTS.SIZE_SCALE, y + 16 * CONSTANTS.SIZE_SCALE);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            function getSkyState() {
                const total = DAY_DURATION + TRANSITION_TIME;
                const cycle = total * 4;

                let t = dayTimer % cycle;

                const skies = [
                    {
                        top:"#FDBA74",
                        mid:"#FDE68A",
                        bottom:"#FFF7D6",
                        sun:"#FFD54F",
                        sunY:0.22,
                        stars:false,
                        moon:false
                    },
                    {
                        top:"#7EC8E3",
                        mid:"#A8D8EA",
                        bottom:"#DAF0F7",
                        sun:"#FFD54F",
                        sunY:0.12,
                        stars:false,
                        moon:false
                    },
                    {
                        top:"#FF8A65",
                        mid:"#F48FB1",
                        bottom:"#9575CD",
                        sun:"#FFB74D",
                        sunY:0.28,
                        stars:false,
                        moon:false
                    },
                    {
                        top:"#08142E",
                        mid:"#13294B",
                        bottom:"#223B63",
                        sun:"#FFFFFF",
                        sunY:0.15,
                        stars:true,
                        moon:true
                    }
                ];

                let phase = Math.floor(t / total);

                let local = t % total;

                if(local < DAY_DURATION){
                    return skies[phase];
                }

                let next = (phase + 1) % 4;

                let p = (local - DAY_DURATION) / TRANSITION_TIME;

                const lerpColor = (a,b)=>{
                    const ca=parseInt(a.slice(1),16);
                    const cb=parseInt(b.slice(1),16);

                    const ar=(ca>>16)&255;
                    const ag=(ca>>8)&255;
                    const ab=ca&255;

                    const br=(cb>>16)&255;
                    const bg=(cb>>8)&255;
                    const bb=cb&255;

                    const r=Math.round(ar+(br-ar)*p);
                    const g=Math.round(ag+(bg-ag)*p);
                    const bl=Math.round(ab+(bb-ab)*p);

                    return `rgb(${r},${g},${bl})`;
                };

                return {
                    top:lerpColor(skies[phase].top,skies[next].top),
                    mid:lerpColor(skies[phase].mid,skies[next].mid),
                    bottom:lerpColor(skies[phase].bottom,skies[next].bottom),
                    sun:lerpColor(skies[phase].sun,skies[next].sun),
                    sunY: skies[phase].sunY + (skies[next].sunY - skies[phase].sunY) * p,
                    stars: p > 0.5 ? skies[next].stars : skies[phase].stars,
                    moon: p > 0.5 ? skies[next].moon : skies[phase].moon
                };
            }

                drawTree(ctx, t) {

                    ctx.quadraticCurveTo(-trunkW * 0.25, trunkTop, 0, trunkTop);
                    ctx.quadraticCurveTo(trunkW * 0.25, trunkTop, trunkW * 0.45, trunkTop + trunkH * 0.2);

                    ctx.strokeStyle = '#5A351B';
                    ctx.lineWidth = 4.5;
                    ctx.lineCap = 'round';

                    const branches = [
                        [-2, trunkTop + 28, -26, trunkTop + 8],
                        [3, trunkTop + 42, 30, trunkTop + 18],
                        [0, trunkTop + 62, -22, trunkTop + 46],
                        [5, trunkTop + 78, 26, trunkTop + 60]
                    ];

                    for (const b of branches) {
                        ctx.beginPath();
                        ctx.moveTo(b[0], b[1]);
                        ctx.quadraticCurveTo((b[0] + b[2]) / 2, b[1] - 10, b[2], b[3]);

                    const centerX = sway;

                draw(ctx) {
                    const gy = getGroundY();
                    const sky = getSkyState();

                    const skyGrad = ctx.createLinearGradient(0, 0, 0, gy);
                    skyGrad.addColorStop(0, sky.top);
                    skyGrad.addColorStop(0.5, sky.mid);
                    skyGrad.addColorStop(1, sky.bottom);
                    ctx.fillStyle = skyGrad;
                    ctx.fillRect(0, 0, canvasWidth, gy);

                    const sunX = canvasWidth * 0.83;
                    const sunY = canvasHeight * sky.sunY;

                    const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.5, sunX, sunY, sunR * 3.5);
                    glow.addColorStop(0, 'rgba(255,255,220,0.9)');

                        grad.addColorStop(1, '#8B9A6B');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.moveTo(m.x - m.w * 0.05, gy);
                        ctx.quadraticCurveTo(m.x + m.w * 0.25, gy - m.h * 0.75, m.x + m.w * 0.5, gy - m.h);
                        ctx.quadraticCurveTo(m.x + m.w * 0.7, gy - m.h * 0.6, m.x + m.w + 10, gy);
                        ctx.fill();
                    }

                    for (let t of this.trees) {
                        this.drawTree(ctx, t);
                    }

                    for (let b of this.bushes) {
                        const bx = b.x;
                        const by = gy;
                        const bs = b.s;
                        const bsway = Math.sin(b.sway) * 2;

                        ctx.fillStyle = '#6B9B3A';
                        ctx.beginPath();
                        ctx.arc(bx, by - bs * 0.15, bs * 0.5, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#7DAF4A';
                        ctx.beginPath();
                        ctx.arc(bx + bs * 0.3 + bsway, by - bs * 0.2, bs * 0.4, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#5A8A2E';
                        ctx.beginPath();
                        ctx.arc(bx - bs * 0.2 + bsway * 0.7, by - bs * 0.1, bs * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    for (let f of this.flowers) {
                        const fx = f.x;
                        const fy = gy - 3;

                        for (let p = 0; p < 5; p++) {
                            const angle = (p / 5) * Math.PI * 2;
                            ctx.fillStyle = f.color;
                            ctx.beginPath();
                            ctx.arc(
                                fx + Math.cos(angle) * f.size * 0.6,
                                fy + Math.sin(angle) * f.size * 0.6,
                                f.size * 0.4,
                                0,
                                Math.PI * 2
                            );
                            ctx.fill();
                        }

                        ctx.fillStyle = '#FFEE58';
                        ctx.beginPath();
                        ctx.arc(fx, fy, f.size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    const roadGrad = ctx.createLinearGradient(0, gy, 0, canvasHeight);
                    roadGrad.addColorStop(0, '#C4A46C');
                    roadGrad.addColorStop(0.1, '#A08450');
                    roadGrad.addColorStop(1, '#6B4F2A');
                    ctx.fillStyle = roadGrad;
                    ctx.fillRect(0, gy, canvasWidth, canvasHeight - gy);

                    ctx.strokeStyle = 'rgba(255,255,240,0.45)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([35, 28]);
                    ctx.lineDashOffset = -this.groundOffset;
                    ctx.beginPath();
                    ctx.moveTo(0, gy + 10);
                    ctx.lineTo(canvasWidth, gy + 10);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    const grassGrad = ctx.createLinearGradient(0, gy - 6, 0, gy + 4);
                    grassGrad.addColorStop(0, '#66BB6A');
                    grassGrad.addColorStop(1, '#43A047');
                    ctx.fillStyle = grassGrad;
                    ctx.fillRect(0, gy - 4, canvasWidth, 8);

                    for (let gx = -this.groundOffset % 16; gx < canvasWidth; gx += 16) {
                        const gh = 4 + Math.sin(gx * 0.35 + frameCount * 0.03) * 3;
                        ctx.strokeStyle = '#4CAF50';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(gx, gy - 2);
                        ctx.quadraticCurveTo(gx + 2.5, gy - gh, gx + 5, gy - 1);
                        ctx.stroke();
                    }
                }
            }

function playLoseSound() {
    if (audioCtx.state === "suspended") audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";

    // Tiếng hét từ cao xuống thấp
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
        2000,
        audioCtx.currentTime + 0.5
    );

    gain.gain.setValueAtTime(0.48, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.0053,
        audioCtx.currentTime + 0.9
    );

    // Rung nhẹ giống tiếng la
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();

    lfo.frequency.value = 15;
    lfoGain.gain.value = 100;

    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    lfo.start();
    osc.start();

    lfo.stop(audioCtx.currentTime + 0.9);
    osc.stop(audioCtx.currentTime + 0.9);
}
