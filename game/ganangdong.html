                for (let i=0; i<5; i++) { let sx=x+4*SIZE_SCALE+Math.random()*(this.width-8*SIZE_SCALE), sy=y+3*SIZE_SCALE+Math.random()*(this.height-5*SIZE_SCALE); ctx.strokeStyle='#E8C860'; ctx.lineWidth=0.8*SIZE_SCALE; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+(Math.random()-0.5)*12*SIZE_SCALE,sy+(Math.random()-0.5)*8*SIZE_SCALE); ctx.stroke(); }

    function resizeCanvas() { canvasWidth=container.clientWidth; canvasHeight=container.clientHeight; canvas.width=canvasWidth*(window.devicePixelRatio||1); canvas.height=canvasHeight*(window.devicePixelRatio||1); canvas.style.width=canvasWidth+'px'; canvas.style.height=canvasHeight+'px'; ctx.setTransform(1,0,0,1,0,0); ctx.scale(window.devicePixelRatio||1,window.devicePixelRatio||1); groundY=canvasHeight*GROUND_RATIO; restartButton.x=canvasWidth/2-restartButton.w/2; restartButton.y=canvasHeight/2+30; if (chicken && !hasStartedPlaying) { chicken.y=groundY-chicken.height; chicken.x=canvasWidth*0.16; } if (bgElements) bgElements.init(); if (weatherManager) weatherManager.init(); }

    function gameOver() { if(gameState==='gameover') return; gameState='gameover'; gameOverAnimTimer=0; if(score>bestScore) { bestScore=Math.floor(score); localStorage.setItem('chickenRunBest_v26',bestScore); } }
    function jump() { if(isBlocked||!chicken||chicken.fallingInHole||gameState==='falling'||gameState==='gameover') return; if(gameState==='waiting'){startGame(); chicken.jump();} else if(gameState==='playing') chicken.jump(); }

    function checkCollisions() { if(!chicken||gameState!=='playing'||chicken.fallingInHole) return; const box=chicken.getCollisionBox(); if(chicken.invincibleTimer>0) return; for(let obs of obstacles) { const oBox=obs.getCollisionBox(); if(box.x<oBox.x+oBox.width&&box.x+box.width>oBox.x&&box.y<oBox.y+oBox.height&&box.y+box.height>oBox.y) { if(chicken.shieldTimer>0){chicken.shieldTimer=0; chicken.invincibleTimer=0.5; obs.passed=true; continue;} gameOver(); return; } if(!obs.passed&&obs.x+obs.width<box.x){obs.passed=true; score+=10;} } for(let hole of holes) { const hZone=hole.getCollisionZone(); if(chicken.isOnGround&&!chicken.currentPlatform&&box.x+box.width>hZone.x+4*SIZE_SCALE&&box.x<hZone.x+hZone.width-4*SIZE_SCALE) { if(chicken.shieldTimer>0){chicken.shieldTimer=0; chicken.invincibleTimer=0.5; hole.passed=true; continue;} gameState='falling'; chicken.fallingInHole=true; chicken.fallTimer=0; return; } if(!hole.passed&&hole.x+hole.width<box.x){hole.passed=true; score+=15;} } for(let spike of spikes) { const sBox=spike.getCollisionBox(); if(box.x<sBox.x+sBox.width&&box.x+box.width>sBox.x&&box.y<sBox.y+sBox.height&&box.y+box.height>sBox.y) { if(chicken.shieldTimer>0){chicken.shieldTimer=0; chicken.invincibleTimer=0.5; spike.passed=true; continue;} gameOver(); return; } if(!spike.passed&&spike.x+spike.width<box.x){spike.passed=true; score+=5;} } for(let eagle of eagles) { if(!eagle.active) continue; const eBox=eagle.getCollisionBox(); if(box.x<eBox.x+eBox.width&&box.x+box.width>eBox.x&&box.y<eBox.y+eBox.height&&box.y+box.height>eBox.y) { if(chicken.shieldTimer>0){chicken.shieldTimer=0; chicken.invincibleTimer=0.5; eagle.passed=true; continue;} gameOver(); return; } } for(let item of items) { if(item.collected) continue; const iBox=item.getCollisionBox(); if(box.x<iBox.x+iBox.width&&box.x+box.width>iBox.x&&box.y<iBox.y+iBox.height&&box.y+box.height>iBox.y) { item.collected=true; if(item.type==='gold') score+=50; else if(item.type==='stamina') stamina=Math.min(STAMINA_MAX,stamina+2); else if(item.type==='shield') chicken.shieldTimer=5; } } }
    let spawnTimer=0, nextSpawnDelay=1.2, itemSpawnTimer=0, eagleSpawnTimer=0;

    function spawnObstacle() {
        const r=Math.random();
        if(r<0.3) { let obs=new Obstacle('haystack'); if(!isOverHole(obs.x, obs.width) && isPositionClear(obs.x,obs.y,obs.width,obs.height)) obstacles.push(obs); }
        else if(r<0.5) { let obs=new Obstacle('crate'); if(!isOverHole(obs.x, obs.width) && isPositionClear(obs.x,obs.y,obs.width,obs.height)) obstacles.push(obs); }
        else if(r<0.65) { let obs=new Obstacle('crate_triple'); if(!isOverHole(obs.x, obs.width) && isPositionClear(obs.x,obs.y,obs.width,obs.height)) obstacles.push(obs); }
        else if(r<0.75) { let obs=new Obstacle('crate_triangle'); if(!isOverHole(obs.x, obs.width) && isPositionClear(obs.x,obs.y,obs.width,obs.height)) obstacles.push(obs); }
        else if(r<0.9) { let sp=new Spike(); if(!isOverHole(sp.x, sp.width) && isPositionClear(sp.x,sp.y,sp.width,sp.height)) spikes.push(sp); }
        else {
            let hole=new Hole();
            if(isPositionClear(hole.x,hole.y,hole.width,hole.depth)) {
                holes.push(hole);
                if (hole.width > 400 * SIZE_SCALE) {
                    let platformWidth = 100 * SIZE_SCALE, gap = 130 * SIZE_SCALE;
                    let startX = hole.x + 60 * SIZE_SCALE, endX = hole.x + hole.width - 60 * SIZE_SCALE - platformWidth;
                    let currentX = startX;
                    while (currentX < endX && platforms.length < 8) {
                        let plat = new Platform(currentX, groundY - 90 * SIZE_SCALE, platformWidth);
                        if (isPositionClear(plat.x, plat.y, plat.width, plat.height)) platforms.push(plat);
                        currentX += platformWidth + gap;
                    }
                }
            }
        }
    }

    function spawnItem() { const types=['gold','gold','stamina','shield']; const type=types[Math.floor(Math.random()*types.length)]; const newItem=new Item(type); if(isPositionClear(newItem.x,newItem.y,newItem.width,newItem.height)) items.push(newItem); }
    function spawnEagle() { eagles.push(new Eagle()); }

    function update(dt) { if(isBlocked) return; if(gameState==='gameover'){ gameOverAnimTimer+=dt; } if(gameState==='falling'){ if(chicken) chicken.update(dt); return; } if(gameState==='playing') { if(chicken&&chicken.fallingInHole){ chicken.update(dt); return; } gameSpeed=Math.min(GAME_SPEED_MAX,gameSpeed+GAME_SPEED_INCREMENT*dt); staminaTimer+=dt; if(staminaTimer>=STAMINA_REGEN_TIME&&stamina<STAMINA_MAX){ stamina++; staminaTimer-=STAMINA_REGEN_TIME; if(stamina>STAMINA_MAX) stamina=STAMINA_MAX; } if(stamina>=STAMINA_MAX) staminaTimer=0; spawnTimer+=dt; if(spawnTimer>=nextSpawnDelay){ spawnTimer=0; spawnObstacle(); const baseDelay=0.9; const variation=Math.random()*0.9; nextSpawnDelay=baseDelay+variation*(1-gameSpeed/GAME_SPEED_MAX*0.4); if(Math.random()<0.15&&gameSpeed>350) setTimeout(()=>{if(gameState==='playing') spawnObstacle();},150+Math.random()*250); } itemSpawnTimer+=dt; if(itemSpawnTimer>4+Math.random()*3){ itemSpawnTimer=0; if(items.length<2) spawnItem(); } eagleSpawnTimer+=dt; if(eagleSpawnTimer>15+Math.random()*10&&gameSpeed>350){ eagleSpawnTimer=0; if(eagles.length===0) spawnEagle(); } score+=gameSpeed*dt*0.05; } if(chicken&&!chicken.fallingInHole) chicken.update(dt); for(let o of obstacles) o.update(dt); for(let h of holes) h.update(dt); for(let s of spikes) s.update(dt); for(let p of platforms) p.update(dt); for(let item of items) item.update(dt); for(let eagle of eagles) eagle.update(dt); obstacles=obstacles.filter(o=>!o.isOffScreen()); holes=holes.filter(h=>!h.isOffScreen()); spikes=spikes.filter(s=>!s.isOffScreen()); platforms=platforms.filter(p=>!p.isOffScreen()); items=items.filter(i=>!i.isOffScreen()&&!i.collected); eagles=eagles.filter(e=>!e.isOffScreen()); if(bgElements) bgElements.update(dt); if(weatherManager) weatherManager.update(dt); if(gameState==='playing') checkCollisions(); }

    function draw(ctx) { ctx.clearRect(0,0,canvasWidth,canvasHeight); if(bgElements) bgElements.draw(ctx); for(let h of holes) h.draw(ctx); for(let o of obstacles) o.draw(ctx); for(let s of spikes) s.draw(ctx); for(let p of platforms) p.draw(ctx); for(let item of items) item.draw(ctx); for(let eagle of eagles) eagle.draw(ctx); if(chicken) chicken.draw(ctx); if(weatherManager) weatherManager.draw(ctx); const boltWidth=28, boltHeight=36, boltGap=6, startX=20, startY=20; for(let i=0; i<STAMINA_MAX; i++) { const bx=startX+i*(boltWidth+boltGap), by=startY, bw=boltWidth, bh=boltHeight; ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,6); ctx.fill(); if(i<stamina) { const cx=bx+bw/2, cy=by+bh/2; const glow=ctx.createRadialGradient(cx,cy,bw*0.2,cx,cy,bw*0.8); glow.addColorStop(0,'rgba(100,255,218,0.8)'); glow.addColorStop(0.5,'rgba(0,200,255,0.4)'); glow.addColorStop(1,'rgba(0,150,255,0)'); ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(cx,cy,bw*0.8,0,Math.PI*2); ctx.fill(); const bolt=ctx.createLinearGradient(0,by,0,by+bh); bolt.addColorStop(0,'#E0FFFF'); bolt.addColorStop(0.3,'#00E5FF'); bolt.addColorStop(0.5,'#00B8D4'); bolt.addColorStop(0.7,'#0091EA'); bolt.addColorStop(1,'#0066CC'); ctx.fillStyle=bolt; ctx.beginPath(); ctx.moveTo(cx,by+3); ctx.lineTo(cx-bw*0.35,cy-2); ctx.lineTo(cx-3,cy-4); ctx.lineTo(cx-bw*0.15,by+bh-3); ctx.lineTo(cx+bw*0.35,cy+2); ctx.lineTo(cx+3,cy+4); ctx.lineTo(cx+bw*0.15,by+3); ctx.closePath(); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5; ctx.stroke(); ctx.fillStyle='#FFF'; ctx.beginPath(); ctx.arc(cx,cy,3.5,0,Math.PI*2); ctx.fill(); } } ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.roundRect(canvasWidth-155,15,140,45,12); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='#FFF'; ctx.font='bold 19px "Segoe UI"'; ctx.textAlign='right'; ctx.fillText(`🏆 ${Math.floor(score)}`,canvasWidth-30,45); ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.font='11px "Segoe UI"'; ctx.fillText(`Best: ${Math.floor(bestScore)}`,canvasWidth-30,60); if(chicken&&(chicken.shieldTimer>0||chicken.invincibleTimer>0)) { ctx.fillStyle='rgba(100,200,255,0.8)'; ctx.font='bold 12px "Segoe UI"'; ctx.textAlign='left'; ctx.fillText(`🛡️ ${(chicken.shieldTimer>0?chicken.shieldTimer:chicken.invincibleTimer).toFixed(1)}s`,20,80); } if(gameState==='waiting') { ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='bold 20px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('👆 Chạm để bắt đầu!',canvasWidth/2,canvasHeight*0.42); } if(gameState==='gameover') { const overlayAlpha=Math.min(0.8,gameOverAnimTimer*2); ctx.fillStyle=`rgba(0,0,0,${overlayAlpha})`; ctx.fillRect(0,0,canvasWidth,canvasHeight); const panelW=300, panelH=190, targetPanelY=canvasHeight/2-panelH/2-20; const slideOffset=Math.max(0,(1-gameOverAnimTimer*3)*200); const panelX=canvasWidth/2-panelW/2, panelY=targetPanelY+slideOffset; ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.roundRect(panelX,panelY,panelW,panelH,20); ctx.fill(); ctx.strokeStyle='#FF8F00'; ctx.lineWidth=4; ctx.stroke(); const scale=1+Math.sin(gameOverAnimTimer*8)*0.03; ctx.save(); ctx.translate(canvasWidth/2,panelY+45); ctx.scale(scale,scale); ctx.fillStyle='#E53935'; ctx.font='bold 26px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('💔 Thua rồi!',0,0); ctx.restore(); ctx.fillStyle='#333'; ctx.font='18px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText(`Điểm: ${Math.floor(score)}`,canvasWidth/2,panelY+85); ctx.fillText(`Kỷ lục: ${Math.floor(bestScore)}`,canvasWidth/2,panelY+115); const btnX=restartButton.x, btnY=restartButton.y, btnW=restartButton.w, btnH=restartButton.h; const pulse=1+Math.sin(gameOverAnimTimer*5)*0.05; ctx.save(); ctx.translate(btnX+btnW/2,btnY+btnH/2); ctx.scale(pulse,pulse); const grad=ctx.createLinearGradient(-btnW/2,-btnH/2,btnW/2,btnH/2); grad.addColorStop(0,'#FFB300'); grad.addColorStop(1,'#FF8F00'); ctx.fillStyle=grad; ctx.beginPath(); ctx.roundRect(-btnW/2,-btnH/2,btnW,btnH,35); ctx.fill(); ctx.fillStyle='#FFF'; ctx.font='bold 22px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('CHƠI LẠI',0,8); ctx.restore(); for(let i=0; i<10; i++) { const angle=(i/10)*Math.PI*2+gameOverAnimTimer*2, radius=120+Math.sin(gameOverAnimTimer*3+i)*30; const px=canvasWidth/2+Math.cos(angle)*radius, py=canvasHeight/2-20+Math.sin(angle)*radius*0.6; const alpha=0.5+Math.sin(gameOverAnimTimer*4+i)*0.3; ctx.fillStyle=`rgba(255,215,0,${alpha})`; ctx.beginPath(); ctx.arc(px,py,4+Math.sin(gameOverAnimTimer*5+i)*2,0,Math.PI*2); ctx.fill(); } } }

    function handleCanvasClick(e) { if(isBlocked) return; const rect=canvas.getBoundingClientRect(); const scaleX=canvasWidth/rect.width, scaleY=canvasHeight/rect.height; let clientX, clientY; if(e.touches){ clientX=e.touches[0].clientX; clientY=e.touches[0].clientY; } else { clientX=e.clientX; clientY=e.clientY; } const x=(clientX-rect.left)*scaleX, y=(clientY-rect.top)*scaleY; if(gameState==='gameover') { if(x>=restartButton.x&&x<=restartButton.x+restartButton.w&&y>=restartButton.y&&y<=restartButton.y+restartButton.h) { e.preventDefault(); resetGame(); startGame(); if(chicken) chicken.jump(); return; } return; } e.preventDefault(); if(gameState==='waiting'){ startGame(); chicken.jump(); } else jump(); }
    canvas.addEventListener('click',handleCanvasClick); canvas.addEventListener('touchstart',(e)=>{ e.preventDefault(); handleCanvasClick(e); },{passive:false});
    document.addEventListener('keydown',(e)=>{ if(isBlocked) return; if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); if(gameState==='gameover'){resetGame(); startGame(); if(chicken) chicken.jump();} else jump(); } });

    function gameLoop(ts) { if(!lastTime) lastTime=ts; let dt=Math.min(0.15,(ts-lastTime)/1000); lastTime=ts; frameCount++; update(dt); draw(ctx); requestAnimationFrame(gameLoop); }
    if(!ctx.roundRect) { ctx.roundRect=function(x,y,w,h,r){ if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r}; ctx.beginPath(); ctx.moveTo(x+r.tl,y); ctx.lineTo(x+w-r.tr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r.tr); ctx.lineTo(x+w,y+h-r.br); ctx.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h); ctx.lineTo(x+r.bl,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r.bl); ctx.lineTo(x,y+r.tl); ctx.quadraticCurveTo(x,y,x+r.tl,y); ctx.closePath(); }; }
    resizeCanvas(); resetGame(); requestAnimationFrame(gameLoop);
})();
</script>
