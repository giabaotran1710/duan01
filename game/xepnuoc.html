<style>

.pill{background:linear-gradient(#ffb02e,#f07a12);border-radius:20px;padding:6px 18px;font-weight:900;font-size:18px;letter-spacing:.5px;box-shadow:0 3px 0 #9a4a08,0 6px 12px #0006;text-shadow:0 2px 0 #9a4a08}

.gl{position:absolute;top:7%;left:0;right:0;bottom:0;border:2px solid #9bb3ffaa;border-radius:calc(var(--w)*.42) calc(var(--w)*.42) calc(var(--w)*.3) calc(var(--w)*.3);background:linear-gradient(90deg,#ffffff22,#ffffff0a 40%,#0004);overflow:hidden;display:flex;flex-direction:column-reverse;padding:3px;box-shadow:inset 0 0 10px #9bb3ff44,0 4px 10px #0006}
.gl::after{content:"";position:absolute;left:16%;top:8%;width:11%;bottom:22%;border-radius:8px;background:linear-gradient(#fff9,#fff2);pointer-events:none}
.ly{height:calc(100% / var(--cap));flex:none;background-image:linear-gradient(90deg,#ffffff55,#ffffff00 35%,#00000033);border-top:1px solid #ffffff44}
.ly.fog{background:linear-gradient(#3b3f73,#23264d);color:#ffffff66;font-weight:900;font-size:calc(var(--w)*.34);line-height:1;display:flex;align-items:center;justify-content:center}
.ly:first-child{border-radius:0 0 calc(var(--w)*.26) calc(var(--w)*.26)}
.bt.done .lip{background:linear-gradient(90deg,#c97a10,#ffe08a 45%,#d98a18);border-color:#ffd86b}
.bt.done .gl{box-shadow:inset 0 0 10px #ffd86b66,0 0 14px #ffd86b66}
#st{position:fixed;width:7px;border-radius:4px;display:none;z-index:30;transition:height .12s linear;pointer-events:none;box-shadow:inset 2px 0 #fff5}
.bar{display:flex;justify-content:center;gap:10px;padding:10px 12px 16px}
.bar button{width:68px;border:0;border-radius:18px;padding:8px 0 6px;color:#fff;font:800 11px "Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#7a56e8,#4c2ba8);box-shadow:0 4px 0 #2a1668,0 8px 14px #0006;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar button i{font-style:normal;font-size:24px;line-height:26px}

.bar button.off{opacity:.45}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#000b;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:86vw;z-index:60}

.card h2{margin:0 0 6px;font-size:30px;color:#ffd86b;text-shadow:0 3px 0 #9a4a08}
.card p{margin:0 0 18px;font-size:16px;opacity:.9}

.card button{border:0;border-radius:18px;padding:14px 30px;font:900 18px "Trebuchet MS",system-ui,sans-serif;color:#fff;background:linear-gradient(#ffb02e,#f07a12);box-shadow:0 4px 0 #9a4a08}

<div id="modal"><div class="card"><div class="stars2"><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i></div><h2>Hoàn thành!</h2><p id="wt"></p><button id="bN">Ván mới</button></div></div>

<script>
/* ===== CONFIG ===== */
const CFG={
  CAP:5, EMPTY:1,
  KEY:'xepnuoc_v2', MAX_HIST:100, SCRAMBLE_TRIES:60000, COUNT_NODES:20000,
  COLORS:['#e53935','#1e88e5','#43a047','#fdd835','#fb8c00','#8e24aa','#ec407a','#00acc1','#c0ca33','#6d4c41','#eceff1','#78909c']
};
/* Độ khó: colors = số lọ màu (mỗi lọ 5 nấc), recipes = số công thức pha màu trong ván,
   minSteps = độ xáo trộn tối thiểu, frag = tỉ lệ nấc nằm cạnh nấc khác màu tối thiểu (càng cao càng rối).
   Tổng lọ = colors + EMPTY, tối đa 12 (2 hàng x 6). */
const DIFFS={
  normal:{colors:10,recipes:0,minSteps:250,frag:.7},
  hard:{colors:9,recipes:2,minSteps:400,frag:.75},
  expert:{colors:9,recipes:3,minSteps:600,frag:.8},
  super:{colors:9,recipes:3,minSteps:1000,frag:.85,fog:true} // fog: sương mù, chỉ thấy dãy màu trên cùng và 1 lớp ngay dưới nó
};
/* [màu A, màu B, màu tạo ra, tên]: chỉ số trỏ vào COLORS. Rót A lên B hoặc B lên A đều ra màu tạo ra. */
const RECIPES=[
  [0,1,5,'Tím'],[2,0,9,'Nâu'],[0,3,4,'Cam'],
  [0,10,6,'Hồng'],[1,2,7,'Xanh ngọc'],[2,3,8,'Chanh']
];
const MIX={}; // chỉ chứa công thức của ván hiện tại; cặp khác không pha
function setRecipes(recs){
  for(const k in MIX)delete MIX[k];
  recs.forEach(([x,z,m])=>{MIX[x+','+z]=m;MIX[z+','+x]=m});
  S.recs=recs;
}

/* ===== STATE ===== */
const S={bottles:[],init:[],sel:-1,moves:0,hist:[],busy:false,sound:true,won:false,mix:false,fog:false,diff:'normal',recs:[]};
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ===== STORAGE ===== */
function load(){
  try{const d=JSON.parse(localStorage.getItem(CFG.KEY));if(d&&d.sound===false)S.sound=false;if(d&&DIFFS[d.diff])S.diff=d.diff}catch(e){}
}
function save(){try{localStorage.setItem(CFG.KEY,JSON.stringify({sound:S.sound,diff:S.diff}))}catch(e){}}

/* ===== AUDIO ===== */
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  return AC;
}
function tone(f,d,type,v,f2){
  if(!S.sound)return;
  const c=ac();if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ===== RULES =====
   Rót bình a sang c nếu c còn chỗ (bất kể màu). Rót cả dãy màu trên cùng của a, tối đa phần chỗ trống của c.
   Ván pha màu: nếu đỉnh hai bình là cặp công thức, cả dãy đỉnh của c và phần rót vào đổi thành màu pha. */
const uniform=x=>x.length>0&&x.every(v=>v===x[0]);
const isFull=x=>x.length===CFG.CAP;
const isSolved=b=>b.every(x=>!x.length||(isFull(x)&&uniform(x)));
const canPour=(b,a,c)=>a!==c&&b[a].length>0&&b[c].length<CFG.CAP;
function runLen(b,a){
  const A=b[a];if(!A.length)return 0;
  const t=A[A.length-1];let n=1;
  while(n<A.length&&A[A.length-1-n]===t)n++;
  return n;
}
const amount=(b,a,c)=>Math.min(runLen(b,a),CFG.CAP-b[c].length);
function transfer(b,a,c){
  const k=amount(b,a,c),x=b[a][b[a].length-1];
  let col=x;
  if(S.mix&&b[c].length&&b[c][b[c].length-1]!==x){
    const m=MIX[x+','+b[c][b[c].length-1]];
    if(m!==undefined){
      col=m;
      const r=runLen(b,c);
      for(let i=1;i<=r;i++)b[c][b[c].length-i]=m;
    }
  }
  for(let i=0;i<k;i++){b[a].pop();b[c].push(col)}
  return k;
}
function hasMoves(){
  const b=S.bottles;
  for(let a=0;a<b.length;a++)for(let c=0;c<b.length;c++){
    if(!canPour(b,a,c))continue;
    if(!b[c].length&&uniform(b[a]))continue; // chỉ đổi chỗ, vô nghĩa
    return true;
  }
  return false;
}

/* Kiểm tra cấp số lượng: có còn cách pha để mọi màu đủ bội của 5 không?
   Bản nới lỏng (bỏ qua vị trí), nên "không thể" ở đây là chắc chắn; không chắc thì coi như còn sống. */
const countsOf=b=>{const c=Array(CFG.COLORS.length).fill(0);b.forEach(x=>x.forEach(v=>c[v]++));return c};
function mixPossible(cnt){
  const seen=new Set();let nodes=0;
  const ok=c=>c.every(v=>v%CFG.CAP===0);
  function go(c){
    if(ok(c))return true;
    if(++nodes>CFG.COUNT_NODES)return true;
    const k=c.join();
    if(seen.has(k))return false;
    seen.add(k);
    for(const [x,z,m] of S.recs){
      for(let a=1;a<=c[x];a++)for(let b=1;b<=c[z];b++){
        const n=c.slice();n[x]-=a;n[z]-=b;n[m]+=a+b;
        if(go(n))return true;
      }
    }
    return false;
  }
  return go(cnt);
}

/* ===== TẠO VÁN =====
   Xuất phát từ trạng thái đã xong rồi đi NGƯỢC các nước rót hợp lệ, nên ván luôn có lời giải. */
function revStep(b,mix,recs){
  const n=b.length,c=Math.floor(Math.random()*n),a=Math.floor(Math.random()*n);
  if(a===c||!b[c].length)return false;
  const C=b[c],A=b[a],col=C[C.length-1],rc=runLen(b,c);
  const rec=mix&&rc>=2&&Math.random()<.5?recs.find(r=>r[2]===col):null;
  if(rec){ // đảo ngược một lần pha: k nấc màu px quay về bình a, r nấc còn lại đổi về z
    const sw=Math.random()<.5,px=sw?rec[0]:rec[1],z=sw?rec[1]:rec[0];
    const k=1+Math.floor(Math.random()*(rc-1)),r=1+Math.floor(Math.random()*(rc-k));
    if(A.length+k>CFG.CAP)return false;
    const extra=A.length&&A[A.length-1]===px?runLen(b,a):0;
    if(extra&&C.length!==CFG.CAP)return false;
    const idx=C.length-k-r-1;
    if(idx>=0&&C[idx]===z)return false;
    C.length-=k;
    for(let i=1;i<=r;i++)C[C.length-i]=z;
    for(let i=0;i<k;i++)A.push(px);
    return true;
  }
  const k=1+Math.floor(Math.random()*rc);
  if(A.length+k>CFG.CAP)return false;
  const extra=A.length&&A[A.length-1]===col?runLen(b,a):0;
  if(extra&&C.length!==CFG.CAP)return false;
  const t=C[C.length-k-1];
  if(mix&&t!==undefined&&t!==col&&MIX[col+','+t]!==undefined)return false; // nước này đáng lẽ đã pha
  C.length-=k;
  for(let i=0;i<k;i++)A.push(col);
  return true;
}
const runsOf=b=>b.reduce((n,x)=>n+x.filter((v,i)=>!i||v!==x[i-1]).length,0);
function goodStart(b,mix,recs,frag){
  if(b.some(x=>!x.length||(isFull(x)&&uniform(x))))return false; // không có lọ rỗng sẵn hay lọ đã xong
  if(frag&&runsOf(b)<frag*b.reduce((n,x)=>n+x.length,0))return false;
  if(!mix)return true;
  const cn=countsOf(b);
  return recs.every(r=>cn[r[0]]>0&&cn[r[1]]>0&&cn[r[2]]<=3);
}
function pickRecipes(k){
  // các công thức chỉ được dùng tối đa 3 màu gốc để còn đủ màu cho các lọ (3 công thức = tam giác 3 màu gốc)
  const sets=[],go=(i,cur)=>{
    if(cur.length===k){if(new Set(cur.flatMap(x=>[x[0],x[1]])).size<=3)sets.push(cur);return}
    for(let j=i;j<RECIPES.length;j++)go(j+1,cur.concat([RECIPES[j]]));
  };
  go(0,[]);
  return shuffle(sets[Math.floor(Math.random()*sets.length)].slice());
}
function makeGame(d){
  const mix=d.recipes>0,all=COLORS_IDX();
  let last=null;
  for(let t=0;t<5;t++){
    let recs=[],targets;
    if(mix){
      recs=pickRecipes(d.recipes);
      const outs=recs.map(r=>r[2]),ing=new Set(recs.flatMap(r=>[r[0],r[1]]));
      const pool=shuffle(all.filter(c=>!outs.includes(c)&&!ing.has(c)));
      targets=outs.concat(pool.slice(0,Math.max(0,d.colors-outs.length)));
    }else targets=shuffle(all.slice()).slice(0,d.colors);
    setRecipes(recs);
    const b=targets.map(c=>Array(CFG.CAP).fill(c));
    for(let i=0;i<CFG.EMPTY;i++)b.push([]);
    let applied=0,ok=false;
    for(let i=0;i<CFG.SCRAMBLE_TRIES&&!ok;i++){
      if(revStep(b,mix,recs)){applied++;if(applied>=d.minSteps&&applied%10===0&&goodStart(b,mix,recs,d.frag))ok=true}
    }
    last=b;
    if(ok)break;
  }
  return {b:last,mix,recs:S.recs};
}
const COLORS_IDX=()=>CFG.COLORS.map((_,i)=>i);

/* ===== RENDER ===== */
function paint(i){
  const el=$('bw').children[i],B=S.bottles[i];
  let hide=-1; // các lớp có chỉ số < hide bị sương mù che
  if(S.fog&&B.length){let n=1;while(n<B.length&&B[B.length-1-n]===B[B.length-1])n++;hide=B.length-n-1}
  el.querySelector('.gl').innerHTML=B.map((c,k)=>k<hide?'<div class="ly fog">?</div>':'<div class="ly" style="background-color:'+CFG.COLORS[c]+'"></div>').join('');
  el.classList.toggle('done',isFull(B)&&uniform(B));
}
function render(){
  const bw=$('bw');bw.innerHTML='';
  S.bottles.forEach((b,i)=>{
    const e=document.createElement('div');
    e.className='bt';e.dataset.i=i;
    e.innerHTML='<div class="lip"></div><div class="gl"></div>';
    bw.appendChild(e);paint(i);
  });
  mark();layout();hud();
}
function mark(){[...$('bw').children].forEach((e,k)=>e.classList.toggle('sel',k===S.sel))}
function hud(){
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.d===S.diff));
  $('mv').textContent='Lượt '+S.moves;
  $('bS').classList.toggle('off',!S.sound);
  $('bU').classList.toggle('off',!S.hist.length);
}
function layout(){
  const n=S.bottles.length,bd=$('board');
  const W=bd.clientWidth-20,H=bd.clientHeight-10;
  if(W<=0||H<=0)return;
  const rows=n<=6?1:2,per=Math.ceil(n/rows);
  const gx=Math.max(8,W*.025);
  let w=Math.min(64,(W-gx*(per-1))/per);
  const h=Math.min(w*3,H/(rows+.22*(rows-1)+.2));
  w=Math.min(w,h/3);
  const gy=h*.2,rs=document.documentElement.style;
  rs.setProperty('--w',w+'px');rs.setProperty('--h',h+'px');
  const bw=$('bw').style;
  bw.width=(per*w+(per-1)*gx+1)+'px';bw.columnGap=gx+'px';bw.rowGap=gy+'px';
}
let rz=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(layout)});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ===== GAMEPLAY ===== */
function snap(){
  S.hist.push(JSON.stringify([S.bottles,S.moves]));
  if(S.hist.length>CFG.MAX_HIST)S.hist.shift();
}
function tap(i){
  const B=S.bottles;
  if(S.sel<0){
    if(B[i].length){S.sel=i;mark();tone(620,.08)}
    return;
  }
  if(S.sel===i){S.sel=-1;mark();return}
  const a=S.sel;
  if(canPour(B,a,i))pour(a,i);
  else{tone(150,.15,'square',.05);S.sel=B[i].length?i:-1;mark()}
}
async function pour(a,b){
  S.busy=true;S.sel=-1;
  const A=S.bottles[a],col=A[A.length-1];
  const n=amount(S.bottles,a,b);
  snap();
  const kids=$('bw').children,ea=kids[a],eb=kids[b];
  ea.classList.remove('sel');
  const R=$('bw').getBoundingClientRect(),h=ea.offsetHeight,w=ea.offsetWidth;
  const scx=R.left+ea.offsetLeft+w/2,scy=R.top+ea.offsetTop+h/2;
  const tcx=R.left+eb.offsetLeft+w/2,tt=R.top+eb.offsetTop;
  let dir=eb.offsetLeft>=ea.offsetLeft?1:-1;
  if(dir>0&&tcx-.43*h<8)dir=-1;
  if(dir<0&&tcx+.43*h>innerWidth-8)dir=1;
  const cx=tcx-dir*.43*h,cy=tt+.17*h;
  ea.style.zIndex=20;ea.style.transition='transform .32s ease';
  ea.style.transform='translate('+(cx-scx)+'px,'+(cy-scy)+'px) rotate('+dir*60+'deg)';
  await wait(340);
  const mY=cy-.25*h,sY=tt+h-5-((S.bottles[b].length+n)/CFG.CAP)*(h*.93-10);
  const st=$('st');
  st.style.cssText='display:block;left:'+(tcx-3)+'px;top:'+mY+'px;height:0;background:'+CFG.COLORS[col];
  void st.offsetHeight;
  st.style.height=Math.max(0,sY-mY)+'px';
  tone(280,.12+n*.1,'sine',.1,620);
  await wait(130+n*120);
  transfer(S.bottles,a,b);
  paint(a);paint(b);
  st.style.display='none';
  ea.style.transform='';
  await wait(340);
  ea.style.zIndex='';ea.style.transition='';
  S.moves++;S.busy=false;hud();
  if(isSolved(S.bottles))win();
  else if(S.mix&&(!mixPossible(countsOf(S.bottles))||!hasMoves()))lose();
  else if(!hasMoves())toast('Hết nước đi! Hãy hoàn tác hoặc chơi lại');
}
function win(){
  S.won=true;hud();
  $('wt').textContent='Hoàn thành sau '+S.moves+' lượt';
  confetti();
  [523,659,784,1047].forEach((f,k)=>setTimeout(()=>tone(f,.25,'triangle',.14),k*120));
  setTimeout(()=>$('modal').classList.add('on'),700);
}
function lose(){
  S.busy=true;S.sel=-1;mark();
  tone(200,.5,'sawtooth',.12,90);
  $('over').classList.add('on');
}
function restart(){
  S.bottles=clone(S.init);S.moves=0;S.sel=-1;S.hist=[];S.won=false;S.busy=false;
  $('modal').classList.remove('on');$('over').classList.remove('on');
  render();
}
let firstGame=true;
function newGame(){
  const g=makeGame(DIFFS[S.diff]);
  S.mix=g.mix;S.fog=!!DIFFS[S.diff].fog;S.init=clone(g.b);
  const rec=$('rec');
  rec.classList.toggle('on',S.mix);
  rec.innerHTML=S.mix?S.recs.map(r=>'<span><b style="background:'+CFG.COLORS[r[0]]+'"></b>+<b style="background:'+CFG.COLORS[r[1]]+'"></b>=<b style="background:'+CFG.COLORS[r[2]]+'"></b>'+r[3]+'</span>').join(''):'';
  restart();
  if(S.fog)toast('Siêu khó: sương mù che màu bên dưới, chỉ thấy dãy trên cùng và 1 lớp dưới nó');
  else if(S.mix)toast('Ván pha màu: rót khác màu có thể tạo màu mới');
  else if(firstGame)toast('Chạm bình để chọn, chạm bình khác để rót');
  firstGame=false;
}
function confetti(){
  for(let i=0;i<36;i++){
    const d=document.createElement('i'),a=Math.random()*6.28,r=120+Math.random()*180;
    d.className='cf';
    d.style.cssText='--x:'+Math.cos(a)*r+'px;--y:'+(Math.sin(a)*r-80)+'px;background:'+CFG.COLORS[i%CFG.COLORS.length];
    document.body.appendChild(d);setTimeout(()=>d.remove(),1300);
  }
}
let tt0=0;
function toast(m){
  const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tt0);tt0=setTimeout(()=>t.classList.remove('on'),2200);
}

/* ===== INPUT ===== */
$('board').addEventListener('pointerdown',e=>{
  if(!e.isPrimary||S.busy||S.won)return;
  const el=e.target.closest('.bt');
  if(el){ac();tap(+el.dataset.i)}
});
$('bU').addEventListener('click',()=>{
  if(S.busy||S.won||!S.hist.length)return;
  const [b,m]=JSON.parse(S.hist.pop());
  S.bottles=b;S.moves=m;S.sel=-1;render();tone(400,.1);
});
$('bR').addEventListener('click',()=>{if(S.busy)return;restart();tone(330,.12)});
let confirmKey='',confirmT=0;
function requestNew(diff){
  if(S.busy)return;
  if(S.moves>0&&!S.won&&confirmKey!==diff){
    confirmKey=diff;toast('Chạm lần nữa để bỏ ván này và tạo ván mới');
    clearTimeout(confirmT);confirmT=setTimeout(()=>{confirmKey=''},2500);
    return;
  }
  confirmKey='';S.diff=diff;save();ac();newGame();
}
$('bG').addEventListener('click',()=>requestNew(S.diff));
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>requestNew(b.dataset.d)));
$('bS').addEventListener('click',()=>{S.sound=!S.sound;save();hud();ac();tone(600,.08)});
$('bN').addEventListener('click',()=>{ac();newGame()});
$('bO').addEventListener('click',()=>{ac();restart()});

/* ===== INIT ===== */
document.documentElement.style.setProperty('--cap',CFG.CAP);
load();newGame();
</script>
