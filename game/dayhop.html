  <script>
    (function() {
      // ===== ÂM THANH WEB AUDIO =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq, duration, type = "square", volume = 0.08) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.value = volume;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    osc.stop(audioCtx.currentTime + duration);
}
      let levelWorker = null;
const levelQueue = new Map();        // cache màn đã tạo
const waitingResolvers = new Map();  // levelIndex -> [resolve, resolve...]

function initLevelWorker() {
    try {
        levelWorker = new Worker("level-worker.js");
    } catch (err) {
        console.warn("Không tạo được Worker, sẽ dùng fallback main thread:", err);
        levelWorker = null;
        return;
    }

    levelWorker.onmessage = (e) => {
        const data = e.data || {};
        if (data.type !== "generated") return;

        const { levelIndex, level } = data;

        levelQueue.set(levelIndex, level);

        const resolvers = waitingResolvers.get(levelIndex);
        if (resolvers && resolvers.length) {
            waitingResolvers.delete(levelIndex);
            for (const resolve of resolvers) resolve(level);
        }
    };

    levelWorker.onerror = (e) => {
        console.error("Worker error:", e);
        hideLoading();
    };
}
      
      function requestGeneratedLevel(levelIndex) {
    const cached = levelQueue.get(levelIndex);
    if (cached) return Promise.resolve(cached);

    if (!levelWorker) {
        return Promise.resolve(createGeneratedLevel(levelIndex)); // fallback
    }

    return new Promise((resolve) => {
        const list = waitingResolvers.get(levelIndex);

        if (list) {
            list.push(resolve);
            return;
        }

        waitingResolvers.set(levelIndex, [resolve]);

        levelWorker.postMessage({
            type: "generate",
            levelIndex
        });
    });
}
      
function createShareLink() {
    if (!currentLevel || !Array.isArray(currentLevel.map)) return "";

    const map = currentLevel.map.join("\n");
    const encoded = btoa(map);

    return `${location.origin}${location.pathname}?map=${encodeURIComponent(encoded)}`;
}

    document.getElementById("loading").classList.remove("show");

      }

    const mark = onTarget ? "O" : "X";
const color = onTarget ? "#2ecc71" : "#e53935";
        return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">

function buildCurrentSolveState() {
    const walkGrid = boardData.map(row =>
        row.map(ch => (ch === '#') ? '#' : ' ')
    );

    const boxesSet = new Set();
    const targetsSet = new Set();
    let player = { r: 0, c: 0 };

    for (let r = 0; r < boardData.length; r++) {
        for (let c = 0; c < boardData[r].length; c++) {
            const ch = boardData[r][c];

            if (ch === '@') {
                player = { r, c };
            } else if (ch === '+') {
                player = { r, c };
                targetsSet.add(`${r},${c}`);
            } else if (ch === '$') {
                boxesSet.add(`${r},${c}`);
            } else if (ch === '*') {
                boxesSet.add(`${r},${c}`);
                targetsSet.add(`${r},${c}`);
            } else if (ch === '.') {
                targetsSet.add(`${r},${c}`);
            }
        }
    }

    return { walkGrid, player, boxesSet, targetsSet };
}

/*
  Developer Mode: giải MỘT lần trong worker riêng (không chặn giao diện), lưu cả đường đi.
  Mỗi bước chỉ tra khoá trạng thái hiện tại trong đường đã lưu; chỉ giải lại (nền) khi người chơi đi chệch.
*/
let devPlan = null;          // { moves: ['U',...], keys: [...] }
let devWorker = null;
let devReqId = 0;
let devPendingKey = null;
let devAskedKey = null;       // thế đã gửi yêu cầu giải
let devFail = null;           // { key, reason } khi thế đó không giải được

function devStateKey(player, boxesSet) {
    return player.r + "," + player.c + "|" + [...boxesSet].sort().join(";");
}

function requestDevPlan(st, key, skipFast = false) {
    if (devPendingKey === key) return;
    devPendingKey = key;
    devAskedKey = key;
    const id = ++devReqId;

    if (!devWorker) {
        try {
            devWorker = new Worker("level-worker.js");
            devWorker.onmessage = (e) => {
                const d = e.data || {};
                if (d.type !== "plan" || d.id !== devReqId) return;   // kết quả của yêu cầu cũ → bỏ
                const asked = devPendingKey;
                devPendingKey = null;

                if (!d.path) {
                    // Không có lời giải (ngõ cụt) hoặc hết giờ: báo rõ và KHÔNG gửi lại yêu cầu cho cùng một thế
                    devFail = { key: devAskedKey, reason: d.reason };
                    renderDeveloperHint();
                    return;
                }

                const next = { moves: d.path.split(""), keys: d.keys };
                if (d.optimal && devPlan) {
                    // đường ít bước hơn chỉ nhận nếu thế hiện tại nằm trên đó; nếu người chơi đã đi tiếp theo đường nhanh,
                    // tính lại đường ít bước nhất từ thế hiện tại (ngắn dần nên sẽ bắt kịp)
                    const st = buildCurrentSolveState();
                    const key = devStateKey(st.player, st.boxesSet);
                    if (next.keys.indexOf(key) < 0) {
                        if (devPlan.keys.indexOf(key) >= 0 && devPlan.moves.length - devPlan.keys.indexOf(key) > 8) requestDevPlan(st, key, true);
                        return;
                    }
                }
                devFail = null;
                devPlan = next;
                renderDeveloperHint();
            };
            devWorker.onerror = () => { devPendingKey = null; };
        } catch (err) {
            devWorker = null;
            devPendingKey = null;
            return;
        }
    }

    const rows = st.walkGrid.map(r => r.join(""));
    devWorker.postMessage({
        type: "plan", id, rows,
        player: st.player,
        boxes: [...st.boxesSet],
        targets: [...st.targetsSet],
        skipFast
    });
}

function getDeveloperHintMove() {
    if (!developerMode) return null;

    const st = buildCurrentSolveState();
    const key = devStateKey(st.player, st.boxesSet);

    if (devPlan) {
        const i = devPlan.keys.indexOf(key);
        if (i >= 0 && i < devPlan.moves.length) return devPlan.moves[i];
    }

    if (devFail && devFail.key === key) return null;   // thế này đã biết là không giải được
    requestDevPlan(st, key);   // đi chệch đường đã lưu (hoặc chưa có): tính lại trong nền
    return null;
}

function clearDeveloperHint() {
    if (devHintEl) {
        devHintEl.remove();

    }
}

function renderDeveloperHint() {
  if (!developerMode) {
    if (devHintEl) {
        devHintEl.remove();

    }

}
    clearDeveloperHint();

    if (!developerMode || !boardData.length || gameWon) return;

    const move = getDeveloperHintMove();
    if (!move) {
        // đang tính ở nền: đồng hồ cát nhỏ xoay 2 quãng 180°; thế không giải được: dấu ✖ kèm lý do
        const st = devPendingKey ? "wait" : (devFail ? "fail" : null);

            if (st === "wait") {

                }
            }
            wrapperW.appendChild(devHintEl);
        }
        return;
    }

    const dirClassMap = {
        U: "up",
        D: "down",
        L: "left",
        R: "right"
    };

    const activeDir = dirClassMap[move];
    if (!activeDir) return;

    const wrapper = document.querySelector(".board-wrapper");
    const cellSize = parseFloat(getComputedStyle(boardEl).getPropertyValue("--cell-size")) || 24;
    const gap = 2;

const top = boardEl.offsetTop + pad + playerPos.r * (cellSize + gap) + cellSize / 2;

}

devHintEl.innerHTML = `

`;

    wrapper.appendChild(devHintEl);
}

      function parseMap(mapRows) {
        const grid = [];
        let pPos = { r: 0, c: 0 };
        let boxes = 0;
        let targets = 0;

        const cleaned = mapRows.map(row => row.replace(/\s+$/g, ''));
        const maxCols = Math.max(...cleaned.map(r => r.length));

        for (let r = 0; r < cleaned.length; r++) {
          const row = [];
          for (let c = 0; c < maxCols; c++) {
            const ch = cleaned[r][c] || ' ';
            row.push(ch);
            if (ch === '@' || ch === '+') pPos = { r, c };
            if (ch === '$' || ch === '*') boxes++;
            if (ch === '.' || ch === '+' || ch === '*') targets++;
          }
          grid.push(row);
        }
        return { grid, pPos, boxes, targets };
      }

      function countBoxesOnTarget(grid) {

// Tính lại số bước ít nhất (3 sao) bằng worker riêng, không phải chờ hàng đợi sinh màn; null nếu quá thời gian
function analyzeParWithWorker(map) {
    return new Promise((resolve) => {
        let w = null;
        try { w = new Worker("level-worker.js"); } catch (e) { resolve(null); return; }
        let done = false;
        const finish = (v) => { if (done) return; done = true; clearTimeout(t); try { w.terminate(); } catch (e) {} resolve(v); };
        const t = setTimeout(() => finish(null), 27000);
        w.onmessage = (e) => { if (e.data && e.data.type === "analyzed") finish(e.data.moves); };
        w.onerror = () => finish(null);
        w.postMessage({ type: "analyze", id: 1, map });
    });
}

async function loadLevel(levelIndex, forceNew = false) {
    if (isSharedLevel || dailyMode) {
        const parsed = parseMap(currentLevel.map);

        boardData = parsed.grid;

        totalBoxes = parsed.boxes;
        boxesOnTarget = countBoxesOnTarget(boardData);

        movesCount = 0;
        history = [];
        gameWon = false;

        currentDifficulty = currentLevel.difficulty || "";

        // số bước ít nhất của màn chia sẻ được tính trong worker (không làm đứng trang)
        if (isSharedLevel && currentLevel.parOpt !== true && !currentLevel.parTried2) {
            showLoading();
            const mv = await analyzeParWithWorker(currentLevel.map);
            currentLevel.parTried2 = true;
            if (mv !== null) { currentLevel.par = mv; currentLevel.parOpt = true; }
        }
        parMoves = currentLevel.par || 0;

        render();
        updateInfo();
        removeWinOverlay();
        document.getElementById("btnShare").style.display = "none";
        hideLoading();

    }

    showLoading();

    let level;

    if (forceNew) {
        level = await requestGeneratedLevel(levelIndex);
        unlockedLevels[levelIndex] = level;
        saveUnlockedLevels();
    } else {
        level = unlockedLevels[levelIndex];

        if (!level) {
            level = await requestGeneratedLevel(levelIndex);
            unlockedLevels[levelIndex] = level;
            saveUnlockedLevels();
        }
    }

    // Màn lưu từ bản cũ có số bước 3 sao chưa tối ưu: tính lại một lần rồi lưu
    if (level.parOpt !== true && !level.parTried2) {
        const mv = await analyzeParWithWorker(level.map);
        if (mv !== null) {
            level.par = mv;
            level.parOpt = true;
            if (typeof level.difficulty === "string") {
                level.difficulty = level.difficulty.replace(/•\s*\d+\s*bước/, `• ${mv} bước`);
            }
        } else {
            level.parOpt = false;
        }
        level.parTried2 = true;   // chỉ thử một lần (bộ giải mới) để không bắt người chơi chờ lại mỗi lần mở màn
        if (unlockedLevels[levelIndex]) { unlockedLevels[levelIndex] = level; saveUnlockedLevels(); }
    }

    currentLevel = level;

    const stars = document.getElementById("starTargets");
    stars.classList.remove("stage-normal", "stage-hard", "stage-extreme");
    stars.classList.add("stage-" + (currentLevel.stageDifficulty || "normal"));

    const parsed = parseMap(currentLevel.map);

    boardData = parsed.grid;
    playerPos = parsed.pPos;
    totalBoxes = parsed.boxes;
    boxesOnTarget = countBoxesOnTarget(boardData);

    movesCount = 0;
    history = [];
    gameWon = false;

    currentDifficulty = currentLevel.difficulty || "";
    parMoves = currentLevel.par || 0;

    if (!isSharedLevel) {
        saveProgress();
    }

    render();
    updateInfo();
    removeWinOverlay();
    hideLoading();

    preloadLevels(levelIndex + 1, 3);
}
    
    function preloadLevels(startIndex, count = 3) {
  if (!levelWorker) return;

  for (let i = 0; i < count; i++) {
    const idx = startIndex + i;
    if (levelQueue.has(idx) || waitingResolvers.has(idx)) continue;

    levelWorker.postMessage({
      type: "generate",
      levelIndex: idx
    });
  }
}

      // tường không giáp ô đi được nào (kể cả chéo) → để trống cho bàn chơi gọn
      function isOuterWall(r, c) {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const row = boardData[r + dr];
          const ch = row && row[c + dc];
          if (ch !== undefined && ch !== '#') return false;
        }
        return true;
      }

// board = lưới ô + khe 2px + viền 3px mỗi bên; wrapper có padding 8px mỗi bên
const maxWidth = wrapper.clientWidth - 16 - 6 - (cols - 1) * 2;
const maxHeight = wrapper.clientHeight - 16 - 6 - (rows - 1) * 2;

const cellSize = Math.floor(
    Math.min(
        maxWidth / cols,
        maxHeight / rows,
        72
    )
);

boardEl.style.setProperty("--cell-size", `${Math.max(14, cellSize)}px`);
        boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        boardEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const ch = boardData[r][c];
            const cell = document.createElement('div');
            cell.classList.add('cell');

            let cellClass = '';
            let entityType = null;
            let onTarget = false;

            switch (ch) {
              case '#': cellClass = isOuterWall(r, c) ? 'cell-void' : 'cell-wall'; break;
              case ' ': cellClass = 'cell-floor'; break;
              case '.': cellClass = 'cell-target'; break;
              case '$': cellClass = 'cell-floor'; entityType = 'box'; break;
              case '*': cellClass = 'cell-target-done'; entityType = 'box'; onTarget = true; break;
              case '@': cellClass = 'cell-floor'; entityType = 'player'; break;
              case '+': cellClass = 'cell-target'; entityType = 'player'; onTarget = true; break;
              default: cellClass = 'cell-floor';
            }

            cell.className = `cell ${cellClass}`;

            if (entityType) {
              const entity = document.createElement('div');
              entity.className = `entity entity-${entityType}${onTarget ? '-on-target' : ''}`;
              entity.style.backgroundImage = entityType === 'box' ? getBoxSvg(onTarget) : getPlayerSvg(onTarget);
              cell.appendChild(entity);
            }

            boardEl.appendChild(cell);
          }

    document.getElementById("star2Moves").textContent = star2Limit();

      function getCell(r, c) {
        if (r < 0 || r >= boardData.length || c < 0 || c >= boardData[0].length) return '#';
        return boardData[r][c];
      }

      function setCell(r, c, val) {
        if (r >= 0 && r < boardData.length && c >= 0 && c < boardData[0].length) {
          boardData[r][c] = val;
        }
      }

      function movePlayer(dr, dc) {
        if (gameWon) return;

        const pr = playerPos.r, pc = playerPos.c;
        const nr = pr + dr, nc = pc + dc;
        const currentCell = getCell(pr, pc);
        const nextCell = getCell(nr, nc);

        if (nextCell === '#') return;

        if (isBox(nextCell)) {
          const nnr = nr + dr, nnc = nc + dc;
          const beyondCell = getCell(nnr, nnc);
          if (!isFloor(beyondCell)) return;

          saveState();

          const boxWasOnTarget = nextCell === '*';
          const beyondIsTarget = beyondCell === '.';

          setCell(nnr, nnc, beyondIsTarget ? '*' : '$');
          if (boxWasOnTarget && !beyondIsTarget) boxesOnTarget--;
          if (!boxWasOnTarget && beyondIsTarget) boxesOnTarget++;
          if (!boxWasOnTarget && beyondIsTarget) {
    beep(750, 0.12, "triangle");
}

          const playerWasOnTarget = currentCell === '+';
          const nextWasTarget = nextCell === '*' || nextCell === '.';
          setCell(pr, pc, playerWasOnTarget ? '.' : ' ');
          setCell(nr, nc, nextWasTarget ? '+' : '@');
          playerPos = { r: nr, c: nc };
movesCount++;

beep(170, 0.08, "square");

        } else if (isFloor(nextCell)) {
          saveState();
          const playerWasOnTarget = currentCell === '+';
          const nextIsTarget = nextCell === '.';
          setCell(pr, pc, playerWasOnTarget ? '.' : ' ');
          setCell(nr, nc, nextIsTarget ? '+' : '@');
          playerPos = { r: nr, c: nc };
          movesCount++;
        } else {
          return;
        }

        render();
        updateInfo();
        checkWin();
      }

     function checkWin() {
    if (boxesOnTarget === totalBoxes) {
        // Phòng hờ: nếu số bước 3 sao chưa phải tối thiểu (màn lưu từ bản cũ, chưa tính xong) mà người chơi thắng sớm hơn,
        // lấy số bước thực tế làm mốc mới để 3 sao luôn là số bước ít nhất đã biết
        if (movesCount < parMoves && currentLevel && currentLevel.parOpt !== true) {
            parMoves = movesCount;
            currentLevel.par = movesCount;
            if (!isSharedLevel && !dailyMode && unlockedLevels[currentLevelIndex]) { unlockedLevels[currentLevelIndex].par = movesCount; saveUnlockedLevels(); }
        }
        const stars = getStars();

        if (dailyMode) {
            saveDailyStars(stars);
        } else if (!isSharedLevel) {
            if ((bestStars[currentLevelIndex] || 0) < stars) {
                bestStars[currentLevelIndex] = stars;
                saveStars();
            }
        }

        gameWon = true;
        updateInfo();
        if (!dailyMode && !isSharedLevel) pregenerateNext();

        setTimeout(() => showWinOverlay(), 300);
    }
}
      
      

      function undo() {
        if (gameWon) return;
        if (history.length === 0) return;

        const prev = history.pop();
        boardData = prev.grid;
        playerPos = prev.playerPos;
        movesCount = prev.movesCount;
        boxesOnTarget = prev.boxesOnTarget;
        gameWon = false;

        render();
        updateInfo();
      }

}

function nextFrontierIndex() {
    const highest = unlockedLevels.length - 1;
    return (bestStars[highest] || 0) > 0 ? highest + 1 : highest;
}

// Khi vừa giải xong màn mới nhất: tạo sẵn màn kế tiếp ở nền để mục chọn màn luôn có màn mới
function pregenerateNext() {
    if (isSharedLevel) return;
    const next = nextFrontierIndex();
    if (!unlockedLevels[next]) requestGeneratedLevel(next).then(() => {});
}

function pad2(n) { return String(n).padStart(2, "0"); }

// Ngày theo giờ Việt Nam (UTC+7) để mọi máy đều cùng một màn
function vnToday() {
    const d = new Date(Date.now() + 7 * 3600 * 1000);
    const y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate();
    const doy = Math.round((Date.UTC(y, m, day) - Date.UTC(y, 0, 1)) / 86400000);
    return {
        key: `${y}-${pad2(m + 1)}-${pad2(day)}`,
        label: `${pad2(day)}/${pad2(m + 1)}/${y}`,
        index: (doy + y * 37) % 365      // 365 màn, mỗi năm xoay vòng thứ tự
    };
}

function getDailyStars() {
    try {
        const d = JSON.parse(localStorage.getItem("sokoban_daily") || "null");
        if (d && d.key === vnToday().key) return d.stars || 0;
    } catch (e) {}
    return 0;   // qua ngày mới: mất hết sao thử thách
}

function saveDailyStars(stars) {
    if (!dailyDay) return;
    try {
        const d = JSON.parse(localStorage.getItem("sokoban_daily") || "null");
        const old = d && d.key === dailyDay.key ? (d.stars || 0) : 0;
        localStorage.setItem("sokoban_daily", JSON.stringify({ key: dailyDay.key, stars: Math.max(old, stars) }));
    } catch (e) {}
    updateChallengeButton();
}

function updateChallengeButton() {
    const n = getDailyStars();
    let html = "";
    for (let i = 1; i <= 3; i++) html += i <= n ? '<span class="on">★</span>' : "☆";

    document.getElementById("chLabel").textContent = dailyMode ? "TRỞ VỀ" : "THỬ THÁCH";
    btnChallenge.classList.toggle("active", dailyMode);
    btnChallenge.title = dailyMode ? "Trở về màn chơi bình thường" : "Thử thách hằng ngày";
}

}
