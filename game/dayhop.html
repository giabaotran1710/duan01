<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <title>Đẩy hộp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    position: fixed;
    inset: 0;
    width: 100%;
    touch-action: none;
    overscroll-behavior: none;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 12px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

    .game-container {
      background: #16213e;
      border-radius: 28px;
      padding: 20px 16px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .header {
      text-align: center;
      width: 100%;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #f7d774, #e8a850);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
      margin-bottom: 2px;
      padding-top:5px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #8899aa;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }
.cell-target-done{
    background:#224a2a;
    box-shadow:
        inset 0 0 0 3px #2ecc71,
        0 0 10px rgba(46,204,113,.6);
    border-radius:50%;
}
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #0f1629;
      border-radius: 50px;
      padding: 10px 18px;
      color: #e0e0e0;
      font-weight: 600;
      font-size: 0.95rem;
      gap: 10px;
      flex-wrap: wrap;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .info-icon {
      font-size: 1.1rem;
    }

    .info-value {
      color: #f7d774;
      font-weight: 700;
      min-width: 22px;
      text-align: center;
    }

    

    .board-wrapper {
      background: #0f1629;
      border-radius: 20px;
      padding: 12px;
      box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .board {
      display: grid;
      --cell-size: 42px;
      gap: 2px;
      background: #1a2740;
      padding: 3px;
      border-radius: 12px;
      transition: all 0.15s ease;
    }

.cell {
  width: var(--cell-size);
  height: var(--cell-size);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--cell-size) * 0.65);
  transition: all 0.12s ease;
  position: relative;
  background: #1a2740;
  overflow: hidden;
}
    .cell-wall {
      background: #3b4a6b;
      border-radius: 4px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.15), inset 0 -3px 0 rgba(0,0,0,0.3);
    }

    .cell-floor {
      background: #1e2d4a;
    }

    .cell-target {
      background: #1e2d4a;
      box-shadow: inset 0 0 0 3px rgba(231, 76, 60, 0.5);
      border-radius: 50%;
    }

    .cell-box, .cell-box-on-target, .cell-player, .cell-player-on-target {
      background: transparent;
      border-radius: 0;
      box-shadow: none;
    }

    .entity {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      pointer-events: none;
    }

    .entity-box, .entity-box-on-target, .entity-player, .entity-player-on-target {
      display: block;
    }

.btn-row{
    display:flex;
    gap:8px;
    width:100%;
    justify-content:space-between;
    flex-wrap:nowrap;
}

.btn-row .btn{
    flex:1;
    min-width:0;
    justify-content:center;
    padding:10px 8px;
    font-size:.82rem;
}

    .btn {
      background: #2a3a5c;
      border: none;
      color: #e0e0e0;
      padding: 10px 16px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 3px 0 #0f1629;
      letter-spacing: 0.5px;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0f1629;
      background: #3d5280;
    }

    .btn-accent {
      background: #e8a850;
      color: #1a1a2e;
      box-shadow: 0 3px 0 #b8732a;
      font-weight: 700;
    }

    .btn-accent:active {
      background: #f0b860;
      box-shadow: 0 1px 0 #b8732a;
    }


    .win-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .win-dialog {
      background: #16213e;
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      max-width: 320px;
      width: 90%;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .win-emoji {
  font-size: 4rem;
}
@keyframes starFlyIn{

    0%{
        opacity:0;
        transform:
            scale(.2)
            rotate(-180deg)
            translateY(-120px);
    }

    55%{
        opacity:1;
        transform:
            scale(1.25)
            rotate(20deg)
            translateY(8px);
    }

    75%{
        transform:
            scale(.9)
            rotate(-8deg)
            translateY(-3px);
    }

    100%{
        opacity:1;
        transform:
            scale(1)
            rotate(0)
            translateY(0);
    }
}


    .win-text {
      color: #f7d774;
      font-size: 1.6rem;
      font-weight: 700;
      margin: 10px 0;
    }

    .win-stats {
      color: #aabbcc;
      margin: 6px 0 16px;
    }

    @media (max-width: 380px) {
      .game-container {
        padding: 14px 8px 16px;
        gap: 12px;
        border-radius: 20px;
      }
      .cell {
        width: clamp(22px, 9vw, 34px);
        height: clamp(22px, 9vw, 34px);
        border-radius: 4px;
      }
      
      .title { font-size: 1.7rem; }
      .btn { padding: 8px 12px; font-size: 0.8rem; }
    }
  .loading-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,22,41,.92);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    z-index:9999;
    opacity:0;
    visibility:hidden;
    transition:.2s;
}

.loading-overlay.show{
    opacity:1;
    visibility:visible;
}

.loading-spinner{
    width:64px;
    height:64px;
    border:6px solid rgba(255,255,255,.15);
    border-top-color:#f7d774;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.loading-text{
    color:#f7d774;
    font-size:18px;
    font-weight:700;
    letter-spacing:1px;
}

.loading-sub{
    color:#9fb2cc;
    font-size:14px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
  
  .star-row{
    display:flex;
    justify-content:center;
    gap:12px;
    margin:12px 0 18px;
}

.star{
    font-size:46px;
    color:#555;
    opacity:1;
}

.star.active{
    color:#FFD54A;
    animation:starFly .8s cubic-bezier(.2,1.2,.25,1) forwards;
}

@keyframes starFly{

    0%{
        opacity:0;
        transform:
            translate(-250px,-220px)
            rotate(-720deg)
            scale(.2);
    }

    65%{
        opacity:1;
        transform:
            scale(1.35)
            rotate(15deg);
    }

    100%{
        opacity:1;
        transform:
            scale(1)
            rotate(0);
    }
}
  .star-targets{
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:center;
    margin-top:-8px;
    margin-bottom:2px;
    padding:6px 10px;
    background:#0f1629;
    border-radius:14px;
    color:#d8d8d8;
    font-size:.82rem;
    font-weight:600;
}

.star-targets span{
    display:flex;
    align-items:center;
    gap:4px;
}

.star-targets b{
    color:inherit;
}
  
  .difficulty-star{
    font-size: 1.35rem;   /* hoặc 22px, 24px, 26px */
    line-height: 1;
    color:#FFD54A;
    transition:.25s;
}

.stage-hard .difficulty-star{
    color:#ff4d4d; /* Đỏ */
}

.stage-extreme .difficulty-star{
    color:#b44dff; /* Tím */
}
  .btn-challenge{
    background:#d83b3b;
    color:#fff;
    box-shadow:0 3px 0 #8f1f1f;
    font-weight:700;
}

.btn-challenge:active{
    background:#ef4a4a;
    box-shadow:0 1px 0 #8f1f1f;
}
  .btn-challenge.active{
    position:relative;
    overflow:hidden;
    animation:
    fireBorder 2.2s linear infinite;
}

.btn-challenge.active::before{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:40px;
    background:
        radial-gradient(circle,#ffd54a 0,#ff9800 30%,#ff5722 55%,transparent 70%);
    filter:blur(10px);
    opacity:.9;
    animation:fireAura .9s infinite alternate;
    z-index:-2;
}

.btn-challenge.active::after{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:40px;
    background:
    repeating-conic-gradient(
        from 0deg,
        #ffeb3b 0deg 12deg,
        #ff9800 12deg 24deg,
        #ff5722 24deg 36deg,
        transparent 36deg 60deg
    );
    filter:blur(6px);
    opacity:.75;
    animation:fireRotate 2.5s linear infinite;
    z-index:-3;
}
@keyframes fireAura{
    from{
        transform:scale(0.9);
        opacity:.6;
    }
    to{
        transform:scale(1.15);
        opacity:1;
    }
}

@keyframes fireRotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}
@keyframes fireBorder{

    0%{
        box-shadow:
        inset 0 3px 0 #ffeb3b,
        0 0 10px #ff9800;
    }

    25%{
        box-shadow:
        inset -3px 0 0 #ff5722,
        0 0 14px #ff9800;
    }

    50%{
        box-shadow:
        inset 0 -3px 0 #ffeb3b,
        0 0 18px #ff5722;
    }

    75%{
        box-shadow:
        inset 3px 0 0 #ff5722,
        0 0 14px #ff9800;
    }

    100%{
        box-shadow:
        inset 0 3px 0 #ffeb3b,
        0 0 10px #ff9800;
    }

}
  .title.challenge{
    background:linear-gradient(135deg,#ff5050,#b60000);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}
  .win-buttons{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:nowrap;
    margin-top:14px;
}

.win-buttons .btn{
    flex:1;
    min-width:0;
    justify-content:center;
    margin:0 !important;
    font-size:.82rem;
    padding:10px 8px;
}
  .challenge-progress{
    width:100%;
    background:#26324d;
    border-radius:0px;
    overflow:hidden;
    height:20px;
    margin-top:0px;
    border:2px solid rgba(255,255,255,.15);
}

.challenge-progress-bar{
    height:100%;
    width:0%;
    background:#3ddc84;
    transition:width .25s, background .25s;
}

.challenge-progress-text{
    text-align:center;
    color:#fff;
    font-weight:700;
    font-size:.85rem;
}
  .level-selector{
    cursor:pointer;
    border-radius:20px;
    padding:4px 10px;
    transition:.2s;
}

.level-selector:active{
    background:rgba(255,255,255,.08);
}
  .board-wrapper{
    position: relative;
}

.dev-hint{
    position:absolute;
    z-index:30;
    pointer-events:none;
    transform:translate(-50%,-50%);
}

.dev-arrow{
    font-size:25px;
    color:#4cff7a;
    font-weight:900;
    text-shadow:
        0 0 8px rgba(76,255,122,.9),
        0 0 18px rgba(76,255,122,.7);
    animation:devArrowPulse .8s infinite alternate;
}

@keyframes devArrowPulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.25);
    }
}

.dev-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(10,16,28,.82);
    border:1px solid rgba(76,255,122,.45);
    color:#4cff7a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:900;
    letter-spacing:.5px;
    box-shadow:0 0 10px rgba(76,255,122,.18);
}
  #btnShare{
    flex:0 0 46px;
    padding:10px;
}

#btnShare i{
    font-size:18px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    background:rgba(20,20,20,.92);
    color:#fff;
    padding:12px 18px;
    border-radius:30px;
    font-size:.9rem;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:99999;
}

.toast.show{
    opacity:1;
    bottom:50px;
}

  </style>
</head>

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq, duration, type = "square", volume = 0.08) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.value = volume;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    osc.stop(audioCtx.currentTime + duration);

    // Chọn player ban đầu
    const playerCandidates = emptyCells.filter(([r, c]) => !targetsSet.has(toKey(r, c)));
    if (playerCandidates.length === 0) continue;

    shuffleWithRand(playerCandidates, rand);

    for (const cell of playerCandidates) {
      const [r, c] = cell;
      const distToTargets = targets.reduce((min, t) => {
        const d = Math.abs(r - t[0]) + Math.abs(c - t[1]);
        return Math.min(min, d);
      }, Infinity);

      if (distToTargets >= 2) {
        playerCell = cell;
        break;
      }
    }

    if (!playerCell) playerCell = playerCandidates[0];

    let playerPos = { r: playerCell[0], c: playerCell[1] };
    let boxesSet = new Set(targets.map(([r, c]) => toKey(r, c)));

    // Reverse generation: đẩy ngược box ra khỏi đích
    let ok = true;

    for (let step = 0; step < reverseSteps; step++) {
      let candidates = getReverseCandidates(
        grid,
        playerPos,
        boxesSet,
        targetsSet
      );

      if (candidates.length === 0) {
        ok = false;
        break;
      }

      // Ưu tiên các bước làm box rời target
      const onTargetMoves = candidates.filter(c => {
        const [br, bc] = fromKey(c.boxKey);
        const [nr, nc] = fromKey(c.nextBoxKey);
        return targetsSet.has(toKey(br, bc)) && !targetsSet.has(toKey(nr, nc));
      });

      if (onTargetMoves.length > 0) {
        candidates = onTargetMoves;
      }

      const pick = chooseReverseCandidate(
    candidates,
    grid,
    boxesSet,
    targetsSet,
    targetPoints,
    rand
);
      if (!pick) {
        ok = false;
        break;
      }

      boxesSet.delete(pick.boxKey);
      boxesSet.add(pick.nextBoxKey);
      playerPos = { r: fromKey(pick.nextPlayerKey)[0], c: fromKey(pick.nextPlayerKey)[1] };
    }

    if (!ok) continue;

    // Đảm bảo không còn box nào nằm trên target
    let safety = 0;
    while (boxesOnTargetCount(boxesSet, targetsSet) > 0 && safety < 30) {
      let candidates = getReverseCandidates(
        grid,
        playerPos,
        boxesSet,
        targetsSet
      );
      if (candidates.length === 0) break;

      const preferred = candidates.filter(c => {
        const [br, bc] = fromKey(c.boxKey);
        const [nr, nc] = fromKey(c.nextBoxKey);
        return targetsSet.has(toKey(br, bc)) && !targetsSet.has(toKey(nr, nc));
      });

      if (preferred.length > 0) candidates = preferred;

      const pick = chooseReverseCandidate(
  candidates,
  grid,
  boxesSet,
  targetsSet,
  targetPoints,
  rand
);
      if (!pick) break;

      boxesSet.delete(pick.boxKey);
      boxesSet.add(pick.nextBoxKey);
      playerPos = { r: fromKey(pick.nextPlayerKey)[0], c: fromKey(pick.nextPlayerKey)[1] };

      safety++;
    }

    if (boxesOnTargetCount(boxesSet, targetsSet) !== 0) {
      continue;

const boxes = [...boxesSet].map(fromKey);

// Không cho box quá gần target hoặc nhìn thẳng tới target

solveLevelAStar(

);

switch(stageDifficulty){

}

if(

){

}


    // Gán lên grid
    for (const [r, c] of targets) grid[r][c] = '.';

    }

  par: analysis.moves,

};
  }
}

function getReverseCandidates(grid, playerPos, boxesSet, targetsSet) {
  const reach = reachableCells(grid, playerPos, boxesSet);

  const dirs = [
    { dr: -1, dc: 0 },
    { dr: 1, dc: 0 },
    { dr: 0, dc: -1 },
    { dr: 0, dc: 1 }
  ];

  const candidates = [];

  for (const boxKey of boxesSet) {
    const [br, bc] = fromKey(boxKey);

    for (const d of dirs) {
      const nextBoxR = br - d.dr;
      const nextBoxC = bc - d.dc;

      const nextPlayerR = br - 2 * d.dr;
      const nextPlayerC = bc - 2 * d.dc;

      const nextBoxKey = toKey(nextBoxR, nextBoxC);
      const nextPlayerKey = toKey(nextPlayerR, nextPlayerC);

      if (!reach.has(nextBoxKey)) continue;
      if (!isFreeForPlayer(grid, nextBoxR, nextBoxC, boxesSet)) continue;
      if (!isFreeForPlayer(grid, nextPlayerR, nextPlayerC, boxesSet)) continue;

      candidates.push({
        boxKey,
        nextBoxKey,
        nextPlayerKey
      });
    }
  }

  return candidates;
}

      function parseMap(mapRows) {
        const grid = [];
        let pPos = { r: 0, c: 0 };
        let boxes = 0;
        let targets = 0;

        const cleaned = mapRows.map(row => row.replace(/\s+$/g, ''));
        const maxCols = Math.max(...cleaned.map(r => r.length));

        for (let r = 0; r < cleaned.length; r++) {
          const row = [];
          for (let c = 0; c < maxCols; c++) {
            const ch = cleaned[r][c] || ' ';
            row.push(ch);
            if (ch === '@' || ch === '+') pPos = { r, c };
            if (ch === '$' || ch === '*') boxes++;
            if (ch === '.' || ch === '+' || ch === '*') targets++;
          }
          grid.push(row);
        }
        return { grid, pPos, boxes, targets };
      }

      let toastTimer = null;

function showToast(text){

    let toast = document.getElementById("toast");

    if(!toast){
        toast = document.createElement("div");
        toast.id = "toast";
        toast.className = "toast";
        document.body.appendChild(toast);
    }

    toast.textContent = text;

    clearTimeout(toastTimer);

    toast.classList.add("show");

    toastTimer = setTimeout(()=>{
        toast.classList.remove("show");
    },2200);
}

function loadSharedLevelFromUrl() {
    const params = new URLSearchParams(location.search);
    const sharedMap = params.get("map");

    if (!sharedMap) return false;

    try {
        const mapText = atob(sharedMap);
        const map = mapText.split("\n");

        const parsed = parseMap(map);

        const walkGrid = parsed.grid.map(row =>
            row.map(ch => ch === "#" ? "#" : " ")
        );

        const boxesSet = new Set();
        const targetsSet = new Set();

        for (let r = 0; r < parsed.grid.length; r++) {
            for (let c = 0; c < parsed.grid[r].length; c++) {
                const ch = parsed.grid[r][c];

                if (ch === "$") {
                    boxesSet.add(`${r},${c}`);
                } else if (ch === "*") {
                    boxesSet.add(`${r},${c}`);
                    targetsSet.add(`${r},${c}`);
                } else if (ch === ".") {
                    targetsSet.add(`${r},${c}`);
                } else if (ch === "+") {
                    targetsSet.add(`${r},${c}`);
                }
            }
        }

        const analysis = solveLevelAStar(
            walkGrid,
            parsed.pPos,
            boxesSet,
            targetsSet
        );

        currentLevelIndex = -1;
        currentLevel = {
            name: "Màn chia sẻ",
            map,
            par: analysis.solvable ? analysis.moves : 0,
            difficulty: "CHIA SẺ",
            stageDifficulty: "normal"
        };

        isSharedLevel = true;
          history = [];
gameWon = false;

// Không cho dùng tiến trình cũ
currentLevelIndex = -1;
        return true;

    } catch (e) {
        console.error("Không đọc được map chia sẻ:", e);
        return false;
    }
}

}
