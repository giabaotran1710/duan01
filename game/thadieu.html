<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;background:#3f7fc4;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* HUD */

  #windFlow{display:inline-flex;gap:3px;align-items:center;--d:1.6s;--c:#fff;transform:scaleX(1)}

  @keyframes flow{0%,100%{opacity:.15}50%{opacity:1}}

  #snd{position:fixed;right:12px;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 88px);z-index:6;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.4);background:rgba(10,30,60,.35);color:#fff;font-size:18px}

    background:linear-gradient(135deg,rgba(255,240,200,.95),rgba(255,205,140,.92));color:#5a2a00;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.8);
    transform:translate(-50%,-30px) scale(.9);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.3,1.3),opacity .45s}
  #banner.show{transform:translate(-50%,0) scale(1);opacity:1}

  /* hành trình ở màn kết thúc */
  #journey{width:min(340px,88vw);display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}

  #jDot{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,227,154,.55),0 0 14px 4px rgba(255,227,154,.8)}
  .jNext{font-size:14px;font-weight:700;color:#bfe6ff}
  @media (prefers-reduced-motion:reduce){#banner{transition:opacity .3s;transform:translate(-50%,0)}}
  @media (max-height:640px){#journey{padding:10px 12px;gap:6px}.big{font-size:44px}}
  @media (max-height:450px){#over{justify-content:flex-start;padding-top:calc(max(6px,env(safe-area-inset-top)) + 52px);gap:2px;overflow-y:auto;background:rgba(10,30,70,.93)}#over .title{font-size:26px;padding:0;line-height:1.2}#over .big{font-size:28px}#over .sub{font-size:13px;line-height:1.3}#over .reason{font-size:14px}#journey{width:min(420px,70vw);padding:6px 10px;gap:2px}.jBar{margin:12px 8px 2px}#jMarks span{top:-20px;font-size:12px}.jNext{font-size:12px}#over .btn{height:40px;min-width:160px;margin-top:4px}}

<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), mainCtx = cv.getContext('2d');
let ctx = mainCtx;   // các hàm vẽ dùng ctx; lớp tiền cảnh tạm trỏ ctx sang canvas riêng để phủ ánh sáng theo giờ
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
let W = 0, H = 0, DPR = 1;

// ---------- lưu trữ ----------
const store = { best: 0, snd: true };
try { const j = JSON.parse(localStorage.getItem('thadieu_v1') || '{}'); store.best = +j.best || 0; store.snd = j.snd !== false; } catch (e) {}
const save = () => { try { localStorage.setItem('thadieu_v1', JSON.stringify(store)); } catch (e) {} };

// ---------- âm thanh: tiếng gió (nhiễu lọc dải) + tiếng dây đứt ----------
const Snd = {
  x: null, gain: null, filt: null,
  init() {
    if (this.x) { if (this.x.state === 'suspended') this.x.resume(); return; }
    try {
      const A = window.AudioContext || window.webkitAudioContext; this.x = new A();
      const n = this.x.sampleRate * 2, buf = this.x.createBuffer(1, n, this.x.sampleRate), d = buf.getChannelData(0);
      let last = 0; for (let i = 0; i < n; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }   // nhiễu nâu: tiếng gió trầm
      const src = this.x.createBufferSource(); src.buffer = buf; src.loop = true;
      this.filt = this.x.createBiquadFilter(); this.filt.type = 'bandpass'; this.filt.frequency.value = 500; this.filt.Q.value = 0.7;
      this.gain = this.x.createGain(); this.gain.gain.value = 0;
      src.connect(this.filt); this.filt.connect(this.gain); this.gain.connect(this.x.destination); src.start();
    } catch (e) { this.x = null; }
  },
  wind(level) {   // level 0..1
    if (!this.x) return;
    const t = this.x.currentTime, v = store.snd ? 0.05 + level * 0.5 : 0;
    this.gain.gain.setTargetAtTime(v, t, 0.15);
    this.filt.frequency.setTargetAtTime(380 + level * 900, t, 0.2);
  },
  snap() {
    if (!this.x || !store.snd) return;
    try {
      const t = this.x.currentTime, o = this.x.createOscillator(), g = this.x.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.25);
      g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g); g.connect(this.x.destination); o.start(t); o.stop(t + 0.32);
    } catch (e) {}
  },
  mute() { if (this.x) { this.gain.gain.setTargetAtTime(0, this.x.currentTime, 0.05); if (this.fl) this.fl.g.gain.setTargetAtTime(0, this.x.currentTime, 0.05); } },
  // sáo diều: hai ống sáo ngân theo gió, đổi nốt ngũ cung chậm rãi
  fl: null, flNext: 0, flStep: 0,
  flute(level, night) {
    if (!this.x) return;
    try {
      const x = this.x, t = x.currentTime;
      if (!this.fl) {
        const g = x.createGain(); g.gain.value = 0;
        const lp = x.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
        const lfo = x.createOscillator(), lg = x.createGain(); lfo.frequency.value = 5.2; lg.gain.value = 5;
        const mk = (f, v) => { const o = x.createOscillator(), og = x.createGain(); o.type = 'sine'; o.frequency.value = f; og.gain.value = v; lfo.connect(lg); lg.connect(o.frequency); o.connect(og); og.connect(lp); o.start(); return o; };
        const a = mk(392, 0.55), a2 = mk(784, 0.12), b = mk(587, 0.35);
        lp.connect(g); g.connect(x.destination); lfo.start();
        this.fl = { g, a, a2, b };
      }
      if (t > this.flNext) {
        const A = [392, 440, 392, 523.25, 440, 392, 349.23, 392], B = [587.33, 659.25, 587.33, 783.99, 659.25, 587.33, 523.25, 587.33];
        const k = this.flStep++ % A.length, oct = night > 0.5 ? 0.5 : 1;
        this.fl.a.frequency.setTargetAtTime(A[k] * oct, t, 0.35); this.fl.a2.frequency.setTargetAtTime(A[k] * 2 * oct, t, 0.35); this.fl.b.frequency.setTargetAtTime(B[k] * oct, t, 0.45);
        this.flNext = t + 2.2 + Math.random() * 1.8;
      }
      const v = store.snd ? (0.012 + level * 0.055) * (1 - night * 0.3) : 0;
      this.fl.g.gain.setTargetAtTime(v, t, 0.4);
    } catch (e) {}
  },
  noiseBurst(dur, f0, f1, vol) {
    if (!this.x || !store.snd) return;
    try {
      const x = this.x, t = x.currentTime, n = Math.round(x.sampleRate * dur), buf = x.createBuffer(1, n, x.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const s = x.createBufferSource(), f = x.createBiquadFilter(), g = x.createGain();
      s.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.75); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(x.destination); s.start(t); s.stop(t + dur + 0.02);
    } catch (e) {}
  },
  whoosh() { this.noiseBurst(0.9, 260, 1500, 0.22); },
  beat() {
    if (!this.x || !store.snd) return;
    try {
      const x = this.x, t = x.currentTime;
      for (const [dt, v] of [[0, 0.5], [0.16, 0.32]]) {
        const o = x.createOscillator(), g = x.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(70, t + dt); o.frequency.exponentialRampToValueAtTime(42, t + dt + 0.12);
        g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(v, t + dt + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.16);
        o.connect(g); g.connect(x.destination); o.start(t + dt); o.stop(t + dt + 0.18);
      }
    } catch (e) {}
  },
  chime() {
    if (!this.x || !store.snd) return;
    try {
      const x = this.x, t = x.currentTime;
      [1046.5, 1318.5, 1568, 1760, 2093].forEach((f, i) => {
        const o = x.createOscillator(), g = x.createGain(), at = t + i * 0.09; o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.13, at + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.9);
        o.connect(g); g.connect(x.destination); o.start(at); o.stop(at + 0.95);
      });
    } catch (e) {}
  }
};

// ---------- khung hình ----------
let groundY = 0, handX = 0, handY = 0, skyT = 24, skyClock = 0;
let lastW = 0, lastH = 0, rzT = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const nw = innerWidth, nh = innerHeight;
  if (!nw || !nh) return;   // cửa sổ bằng 0 (iframe ẩn): giữ nguyên, không tạo canvas rỗng
  if (nw === lastW && nh === lastH && clouds.length) return;   // kích thước không đổi: không dựng lại
  lastW = nw; lastH = nh;
  W = nw; H = nh;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  groundY = H - Math.max(150, H * 0.2);
  handX = W / 2; handY = groundY + 34;
  buildWorld();
  initGrass();
  if (clouds.length) initClouds();
  if (!kite.alive || state.phase !== 'play') { kite.y = kiteBaseY(); }
}
const kiteBaseY = () => Math.max(170, H * 0.36);

// ---------- THẾ GIỚI: hành trình bầu trời (ngày → hoàng hôn → đêm → bình minh) + làng quê ----------
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const smooth = t => t * t * (3 - 2 * t);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixHex = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; };
const mixArr = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
function srand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// Mốc hành trình: giây bay → bảng màu trời. sun/moon: độ cao (1 = cao, 0 = chạm chân trời, âm = đã lặn)
const DAY_LEN = 140;
const JOURNEY = [
  { t: 0,   sky: ['#1f5fae', '#5d9fe0', '#b9dcf5', '#f6e7c8'], warm: 0,    night: 0,    sun: 1,     moon: -0.4, stars: 0 },
  { t: 20,  sky: ['#2a5fa6', '#6aa2d6', '#f0d7a4', '#ffd08a'], warm: 0.35, night: 0,    sun: 0.6,   moon: -0.4, stars: 0 },
  { t: 40,  sky: ['#353c8c', '#b85f8e', '#ff9a62', '#ffcf6b'], warm: 1,    night: 0.04, sun: 0.14,  moon: -0.3, stars: 0 },
  { t: 52,  sky: ['#232766', '#6d3c7c', '#df6658', '#ff9b5c'], warm: 0.8,  night: 0.32, sun: -0.02, moon: -0.1, stars: 0.25 },
  { t: 60,  sky: ['#0a1236', '#14275a', '#253a6c', '#38497a'], warm: 0.08, night: 1,    sun: -0.3,  moon: 0.12, stars: 1 },
  { t: 92,  sky: ['#08102e', '#122454', '#22366a', '#34467a'], warm: 0,    night: 1,    sun: -0.4,  moon: 0.8,  stars: 1 },
  { t: 106, sky: ['#2a2e6a', '#8a68a6', '#f2a59f', '#ffd5a0'], warm: 0.62, night: 0.32, sun: -0.04, moon: 0.25, stars: 0.2 },
  { t: 122, sky: ['#3a71b6', '#84b4e0', '#f4d8bf', '#ffe6c4'], warm: 0.22, night: 0,    sun: 0.38,  moon: -0.2, stars: 0 },

function bambooClump(g, rnd, x, base, h, P) {

function drawBlend(set, x, y, w, h) {
  const S = SKY, a = S.wd + S.wdu > 0.001 ? S.wdu / (S.wd + S.wdu) : 1;
  if (S.wn < 0.999) {
    if (a < 0.999) ctx.drawImage(set.day, x, y, w, h);
    if (a > 0.001) { ctx.globalAlpha = a; ctx.drawImage(set.dusk, x, y, w, h); }
  }
  if (S.wn > 0.001) { ctx.globalAlpha = S.wn; ctx.drawImage(set.night, x, y, w, h); }
  ctx.globalAlpha = 1;
}

let par = 0;   // thị sai mượt theo diều
function drawSky() {
  const S = SKY;
  const sky = ctx.createLinearGradient(0, 0, 0, hY + 4);
  sky.addColorStop(0, S.sky[0]); sky.addColorStop(0.45, S.sky[1]); sky.addColorStop(0.85, S.sky[2]); sky.addColorStop(1, S.sky[3]);
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, hY + 26);
  // sao
  if (S.stars > 0.01) {
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      const tw = RM ? 0.8 : 0.55 + 0.45 * Math.sin(skyClock * s.sp + s.ph);
      ctx.globalAlpha = S.stars * tw * clamp((hY - s.y) / 120, 0.2, 1);
      ctx.fillRect(s.x - s.r / 2, s.y - s.r / 2, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }
  // mặt trời: hạ dần, to và đỏ dần khi về chân trời
  if (S.sun > -0.12) {
    const e = S.sun, sx = W * lerp(0.84, 0.76, clamp(e, 0, 1)), sy = lerp(hY - 40, H * 0.13, clamp(e, -0.3, 1));
    const low = 1 - clamp(e, 0, 1), r = 20 + low * 22;
    const core = low > 0.6 ? mixHex('#fff1c2', '#ff7a45', (low - 0.6) / 0.4) : mixHex('#fffbe9', '#fff1c2', low / 0.6);
    const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * (0.4 + low * 0.25));
    rg.addColorStop(0, low > 0.6 ? 'rgba(255,170,110,.75)' : 'rgba(255,248,220,.75)'); rg.addColorStop(0.08, low > 0.6 ? 'rgba(255,140,90,.4)' : 'rgba(255,240,200,.42)');
    rg.addColorStop(0.32, 'rgba(255,200,150,.1)'); rg.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, hY + 4);
    ctx.save(); ctx.beginPath(); ctx.rect(-20, -20, W + 40, hY + 20); ctx.clip();
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // trăng
  if (S.moon > -0.15) {
    const e = S.moon, mx = W * lerp(0.16, 0.26, clamp(e, 0, 1)), my = lerp(hY + 4, H * 0.12, clamp(e, -0.2, 1)), sz = 140;
    ctx.save(); ctx.beginPath(); ctx.rect(-20, -20, W + 40, hY + 20); ctx.clip();
    ctx.globalAlpha = clamp((e + 0.15) / 0.25, 0, 1); ctx.drawImage(moonSpr, mx - sz / 2, my - sz / 2, sz, sz); ctx.restore();
  }
}
function drawWater() {

// ---------- mây (vẽ sẵn từng đám, trôi theo gió, có độ sâu) ----------
function makeCloud(scale) {
  const c = document.createElement('canvas'), w = Math.round(220 * scale), h = Math.round(110 * scale);
  c.width = w * DPR; c.height = h * DPR;
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  const n = 7 + (Math.random() * 5 | 0);
  for (let i = 0; i < n; i++) {
    const x = rand(0.25, 0.75) * w, y = rand(0.5, 0.62) * h;
    // bán kính không vượt mép khung vẽ (tránh mây bị cắt cạnh vuông)
    const r = Math.min(rand(0.12, 0.22) * w, x - 2, w - x - 2, y - 2, h - y - 2);
    const rg = g.createRadialGradient(x, y - r * 0.3, r * 0.1, x, y, r);
    rg.addColorStop(0, 'rgba(255,255,255,.95)'); rg.addColorStop(0.65, 'rgba(250,252,255,.75)'); rg.addColorStop(1, 'rgba(235,242,252,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  // đáy mây hơi xám cho có khối
  const sh = g.createLinearGradient(0, h * 0.5, 0, h);

  const tint = (top, bot, a) => {
    const t = document.createElement('canvas'); t.width = c.width; t.height = c.height;
    const q = t.getContext('2d'); q.drawImage(c, 0, 0); q.scale(DPR, DPR); q.globalCompositeOperation = 'source-atop';
    const lg = q.createLinearGradient(0, 0, 0, h); lg.addColorStop(0, top); lg.addColorStop(1, bot); q.globalAlpha = a; q.fillStyle = lg; q.fillRect(0, 0, w, h);
    return t;
  };
  return { img: c, imgD: tint('#ffc98a', '#a65a8c', 0.62), imgN: tint('#6f7fae', '#1d2649', 0.82), w, h };
}

// ---------- cỏ lay theo gió ----------
let grass = [];

// ---------- trạng thái ----------
const LEVELS = [
  { name: 'Gió nhẹ', f: 100 }, { name: 'Gió vừa', f: 150 }, { name: 'Gió mạnh', f: 200 }, { name: 'Gió rất mạnh', f: 250 }
];
const state = { phase: 'menu', t: 0, snapT: 0, reason: '', stage: 0 };
let freezeT = 0, flashA = 0, shakeT = 0, hbNext = 0;
const kite = { x: 0, y: 0, vx: 0, vy: 0, tilt: 0, alive: true, fx: 0, fy: 0, fvx: 0, fvy: 0, spin: 0, tail: [] };
const wind = { x: 0, gust: null, next: 2.5, warn: null };
// ---------- nghiêng thiết bị: góp một lực nhỏ lên diều (không ảnh hưởng lực căng dây) ----------
const tiltCtl = { raw: 0, base: null, val: 0, on: false };
function onTilt(e) {
  if (e.gamma == null) return;
  let g = e.gamma;   // nghiêng trái/phải khi cầm dọc (độ)
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (ang === 90) g = -(e.beta || 0); else if (ang === -90 || ang === 270) g = (e.beta || 0);   // màn hình xoay ngang
  tiltCtl.raw = g;
  if (tiltCtl.base === null) tiltCtl.base = g;   // tư thế cầm ban đầu là vị trí trung hòa
  tiltCtl.on = true;
}
function enableTilt() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') addEventListener('deviceorientation', onTilt); }).catch(() => {});
    } else addEventListener('deviceorientation', onTilt);
  } catch (e) {}
}
const TILT_FORCE = 68;   // so với lực kéo PULL = 270: khoảng 25% ở độ nghiêng tối đa
function tiltInput(dt) {
  if (!tiltCtl.on || tiltCtl.base === null) return 0;
  let d = tiltCtl.raw - tiltCtl.base;
  tiltCtl.base += clamp(d, -1, 1) * dt * 0.5;   // trung hòa trôi dần theo tư thế cầm để không bị lệch lâu dài
  if (Math.abs(d) < 3) d = 0; else d -= Math.sign(d) * 3;   // vùng chết 3°
  const v = clamp(d / 25, -1, 1);
  tiltCtl.val = lerp(tiltCtl.val, v, 1 - Math.exp(-8 * dt));
  return tiltCtl.val;
}

let tension = 0, input = 0, keyL = false, keyR = false, btnL = false, btnR = false;
let streaks = [], leaves = [], birds = [], birdTimer = 4;

function resetGame() {
  state.t = 0; state.reason = '';
  kite.x = 0; kite.vx = 0; kite.y = kiteBaseY(); kite.vy = 0; kite.tilt = 0; kite.alive = true; kite.spin = 0;
  wind.x = 0; wind.gust = null; wind.next = 2.2; wind.warn = null;
  tension = 0.12;
  initTail();
  streaks = []; leaves = [];
  state.stage = 0; freezeT = 0; flashA = 0; shakeT = 0; hbNext = 0;
  hideBanner();
}

// đuôi diều: chuỗi điểm (verlet)
const TAIL_N = 16, TAIL_SEG = 9;
function kiteAnchor() { return [W / 2 + kite.x, kite.y]; }
function initTail() {
  const [x, y] = kiteAnchor();
  kite.tail = Array.from({ length: TAIL_N }, (_, i) => ({ x, y: y + 34 + i * TAIL_SEG, px: x, py: y + 34 + i * TAIL_SEG }));
}

// ---------- gió ----------
function difficulty() { return 1 + Math.min(0.7, state.t / 150); }
function updateWind(dt) {
  const d = difficulty(), t = state.t;
  // gió nền trôi chậm + nhiễu động
  const drift = Math.sin(t * 0.21) * 18 * d + Math.sin(t * 0.53 + 1.3) * 10;
  const turb = (Math.sin(t * 2.7) * 0.6 + Math.sin(t * 4.3 + 2) * 0.4) * 14 * d;
  let gx = 0;
  // lịch cơn gió giật: cảnh báo trước ~0.9s
  if (!wind.gust && !wind.warn) {
    wind.next -= dt;
    if (wind.next <= 0) {
      const maxL = clamp(2 + Math.floor(state.t / 15), 2, 4);   // đầu game có gió nhẹ/vừa, sau đó mạnh dần
      const level = Math.min(maxL - 1, Math.floor(Math.pow(Math.random(), 0.8) * maxL));
      wind.warn = { dir: Math.random() < 0.5 ? -1 : 1, level, t: 0 };
      Snd.whoosh();
    }
  }
  if (wind.warn) {
    wind.warn.t += dt;
    gx += wind.warn.dir * LEVELS[wind.warn.level].f * 0.12 * (wind.warn.t / 0.9);   // gió bắt đầu nổi
    if (wind.warn.t >= 0.9) {
      wind.gust = { dir: wind.warn.dir, level: wind.warn.level, t: 0, dur: rand(1.5, 3.0) + wind.warn.level * 0.3 };
      wind.warn = null;
    }
  }
  if (wind.gust) {
    const g = wind.gust; g.t += dt;
    const up = 0.45, down = 0.7;
    const env = g.t < up ? g.t / up : g.t < g.dur ? 1 : Math.max(0, 1 - (g.t - g.dur) / down);
    const flutter = 1 + 0.18 * Math.sin(g.t * 9) ;
    gx += g.dir * LEVELS[g.level].f * d * 0.75 * env * flutter;
    if (g.t > g.dur + down) { wind.gust = null; wind.next = rand(1.6, 3.6) / Math.sqrt(d); }
  }
  wind.x = drift + turb + gx;
}

// ---------- vật lý diều ----------
const PULL = 270, BREAK = 1;
const SCALE = () => W / 412;   // lực tính theo bề rộng màn hình để độ khó như nhau trên mọi máy
function updateKite(dt) {
  input = (keyR || btnR ? 1 : 0) - (keyL || btnL ? 1 : 0);
  const wAbs = Math.abs(wind.x);
  // lực: gió + kéo dây + dây có xu hướng kéo diều về giữa (yếu) + cản không khí
  const k = SCALE();
  const ax = (wind.x * 1.05 + input * PULL + tiltInput(dt) * TILT_FORCE) * k - kite.x * 0.25 - kite.vx * 1.35;
  kite.vx += ax * dt; kite.x += kite.vx * dt;
  // độ cao: gió mạnh nâng diều lên, lặng gió diều hạ nhẹ, kéo dây cũng nâng diều
  const targetY = kiteBaseY() - Math.min(70, wAbs * 0.22) - (input ? 18 : 0) + Math.sin(state.t * 1.7) * 6;
  kite.vy += ((targetY - kite.y) * 3.2 - kite.vy * 2.4) * dt; kite.y += kite.vy * dt;
  kite.tilt = lerp(kite.tilt, clamp(kite.vx * 0.0028 + wind.x * 0.0016, -0.75, 0.75), 1 - Math.exp(-6 * dt));
  // lực căng: tự cân bằng theo sức gió; giữ nút thì tăng dần (kéo ngược gió và gió mạnh tăng nhanh hơn)
  const base = 0.12 + 0.38 * Math.min(1, wAbs / 300);
  if (input) {
    const against = Math.sign(wind.x) === -input ? 1.35 : 0.85;
    tension += (0.36 + 0.24 * Math.min(1, wAbs / 260)) * against * dt;   // giữ liên tục ~1.5–2 giây là đứt
  } else {
    tension += (base - tension) * Math.min(1, 3.2 * dt);   // nhả tay thì dây chùng lại khá nhanh
  }
  tension = Math.max(tension, base * 0.9);
  // thua
  if (tension >= BREAK) return snap('Dây căng quá mức');
  if (Math.abs(kite.x) > W / 2 + 4) return snap('Diều bay khỏi khung trời');
}

function snap(reason) {
  if (!kite.alive) return;
  kite.alive = false; state.phase = 'snap'; state.snapT = 0; state.reason = reason;
  const [x, y] = kiteAnchor();
  kite.fx = x; kite.fy = y; kite.fvx = kite.vx + wind.x * 0.8 + rand(-40, 40); kite.fvy = -rand(60, 140); kite.spin = rand(-4, 4);
  // sợi dây rơi xuống
  looseStr = { t: 0, x: x, y: y };
  Snd.snap();
  freezeT = 0.09; if (!RM) { flashA = 0.55; shakeT = 0.35; }
  try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
}
let looseStr = null;

function updateTail(dt) {
  const [ax, ay] = kiteAnchor();
  const cut = !kite.alive;   // dây đã đứt (cả khi đã sang màn kết thúc): đuôi bám theo diều đang bay đi
  const anchorX = cut ? kite.fx : ax, anchorY = (cut ? kite.fy : ay) + 34;
  const T = kite.tail, gx = wind.x * 0.9 - kite.vx * 0.4, gy = 260;
  for (let i = 0; i < T.length; i++) {
    const p = T[i];
    const vx = (p.x - p.px) * 0.985, vy = (p.y - p.py) * 0.985;
    p.px = p.x; p.py = p.y;
    const wob = Math.sin(state.t * 8 + i * 0.7) * 30 * (0.3 + Math.min(1, Math.abs(wind.x) / 200));
    p.x += vx + (gx + wob) * dt * dt * 1.0; p.y += vy + gy * dt * dt;
  }
  for (let k = 0; k < 4; k++) {
    T[0].x = anchorX; T[0].y = anchorY;
    for (let i = 1; i < T.length; i++) {
      const a = T[i - 1], b = T[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, f = (d - TAIL_SEG) / d;

      else { a.x += dx * f * 0.5; a.y += dy * f * 0.5; b.x -= dx * f * 0.5; b.y -= dy * f * 0.5; }
    }
  }
}

// ---------- hiệu ứng ----------
function updateFx(dt) {
  const wAbs = Math.abs(wind.x);
  // vệt gió
  const rate = wAbs / 22;
  if (Math.random() < rate * dt) streaks.push({ x: wind.x > 0 ? -60 : W + 60, y: rand(0.05, 0.85) * groundY, len: rand(40, 110) * (0.6 + wAbs / 300), life: rand(0.8, 1.6), a: 0, sp: rand(2.5, 4.2) });
  for (let i = streaks.length - 1; i >= 0; i--) { const s = streaks[i]; s.x += wind.x * s.sp * dt; s.life -= dt; s.a = Math.min(1, s.a + dt * 3); if (s.life <= 0 || s.x < -200 || s.x > W + 200) streaks.splice(i, 1); }

  if (wAbs > 120 && Math.random() < (wAbs - 120) / 60 * dt) leaves.push({ x: wind.x > 0 ? -20 : W + 20, y: rand(groundY - 120, groundY + 30), vx: wind.x * rand(1.5, 2.6), vy: rand(-40, 10), r: rand(0, 6.28), vr: rand(-6, 6), s: rand(4, 7), c: `hsl(${rand(30, 95)},70%,${rand(35, 50)}%)` });
  for (let i = leaves.length - 1; i >= 0; i--) { const l = leaves[i]; l.vx = lerp(l.vx, wind.x * 2.2, dt); l.vy += (Math.sin(state.t * 3 + i) * 40 - l.vy * 0.5) * dt; l.x += l.vx * dt; l.y += l.vy * dt; l.r += l.vr * dt; if (l.x < -40 || l.x > W + 40 || l.y > H) leaves.splice(i, 1); }
  // mây trôi theo gió (lớp gần trôi nhanh hơn)
  for (const c of clouds) {
    c.x += (6 + wind.x * 0.18) * c.depth * dt;
    if (c.x > W + 40) c.x = -c.w - rand(0, 80); else if (c.x < -c.w - 120) c.x = W + rand(0, 40);
  }
  // chim
  birdTimer -= dt;
  if (birdTimer <= 0 && SKY.night < 0.5) {
    birdTimer = rand(7, 15);
    const dir = Math.random() < 0.5 ? 1 : -1, n = 3 + (Math.random() * 4 | 0), y0 = rand(0.12, 0.4) * groundY;
    for (let i = 0; i < n; i++) birds.push({ x: dir > 0 ? -30 - i * 22 : W + 30 + i * 22, y: y0 + Math.abs(i - n / 2) * 10, v: dir * rand(40, 60), ph: rand(0, 6), s: rand(0.8, 1.1) });
  }
  for (let i = birds.length - 1; i >= 0; i--) { const b = birds[i]; b.x += (b.v + wind.x * 0.15) * dt; b.ph += dt * 9; if (b.x < -80 || b.x > W + 80) birds.splice(i, 1); }
}

// ---------- vẽ ----------
function drawClouds() { for (const c of clouds) drawBlend({ day: c.img, dusk: c.imgD, night: c.imgN }, c.x - par * 0.01 * c.depth, c.y, c.w, c.h); }

function drawBirds() {
  ctx.strokeStyle = 'rgba(40,50,70,.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (const b of birds) {
    const f = Math.sin(b.ph) * 4 * b.s, w = 7 * b.s;
    ctx.beginPath(); ctx.moveTo(b.x - w, b.y - f); ctx.quadraticCurveTo(b.x - w * 0.4, b.y - 3, b.x, b.y);
    ctx.quadraticCurveTo(b.x + w * 0.4, b.y - 3, b.x + w, b.y - f); ctx.stroke();
  }
}

function drawStreaks() {
  ctx.lineCap = 'round';
  for (const s of streaks) {
    const a = Math.min(s.a, s.life) * 0.45 * (1 - SKY.night * 0.55);
    const g = ctx.createLinearGradient(s.x - s.len, s.y, s.x, s.y);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${a})`);
    ctx.strokeStyle = g; ctx.lineWidth = 1.4;
    const dir = Math.sign(wind.x) || 1;
    ctx.beginPath(); ctx.moveTo(s.x - s.len * dir, s.y); ctx.quadraticCurveTo(s.x - s.len * 0.5 * dir, s.y - 3, s.x, s.y); ctx.stroke();
  }
}

function drawGrass(front) {
  const bendBase = clamp(wind.x / 300, -1, 1);
  ctx.lineCap = 'round';
  const feet = groundY + 70;   // chân người chơi
  for (const b of grass) {
    if ((b.y > feet) !== !!front) continue;   // cỏ phía sau người vẽ trước, cỏ phía trước vẽ sau
    const sway = Math.sin(state.t * (2 + Math.abs(bendBase) * 4) + b.ph + b.x * 0.02) * (0.15 + Math.abs(bendBase) * 0.25);
    const bend = (bendBase * 0.9 + sway) * b.h;
    ctx.strokeStyle = b.col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(b.x + bend * 0.3, b.y - b.h * 0.6, b.x + bend, b.y - b.h + Math.abs(bend) * 0.25); ctx.stroke();
  }
}

function drawLeaves() {
  for (const l of leaves) {
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.r); ctx.fillStyle = l.c;
    ctx.beginPath(); ctx.ellipse(0, 0, l.s, l.s * 0.45, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}

// người thả diều (bóng dáng) ở chân đồi
function drawPerson() {
  const x = handX, gy = groundY + 70, lean = clamp(input * 0.12 + (tension - 0.4) * 0.1, -0.2, 0.2);
  ctx.save(); ctx.translate(x, gy);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 2, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(lean * 0.4);
  // chân
  ctx.strokeStyle = '#2b3a55'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-5, -28); ctx.lineTo(-9, 0); ctx.moveTo(5, -28); ctx.lineTo(9, 0); ctx.stroke();
  // thân áo
  ctx.fillStyle = '#e8473f';
  ctx.beginPath(); ctx.moveTo(-11, -30); ctx.quadraticCurveTo(-13, -50, -8, -56); ctx.lineTo(8, -56); ctx.quadraticCurveTo(13, -50, 11, -30); ctx.closePath(); ctx.fill();
  // tay cầm dây giơ lên
  const hx = (handX - x) + input * 6, hy = handY - gy;
  ctx.strokeStyle = '#f2c79a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(7, -52); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7, -52); ctx.lineTo(-14, -36); ctx.stroke();
  // đầu + nón lá
  ctx.fillStyle = '#f2c79a'; ctx.beginPath(); ctx.arc(0, -63, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f4dc9b'; ctx.beginPath(); ctx.moveTo(-15, -64); ctx.lineTo(0, -80); ctx.lineTo(15, -64); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(150,110,40,.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

// dây diều: võng nhiều khi chùng, căng thẳng và đỏ dần khi sắp đứt
function drawString(kx, ky) {
  const slack = clamp(1 - tension, 0, 1);
  const mx = (handX + kx) / 2 - wind.x * 0.18 * slack, my = (handY + ky) / 2 + 60 * slack;
  const shakeAmt = tension > 0.78 ? (tension - 0.78) * 30 : 0;
  const jx = (Math.random() - 0.5) * shakeAmt, jy = (Math.random() - 0.5) * shakeAmt;
  const r = Math.round(lerp(245, 255, tension)), g = Math.round(lerp(245, 70, clamp((tension - 0.45) / 0.55, 0, 1))), b = Math.round(lerp(240, 60, clamp((tension - 0.45) / 0.55, 0, 1)));
  ctx.strokeStyle = `rgba(${r},${g},${b},.95)`; ctx.lineWidth = 1.4 + tension * 0.8;
  ctx.beginPath(); ctx.moveTo(handX, handY); ctx.quadraticCurveTo(mx + jx, my + jy, kx, ky); ctx.stroke();
}

function drawKite(x, y, tilt, scale) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(scale, scale);
  const w = 34, top = -46, mid = -6, bot = 40;
  // bóng mờ
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 6;
  // 4 mảnh màu (ánh sáng: nửa trái sáng hơn)
  const panels = [
    [[0, top], [-w, mid], [0, mid], '#ff5a4f'],
    [[0, top], [w, mid], [0, mid], '#d8322b'],
    [[-w, mid], [0, bot], [0, mid], '#ffcf3f'],
    [[w, mid], [0, bot], [0, mid], '#f0a91f'],
  ];
  for (const [a, b, c, col] of panels) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath(); ctx.fill();
  }
  ctx.shadowColor = 'transparent';
  // họa tiết mặt trời giữa diều
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(0, mid, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 10, mid + Math.sin(a) * 10); ctx.lineTo(Math.cos(a) * 14, mid + Math.sin(a) * 14); ctx.stroke(); }
  // nan tre
  ctx.strokeStyle = '#6b4a22'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(0, bot); ctx.moveTo(-w, mid); ctx.quadraticCurveTo(0, mid - 8, w, mid); ctx.stroke();
  // viền
  ctx.strokeStyle = 'rgba(90,30,10,.55)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(w, mid); ctx.lineTo(0, bot); ctx.lineTo(-w, mid); ctx.closePath(); ctx.stroke();
  // ánh nắng phản chiếu
  const sh = ctx.createLinearGradient(-w, top, w, bot);
  sh.addColorStop(0, 'rgba(255,255,255,.28)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.12)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(w, mid); ctx.lineTo(0, bot); ctx.lineTo(-w, mid); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawTail() {
  const T = kite.tail;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(120,60,20,.7)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(T[0].x, T[0].y); for (let i = 1; i < T.length; i++) ctx.lineTo(T[i].x, T[i].y); ctx.stroke();
  // nơ ruy băng xen màu
  for (let i = 2; i < T.length; i += 2) {
    const p = T[i], q = T[i - 1], a = Math.atan2(p.y - q.y, p.x - q.x) + Math.PI / 2;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(a);
    ctx.fillStyle = i % 4 === 0 ? '#ff5a4f' : '#ffcf3f';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-7, -4); ctx.lineTo(-7, 4); ctx.closePath(); ctx.moveTo(0, 0); ctx.lineTo(7, -4); ctx.lineTo(7, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// mép khung đỏ dần khi diều sắp ra ngoài
function drawEdgeWarning() {
  const d = Math.abs(kite.x) / (W / 2);
  if (d < 0.65 || !kite.alive) return;
  const a = clamp((d - 0.65) / 0.3, 0, 1) * (0.55 + 0.25 * Math.sin(state.t * 14));
  const left = kite.x < 0;
  const g = ctx.createLinearGradient(left ? 0 : W, 0, left ? 70 : W - 70, 0);
  g.addColorStop(0, `rgba(255,50,50,${a})`); g.addColorStop(1, 'rgba(255,50,50,0)');
  ctx.fillStyle = g; ctx.fillRect(left ? 0 : W - 70, 0, 70, H);
}

// cảnh báo cơn gió giật: dải mũi tên sáng ở mép phía gió tới
function drawGustWarn() {
  const wv = wind.warn; if (!wv || state.phase !== 'play') return;
  const k = clamp(wv.t / 0.9, 0, 1), left = wv.dir > 0, ex = left ? 0 : W, dir = left ? 1 : -1;
  const pulse = 0.55 + 0.45 * Math.sin(wv.t * Math.PI * 2 * 2.5);
  const g = ctx.createLinearGradient(ex, 0, ex + dir * 90, 0);
  g.addColorStop(0, `rgba(255,255,255,${0.32 * k})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(left ? 0 : W - 90, 0, 90, groundY);
  ctx.strokeStyle = `rgba(255,255,255,${(0.55 + 0.45 * pulse) * k})`; ctx.lineWidth = 4.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const n = 2 + wv.level;
  for (let i = 0; i < 4; i++) {
    const y = groundY * (0.2 + i * 0.17), x0 = ex + dir * (16 + ((wv.t * 70 + i * 13) % 26));
    for (let j = 0; j < Math.min(3, n); j++) { const x = x0 + dir * j * 11; ctx.beginPath(); ctx.moveTo(x - dir * 6, y - 8); ctx.lineTo(x + dir * 2, y); ctx.lineTo(x - dir * 6, y + 8); ctx.stroke(); }
  }
}
function drawForeground() {
  if (kite.alive) {
    const [kx, ky] = kiteAnchor();
    drawString(kx, ky + 30);
    drawTail();
    drawKite(kx, ky, kite.tilt, 1);
  } else {
    // dây đứt rơi xuống, diều xoay tít bay theo gió
    if (looseStr) {
      const k = Math.min(1, looseStr.t / 1.2);
      ctx.strokeStyle = `rgba(255,255,255,${0.9 - k * 0.6})`; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(handX, handY);
      const wob = Math.sin(looseStr.t * 16) * Math.exp(-looseStr.t * 3.2) * 46;
      ctx.quadraticCurveTo(lerp((handX + looseStr.x) / 2, handX + 30, k) + wob, lerp((handY + looseStr.y) / 2 + 80, handY + 40, k) - wob * 0.4,
        lerp(looseStr.x, handX + 50, k), lerp(looseStr.y, handY + 60, k));
      ctx.stroke();
    }
    drawTail();
    drawKite(kite.fx, kite.fy, kite.spin * state.snapT, Math.max(0.4, 1 - state.snapT * 0.25));
  }
  drawLeaves();
  drawGrass(false);
  drawPerson();
  drawGrass(true);
}
function draw() {
  const S = skyAt(skyT);
  par = RM ? 0 : lerp(par, kite.alive ? kite.x : kite.fx - W / 2, 0.08);
  let ox = 0, oy = 0;
  if (shakeT > 0) { const a = 8 * (shakeT / 0.35) ** 2; ox = (Math.random() * 2 - 1) * a; oy = (Math.random() * 2 - 1) * a; }
  ctx = mainCtx;
  ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
  ctx.fillStyle = S.sky[0]; ctx.fillRect(-20, -20, W + 40, H + 40);
  drawSky();
  drawBlend(L.far, -PAR_M - par * 0.02, farY0, W + PAR_M * 2, farH);
  drawClouds();
  drawBirds();
  drawWater();
  drawBlend(L.mid, -PAR_M - par * 0.045, midY0, W + PAR_M * 2, midH);
  drawLights();
  drawBuffalo();
  drawBlend(L.near, -PAR_M, nearY0, W + PAR_M * 2, nearH);
  drawStreaks();
  // diều phát sáng nhẹ ban đêm (vẽ sau lưng diều)
  if (S.night > 0.3) {
    const [gx, gy] = kite.alive ? kiteAnchor() : [kite.fx, kite.fy];
    ctx.globalAlpha = (S.night - 0.3) * 0.55; ctx.drawImage(warmGlow, gx - 70, gy - 70, 140, 140); ctx.globalAlpha = 1;
  }
  // tiền cảnh (dây, diều, cỏ, người) vẽ lên lớp riêng rồi phủ ánh sáng theo giờ
  const tint = S.wdu * 0.26 + S.wn * 0.5;
  if (tint > 0.01) {
    // chỉ xử lý vùng tiền cảnh (từ 22% chiều cao màn hình trở xuống) thay vì cả màn hình
    const fy0 = Math.floor(H * 0.22 * DPR), fh = cv.height - fy0;
    fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, fgCv.width, fh);
    fx.setTransform(DPR, 0, 0, DPR, 0, -H * 0.22 * DPR);
    ctx = fx; drawForeground(); ctx = mainCtx;
    fx.globalCompositeOperation = 'source-atop';
    if (S.wdu > 0.01) { fx.fillStyle = `rgba(150,60,70,${S.wdu * 0.26})`; fx.fillRect(0, H * 0.22, W, H); }
    if (S.wn > 0.01) { fx.fillStyle = `rgba(12,22,70,${S.wn * 0.5})`; fx.fillRect(0, H * 0.22, W, H); }
    fx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, ox * DPR, oy * DPR);
    ctx.drawImage(fgCv, 0, 0, fgCv.width, fh, 0, fy0, fgCv.width, fh);
    ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
  } else drawForeground();
  drawFireflies();
  drawGustWarn();
  drawEdgeWarning();
  // căng dây nguy hiểm: viền đỏ đập theo nhịp tim
  if (tension > 0.8 && state.phase === 'play') {
    const ph = (skyClock * 1.6) % 1, beat = RM ? 0.6 : Math.max(Math.exp(-ph * 9), 0.7 * Math.exp(-Math.abs(ph - 0.16) * 12));
    ctx.globalAlpha = clamp((tension - 0.8) / 0.2, 0, 1) * (0.35 + 0.5 * beat); ctx.drawImage(vignette, 0, 0, W, H); ctx.globalAlpha = 1;
  }
  if (flashA > 0.01) { ctx.fillStyle = `rgba(255,255,255,${flashA})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
}

// ---------- HUD ----------
let hudT = 0;
function updateHUD(dt) {
  hudT -= dt;
  const ti = $('tension');
  ti.firstElementChild.style.width = (Math.min(1, tension) * 100).toFixed(1) + '%';
  ti.classList.toggle('danger', tension > 0.8 && state.phase === 'play');
  if (hudT > 0) return;
  hudT = 0.1;
  $('time').textContent = state.t.toFixed(1) + ' giây';
  $('best').textContent = 'Kỷ lục ' + store.best.toFixed(1) + ' giây';
  const w = wind.x, v = Math.abs(w) / 16;   // m/s (quy ước: 16 đơn vị = 1 m/s)
  $('windText').textContent = v.toFixed(1) + ' m/s';
  const f = $('windFlow');
  f.style.setProperty('--d', clamp(1.7 - v * 0.095, 0.2, 1.7).toFixed(2) + 's');   // gió càng mạnh mũi tên chạy càng nhanh
  f.style.setProperty('--c', v < 3 ? '#e8f4ff' : v < 7 ? '#fff2a8' : v < 11 ? '#ffc266' : '#ff7a6a');
  f.style.transform = w < 0 ? 'scaleX(-1)' : 'scaleX(1)';
  f.style.opacity = v < 0.6 ? 0.45 : 1;
}

// ---------- vòng lặp ----------
let last = 0, menuT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
  if (document.hidden) return;
  if (document.body.dataset.ph !== state.phase) document.body.dataset.ph = state.phase;
  skyClock += dt;
  flashA = Math.max(0, flashA - dt * 5); shakeT = Math.max(0, shakeT - dt);
  if (freezeT > 0) { freezeT -= dt; draw(); return; }   // khựng khung khi dây đứt
  if (state.phase === 'play') {
    state.t += dt;
    updateWind(dt);
    updateKite(dt);
    skyT = state.t;
    const st = stageAt(state.t);
    if (st.idx > state.stage) { state.stage = st.idx; milestone(st); }
    if (tension > 0.82 && state.phase === 'play' && skyClock > hbNext) { Snd.beat(); hbNext = skyClock + 0.62; }
  } else if (state.phase === 'menu') {
    // màn chờ: gió hiu hiu, diều tự bay
    menuT += dt; state.t += dt;   // chỉ để cảnh nền (cỏ, đuôi diều, mây) chuyển động; HUD đang ẩn và ván mới sẽ đặt lại về 0
    wind.x = Math.sin(menuT * 0.5) * 60 + Math.sin(menuT * 1.7) * 15;
    kite.x = Math.sin(menuT * 0.5 - 0.6) * W * 0.12; kite.vx = Math.cos(menuT * 0.5 - 0.6) * W * 0.06;
    kite.y = kiteBaseY() + Math.sin(menuT * 1.3) * 10;
    kite.tilt = lerp(kite.tilt, clamp(kite.vx * 0.003 + wind.x * 0.0015, -0.6, 0.6), 0.08);
    tension = 0.3;
    skyT = (24 + menuT * 3.2) % DAY_LEN;   // màn chờ: bầu trời trôi qua cả ngày để giới thiệu hành trình
  } else if (state.phase === 'snap' || state.phase === 'over') {
    state.snapT += dt;
    wind.x *= Math.exp(-0.3 * dt);
    kite.fvx = lerp(kite.fvx, wind.x * 1.4, dt); kite.fvy -= 20 * dt;
    kite.fx += kite.fvx * dt; kite.fy += kite.fvy * dt;
    if (looseStr) looseStr.t += dt;
    tension = Math.max(0, tension - dt * 2);
    if (state.phase === 'snap' && state.snapT > 1.4) gameOver();
  }
  updateTail(dt);
  updateFx(dt);
  updateBuffalo(dt);
  updateFireflies(dt);
  Snd.wind(Math.min(1, Math.abs(wind.x) / 280));
  Snd.flute(Math.min(1, Math.abs(wind.x) / 260), SKY.night);
  updateHUD(dt);
  draw();
}

// ---------- màn hình ----------
const show = (id, on) => $(id).classList.toggle('show', on);
let bannerT = 0;
function milestone(st) {
  const S = STAGES[st.s], newDay = st.s === 0;
  $('bnIc').textContent = newDay ? '🎉' : S.i;
  $('bnTi').textContent = newDay ? 'Ngày mới' : S.n;
  $('bnSu').textContent = newDay ? 'Bạn đã bay trọn một ngày!' : 'Bay được ' + Math.round(state.t) + ' giây';
  const el = $('banner'); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(bannerT); bannerT = setTimeout(hideBanner, 2600);
  Snd.chime();
  try { navigator.vibrate && navigator.vibrate(20); } catch (e) {}
}
function hideBanner() { clearTimeout(bannerT); const el = $('banner'); if (el) el.classList.remove('show'); }
function journeyInfo(t) {
  const st = stageAt(t), r = t - st.lap * DAY_LEN, nx = STAGES[st.s + 1];
  const pct = clamp(r / DAY_LEN * 100, 0, 100);
  $('jFill').style.width = (st.lap > 0 ? 100 : pct) + '%';
  $('jDot').style.left = pct + '%';
  $('jMarks').innerHTML = STAGES.map((s, i) => `<span style="left:${s.t / DAY_LEN * 100}%" class="${i <= st.s || st.lap ? 'on' : ''}">${s.i}</span>`).join('') + '<span style="left:100%" class="' + (st.lap ? 'on' : '') + '">🎉</span>';
  $('oReach').innerHTML = 'Bạn đã bay tới <b>' + STAGES[st.s].i + ' ' + STAGES[st.s].n + '</b>' + (st.lap ? ' (ngày thứ ' + (st.lap + 1) + ')' : '');
  const left = (nx ? nx.t : DAY_LEN) - r;
  $('oNext').textContent = 'Còn ' + left.toFixed(1).replace('.', ',') + ' giây nữa là tới ' + (nx ? nx.i + ' ' + nx.n : '🎉 Ngày mới') + '!';
}
function start() {
  Snd.init(); enableTilt(); tiltCtl.base = null;   // đặt lại tư thế trung hòa mỗi ván
  resetGame();
  state.phase = 'play';
  show('menu', false); show('over', false);
}
function gameOver() {
  state.phase = 'over';
  const t = state.t, nb = t > store.best;
  if (nb) { store.best = t; save(); }
  if (window.Scores) Scores.submit('thadieu', Math.floor(t * 10));
  $('reason').textContent = state.reason;
  $('oTime').textContent = t.toFixed(1) + ' giây';
  $('oBest').textContent = nb ? ' Kỷ lục mới!' : 'Kỷ lục: ' + store.best.toFixed(1) + ' giây';
  journeyInfo(t);
  hideBanner();
  show('over', true);
}
$('bStart').onclick = start;
$('bAgain').onclick = start;

// ---------- điều khiển ----------
function bindHold(el, set) {
  const on = e => { e.preventDefault(); Snd.init(); set(true); el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { set(false); el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindHold($('bL'), v => btnL = v);
bindHold($('bR'), v => btnR = v);
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keyL = true; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keyR = true; e.preventDefault(); }
  if ((e.key === ' ' || e.key === 'Enter') && state.phase !== 'play' && state.phase !== 'snap') start();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyL = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyR = false;
});
addEventListener('blur', () => { keyL = keyR = btnL = btnR = false; });
const sndBtn = $('snd');
const syncSnd = () => { sndBtn.textContent = store.snd ? '🔊' : '🔇'; };
sndBtn.onclick = () => { store.snd = !store.snd; save(); syncSnd(); Snd.init(); if (!store.snd) Snd.mute(); };
syncSnd();

addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 150); });   // gom các sự kiện resize liên tiếp
addEventListener('visibilitychange', () => { if (document.hidden) Snd.mute(); });   // tab ẩn: tắt gió và sáo
resize();
initClouds();
resetGame();
state.phase = 'menu';
requestAnimationFrame(frame);
</script>
