<script>
(() => {
'use strict';

/* =========================================================
   CANVAS
   ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  bgGrad = null;
}
window.addEventListener('resize', resize);

/* =========================================================
   MÀU
   ========================================================= */
const PAL = [
  { r:255, g:46,  b:136 },
  { r:0,   g:229, b:255 }
];
const css = (i, a = 1) => `rgba(${PAL[i].r},${PAL[i].g},${PAL[i].b},${a})`;

const glowSprites = PAL.map(c => {
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grd.addColorStop(0,    `rgba(${c.r},${c.g},${c.b},0.90)`);
  grd.addColorStop(0.28, `rgba(${c.r},${c.g},${c.b},0.30)`);
  grd.addColorStop(1,    `rgba(${c.r},${c.g},${c.b},0)`);
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  return cv;
});

/* =========================================================
   ĐỘ KHÓ 4/5  ← CÁC HẰNG SỐ ĐÃ THAY ĐỔI
   ========================================================= */
const MAX_SPEED   = 380;   // cũ 450 — chậm hơn 16%
const RESPONSE    = 14;    // cũ 18  — bám input kém "tức thì" hơn
const PICKUP_MUL  = 1.05;  // cũ 1.10 — vùng ăn điểm hẹp hơn
const DEATH_MUL   = 0.78;  // cũ 0.50 — VÙNG CHẾT RỘNG HƠN 60%
const MAX_ENEMIES = 65;    // cũ 46  — nhiều địch hơn
const SWAP_CD     = 0.15;  // cũ 0.08 — đổi màu chậm hơn gần 2 lần

let state = 'menu';
let bgGrad = null;
let isTouch = false;

let player = { x:0, y:0, vx:0, vy:0, r:13, pol:0 };
let enemies = [];
let particles = [];
let waves = [];
let trail = [];

let score = 0;
let best = Number(localStorage.getItem('colorshift_best') || 0);
let combo = 0, comboTimer = 0;
let elapsed = 0, spawnTimer = 0;
let idleUntil = 0, idleBoost = 1;
let shake = 0, overTimer = 0, swapCd = 0;
let overlayShown = false;

const keys = Object.create(null);
const joy = { active:false, id:-1, ox:0, oy:0, dx:0, dy:0 };

resize();
player.x = W/2;
player.y = H/2;

/* =========================================================
   ÂM THANH
   ========================================================= */
let audioCtx = null;
function initAudio(){
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ audioCtx = null; }
}
function beep(freq, dur, type, vol){
  if (!audioCtx || audioCtx.state === 'suspended') return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.55), t + dur);
  gain.gain.setValueAtTime(vol || 0.07, t);
  gain.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

/* =========================================================
   DOM
   ========================================================= */
const overlay    = document.getElementById('overlay');
const menuScreen = document.getElementById('menuScreen');
const overScreen = document.getElementById('overScreen');
const hud        = document.getElementById('hud');
const scoreEl    = document.getElementById('scoreVal');
const comboEl    = document.getElementById('comboVal');
const timeEl     = document.getElementById('timeVal');
const finalEl    = document.getElementById('finalScore');
const bestEl     = document.getElementById('bestScore');

let _s = -1, _c = -1, _t = -1;
function updateHUD(){
  if (score !== _s){ _s = score; scoreEl.textContent = score; }
  const mult = Math.min(1 + Math.floor(combo / 4), 9);
  if (mult !== _c){ _c = mult; comboEl.textContent = 'x' + mult; }
  const t = Math.floor(elapsed);
  if (t !== _t){ _t = t; timeEl.textContent = t + 's'; }
}

function swapBtn(){
  const r = Math.min(48, Math.max(38, W * 0.075));
  return { x: W - r - 26, y: H - r - 40, r };
}

/* =========================================================
   ĐIỀU KHIỂN
   ========================================================= */
function action(){
  if (state === 'menu') startGame();
  else if (state === 'playing') swap();
  else if (state === 'over' && overTimer > 0.6) startGame();
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'Space') action();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch'){
    isTouch = true;
    if (state === 'playing'){
      const b = swapBtn();
      const d = Math.hypot(e.clientX - b.x, e.clientY - b.y);
      if (d < b.r + 16){ swap(); return; }
    }
    if (!joy.active){
      joy.active = true;
      joy.id = e.pointerId;
      joy.ox = e.clientX;
      joy.oy = e.clientY;
      joy.dx = 0; joy.dy = 0;
    }
  } else {
    action();
  }
});

canvas.addEventListener('pointermove', e => {
  if (!joy.active || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox;
  let dy = e.clientY - joy.oy;
  const len = Math.hypot(dx, dy);
  const max = 58;
  if (len > max){ dx = dx / len * max; dy = dy / len * max; }
  const dead = 4;
  const l2 = Math.hypot(dx, dy);
  if (l2 < dead){ joy.dx = 0; joy.dy = 0; return; }
  joy.dx = dx / max;
  joy.dy = dy / max;
});

function endJoy(e){
  if (e.pointerId === joy.id){
    joy.active = false; joy.id = -1; joy.dx = 0; joy.dy = 0;
  }
}
canvas.addEventListener('pointerup', endJoy);
canvas.addEventListener('pointercancel', endJoy);

document.getElementById('startBtn').addEventListener('click', () => { initAudio(); startGame(); });
document.getElementById('retryBtn').addEventListener('click', () => { initAudio(); startGame(); });

/* =========================================================
   VÒNG ĐỜI
   ========================================================= */
function startGame(){
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  state = 'playing';
  player.x = W/2; player.y = H/2;
  player.vx = 0;  player.vy = 0;
  player.pol = 0; player.r = 13;

  enemies.length = 0;
  particles.length = 0;
  waves.length = 0;
  trail.length = 0;

  score = 0; combo = 0; comboTimer = 0;
  elapsed = 0; idleUntil = 0; idleBoost = 1;
  spawnTimer = 1.2;           // cũ 1.6 — áp lực đến sớm hơn
  shake = 0; overTimer = 0; swapCd = 0;
  overlayShown = false;
  joy.active = false; joy.id = -1; joy.dx = 0; joy.dy = 0;

  _s = _c = _t = -1;

  overlay.classList.add('hidden');
  hud.classList.remove('hidden');
  menuScreen.classList.remove('hidden');
  overScreen.classList.add('hidden');
  updateHUD();
}

function gameOver(){
  if (state !== 'playing') return;
  state = 'over';
  overTimer = 0;
  overlayShown = false;
  shake = 26;

  burst(player.x, player.y, player.pol, 34, 420);
  burst(player.x, player.y, 1 - player.pol, 22, 320);
  waves.push({ x:player.x, y:player.y, r:player.r, maxR: Math.max(W,H)*0.65, life:1, pol:player.pol, speed:1400 });

  beep(180, 0.55, 'sawtooth', 0.10);
  setTimeout(() => beep(90, 0.7, 'sine', 0.09), 90);

  if (score > best){
    best = score;
    localStorage.setItem('colorshift_best', best);
  }
  if (window.Scores) Scores.submit('biendoithichung', Math.floor(score));
}

function showGameOverScreen(){
  finalEl.textContent = score;
  bestEl.textContent = 'Kỷ lục: ' + best;
  menuScreen.classList.add('hidden');
  overScreen.classList.remove('hidden');
  overlay.classList.remove('hidden');
  hud.classList.add('hidden');
}

function swap(){
  if (swapCd > 0) return;
  swapCd = SWAP_CD;
  player.pol = 1 - player.pol;
  if (state === 'playing' && Math.hypot(player.vx, player.vy) < MAX_SPEED * 0.15){
    idleUntil = elapsed + 8;
    idleBoost = Math.min(idleBoost + 0.04, 1.3);
  }
  waves.push({
    x: player.x, y: player.y, r: player.r,
    maxR: player.r * 5.5, life: 1, pol: player.pol, speed: 520
  });
  beep(player.pol === 0 ? 460 : 620, 0.07, 'triangle', 0.055);
}

/* =========================================================
   KẺ ĐỊCH  ← TỐC ĐỘ & DAO ĐỘNG ĐÃ TĂNG
   ========================================================= */
function spawnEnemy(){
  if (enemies.length >= MAX_ENEMIES) return;

  const m = 70;
  const side = (Math.random() * 4) | 0;
  let x, y;
  if (side === 0){ x = Math.random() * W; y = -m; }
  else if (side === 1){ x = W + m; y = Math.random() * H; }
  else if (side === 2){ x = Math.random() * W; y = H + m; }
  else { x = -m; y = Math.random() * H; }

  enemies.push({
    x, y,
    r: 10 + Math.random() * 8,
    pol: Math.random() < 0.5 ? 0 : 1,
    // TỐC ĐỘ: cũ 50+rand(30)+min(t*1.6,110) → giờ nhanh hơn, trần cao hơn
    speed: 70 + Math.random() * 35 + Math.min(elapsed * 1.85, 200),
    spin: Math.random() * Math.PI * 2,
    spinSpeed: (Math.random() - 0.5) * 1.6,
    sides: 3 + ((Math.random() * 3) | 0),
    wobble: Math.random() * Math.PI * 2
  });
}

function burst(x, y, pol, count, speedMax){
  const sm = speedMax || 280;
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 50 + Math.random() * sm;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0.35 + Math.random() * 0.55,
      maxLife: 0.9,
      size: 1.4 + Math.random() * 3,
      pol
    });
  }
}

function destroyEnemy(index, e){
  enemies.splice(index, 1);
  combo++;
  comboTimer = 2.0;

  const mult = Math.min(1 + Math.floor(combo / 4), 9);
  score += elapsed < idleUntil ? Math.max(1, Math.round(10 * mult * 0.1)) : 10 * mult;

  shake = Math.min(shake + 3.5, 13);
  burst(e.x, e.y, e.pol, 13);
  waves.push({ x:e.x, y:e.y, r:e.r, maxR:e.r * 3.4, life:1, pol:e.pol, speed:420 });

  beep(200 + Math.min(combo, 22) * 24, 0.07, e.pol === 0 ? 'square' : 'triangle', 0.05);
  updateHUD();
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt){
  if (swapCd > 0) swapCd -= dt;
  if (shake > 0)  shake = Math.max(0, shake - dt * 55);

  if (comboTimer > 0){
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;
  }

  updateParticles(dt);
  updateWaves(dt);

  if (state === 'over'){
    overTimer += dt;
    if (!overlayShown && overTimer > 0.75){
      overlayShown = true;
      showGameOverScreen();
    }
    return;
  }
  if (state !== 'playing') return;

  elapsed += dt;

  /* ---------- DI CHUYỂN ---------- */
  let ix = 0, iy = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) ix -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) ix += 1;
  if (keys['ArrowUp']    || keys['KeyW']) iy -= 1;
  if (keys['ArrowDown']  || keys['KeyS']) iy += 1;
  ix += joy.dx;
  iy += joy.dy;

  const mag = Math.hypot(ix, iy);
  if (mag > 1){ ix /= mag; iy /= mag; }

  const tvx = ix * MAX_SPEED;
  const tvy = iy * MAX_SPEED;
  const k = 1 - Math.exp(-RESPONSE * dt);
  player.vx += (tvx - player.vx) * k;
  player.vy += (tvy - player.vy) * k;

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  const pad = player.r;
  if (player.x < pad){ player.x = pad; if (player.vx < 0) player.vx = 0; }
  if (player.x > W - pad){ player.x = W - pad; if (player.vx > 0) player.vx = 0; }
  if (player.y < pad){ player.y = pad; if (player.vy < 0) player.vy = 0; }
  if (player.y > H - pad){ player.y = H - pad; if (player.vy > 0) player.vy = 0; }

  trail.push({ x: player.x, y: player.y });
  if (trail.length > 14) trail.shift();

  /* ---------- SINH ĐỊCH  ← DÀY HƠN, SINH ĐÔI SỚM HƠN ---------- */
  spawnTimer -= dt;
  if (spawnTimer <= 0){
    spawnEnemy();
    // cũ: >35s, 30% → giờ: >20s, 45%
    if (elapsed > 20 && Math.random() < 0.45) spawnEnemy();

    // cũ: max(0.40, 1.15 - t*0.009) → giờ: sàn thấp hơn, tăng nhanh hơn
    const interval = Math.max(0.24, 1.10 - elapsed * 0.013);
    spawnTimer = interval * (0.75 + Math.random() * 0.5);
  }

  /* ---------- KẺ ĐỊCH & VA CHẠM ---------- */
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;

    // cũ 0.18 → giờ 0.32: khó đoán hơn
    const wob = Math.sin(elapsed * 1.8 + e.wobble) * 0.32;

    e.x += (nx - ny * wob) * e.speed * idleBoost * dt;
    e.y += (ny + nx * wob) * e.speed * idleBoost * dt;
    e.spin += e.spinSpeed * dt;

    const hitDist = Math.hypot(player.x - e.x, player.y - e.y);

    if (e.pol === player.pol){
      if (hitDist < e.r + player.r * PICKUP_MUL){
        destroyEnemy(i, e);
      }
    } else {
      // DEATH_MUL 0.78: hitbox chết rộng gần gấp đôi — không còn "suýt sống"
      if (hitDist < e.r + player.r * DEATH_MUL){
        gameOver();
        return;
      }
    }
  }

  updateHUD();
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const f = Math.exp(-2.6 * dt);
    p.vx *= f;
    p.vy *= f;
  }
}

function updateWaves(dt){
  for (let i = waves.length - 1; i >= 0; i--){
    const w = waves[i];
    w.life -= dt * 2.4;
    if (w.life <= 0){ waves.splice(i, 1); continue; }
    w.r += (w.maxR - w.r) * Math.min(1, dt * 7) + (w.speed || 0) * dt * 0.15;
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function drawGrid(){
  const step = 72;
  const ox = -player.x * 0.035;
  const oy = -player.y * 0.035;

  ctx.strokeStyle = 'rgba(120,155,255,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();

  let sx = ((ox % step) + step) % step - step;
  for (let x = sx; x < W + step; x += step){
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  let sy = ((oy % step) + step) % step - step;
  for (let y = sy; y < H + step; y += step){
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.spin);

  ctx.beginPath();
  for (let i = 0; i < e.sides; i++){
    const a = (i / e.sides) * Math.PI * 2 - Math.PI / 2;
    const px = Math.cos(a) * e.r;
    const py = Math.sin(a) * e.r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();

  ctx.fillStyle = css(e.pol, 0.18);
  ctx.fill();

  ctx.strokeStyle = css(e.pol, 1);
  ctx.lineWidth = 2.4;
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.restore();
}

function drawSwapButton(){
  const b = swapBtn();
  const col = player.pol;

  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fillStyle = css(col, 0.14);
  ctx.fill();
  ctx.strokeStyle = css(col, 0.65);
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r * 0.72, -0.9, 0.9);
  ctx.strokeStyle = css(col, 0.35);
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = css(col, 0.95);
  ctx.font = '800 ' + Math.round(b.r * 0.36) + 'px Segoe UI, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ĐỔI', b.x, b.y);
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  ctx.fillStyle = '#05060c';
  ctx.fillRect(0, 0, W, H);

  if (!bgGrad){
    bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.72);
    bgGrad.addColorStop(0, 'rgba(34,46,92,0.55)');
    bgGrad.addColorStop(1, 'rgba(5,6,12,0)');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.5){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawGrid();

  ctx.globalCompositeOperation = 'lighter';

  for (const e of enemies){
    const s = e.r * 6.5;
    ctx.drawImage(glowSprites[e.pol], e.x - s/2, e.y - s/2, s, s);
  }

  if (state !== 'over'){
    const s = player.r * 10;
    ctx.drawImage(glowSprites[player.pol], player.x - s/2, player.y - s/2, s, s);
  }

  for (const p of particles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = css(p.pol, a * 0.9);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';

  for (const w of waves){
    ctx.beginPath();
    ctx.arc(w.x, w.y, Math.max(0, w.r), 0, Math.PI * 2);
    ctx.strokeStyle = css(w.pol, w.life * 0.7);
    ctx.lineWidth = 1.5 + w.life * 3;
    ctx.stroke();
  }

  for (const e of enemies) drawEnemy(e);

  if (state !== 'over'){
    for (let i = 0; i < trail.length; i++){
      const t = trail[i];
      const k = i / trail.length;
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.r * (0.3 + 0.62 * k), 0, Math.PI * 2);
      ctx.fillStyle = css(player.pol, k * 0.20);
      ctx.fill();
    }

    const pulse = 1 + Math.sin(elapsed * 6) * 0.08;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 1.85 * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = css(player.pol, 0.30);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fillStyle = css(player.pol, 0.28);
    ctx.fill();
    ctx.strokeStyle = css(player.pol, 1);
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 0.36, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  if (joy.active){
    ctx.beginPath();
    ctx.arc(joy.ox, joy.oy, 58, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(150,180,255,0.22)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(joy.ox + joy.dx * 58, joy.oy + joy.dy * 58, 24, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(150,180,255,0.20)';
    ctx.fill();
  }

  if (isTouch && state === 'playing') drawSwapButton();

  ctx.restore();
}

/* =========================================================
   VÒNG LẶP
   ========================================================= */
let last = performance.now();

function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

})();
</script>
