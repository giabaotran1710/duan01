        html,
        body {

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            touch-action: manipulation;
            user-select: none;

            color: var(--text);
            position: relative;
        }

        /* Nền chấm trang trí */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 22px 22px;
            pointer-events: none;
            z-index: 0;
        }

        /* Vầng sáng phía sau */
        body::after {
            content: '';
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: min(80vw, 500px);
            height: min(80vw, 500px);
            background: radial-gradient(circle, rgba(94, 234, 212, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
        }

        .app {
            width: 100%;
            max-width: 520px;

            flex-direction: column;
            align-items: center;
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 1;

        header {
            width: 100%;
            text-align: center;
            padding: 16px 0 10px;
            flex-shrink: 0;

/* ===== Stats Bar ===== */
.stats-bar {
    width: 80%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 1px 0 4px;
    flex-shrink: 0;
}

.stat {
    min-width: 0;
    background: var(--surface-glass);
    border-radius: var(--radius-md);
    padding: 5px 4px;
    text-align: center;

    box-shadow: var(--shadow-inner);
    border: 1px solid var(--surface-border);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

}

.stat .label {
    font-size: 10px;

}

}

.stat .value.time {

}

.stat .value.moves {

   /* ===== Board Area ===== */

    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 0;
    perspective: 1000px;
    overflow: visible;
}

#board {
    width: min(92%, calc(100dvh - 330px));
    aspect-ratio: 1 / 1;
    max-width: 440px;

    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);

    gap: 2.6%;
    padding: 2.2%;

    background: linear-gradient(
        145deg,
        rgba(30, 36, 70, 0.85),
        rgba(20, 24, 50, 0.9)
    );

        0 25px 60px rgba(0, 0, 0, 0.5),

        0 8px 0 rgba(0, 0, 0, 0.3);

    transition: transform 0.4s ease;
    position: relative;
    flex-shrink: 1;
}

        /* Viền phát sáng nhẹ quanh bảng */
        #board::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--radius-lg) + 2px);
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.3), transparent 40%, transparent 60%, rgba(94, 234, 212, 0.25));
            z-index: -1;
            pointer-events: none;
        }

        #board.shake {
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px) rotate(-0.5deg);
            }
            40% {
                transform: translateX(6px) rotate(0.5deg);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        .cell {
            position: relative;
            perspective: 650px;
            cursor: pointer;
            border-radius: 18%;
            transition: filter 0.2s ease;
        }
        .cell:hover {
            filter: brightness(1.08);
        }
        .cell:active {
            filter: brightness(0.95);
        }

        .cup-inner {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transform: rotateX(0deg);
        }
        .cell.closed .cup-inner {
            transform: rotateX(180deg);
        }
        .cell.open .cup-inner {
            transform: rotateX(0deg);
        }

        .cup-inner.anim-open {
            animation: flipToOpen 0.3s cubic-bezier(0.34, 1.2, 0.4, 1);
        }
        .cup-inner.anim-close {
            animation: flipToClose 0.3s cubic-bezier(0.34, 1.2, 0.4, 1);
        }
        @keyframes flipToOpen {
            0% {
                transform: rotateX(180deg) scale(1);
            }
            55% {
                transform: rotateX(80deg) scale(1.12);
            }
            100% {
                transform: rotateX(0deg) scale(1);
            }
        }
        @keyframes flipToClose {
            0% {
                transform: rotateX(0deg) scale(1);
            }
            55% {
                transform: rotateX(100deg) scale(1.12);
            }
            100% {
                transform: rotateX(180deg) scale(1);
            }
        }

        .face {
            position: absolute;
            inset: 4%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16%;
        }
        .face-open {
            transform: rotateX(0deg);
        }
        .face-closed {
            transform: rotateX(180deg);
        }

        .face svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
        }

        /* Hiệu ứng solve-hint */
        .cell.solve-hint {
            z-index: 1;
        }
        .cell.solve-hint::after {
            content: '';
            position: absolute;
            inset: -7%;
            border-radius: 22%;
            box-shadow: 0 0 0 3px rgba(52, 211, 110, 0.95), 0 0 20px 7px rgba(52, 211, 110, 0.55);
            pointer-events: none;
            animation: hintGlow 1.1s ease-in-out infinite;
        }
        .cell.solve-hint .face svg {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4)) saturate(0) sepia(1) hue-rotate(60deg) saturate(4) brightness(1.08);
        }
        @keyframes hintGlow {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        }

        button.ctrl.secondary {
            background: linear-gradient(145deg, #3a447e, #2a3155);
            color: var(--text);
            box-shadow: 0 6px 0 #1a1f3a, 0 10px 24px rgba(0, 0, 0, 0.35);
        }
        button.ctrl.secondary:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1a1f3a, 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        button.icon-btn {
            width: 52px;

            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(145deg, #3a447e, #2a3155);

        }
        button.icon-btn:active {

        .win-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 8, 18, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 50;
        }
        .win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .win-card {
            background: linear-gradient(145deg, #1e2648, #141a32);
            border-radius: var(--radius-xl);
            padding: 32px 36px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);

            transform: scale(1);

        .win-card .big {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 30px;
            color: #ffd166;
            margin-bottom: 4px;
            text-shadow: 0 0 30px rgba(255, 209, 102, 0.4);
        }
        .win-card .line {
            margin-top: 10px;
            font-size: 15px;
            color: var(--text-dim);
        }
        .win-card .line b {
            color: var(--text);
            font-weight: 700;
        }

        /* ===== Confetti ===== */
        .confetti-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 49;

        .confetti-piece {
            position: absolute;
            top: -10px;
            width: 9px;
            height: 16px;
            opacity: 0.95;
            animation: fall linear forwards;
            border-radius: 2px;
        }
        @keyframes fall {
            to {
                transform: translateY(115vh) rotate(540deg);
                opacity: 0.15;

        /* ===== Responsive ===== */
        @media (orientation: landscape) and (max-height: 520px) {
            header {
                padding: 4px 0;
            }
            h1 {
                font-size: 24px;
                letter-spacing: 2px;

            .subtitle {
                font-size: 10px;
                padding: 3px 12px;
                margin-top: 2px;
            }
            .stats-bar {
                margin: 6px 0 8px;

            }
            .stat {
                padding: 6px 10px;
                border-radius: var(--radius-sm);
            }
            .stat .value {
                font-size: 16px;
            }
            #board {
                width: min(70vh, 88vw);
                max-width: 340px;
                border-radius: var(--radius-md);

            .controls {
                padding: 8px 0 2px;

            }
            button.ctrl {
                padding: 8px 6px;

                border-radius: var(--radius-sm);
            }
            button.icon-btn {
                width: 40px;
                flex-basis: 40px;
                font-size: 16px;
                border-radius: var(--radius-sm);
            }
        }

        @media (min-width: 600px) {
            .app {
                max-width: 560px;
            }
            #board {
                max-width: 470px;
            }
        }

    <script>
        (function() {
            "use strict";

            /* =========================================================
               GAME STATE
            ========================================================= */
            const SIZE = 6;
            const TOTAL = SIZE * SIZE;
            const DIFFICULTY_MIN_WEIGHT = 20;
            const MAX_GEN_ATTEMPTS = 300;

            let cups = new Array(TOTAL).fill(true);
            let levelInitialBoard = cups.slice();
            let previousLevelBoard = null;
            let levelNumber = 1;
            let moveCount = 0;
            let levelWon = false;

            let startTime = null;
            let timerInterval = null;
            let elapsedFrozenMs = 0;
            let minMoves = 0;
            let soundOn = true;
            let solveModeOn = false;

            /* =========================================================
               MOVE LOGIC
            ========================================================= */
            function neighborsOf(idx) {
                const r = Math.floor(idx / SIZE);
                const c = idx % SIZE;
                const res = [idx];
                if (r > 0) res.push(idx - SIZE);
                if (r < SIZE - 1) res.push(idx + SIZE);
                if (c > 0) res.push(idx - 1);
                if (c < SIZE - 1) res.push(idx + 1);
                return res;
            }

            function applyMove(idx, board) {
                const affected = neighborsOf(idx);
                for (let k = 0; k < affected.length; k++) {
                    board[affected[k]] = !board[affected[k]];
                }
                return affected;
            }

            function arraysEqual(a, b) {
                if (!a || !b || a.length !== b.length) return false;
                for (let i = 0; i < a.length; i++)
                    if (a[i] !== b[i]) return false;
                return true;
            }

            /* =========================================================
               PUZZLE SOLVER (Gauss-Jordan GF(2))
            ========================================================= */
            function gaussianEliminationGF2(A, b) {
                const n = TOTAL;
                const aug = A.map((row, i) => row.concat([b[i]]));
                const pivotCols = [];
                let pivotRow = 0;

                for (let col = 0; col < n && pivotRow < n; col++) {
                    let sel = -1;
                    for (let r = pivotRow; r < n; r++) {
                        if (aug[r][col] === 1) { sel = r; break; }
                    }
                    if (sel === -1) continue;
                    const tmp = aug[pivotRow];
                    aug[pivotRow] = aug[sel];
                    aug[sel] = tmp;
                    for (let r = 0; r < n; r++) {
                        if (r !== pivotRow && aug[r][col] === 1) {
                            for (let c = col; c <= n; c++) aug[r][c] ^= aug[pivotRow][c];
                        }
                    }
                    pivotCols.push(col);
                    pivotRow++;
                }
                for (let r = pivotRow; r < n; r++) {
                    let allZero = true;
                    for (let c = 0; c < n; c++) { if (aug[r][c] === 1) { allZero = false; break; } }
                    if (allZero && aug[r][n] === 1) return null;
                }
                const freeCols = [];
                for (let c = 0; c < n; c++) { if (pivotCols.indexOf(c) === -1) freeCols.push(c); }
                return { aug, pivotCols, freeCols };
            }

            function solvePuzzle(board) {
                const n = TOTAL;
                const A = [];
                const b = [];
                for (let j = 0; j < n; j++) {
                    const row = new Array(n).fill(0);
                    const nb = neighborsOf(j);
                    for (let k = 0; k < nb.length; k++) row[nb[k]] = 1;
                    A.push(row);
                    b.push(board[j] ? 0 : 1);
                }
                const ge = gaussianEliminationGF2(A, b);
                if (!ge) return null;
                const { aug, pivotCols, freeCols } = ge;
                const k = freeCols.length;
                const combos = Math.min(1 << k, 4096);
                let minWeight = Infinity;
                let minSolution = null;
                for (let mask = 0; mask < combos; mask++) {
                    const freeVals = new Array(TOTAL).fill(0);
                    for (let i = 0; i < k; i++) freeVals[freeCols[i]] = (mask >> i) & 1;
                    const sol = new Array(TOTAL).fill(0);
                    for (let i = 0; i < k; i++) sol[freeCols[i]] = freeVals[freeCols[i]];
                    for (let i = 0; i < pivotCols.length; i++) {
                        let val = aug[i][TOTAL];
                        for (let j = 0; j < k; j++) {
                            if (aug[i][freeCols[j]] === 1) val ^= freeVals[freeCols[j]];
                        }
                        sol[pivotCols[i]] = val;
                    }
                    let weight = 0;
                    for (let i = 0; i < TOTAL; i++) weight += sol[i];
                    if (weight < minWeight) { minWeight = weight;
                        minSolution = sol; }
                }
                return { minWeight, minSolution };
            }

            function generateLevel(prevBoard) {
                let fallback = null;
                for (let attempt = 0; attempt < MAX_GEN_ATTEMPTS; attempt++) {
                    const scrambleLen = 50 + Math.floor(Math.random() * 51);
                    const board = new Array(TOTAL).fill(true);
                    for (let k = 0; k < scrambleLen; k++) {
                        const idx = Math.floor(Math.random() * TOTAL);
                        applyMove(idx, board);
                    }
                    if (board.every(v => v === true)) continue;
                    if (prevBoard && arraysEqual(board, prevBoard)) continue;
                    const result = solvePuzzle(board);
                    if (!result) continue;
                    if (!fallback || result.minWeight > fallback.minWeight) {
                        fallback = { board, scrambleLen, minWeight: result.minWeight };
                    }
                    if (result.minWeight >= DIFFICULTY_MIN_WEIGHT) {
                        return { board, scrambleLen, minWeight: result.minWeight };
                    }
                }
                return fallback;
            }

            /* =========================================================
               TIMER
            ========================================================= */
            function formatTime(ms) {
                const totalSec = Math.floor(ms / 1000);
                const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const ss = String(totalSec % 60).padStart(2, '0');
                return mm + ':' + ss;
            }

            function startTimer() {
                stopTimer();
                startTime = Date.now();
                elapsedFrozenMs = 0;
                timerInterval = setInterval(updateTimerDisplay, 200);
                updateTimerDisplay();
            }

            function stopTimer() {
                if (timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
            }

            function currentElapsedMs() {
                if (levelWon) return elapsedFrozenMs;
                if (startTime === null) return 0;
                return Date.now() - startTime;
            }

            function updateTimerDisplay() {
                document.getElementById('stat-time').textContent = formatTime(currentElapsedMs());
            }

            ========================================================= */
            const boardEl = document.getElementById('board');
            const cellEls = [];

            function buildBoardDOM() {
                boardEl.innerHTML = '';
                cellEls.length = 0;
                for (let i = 0; i < TOTAL; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.index = i;
                    const inner = document.createElement('div');
                    inner.className = 'cup-inner';
                    const faceOpen = document.createElement('div');
                    faceOpen.className = 'face face-open';
                    faceOpen.innerHTML = cupSvgOpen(i);
                    const faceClosed = document.createElement('div');
                    faceClosed.className = 'face face-closed';
                    faceClosed.innerHTML = cupSvgClosed(i);
                    inner.appendChild(faceOpen);
                    inner.appendChild(faceClosed);
                    cell.appendChild(inner);
                    cell.addEventListener('click', onCellClick);
                    boardEl.appendChild(cell);
                    cellEls.push(cell);
                }
            }

            function renderBoard() {
                for (let i = 0; i < TOTAL; i++) {
                    const cell = cellEls[i];
                    cell.classList.toggle('open', cups[i]);
                    cell.classList.toggle('closed', !cups[i]);
                }
            }

            function animateFlip(idx, opening) {
                const inner = cellEls[idx].querySelector('.cup-inner');
                inner.classList.remove('anim-open', 'anim-close');
                void inner.offsetWidth;
                inner.classList.add(opening ? 'anim-open' : 'anim-close');
            }

            /* =========================================================
               SOUND
            ========================================================= */
            let audioCtx = null;

            function ensureAudio() {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (Ctx) audioCtx = new Ctx();
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playTone(freq, duration, type, gainPeak) {
                if (!soundOn || !audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                const now = audioCtx.currentTime;
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(gainPeak || 0.18, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            }

            function sfxClick() { playTone(520, 0.09, 'triangle', 0.15); }

            function sfxFlip(open) { playTone(open ? 720 : 340, 0.12, 'sine', 0.1); }

            function sfxWin() {
                if (!soundOn || !audioCtx) return;
                const notes = [523, 659, 784, 1047];
                notes.forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'triangle', 0.16), i * 110));
            }

            /* =========================================================
               WIN DETECTION + UI
            ========================================================= */
            function checkWin() {
                return cups.every(v => v === true);
            }

            function updateStatsDisplay() {
                document.getElementById('stat-moves').textContent = moveCount;
            }

            function onCellClick(e) {
                if (levelWon) return;
                const idx = parseInt(e.currentTarget.dataset.index, 10);
                ensureAudio();
                const affected = applyMove(idx, cups);
                moveCount++;
                sfxClick();
                affected.forEach(i => animateFlip(i, cups[i]));
                renderBoard();
                updateStatsDisplay();
                sfxFlip(cups[idx]);
                if (checkWin()) {
                    handleWin();
                } else if (solveModeOn) {
                    updateSolveHighlights();
                }
            }
function handleWin() {
    // Tính thời gian TRƯỚC khi levelWon = true
    const elapsed = currentElapsedMs();
    elapsedFrozenMs = elapsed;
    levelWon = true;

    stopTimer();
    updateTimerDisplay();
    sfxWin();
    updateStatsDisplay();
    if (solveModeOn) toggleSolveMode(false);

    document.getElementById('win-moves').textContent = moveCount;
    document.getElementById('win-time').textContent = formatTime(elapsedFrozenMs);

    const overlay = document.getElementById('win-overlay');
    overlay.classList.add('show');
    document.getElementById('board').classList.add('shake');
    launchConfetti();

    setTimeout(() => {
        overlay.classList.remove('show');
        document.getElementById('board').classList.remove('shake');
        goToNewLevel();
    }, 1700);
}

            function launchConfetti() {
                const layer = document.getElementById('confetti-layer');
                const colors = ['#ffd166', '#5eead4', '#fb7185', '#a78bfa', '#f8c04a'];
                for (let i = 0; i < 48; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + 'vw';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    const duration = 1.4 + Math.random() * 1.2;
                    piece.style.animationDuration = duration + 's';
                    piece.style.animationDelay = (Math.random() * 0.35) + 's';
                    piece.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
                    layer.appendChild(piece);
                    setTimeout(() => piece.remove(), (duration + 0.6) * 1000);
                }
            }

            /* =========================================================
               NEW LEVEL
            ========================================================= */
   function goToNewLevel() {
    const result = generateLevel(previousLevelBoard);

    previousLevelBoard = result.board.slice();
    cups = result.board.slice();
    levelInitialBoard = result.board.slice();

    minMoves = result.minWeight;
    document.getElementById('stat-min-moves').textContent = minMoves;

    levelNumber++;
    moveCount = 0;
    levelWon = false;

    updateStatsDisplay();
    renderBoard();
    startTimer();
}
            /* =========================================================
               HIDDEN SOLVER MODE
            ========================================================= */
            function updateSolveHighlights() {
                cellEls.forEach(c => c.classList.remove('solve-hint'));
                if (levelWon) return;
                const result = solvePuzzle(cups);
                if (!result) return;
                for (let i = 0; i < TOTAL; i++) {
                    if (result.minSolution[i] === 1) cellEls[i].classList.add('solve-hint');
                }
            }

            function clearSolveHighlights() {
                cellEls.forEach(c => c.classList.remove('solve-hint'));
            }

            function toggleSolveMode(forceOn) {
                solveModeOn = (typeof forceOn === 'boolean') ? forceOn : !solveModeOn;
                if (solveModeOn) updateSolveHighlights();
                else clearSolveHighlights();
            }

            function restartLevel() {
                if (levelWon) return;
                cups = levelInitialBoard.slice();
                moveCount = 0;
                renderBoard();
                updateStatsDisplay();
                startTimer();
                if (solveModeOn) updateSolveHighlights();
            }

            function toggleSound() {
                soundOn = !soundOn;
                document.getElementById('btn-sound').textContent = soundOn ? '🔊' : '🔇';
                if (soundOn) ensureAudio();
            }

            /* =========================================================
               INIT
            ========================================================= */
            function init() {
                buildBoardDOM();
                const result = generateLevel(null);
                previousLevelBoard = result.board.slice();
                cups = result.board.slice();
                levelInitialBoard = result.board.slice();
                minMoves = result.minWeight;
document.getElementById('stat-min-moves').textContent = minMoves;
                renderBoard();
                updateStatsDisplay();
                startTimer();

                const btnRestart = document.getElementById('btn-restart');
                let restartPressTimer = null;
                let longPressFired = false;
                const LONG_PRESS_MS = 3000;
                const clearRestartTimer = () => { clearTimeout(restartPressTimer);
                    restartPressTimer = null; };

                btnRestart.addEventListener('pointerdown', () => {
                    longPressFired = false;
                    clearRestartTimer();
                    restartPressTimer = setTimeout(() => {
                        longPressFired = true;
                        ensureAudio();
                        toggleSolveMode();
                    }, LONG_PRESS_MS);
                });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => {
                    btnRestart.addEventListener(evt, clearRestartTimer);
                });
                btnRestart.addEventListener('click', (e) => {
                    if (longPressFired) { e.preventDefault();
                        longPressFired = false; return; }
                    ensureAudio();
                    restartLevel();
                });

                document.getElementById('btn-sound').addEventListener('click', () => { ensureAudio();
                    toggleSound(); });

                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) updateTimerDisplay();
                });
            }

            if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
        })();
    </script>
