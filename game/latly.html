function neighborsOf(idx){const r=Math.floor(idx/SIZE),c=idx%SIZE,res=[idx];if(r>0)res.push(idx-SIZE);if(r<SIZE-1)res.push(idx+SIZE);if(c>0)res.push(idx-1);if(c<SIZE-1)res.push(idx+1);return res}

function generateLevel(prevBoard){

 for(let attempt=0;attempt<80;attempt++){
   const scrambleLen=58+Math.floor(Math.random()*35), board=new Array(TOTAL).fill(true);

function buildBoardDOM(){els.board.replaceChildren();cellEls.length=0;for(let i=0;i<TOTAL;i++){const cell=document.createElement('div');cell.className='cell';cell.dataset.index=String(i);const inner=document.createElement('div');inner.className='cup-inner';const open=document.createElement('div');open.className='face face-open';open.innerHTML=cupSvgOpen(i);const closed=document.createElement('div');closed.className='face face-closed';closed.innerHTML=cupSvgClosed(i);inner.append(open,closed);cell.appendChild(inner);cell.addEventListener('click',onCellClick);els.board.appendChild(cell);cellEls.push(cell)}}
function renderBoard(){for(let i=0;i<TOTAL;i++){cellEls[i].classList.toggle('open',cups[i]);cellEls[i].classList.toggle('closed',!cups[i])}}
function animateFlip(idx,opening){const inner=cellEls[idx].querySelector('.cup-inner');inner.classList.remove('anim-open','anim-close');void inner.offsetWidth;inner.classList.add(opening?'anim-open':'anim-close');window.setTimeout(()=>inner.classList.remove('anim-open','anim-close'),410)}
function ensureAudio(){if(!audioCtx){const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx)audioCtx=new Ctx()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function playTone(freq,duration,type,gainPeak){if(!soundOn||!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type=type||'sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(gainPeak||.15,now+.01);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.02)}
function sfxClick(){playTone(510,.08,'triangle',.13)}
function sfxFlip(open){playTone(open?720:330,.11,'sine',.095)}
function sfxWin(){if(!soundOn||!audioCtx)return;[523,659,784,1047].forEach((f,i)=>window.setTimeout(()=>playTone(f,.24,'triangle',.15),i*95))}
function updateStats(){els.moves.textContent=String(moveCount)}
function clearSolveHighlights(){cellEls.forEach(c=>c.classList.remove('solve-hint'))}
function updateSolveHighlights(){clearSolveHighlights();if(levelWon)return;const result=solvePuzzle(cups);if(!result)return;for(let i=0;i<TOTAL;i++)if(result.minSolution[i]===1)cellEls[i].classList.add('solve-hint')}
function toggleSolveMode(forceOn){solveModeOn=typeof forceOn==='boolean'?forceOn:!solveModeOn;els.mode.textContent=solveModeOn?'GỢI Ý BẬT':'TẬP TRUNG';els.mode.style.color=solveModeOn?'#4de7a0':'';if(solveModeOn)updateSolveHighlights();else clearSolveHighlights()}
function checkWin(){return cups.every(Boolean)}
function onCellClick(e){if(levelWon)return;const idx=Number(e.currentTarget.dataset.index);ensureAudio();const affected=applyMove(idx,cups);moveCount++;sfxClick();for(const i of affected)animateFlip(i,cups[i]);renderBoard();updateStats();sfxFlip(cups[idx]);if(checkWin())handleWin();else if(solveModeOn)updateSolveHighlights()}
function launchConfetti(){els.confetti.replaceChildren();const pieces=Array.from({length:58},()=>{const p=document.createElement('div');p.className='confetti-piece';p.style.left=(Math.random()*100)+'vw';p.style.background=['#ffd45c','#61ead4','#ff6d88','#9b8cff','#ff9d43'][Math.floor(Math.random()*5)];const d=1.35+Math.random()*1.35;p.style.animationDuration=d+'s';p.style.animationDelay=(Math.random()*.28)+'s';p.style.transform=`rotate(${Math.floor(Math.random()*360)}deg)`;els.confetti.appendChild(p);return{p,d}});for(const x of pieces)window.setTimeout(()=>x.p.remove(),(x.d+.6)*1000)}
function handleWin(){elapsedFrozenMs=currentElapsedMs();levelWon=true;stopTimer();updateTimerDisplay();sfxWin();els.winMoves.textContent=String(moveCount);els.winTime.textContent=formatTime(elapsedFrozenMs);els.overlay.classList.add('show');els.board.classList.add('shake');launchConfetti();if(solveModeOn)toggleSolveMode(false);if(winTimeout!==null)window.clearTimeout(winTimeout);winTimeout=window.setTimeout(()=>{els.overlay.classList.remove('show');els.board.classList.remove('shake');winTimeout=null;goToNewLevel()},WIN_NEXT_DELAY)}
function goToNewLevel(){const result=generateLevel(previousLevelBoard);if(!result)return;previousLevelBoard=result.board.slice();cups=result.board.slice();levelInitialBoard=result.board.slice();minMoves=result.minWeight;els.min.textContent=String(minMoves);levelNumber++;moveCount=0;levelWon=false;updateStats();renderBoard();resetTimer()}
function restartLevel(){if(levelWon)return;cups=levelInitialBoard.slice();moveCount=0;updateStats();renderBoard();resetTimer();if(solveModeOn)updateSolveHighlights()}
function toggleSound(){soundOn=!soundOn;els.sound.textContent=soundOn?'🔊':'🔇';if(soundOn)ensureAudio()}
function init(){buildBoardDOM();const result=generateLevel(null);previousLevelBoard=result.board.slice();cups=result.board.slice();levelInitialBoard=result.board.slice();minMoves=result.minWeight;els.min.textContent=String(minMoves);renderBoard();updateStats();resetTimer();
 let pressTimer=null,longPress=false;const clearPress=()=>{if(pressTimer!==null){clearTimeout(pressTimer);pressTimer=null}};els.restart.addEventListener('pointerdown',()=>{longPress=false;clearPress();pressTimer=window.setTimeout(()=>{pressTimer=null;longPress=true;ensureAudio();toggleSolveMode()},3000)});for(const evt of ['pointerup','pointerleave','pointercancel'])els.restart.addEventListener(evt,clearPress);els.restart.addEventListener('click',e=>{if(longPress){longPress=false;e.preventDefault();return}ensureAudio();restartLevel()});els.sound.addEventListener('click',()=>{ensureAudio();toggleSound()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimerDisplay()})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script></body></html>
