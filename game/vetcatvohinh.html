/* ---- geometry ---- */
const ccw=(a,b,c,d,e,f)=>(f-b)*(c-a)-(d-b)*(e-a);

 let gap=Infinity;const hits=[];
 for(let i=0;i<cuts.length;i++){const c=cuts[i],lim=c.w/2+mg,reach=lim+C.NEAR+2;
  if(x1<c.bb[0]-reach||x0>c.bb[2]+reach||y1<c.bb[1]-reach||y0>c.bb[3]+reach)continue;
  const q=c.pts,m=q.length,n=P.length;let d=Infinity;
  for(const p of q)if(inPoly(p[0],p[1],P)){d=0;break}

  if(d<=lim)hits.push(i);gap=Math.min(gap,d-c.w/2)}

/* ---- cuts & shapes ---- */
function fin(type,pts,closed){const m=pts.length,c={type,pts,closed,w:C.CW,hit:false,sc:closed?m:m-1,cum:[0]};let L=0;
 for(let i=0;i<c.sc;i++){const a=pts[i],b=pts[(i+1)%m];L+=Math.hypot(b[0]-a[0],b[1]-a[1]);c.cum.push(L)}c.len=L;
 c.bb=[Math.min(...pts.map(p=>p[0])),Math.min(...pts.map(p=>p[1])),Math.max(...pts.map(p=>p[0])),Math.max(...pts.map(p=>p[1]))];return c}
function lineP(cx,cy,th,half){const dx=Math.cos(th),dy=Math.sin(th);let t0=-half,t1=half;
 const k=(p,d,lo,hi)=>{if(Math.abs(d)<1e-9)return;let a=(lo-p)/d,b=(hi-p)/d;if(a>b){const t=a;a=b;b=t}t0=Math.max(t0,a);t1=Math.min(t1,b)};k(cx,dx,0,W);k(cy,dy,0,H);

function makeCut(type,n){const M=C.M;
 if(type==='line'||type==='seg'){const cx=rr(M+20,W-M-20),cy=rr(M+20,H-M-20),th=rr(0,Math.PI);
  return fin('line',lineP(cx,cy,th,type==='seg'?rr(60,130):2000),false)}
 if(type==='zig'){const sg=ri(4,6),st=rr(55,80),am=rr(32,58),th=rr(0,TAU),dx=Math.cos(th),dy=Math.sin(th),cx=rr(M+60,W-M-60),cy=rr(M+60,H-M-60);

const PAL=[['#ffd166','#ef8f00'],['#5eead4','#0d9488'],['#ff8fab','#e5365f'],['#a5b4fc','#4f46e5'],['#86efac','#16a34a']];
function clampXY(s,x,y){const b=s.bb;return[cl(x,4-b[0],W-4-b[2]),cl(y,4-b[1],H-4-b[3])]}
const ZR=100,corners=()=>[[0,0],[W,0],[0,H],[W,H]],inZone=(x,y)=>corners().some(c=>Math.hypot(x-c[0],y-c[1])<ZR);
function placeXY(s,x,y){[x,y]=clampXY(s,x,y);for(const[cx,cy]of corners()){let dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);if(d<ZR){if(d<1e-6){dx=dy=1;d=Math.SQRT2}x=cx+dx*ZR/d;y=cy+dy*ZR/d}}return[x,y]}
function makeShape(n){const r=C.R0+(Math.min(n,6)-1)*C.RS,N=28,p=[rr(0,TAU),rr(0,TAU),rr(0,TAU)],a1=rr(.18,.3),a2=rr(.1,.2),a3=rr(.05,.1);
 const pts=Array.from({length:N},(_,i)=>{const a=TAU*i/N,k=r*(1+a1*Math.sin(2*a+p[0])+a2*Math.sin(3*a+p[1])+a3*Math.sin(5*a+p[2]));return[Math.cos(a)*k,Math.sin(a)*k]});

const wpoly=(s,x,y)=>s.pts.map(p=>[p[0]+(x===undefined?s.x:x),p[1]+(y===undefined?s.y:y)]);

// Số vết cắt = số màn (tối đa MAX_CUTS), nhưng luôn chừa ≥ ~7% vị trí đặt mảnh an toàn (đo trên lưới dày):
// vết cắt nào làm vùng trống tụt dưới mức đó thì bị bỏ, nên màn rất cao có thể ít vết hơn số màn.

const framesFor=n=>n<20?1:Math.floor((n-20)/5)+2;

  const shape=makeShape(n),b=shape.bb,pts=[];
  for(let y=4-b[1];y<=H-4-b[3];y+=9)for(let x=4-b[0];x<=W-4-b[2];x+=9)if(!inZone(x,y))pts.push([x,y]);

const HINTS={intro:'Chuẩn bị…',show:'Ghi nhớ vị trí các vết cắt',hide:'Vết cắt biến mất…',place:'Kéo mảnh vào chỗ an toàn rồi thả tay',reveal:''};

function setupLevel(){const L=genLevel(S.level);S.cuts=L.cuts;S.shape=L.shape;
 // chia đều vết cắt cho các khung; phần dư dồn vào các khung đầu (vd 33 vết / 4 khung → 9, 8, 8, 8)
 const order=S.cuts.slice().sort(()=>Math.random()-.5),nf=Math.max(1,Math.min(framesFor(S.level),order.length)),base=Math.floor(order.length/nf),extra=order.length%nf;
 S.frames=[];let at=0;for(let i=0;i<nf;i++){const sz=base+(i<extra?1:0);S.frames.push(order.slice(at,at+sz));at+=sz}

function startGame(){Object.assign(S,{level:1,lives:C.LIVES,score:0,streak:0,paused:false,retry:false,shake:0,parts:[],floats:[]});ov('menu',false);ov('over',false);ov('pause',false);setupLevel()}
function saveBest(){St.d.best=Math.max(St.d.best,S.level);St.d.bs=Math.max(St.d.bs,S.score);St.save()}
function goMenu(){if(playing())saveBest();S.paused=false;S.drag=null;S.phase='menu';S.cuts=[];S.shape=null;S.result=null;ov('pause',false);ov('over',false);ov('menu',true);$('mB').textContent=St.d.best?`Kỷ lục: màn ${St.d.best} · ${St.d.bs} điểm`:'';hint.textContent='';$('bar').style.visibility='hidden'}
function setPaused(v){if(v&&!playing())return;S.paused=v;S.drag=null;ov('pause',v)}

function commit(){const s=S.shape,R=evalCuts(wpoly(s),S.cuts,0);S.cuts.forEach((c,i)=>c.hit=R.hits.includes(i));R.fx=false;R.ti=(S.cuts.length-1)*.12+.4;S.result=R;setPhase('reveal');S.cuts.forEach((_,i)=>Sfx.sw(i*.12))}

function impact(){const R=S.result,s=S.shape;R.fx=true;R.ft=S.t;
 if(R.hit){S.lives--;S.streak=0;S.shake=14;burst(s.x,s.y,'#ff4d6d',30,260);S.floats.push({x:s.x,y:s.y-s.r-16,txt:'CHẠM!',col:'#ff4d6d',t:0});hint.textContent='Chạm vết cắt! Mất 1 mạng';Sfx.play('hit');try{navigator.vibrate(120)}catch(e){}syncHUD(true)}
 else{let g=100+20*(S.level-1)+10*Math.min(S.streak,10);S.streak++;const near=R.gap<=C.NEAR;if(near)g+=50;S.score+=g;burst(s.x,s.y,'#3ddc97',28,240);
  S.floats.push({x:s.x,y:s.y-s.r-16,txt:'+'+g,col:'#3ddc97',t:0});if(near)S.floats.push({x:s.x,y:s.y+s.r+22,txt:'SÁT VÁCH!',col:'#ffd166',t:0});

function update(dt){if(S.paused)return;S.t+=dt;

 else if(p==='hide'){if(S.t>=C.HIDE){setPhase('place');Sfx.play('drop')}}
 else if(p==='place'){const left=Math.ceil(C.PLACE-S.t);$('bar').firstElementChild.style.transform='scaleX('+Math.max(0,1-S.t/C.PLACE)+')';if(left!==S.left){S.left=left;hint.textContent='Kéo mảnh vào chỗ an toàn · '+Math.max(0,left)+'s'}if(S.t>=C.PLACE){S.drag=null;commit()}}
 else if(p==='reveal'){const R=S.result;if(!R.fx&&S.t>=R.ti)impact();if(R.fx&&S.t>=R.ti+1.3)finishReveal()}}
/* ---- input ---- */
const cv=$('cv'),ctx=cv.getContext('2d'),bg=document.createElement('canvas');
let cw=0,ch=0,dpr=1,sc=1,ox=0,oy=0,dirty=true,worldSet=false;
const wp=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc]};
cv.addEventListener('pointerdown',e=>{if(S.paused||blocked)return;e.preventDefault();const[x,y]=wp(e);
 if(S.phase==='place'&&!S.drag){const s=S.shape;if(Math.hypot(x-s.x,y-s.y)<=s.r+C.GRAB){S.drag={id:e.pointerId,dx:s.x-x,dy:s.y-y};try{cv.setPointerCapture(e.pointerId)}catch(_){}}}
 else if(S.phase==='reveal'&&S.result.fx&&S.t-S.result.ft>.6)finishReveal()});
cv.addEventListener('pointermove',e=>{const d=S.drag;if(!d||e.pointerId!==d.id)return;const[x,y]=wp(e),s=S.shape;[s.x,s.y]=placeXY(s,x+d.dx,y+d.dy);S.moved=true});
const up=e=>{const d=S.drag;if(!d||e.pointerId!==d.id)return;S.drag=null;if(e.type==='pointerup'&&S.phase==='place'&&!S.paused)commit()};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('bPlay').onclick=()=>{Sfx.init();Sfx.play('tap');try{screen.orientation.lock('portrait').catch(()=>{})}catch(e){}startGame()};
$('bAgain').onclick=()=>{Sfx.play('tap');startGame()};
$('bPause').onclick=()=>{Sfx.play('tap');setPaused(true)};
$('bRes').onclick=()=>{Sfx.play('tap');setPaused(false)};
$('bMenu').onclick=$('bMenu2').onclick=goMenu;
$('bSnd').onclick=()=>{St.d.snd=!St.d.snd;St.save();$('wv').style.display=St.d.snd?'':'none';Sfx.init();Sfx.play('tap')};
['gesturestart','gesturechange','gestureend','contextmenu','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.target.closest('#board'))e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true)});
function checkBlock(){const ua=navigator.userAgent||'',mob=/Android|iPhone|iPod|iPad|Mobile/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const desk=!mob||!(navigator.maxTouchPoints>0)||matchMedia('(hover:hover) and (pointer:fine)').matches,land=innerWidth>innerHeight;blocked=desk||land;ov('block',blocked);
 if(blocked){$('bt').textContent=desk?'Chỉ chơi trên điện thoại':'Hãy xoay dọc điện thoại';$('bd').textContent=desk?'Mở game trên điện thoại (tắt “Trang web cho máy tính”) và giữ màn hình dọc.':'Game chỉ hỗ trợ màn hình dọc.';$('ph').style.animationName=desk?'none':'rot';setPaused(true)}}
const onSize=()=>{dirty=true;checkBlock()};
addEventListener('resize',onSize);addEventListener('orientationchange',onSize);
if(window.ResizeObserver)new ResizeObserver(()=>{dirty=true}).observe($('board'));
/* ---- render ---- */
function rp(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function layout(){const b=$('board');cw=b.clientWidth;ch=b.clientHeight;if(!cw||!ch)return;dirty=false;dpr=Math.min(window.devicePixelRatio||1,C.DPR);
 cv.width=bg.width=Math.round(cw*dpr);cv.height=bg.height=Math.round(ch*dpr);if(!worldSet&&!blocked&&ch>cw){H=cl(Math.round(W*ch/cw),480,820);worldSet=true}sc=Math.min(cw/W,ch/H);ox=(cw-W*sc)/2;oy=(ch-H*sc)/2;
 const g=bg.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.translate(ox,oy);g.scale(sc,sc);
 const f=g.createLinearGradient(0,0,0,H);f.addColorStop(0,'#1a2252');f.addColorStop(1,'#0b0f2c');rp(g,0,0,W,H,20);g.fillStyle=f;g.fill();
  const v=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.4)');rp(g,0,0,W,H,20);g.fillStyle=v;g.fill();
 g.lineWidth=2;g.strokeStyle='rgba(125,249,255,.28)';rp(g,1,1,W-2,H-2,20);g.stroke()}
const CY={g:'rgba(125,249,255,.16)',m:'rgba(125,249,255,.55)',c:'#fff'},RD={g:'rgba(255,77,109,.2)',m:'rgba(255,77,109,.75)',c:'#ffe3e8'};
function partial(c,len){const q=c.pts,m=q.length;ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);let ex=q[0][0],ey=q[0][1];
 for(let i=0;i<c.sc;i++){const a=q[i],b=q[(i+1)%m];if(c.cum[i+1]<=len){ctx.lineTo(b[0],b[1]);ex=b[0];ey=b[1]}else{const t=(len-c.cum[i])/(c.cum[i+1]-c.cum[i]);if(t>0){ex=a[0]+(b[0]-a[0])*t;ey=a[1]+(b[1]-a[1])*t;ctx.lineTo(ex,ey)}break}}return[ex,ey]}
function drawCut(c,pr,al,col){if(pr<=0||al<=0)return;ctx.save();ctx.globalAlpha=al;ctx.lineCap=ctx.lineJoin='round';const e=partial(c,c.len*Math.min(1,pr));

 if(pr<1){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e[0],e[1],7,0,TAU);ctx.fill()}ctx.restore()}
function drawShape(){const s=S.shape,R=S.result,k=S.phase==='place'?easeBack(S.t/C.DROP):1;if(k<=0)return;const lift=!!S.drag;let sx=0;
 if(R&&R.hit&&R.fx){const e=S.t-R.ft;if(e<.5)sx=Math.sin(e*70)*5*(1-e*2)}
 const path=()=>{ctx.beginPath();s.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()};
 if(S.phase==='place'&&!S.moved&&!S.drag){ctx.save();ctx.setLineDash([6,7]);ctx.strokeStyle='rgba(125,249,255,'+(.35+.25*Math.sin(S.t*5))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,s.r+16,0,TAU);ctx.stroke();ctx.restore()}
 ctx.save();ctx.translate(s.x+sx,s.y);const z=k*(lift?1.06:1);ctx.scale(z,z);
 ctx.save();ctx.translate(lift?6:3,lift?14:6);path();ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();ctx.restore();
 const g=ctx.createLinearGradient(0,-s.r,0,s.r);g.addColorStop(0,s.col[0]);g.addColorStop(1,s.col[1]);path();ctx.fillStyle=g;ctx.fill();
 ctx.lineJoin='round';ctx.lineWidth=2.5;ctx.strokeStyle=R&&R.fx?(R.hit?'#ff4d6d':'#3ddc97'):'rgba(255,255,255,.75)';ctx.stroke();
 const h=ctx.createLinearGradient(0,-s.r,0,0);h.addColorStop(0,'rgba(255,255,255,.4)');h.addColorStop(1,'rgba(255,255,255,0)');path();ctx.fillStyle=h;ctx.fill();

 if(R&&R.fx&&!R.hit){const e=S.t-R.ft;if(e<.8){ctx.strokeStyle='rgba(61,220,151,'+(1-e/.8)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,s.r+e*160,0,TAU);ctx.stroke()}}}
function drawZones(){ctx.save();ctx.fillStyle='rgba(255,77,109,.10)';ctx.strokeStyle='rgba(255,77,109,.45)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
 [[0,0,0],[W,0,.5],[W,H,1],[0,H,1.5]].forEach(([x,y,q])=>{ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,ZR,q*Math.PI,(q+.5)*Math.PI);ctx.closePath();ctx.fill();ctx.stroke()});ctx.restore()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);ctx.drawImage(bg,0,0,cw,ch);
 const jx=S.shake>0?(Math.random()-.5)*S.shake:0,jy=S.shake>0?(Math.random()-.5)*S.shake:0;
 ctx.save();ctx.translate(ox+jx,oy+jy);ctx.scale(sc,sc);rp(ctx,0,0,W,H,20);ctx.clip();
 const t=S.t,p=S.phase;
 if(p==='intro'){const k=t/C.INTRO,a=k<.2?k/.2:k>.75?(1-k)/.25:1;ctx.save();ctx.globalAlpha=cl(a,0,1);ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.font='900 58px Georgia,serif';ctx.fillText('MÀN '+S.level,W/2,H/2);
  if(S.retry){ctx.fillStyle='#ff4d6d';ctx.font='800 18px sans-serif';ctx.fillText('Thử lại',W/2,H/2-64)}ctx.restore()}
 else if(p==='show'){const per=S.frameDur+FRAME_GAP,k=Math.min(S.frames.length-1,Math.floor(t/per)),w=t-k*per;
  if(w<S.frameDur){const a=cl(Math.min(w/.06,(S.frameDur-w)/.08),0,1);S.frames[k].forEach(c=>drawCut(c,1,a,CY))}}
 else if(p==='hide'){}
 else if(p==='place'){drawZones();drawShape()}
 else if((p==='reveal'||p==='over')&&S.shape){drawZones();drawShape();S.cuts.forEach((c,i)=>drawCut(c,ease((t-i*.12)/.4),1,c.hit?RD:CY))}
 for(const q of S.parts){ctx.globalAlpha=q.life/q.max;ctx.fillStyle=q.col;ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz)}ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.font='900 24px sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';
 for(const f of S.floats){ctx.globalAlpha=1-f.t/1.2;ctx.fillStyle=f.col;const y=f.y-f.t*36;ctx.strokeText(f.txt,f.x,y);ctx.fillText(f.txt,f.x,y)}
 ctx.restore()}

let last=0;

St.load();$('wv').style.display=St.d.snd?'':'none';$('mB').textContent=St.d.best?`Kỷ lục: màn ${St.d.best} · ${St.d.bs} điểm`:'';
