<title>Nhớ đồ vật</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&family=Bricolage+Grotesque:wght@800&display=swap">
<style>
/* Kế hoạch: phòng trưng bày ban đêm. Chủ đề: tủ kính với đèn rọi, mỗi món đứng trên một bệ sáng.
   Màn nhung đỏ kéo lại che khay giữa lúc đổi đồ. Biểu tượng tự vẽ SVG cùng nét viền, không dùng emoji. */
:root{
  --bg1:#e9edfa; --bg2:#cfd7f0; --glass:rgba(255,255,255,.55); --edge:#aab5d8; --pedestal:#ffffff; --pedestal2:#e4e9f7;
  --fg:#172041; --muted:#5a6591; --accent:#0b8f78; --accent-fg:#ffffff; --good:#14925e; --bad:#d23b52;
  --velvet:#b0284f; --velvet2:#7d1634; --spot:rgba(255,255,255,.9);
  --display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#1b2250; --bg2:#0a0d24; --glass:rgba(255,255,255,.06); --edge:#3a4585; --pedestal:#f2f5ff; --pedestal2:#cdd6f2;
  --fg:#eef1ff; --muted:#9aa5d6; --accent:#4ee0c1; --accent-fg:#06241d; --good:#4ee0a0; --bad:#ff6f86;
  --velvet:#a3213f; --velvet2:#640f27; --spot:rgba(140,160,255,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#1b2250; --bg2:#0a0d24; --glass:rgba(255,255,255,.06); --edge:#3a4585; --pedestal:#f2f5ff; --pedestal2:#cdd6f2;
  --fg:#eef1ff; --muted:#9aa5d6; --accent:#4ee0c1; --accent-fg:#06241d; --good:#4ee0a0; --bad:#ff6f86;
  --velvet:#a3213f; --velvet2:#640f27; --spot:rgba(140,160,255,.35); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg2)}
body{margin:0;min-height:100vh;color:var(--fg);font-family:var(--body);
  background:radial-gradient(120% 60% at 50% -10%,var(--spot),transparent 60%),linear-gradient(var(--bg1),var(--bg2)) fixed;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:10px}
h1{font-family:var(--display);font-size:1.7rem;margin:0;flex:1;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.stat{text-align:center;min-width:46px}
.stat b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem;color:var(--muted);font-weight:700}
.hearts{display:flex;gap:5px;align-items:center}
.heart{width:18px;height:18px;transition:transform .2s}
.heart path{fill:var(--bad);stroke:none}
.heart.off path{fill:none;stroke:var(--edge);stroke-width:2}
.heart.pop{animation:beat .35s}
@keyframes beat{50%{transform:scale(1.5)}}
.timer{height:6px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);overflow:hidden;margin-top:-4px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.case{position:relative;border:2px solid var(--edge);border-radius:20px;padding:14px;background:var(--glass);
  box-shadow:inset 0 0 40px rgba(120,140,255,.12),0 18px 40px rgba(5,8,30,.28);overflow:hidden}
.grid{display:grid;gap:10px;position:relative}
.cell{aspect-ratio:1;border-radius:14px;border:2px solid transparent;padding:0;display:grid;place-items:center;cursor:default;
  background:linear-gradient(var(--pedestal),var(--pedestal2));box-shadow:0 4px 0 rgba(10,14,40,.35),inset 0 -6px 10px rgba(80,100,170,.15);
  animation:rise .35s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i)*40ms)}
.cell svg{width:68%;height:68%;filter:drop-shadow(0 3px 2px rgba(20,30,70,.3));pointer-events:none}
.cell:disabled{opacity:1}
.cell.live{cursor:pointer;transition:transform .12s,border-color .12s}
.cell.live:hover{transform:translateY(-3px);border-color:var(--accent)}
.cell.live:active{transform:translateY(2px)}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cell.ok{border-color:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 35%,transparent);animation:ping .4s}
.cell.no{border-color:var(--bad);animation:shake .3s}
.cell.miss{border:2px dashed var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.cell .chk{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--good);display:none;place-items:center}
.cell{position:relative}.cell.ok .chk{display:grid}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.85)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes ping{50%{transform:scale(1.08)}}
.curtain{position:absolute;inset:0;pointer-events:none;display:flex}
.curtain i{flex:1;transition:transform .45s cubic-bezier(.6,0,.3,1);
  background:repeating-linear-gradient(90deg,var(--velvet) 0 16px,var(--velvet2) 16px 26px,var(--velvet) 26px 34px)}
.curtain i:first-child{transform:translateX(-101%)}.curtain i:nth-of-type(2){transform:translateX(101%)}
.curtain.on i{transform:none}
.curtain b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.15rem;opacity:0;transition:opacity .3s .25s;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.curtain.on b{opacity:1}
.msg{margin:0;min-height:2.8em;text-align:center;font-weight:700;line-height:1.45;text-wrap:balance}
.msg small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
button.main{font:700 1.05rem var(--body);min-height:52px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:14px;cursor:pointer;
  box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000)}
button.main:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
button.main:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
button.main[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.cell,.heart.pop,.curtain i,.curtain b{animation:none!important;transition:none!important}}
</style>

<main>
  <header>
    <h1>Nhớ đồ vật</h1>
    <div class="stat"><b id="round">0</b><span>Vòng</span></div>
    <div class="stat"><b id="best">0</b><span>Kỷ lục</span></div>
    <div class="hearts" id="lives" aria-label="Số mạng"></div>
  </header>
  <div class="timer" aria-hidden="true"><i id="timerFill"></i></div>
  <div class="case">
    <div class="grid" id="grid"></div>
    <div class="curtain" id="curtain"><i></i><i></i><b>Đang đổi đồ...</b></div>
  </div>
  <p class="msg" id="msg" aria-live="polite">Nhớ vị trí từng món, rồi tìm ô bị thay đổi.<small>Có món bị thay, hoặc hai món đổi chỗ. Sai 3 lần là thua.</small></p>
  <button class="main" id="go">Bắt đầu</button>
</main>

<script>
(function(){
  /* Biểu tượng: cùng viền tối, cùng độ dày nét, bảng màu phẳng */
  var K='#1c2340',R='#e5484d',B='#3b82f6',Y='#f5b83d',G='#34b27b',P='#8b5cf6',O='#f08a3c',W='#fdfdfb',T='#2dc2c0',S='#9aa6bd';
  function C(x,y,r,f){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'" stroke="'+K+'" stroke-width="2.4"/>'}
  function Rc(x,y,w,h,r,f){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+f+'" stroke="'+K+'" stroke-width="2.4"/>'}
  function Pa(d,f){return '<path d="'+d+'" fill="'+f+'" stroke="'+K+'" stroke-width="2.4" stroke-linejoin="round"/>'}
  function L(d,c,w){return '<path d="'+d+'" fill="none" stroke="'+K+'" stroke-width="'+(w+4.8)+'" stroke-linecap="round" stroke-linejoin="round"/><path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>'}
  function Ln(d,w){return '<path d="'+d+'" fill="none" stroke="'+K+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>'}
  var ICONS=[
   {n:'chìa khóa',s:L('M21 21L41 41M33 33l5-5M38 38l5-5',Y,4.5)+C(15,15,9,Y)+C(15,15,3.5,W)},
   {n:'đồng hồ',s:L('M13 8l-4 4M35 8l4 4',R,4)+L('M14 40l-3 4M34 40l3 4',K,3)+C(24,26,16,W)+Ln('M24 26V16M24 26l7 4',2.8)},
   {n:'máy ảnh',s:Pa('M16 15l3-6h10l3 6z',B)+Rc(5,15,38,26,5,B)+C(24,28,9,W)+C(24,28,4.5,T)+Rc(34,19,5,3,1,Y)},
   {n:'tai nghe',s:L('M9 30V24a15 15 0 0130 0v6',S,4)+Rc(6,28,9,14,4,R)+Rc(33,28,9,14,4,R)},
   {n:'la bàn',s:C(24,24,18,Y)+C(24,24,12,W)+Pa('M24 12l5 12h-10z',R)+Pa('M24 36l5-12h-10z',S)},
   {n:'cái ô',s:L('M24 24v14a4 4 0 01-8 0',S,3)+Pa('M5 25a19 17 0 0138 0z',R)+Ln('M24 8v17M14 25c0-9 4-15 10-17M34 25c0-9-4-15-10-17',2)},
   {n:'xúc xắc',s:Rc(7,7,34,34,8,W)+C(16,16,3.2,K)+C(32,16,3.2,K)+C(24,24,3.2,R)+C(16,32,3.2,K)+C(32,32,3.2,K)},
   {n:'quyển sách',s:Rc(8,6,32,36,3,B)+Rc(16,14,16,6,1.5,Y)+Ln('M14 6v36',2.4)},
   {n:'cốc',s:L('M33 20h4a5 5 0 010 11h-4',S,3)+Rc(9,14,24,26,5,T)+Ln('M16 6q-2 3 0 5M23 6q-2 3 0 5',2.4)},
   {n:'bóng đèn',s:Pa('M24 5a13 13 0 00-6 24v4h12v-4A13 13 0 0024 5z',Y)+Rc(18,33,12,4,2,S)+Rc(20,37,8,4,2,S)+Ln('M20 24l4-5 4 5',2.4)},
   {n:'cái kéo',s:L('M14 6l20 24M34 6L14 30',S,4.5)+C(13,36,6,R)+C(35,36,6,R)},
   {n:'cái chuông',s:Pa('M24 6c-8 0-12 6-12 14 0 8-4 9-4 12h32c0-3-4-4-4-12 0-8-4-14-12-14z',Y)+C(24,38,4,O)},
   {n:'quả táo',s:Pa('M24 15C17 9 7 13 8 26c1 9 8 17 13 17 2 0 2-1 3-1s1 1 3 1c5 0 12-8 13-17 1-13-9-17-16-11z',R)+Pa('M25 14c0-5 3-8 8-9-1 5-3 8-8 9z',G)},
   {n:'kính',s:C(14,28,9,T)+C(34,28,9,T)+Ln('M23 27h2M5 26l-2-6M43 26l2-6',2.6)},
   {n:'mũ',s:Rc(14,8,20,24,3,P)+Rc(14,24,20,6,0,Y)+Rc(5,30,38,7,3.5,P)},
   {n:'con cá',s:Pa('M33 24l10-8v16z',O)+Pa('M6 24c6-10 20-12 28 0-8 12-22 10-28 0z',O)+C(15,22,2,K)},
   {n:'chậu cây',s:Pa('M24 22c-9 0-13-8-11-15 8 0 12 6 11 15z',G)+Pa('M24 22c9 0 13-8 11-15-8 0-12 6-11 15z',G)+Pa('M12 25h24l-3 17H15z',O)+Rc(10,22,28,5,2,O)},
   {n:'quả bóng',s:C(24,24,18,W)+Pa('M24 24V6a18 18 0 0115.6 9z',R)+Pa('M24 24l15.6 9A18 18 0 0124 42z',B)+'<circle cx="24" cy="24" r="18" fill="none" stroke="'+K+'" stroke-width="2.4"/>'},
   {n:'phong thư',s:Rc(5,11,38,26,3,W)+Ln('M6 14l18 13 18-13',2.4)+C(24,27,3.5,R)},
   {n:'ngôi sao',s:Pa('M24 5l5.5 12 13 1.5-9.7 9 2.7 13L24 33.5 12.5 40.5l2.7-13L5.5 18.5l13-1.5z',Y)}
  ];
  var $=function(id){return document.getElementById(id)};
  var grid=$('grid'),curtain=$('curtain'),msg=$('msg'),go=$('go'),fill=$('timerFill');
  var best=0;try{best=+localStorage.getItem('nhodovat_best')||0}catch(e){}
  $('best').textContent=best;
  var S_={round:0,lives:3,board:[],cells:[],changed:[],found:0,phase:'idle',timers:[],over:false};
  var HEART='<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.7A4.5 4.5 0 0120 10c0 5.800-8 11-8 11z"/></svg>';
  var CHK='<span class="chk"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.500l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  function later(fn,ms){S_.timers.push(setTimeout(fn,ms))}
  function clearTimers(){S_.timers.forEach(clearTimeout);S_.timers=[]}
  function rnd(n){return Math.floor(Math.random()*n)}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
  function saveBest(v){if(v>best){best=v;$('best').textContent=v;try{localStorage.setItem('nhodovat_best',v)}catch(e){}}}
  function renderLives(pop){
    var h='';for(var i=0;i<3;i++)h+=HEART.replace('class="heart"','class="heart'+(i>=S_.lives?' off':'')+(pop&&i===S_.lives?' pop':'')+'"');
    $('lives').innerHTML=h;
  }
  function size(r){return r<=2?[3,2]:r<=4?[3,3]:r<=6?[4,3]:[4,4]}
  function changeCount(r){return r<5?1:r<8?2:3}
  function studyMs(r,n){return Math.max(2200,1800+n*350-Math.min(r,12)*120)}
  function build(){
    var sz=size(S_.round),n=sz[0]*sz[1];
    grid.style.gridTemplateColumns='repeat('+sz[0]+',1fr)';
    S_.board=shuffle(ICONS.map(function(_,i){return i})).slice(0,n);
    S_.pool=ICONS.map(function(_,i){return i}).filter(function(x){return S_.board.indexOf(x)<0});
    draw(S_.board,false);
  }
  function draw(board,live){
    grid.innerHTML='';S_.cells=[];
    board.forEach(function(it,i){
      var b=document.createElement('button');b.type='button';
      b.className='cell'+(live?' live':'');b.style.setProperty('--i',i);
      b.innerHTML='<svg viewBox="0 0 48 48" aria-hidden="true">'+ICONS[it].s+'</svg>'+CHK;
      b.setAttribute('aria-label','Ô '+(i+1)+': '+ICONS[it].n);b.disabled=!live;
      b.addEventListener('click',function(){pick(i)});
      grid.appendChild(b);S_.cells.push(b);
    });
  }
  function applyChanges(){
    var n=S_.board.length,k=Math.min(changeCount(S_.round),Math.floor(n/3));
    var next=S_.board.slice(),used={},changed=[],pool=shuffle(S_.pool);
    function free(){var i;do{i=rnd(n)}while(used[i]);used[i]=1;return i}
    for(var c=0;c<k;c++){
      var kind=['new','swap'][rnd(2)];
      if(kind==='swap'&&Object.keys(used).length+2>n)kind='new';
      if(kind==='new'){var j=free();next[j]=pool.pop();changed.push(j)}
      else{var a=free(),b=free(),t=next[a];next[a]=next[b];next[b]=t;changed.push(a,b)}
    }
    S_.next=next;S_.changed=changed;S_.found=0;
  }
  function setMsg(t,s){msg.innerHTML=t+(s?'<small>'+s+'</small>':'')}
  function startRound(){
    clearTimers();S_.round++;$('round').textContent=S_.round;
    go.hidden=true;S_.phase='study';build();
    var ms=studyMs(S_.round,S_.board.length);
    setMsg('Nhìn kỹ và nhớ vị trí từng món.');
    fill.style.transition='none';fill.style.transform='scaleX(1)';void fill.offsetWidth;
    fill.style.transition='transform '+ms+'ms linear';fill.style.transform='scaleX(0)';
    later(function(){
      S_.phase='cover';curtain.classList.add('on');setMsg('Đang đổi đồ...');applyChanges();
      later(function(){
        draw(S_.next,true);curtain.classList.remove('on');S_.phase='pick';
        fill.style.transition='none';fill.style.transform='scaleX(1)';
        setMsg('Có '+S_.changed.length+' ô đã thay đổi.','Bấm vào những ô đó.');
      },1000);
    },ms);
  }
  function pick(i){
    if(S_.phase!=='pick')return;
    var cell=S_.cells[i];if(cell.classList.contains('ok'))return;
    if(S_.changed.indexOf(i)>=0){
      cell.classList.add('ok');S_.found++;
      if(S_.found===S_.changed.length){S_.phase='done';won()}
      else setMsg('Đúng! Còn '+(S_.changed.length-S_.found)+' ô nữa.');
    }else{
      cell.classList.add('no');S_.lives--;renderLives(true);
      setTimeout(function(){cell.classList.remove('no')},320);
      if(S_.lives<=0){S_.phase='done';lose()}else setMsg('Ô này không đổi.','Còn '+S_.lives+' mạng.');
    }
  }
  function lockAll(){S_.cells.forEach(function(c){c.disabled=true;c.classList.remove('live')})}
  function won(){lockAll();saveBest(S_.round);setMsg('Chính xác! Qua vòng '+S_.round+'.');go.textContent='Vòng tiếp theo';go.hidden=false;go.focus()}
  function lose(){
    lockAll();S_.changed.forEach(function(i){var c=S_.cells[i];if(!c.classList.contains('ok'))c.classList.add('miss')});
    saveBest(S_.round-1);setMsg('Hết mạng. Bạn qua '+(S_.round-1)+' vòng.','Ô viền đứt là chỗ đã đổi.');
    S_.over=true;go.textContent='Chơi lại';go.hidden=false;go.focus();
  }
  go.addEventListener('click',function(){
    if(S_.over||S_.phase==='idle'){S_.round=0;S_.lives=3;S_.over=false;renderLives();$('round').textContent=0}
    startRound();
  });
  renderLives();
  grid.style.gridTemplateColumns='repeat(3,1fr)';
  draw(shuffle(ICONS.map(function(_,i){return i})).slice(0,6),false);
})();
</script>
