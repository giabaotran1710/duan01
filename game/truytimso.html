<title>Truy tìm số</title>
<style>
:root{
    --bg:#07111f;
    --panel:rgba(13,27,45,.78);
    --panel2:rgba(20,39,62,.84);
    --text:#edf6ff;
    --muted:#91a7be;
    --accent:#5eead4;
    --accent2:#60a5fa;
    --danger:#fb7185;
    --warning:#fbbf24;
    --line:rgba(255,255,255,.09);
    --shadow:0 18px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;margin:0;overflow-x:hidden;overflow-y:auto}
body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 15%,rgba(96,165,250,.14),transparent 30%),
      radial-gradient(circle at 85% 85%,rgba(94,234,212,.10),transparent 30%),
      var(--bg);
}
button{font:inherit;color:inherit}
.app{
    width:100%;
    max-height:100dvh;
    display:grid;
    grid-template-rows:auto auto 1fr;
    gap:12px;
    padding:14px;
}
.topbar{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:14px;
    max-width:1050px;
    width:min(1050px,100%);
    margin:0 auto;
}
.brand{
    display:flex;align-items:center;gap:10px;
    min-width:155px;
}
.logo{
    width:38px;height:38px;border-radius:12px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#06121d;font-weight:900;font-size:17px;
    box-shadow:0 8px 24px rgba(94,234,212,.18);
}
.brandText{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.mode{
    justify-self:center;
    display:flex;
    padding:4px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.035);
    border-radius:999px;
    backdrop-filter:blur(14px);
}
.mode button{
    border:0;background:transparent;
    padding:9px 14px;border-radius:999px;
    font-weight:800;font-size:13px;
    color:var(--muted);
    cursor:pointer;
    opacity:.45;
    transition:.2s ease;
}
.mode button:not(.active):hover{
    opacity:.75;
}
.mode button.active{
    background:linear-gradient(135deg,rgba(96,165,250,.92),rgba(94,234,212,.92));
    color:#06121d;
    opacity:1;
    box-shadow:0 6px 18px rgba(94,234,212,.13);
}
.stats{
    display:flex;align-items:center;gap:16px;
    justify-self:end;
}
.stat{text-align:right;min-width:55px}
.recordStat{min-width:128px}
.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.stat strong{font-size:19px;line-height:1.1}
.timerWrap{
    width:min(95vw,1050px);
    margin:0 auto;
    position:relative;
}
.timeTrack{
    height:6px;border-radius:999px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
}
.timeBar{
    height:100%;width:100%;
    border-radius:inherit;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transform-origin:left center;
    transition:width .1s linear,background .25s ease;
}
.main{
    min-height:0;
    display:grid;
    place-items:center;
    overflow:visible;
}
.boardShell{
    width:min(1050px,100%);
    height:min(calc(100dvh - 140px),760px);
    min-height:320px;
    margin-bottom:14px;
    position:relative;
    padding:18px;
    border:1px solid var(--line);
    border-radius:28px;
    background:linear-gradient(145deg,rgba(17,34,54,.86),rgba(7,18,31,.92));
    box-shadow:var(--shadow);
    overflow:hidden;
}
.boardShell::before{
    content:"";
    position:absolute;inset:-30% auto auto -10%;
    width:320px;height:320px;border-radius:50%;
    background:radial-gradient(circle,rgba(96,165,250,.11),transparent 70%);
    pointer-events:none;
}
.boardInfo{
    display:flex;justify-content:space-between;align-items:end;
    gap:12px;margin:0 2px 14px;
}
.targetBlock .eyebrow{
    color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
}
.targetBlock{
    width:100%;
    text-align:center;
}

.targetBlock .eyebrow{
    color:var(--muted);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:7px;
}

.targetBlock{
    width:100%;
    text-align:center;
}

.targetBlock .eyebrow{
    color:var(--muted);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:7px;
}

/* Khung nhìn cố định */
.targetViewport{
    width:min(300px,80vw);
    height:58px;
    margin:0 auto;
    overflow:hidden;
    position:relative;
}

/* Dải số di chuyển */
.targetTrack{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:flex-start;

    will-change:transform;

    transition:
        transform .32s cubic-bezier(.22,.8,.25,1);
}

/* Mỗi số chiếm một slot cố định */
.targetNumber{
    flex:0 0 70px;
    width:70px;
    text-align:center;
    line-height:1;
    font-weight:900;

    color:#6f8499;
    opacity:.32;
    transform:scale(.68);

    transition:
        transform .32s cubic-bezier(.22,.8,.25,1),
        opacity .32s ease,
        color .32s ease,
        filter .32s ease;
}

/* Số hiện tại */
.targetNumber.current{
    color:var(--accent);
    opacity:1;
    transform:scale(1.28);

    text-shadow:
        0 0 12px rgba(94,234,212,.35),
        0 0 26px rgba(94,234,212,.15);
}

/* Hai số sát bên */
.targetNumber.near{
    opacity:.42;
    transform:scale(.76);
}

/* Các số xa hơn */
.targetNumber.far{
    opacity:.08;
    transform:scale(.55);
    filter:blur(.3px);
}

/* Ở đầu/cuối */
.targetNumber.hiddenNumber{
    opacity:0;
}

/* Mobile */
@media (max-width:760px){
    .targetViewport{
        width:240px;
        height:52px;
    }

    .targetNumber{
        flex-basis:58px;
        width:58px;
    }

    .targetNumber.current{
        font-size:28px;
    }
}


.nextHint{display:none;}
.board{
    position:relative;
    height:calc(100% - 66px);
    min-height:250px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.06);
    background:
      linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
      rgba(4,12,23,.54);
    background-size:28px 28px;
    overflow:hidden;
    touch-action:manipulation;
}
/* Chỉ có chữ số, không nền/viền/bóng: vùng chạm vẫn là ô vuông trong suốt */
.number{
    position:absolute;
    width:clamp(42px,7vw,68px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    border:0;
    background:none;
    box-shadow:none;
    color:#eaf4ff;
    text-shadow:0 2px 8px rgba(0,0,0,.45);
    font-size:clamp(15px,2.6vw,22px);
    font-weight:900;
    line-height:1;
    cursor:pointer;
    transform:translate(-50%,-50%) scale(1);
    transition:transform .16s ease,opacity .16s ease,color .16s ease;
}
.number:active{transform:translate(-50%,-50%) scale(.9)}
.board[data-mode="hard"] .number,
.board[data-mode="veryHard"] .number{
    width:clamp(38px,4.6vw,50px);
}
/* Rất khó trở lên: màu ngẫu nhiên cho từng số (--h là sắc độ) */
.number.colored{
    color:hsl(var(--h) 85% 66%);
    text-shadow:0 0 12px hsl(var(--h) 90% 55% / .45), 0 2px 6px rgba(0,0,0,.5);
}
.number.good{
    color:#52e3c2;
    text-shadow:0 0 14px rgba(82,227,194,.6), 0 2px 6px rgba(0,0,0,.5);
}
.number.bad{animation:shake .28s ease}
.number.done{
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.65);
}
@keyframes shake{
  0%,100%{translate:0 0}
  25%{translate:-5px 0}
  75%{translate:5px 0}
}
.screen{
    position:absolute;inset:0;
    display:grid;place-items:center;
    background:rgba(3,10,18,.72);
    backdrop-filter:blur(10px);
    z-index:10;
    padding:24px;
}
.card{
    width:min(430px,100%);
    text-align:center;
    padding:30px 24px 24px;
    border:1px solid var(--line);
    border-radius:24px;
    background:linear-gradient(145deg,rgba(20,39,62,.97),rgba(10,23,40,.98));
    box-shadow:0 24px 70px rgba(0,0,0,.42);
}
.card .icon{
    width:58px;height:58px;border-radius:18px;
    margin:0 auto 16px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(96,165,250,.22),rgba(94,234,212,.2));
    color:var(--accent);font-size:25px;font-weight:900;
}
.card h1{margin:0 0 8px;font-size:28px}
.card p{margin:0 auto 18px;color:var(--muted);line-height:1.55;font-size:14px;max-width:340px}
.rule{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    margin:0 0 20px;
}
.pill{
    padding:7px 11px;border-radius:999px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.06);
    font-size:11px;color:#c9d8e8;font-weight:700;
}
.primary{
    width:100%;border:0;border-radius:16px;
    padding:14px 18px;
    font-size:15px;font-weight:900;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#05131e;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(94,234,212,.14);
}
.secondary{
    margin-top:9px;width:100%;
    border:1px solid var(--line);
    background:rgba(255,255,255,.035);
    border-radius:14px;padding:12px;
    font-size:13px;font-weight:800;color:#bfd0df;
    cursor:pointer;
}
.hidden{display:none!important}
.resultScore{
    font-size:44px;font-weight:950;
    color:var(--accent);
    margin:6px 0;
}
.resultMeta{display:none}
@media (max-width:760px){
    .app{padding:10px;gap:9px;min-height:90dvh}
    .boardShell{max-height:none}
    .topbar{
        grid-template-columns:1fr auto;
        grid-template-areas:"brand stats" "mode mode";
        gap:8px;
    }
    .brand{grid-area:brand}
    .mode{grid-area:mode;justify-self:stretch}
    .mode button{flex:1;padding:8px 7px;font-size:11px}
    .stats{grid-area:stats;gap:11px}
    .boardShell{
        height:min(calc(100vh - 125px),700px);
        padding:12px;border-radius:22px;
    }
    .boardInfo{margin-bottom:10px}
    .targetBlock .target{font-size:25px}
    .nextHint{font-size:11px}
    .number{border-radius:13px}
}
@media (max-height:520px) and (orientation:landscape){
    .app{padding:8px;gap:6px;min-height:100dvh}

    .topbar{gap:8px}
    .brand{min-width:130px}
    .logo{width:32px;height:32px;border-radius:10px}
    .mode button{padding:7px 14px}
    .boardShell{
        height:calc(100vh - 90px);
        padding:10px;border-radius:19px;
    }
    .boardInfo{margin-bottom:8px}
    .targetBlock .target{font-size:22px}
    .board{height:calc(100% - 54px)}
}
    
    footer { position:fixed;bottom:5px;left:10px;font-size:10px;color:#aaa;opacity:1;font-family:Tahoma;z-index:99999; }

</style>

<style id="theme-chalk">
/* Chủ đề: bảng đen lớp học. Khung gỗ, mặt bảng đá xanh, số viết bằng phấn, máng phấn dưới chân bảng. */
:root{
    --wall:#4a2f1d; --wall-2:#3a2416;
    --slate:#2f4a3c; --slate-2:#243b2f; --slate-deep:#1a2b22;
    --wood:#a0663a; --wood-2:#7a4a26; --wood-hi:#c58a54;
    --chalk:#f4f1e6; --chalk-dim:#c9cfc2; --chalk-y:#ffe17a; --chalk-p:#ffb3c1; --chalk-b:#a9d8ff;
    --text:var(--chalk); --muted:#bfc9bb; --accent:var(--chalk-y); --danger:#ff9b8f;
}
body{
    font-family:'Pangolin',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:
      repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 46px,rgba(0,0,0,.25) 47px 49px),
      linear-gradient(180deg,var(--wall),var(--wall-2));
}
.logo{
    border-radius:50%;background:none;color:var(--chalk-y);font-size:18px;
    border:2.5px solid var(--chalk-y);box-shadow:none;rotate:-6deg;
}
.brandText{font-size:20px;letter-spacing:.02em;text-transform:none;color:var(--chalk)}
/* thanh chọn độ khó: thanh gỗ với các nhãn phấn */
.mode{
    border:0;border-radius:10px;padding:4px;backdrop-filter:none;
    background:linear-gradient(180deg,var(--wood-hi),var(--wood) 55%,var(--wood-2));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.35);
}
.mode button{opacity:1;color:#f7e6cf;font-weight:400;font-size:15px;border-radius:7px;min-height:40px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.mode button.active{background:var(--slate);color:var(--chalk-y);box-shadow:inset 0 2px 4px rgba(0,0,0,.45);text-shadow:none}
.stat small{font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.stat strong{font-weight:400;color:var(--chalk)}
/* thanh thời gian: vạch phấn trên nẹp gỗ */
.timeTrack{height:8px;background:var(--wall-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.timeBar{background:repeating-linear-gradient(90deg,var(--chalk) 0 14px,var(--chalk-dim) 14px 16px)}
/* mặt bảng: khung gỗ dày + máng phấn */
.boardShell{
    border:12px solid var(--wood);border-radius:6px;
    border-image:linear-gradient(160deg,var(--wood-hi),var(--wood) 40%,var(--wood-2)) 1;
    background:
      radial-gradient(ellipse at 20% 25%,rgba(255,255,255,.07),transparent 40%),
      radial-gradient(ellipse at 75% 70%,rgba(255,255,255,.05),transparent 45%),
      radial-gradient(ellipse at 60% 10%,rgba(255,255,255,.04),transparent 30%),
      linear-gradient(170deg,var(--slate),var(--slate-2));
    box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 14px 0 -4px var(--wood-2),0 18px 26px rgba(0,0,0,.5);
}
.boardShell::before{
    content:"";position:absolute;inset:auto 10% 4px auto;width:84px;height:10px;border-radius:3px;
    background:linear-gradient(90deg,var(--chalk) 0 40%,transparent 40% 48%,var(--chalk-y) 48% 72%,transparent 72% 78%,var(--chalk-p) 78%);
    opacity:.9;filter:none;
}
.targetBlock .eyebrow{font-size:14px;letter-spacing:.04em;text-transform:none;color:var(--muted)}
.targetNumber{color:var(--chalk-dim)}
.targetNumber.current{color:var(--chalk-y);text-shadow:0 0 1px var(--chalk-y),0 0 6px rgba(255,225,122,.35)}
.board{border:0;border-radius:4px;background:transparent}
.number{
    color:var(--chalk);font-weight:400;font-size:clamp(20px,3.2vw,28px);
    text-shadow:0 0 1px rgba(255,255,255,.9),1px 1px 0 rgba(255,255,255,.12),-1px 0 2px rgba(255,255,255,.18);
}
.number:nth-child(3n){rotate:-7deg}.number:nth-child(4n+1){rotate:6deg}.number:nth-child(5n+2){rotate:-3deg}
.number.colored{color:hsl(var(--h) 75% 82%);text-shadow:0 0 1px hsl(var(--h) 80% 85%),-1px 0 2px rgba(255,255,255,.15)}
.number.good{color:var(--chalk-y);text-shadow:none;border:2.5px solid var(--chalk-y);border-radius:50%}
.number.done{opacity:.18;transform:translate(-50%,-50%) scale(.85)}
.number:focus-visible{outline:2px dashed var(--chalk-y);outline-offset:2px}
/* màn bắt đầu/kết quả: mảng bảng được lau sạch, viền phấn */
.screen{background:rgba(26,43,34,.86);backdrop-filter:none}
.card{
    border:2.5px dashed rgba(244,241,230,.55);border-radius:10px;
    background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 55%),var(--slate);
    box-shadow:0 0 0 6px var(--slate-deep);
}
.card .icon{border-radius:50%;background:none;border:2.5px solid var(--chalk-y);color:var(--chalk-y);font-weight:400;rotate:-6deg}
.card h1{font-weight:400;font-size:34px;color:var(--chalk)}
.card p{font-size:16px;color:var(--chalk-dim)}
.pill{background:none;border:1.5px solid rgba(244,241,230,.4);border-radius:8px;font-size:14px;font-weight:400;color:var(--chalk)}
.primary{
    border-radius:10px;min-height:50px;font-weight:400;font-size:20px;
    background:linear-gradient(180deg,#ffe998,var(--chalk-y));color:#2a2a1a;
    box-shadow:0 4px 0 #b99a3a,0 8px 14px rgba(0,0,0,.35);
}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #b99a3a}
.secondary{border:1.5px solid rgba(244,241,230,.4);background:none;font-weight:400;font-size:16px;color:var(--chalk);min-height:46px}
.primary:focus-visible,.secondary:focus-visible,.mode button:focus-visible{outline:3px solid var(--chalk-y);outline-offset:2px}
.resultScore{font-weight:400;color:var(--chalk-y)}
@media (max-width:760px){
    .mode button{font-size:14px;padding:8px 4px}
    .boardShell{border-width:10px;padding:10px 10px 16px}
    .number{border-radius:50%}
}
@media (prefers-reduced-motion:reduce){.targetTrack,.targetNumber,.number{transition:none}}
footer{color:#c9a982}

/* ===== hoạt ảnh: bảng phấn ===== */
@keyframes chalkCircle{from{clip-path:polygon(50% 50%,50% 0,50% 0,50% 0,50% 0,50% 0,50% 0)}to{clip-path:polygon(50% 50%,50% 0,100% 0,100% 100%,0 100%,0 0,50% 0)}}
.number.good::after{content:'';position:absolute;inset:3px;border:2.5px solid var(--chalk-y);border-radius:50%;animation:chalkCircle .28s ease-out both;transform:rotate(-8deg)}
.number.done{filter:blur(2px);transition:opacity .35s ease,transform .35s ease,filter .35s ease}
@keyframes boardIn{from{opacity:0;transform:translateY(8px)}}
.number{animation:chalkWrite .35s ease-out both}
@keyframes chalkWrite{from{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(-12deg);filter:blur(3px)}}
.boardShell.hurry{animation:hurry .8s ease-in-out infinite}
@keyframes hurry{50%{box-shadow:inset 0 0 40px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,155,143,.7),0 14px 0 -4px var(--wood-2),0 18px 26px rgba(0,0,0,.5)}}
.eraser{position:absolute;top:8%;bottom:8%;left:-30%;width:26%;z-index:12;pointer-events:none;border-radius:10px;background:linear-gradient(180deg,#e8d9b0 0 70%,#2a2a2a 70%);box-shadow:0 8px 14px rgba(0,0,0,.5);animation:eraserSweep .9s cubic-bezier(.5,0,.3,1) forwards}
@keyframes eraserSweep{to{left:106%}}
.eraseTrail{position:absolute;inset:0;z-index:11;pointer-events:none;background:linear-gradient(90deg,rgba(26,43,34,.95),rgba(26,43,34,.95));transform-origin:left;transform:scaleX(0);animation:trail .9s cubic-bezier(.5,0,.3,1) forwards;border-radius:4px}
@keyframes trail{to{transform:scaleX(1)}}
.chalkScrawl{position:absolute;left:50%;top:44%;z-index:13;transform:translate(-50%,-50%) rotate(-6deg);font:400 54px Pangolin,sans-serif;color:var(--chalk-y);pointer-events:none;white-space:nowrap;animation:scrawl .8s .75s ease-out both}
@keyframes scrawl{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

<script>
(() => {
    const targetTrack = document.getElementById('targetTrack');
    const board = document.getElementById('board');
const logoEl = document.querySelector('.logo');
const startIconEl = document.querySelector('.card .icon');
const modeDescEl = document.getElementById('modeDesc');
    
    const scoreEl = null;
    const bestEl = document.getElementById('best');
    const timeBar = document.getElementById('timeBar');
    const startScreen = document.getElementById('startScreen');
    const resultScreen = document.getElementById('resultScreen');
    const resultTitle = document.getElementById('resultTitle');
    const resultScore = document.getElementById('resultScore');
    const resultMeta = document.getElementById('resultMeta');
    const resultIcon = document.getElementById('resultIcon');
    const normalBtn = document.getElementById('normalBtn');
    const hardBtn = document.getElementById('hardBtn');
    const veryHardBtn = document.getElementById('veryHardBtn');
    const superHardBtn = document.getElementById('superHardBtn');
    const masterBtn = document.getElementById('masterBtn');
    const startBtn = document.getElementById('startBtn');
    const againBtn = document.getElementById('againBtn');
    const changeModeBtn = document.getElementById('changeModeBtn');

    // Mọi chế độ đều 30 số. Chế độ khó hơn thừa hưởng tính năng của chế độ dễ hơn:
    // Khó: số đúng không biến mất · Rất khó: + màu ngẫu nhiên · Siêu khó: + kích thước lớn nhỏ · Bậc thầy: + tìm số theo thứ tự ngẫu nhiên
    const MODES = {
        normal:    { count: 30, time: 60, label: 'Thường',   persistent: false, colors: false, sizes: false, random: false, desc: 'Số tìm đúng sẽ biến mất' },
        hard:      { count: 30, time: 60, label: 'Khó',      persistent: true,  colors: false, sizes: false, random: false, desc: 'Số tìm đúng không biến mất' },
        veryHard:  { count: 30, time: 60, label: 'Rất khó',  persistent: true,  colors: true,  sizes: false, random: false, desc: 'Thêm màu sắc ngẫu nhiên' },
        superHard: { count: 30, time: 65, label: 'Siêu khó', persistent: true,  colors: true,  sizes: true,  random: false, desc: 'Thêm số to nhỏ khác nhau' },
        master:    { count: 30, time: 70, label: 'Bậc thầy', persistent: true,  colors: true,  sizes: true,  random: true,  desc: 'Tìm số theo thứ tự ngẫu nhiên' }
    };

    // Ánh xạ chế độ -> khóa lưu trữ (dùng chung cho window.storage).
    const BEST_KEYS = {
        normal: 'findNumberBestNormal',
        hard: 'findNumberBestHard',
        veryHard: 'findNumberBestVeryHard',
        superHard: 'findNumberBestSuperHard',
        master: 'findNumberBestMaster'
    };

    let mode = 'normal';
    let count = 30;
    let limit = 30;
    let target = 1;
    let score = 0;
    let startedAt = 0;
    let raf = 0;
    let running = false;
    let cells = [];
    let seq = [];   // thứ tự các số cần tìm (1..30, hoặc xáo trộn ở Bậc thầy)
    let idx = 0;    // đang tìm số seq[idx]

    // Kỉ lục được lưu bằng window.storage (bền vững trong artifact Claude),
    // KHÔNG dùng localStorage vì localStorage không được hỗ trợ trong artifact
    // và mọi lệnh gọi tới nó sẽ thất bại âm thầm (không lưu được kỉ lục).
    

function loadBests() {
    updateBest();
}

 function saveBest(modeKey, valueMs) {
    localStorage.setItem(
        BEST_KEYS[modeKey],
        String(Math.round(valueMs))
    );
}
    
    function updateTargetDisplay(animate = true){
    targetTrack.innerHTML = '';

    /*
     * Hiển thị một khoảng số xung quanh số hiện tại.
     * Ví dụ target = 10:
     *
     * 7  8  9  10  11  12  13
     *
     * Số 10 sẽ nằm giữa.
     */

    const start = Math.max(0, idx - 3);
    const end = Math.min(count - 1, idx + 3);

    for(let k = start; k <= end; k++){
        const number = document.createElement('span');

        number.className = 'targetNumber';

        if(k === idx){
            number.classList.add('current');
        }
        else if(Math.abs(k - idx) === 1){
            number.classList.add('near');
        }
        else{
            number.classList.add('far');
        }

        number.textContent = seq[k] === undefined ? '' : seq[k];

        targetTrack.appendChild(number);
    }

    /*
     * Kích thước slot phải giống với CSS.
     */
    const slotWidth =
        window.innerWidth <= 760 ? 58 : 70;

    const viewportWidth =
        window.innerWidth <= 760 ? 240 : 300;

    /*
     * Vị trí của target trong track.
     */
    const currentIndex = idx - start;

    /*
     * Đưa target vào chính giữa viewport.
     */
    const translateX =
        viewportWidth / 2
        - slotWidth / 2
        - currentIndex * slotWidth;

    /*
     * Animation hay không.
     */
    if(!animate){
        targetTrack.style.transition = 'none';
    }
    else{
        targetTrack.style.transition =
            'transform .32s cubic-bezier(.22,.8,.25,1)';
    }

    targetTrack.style.transform =
        `translateX(${translateX}px)`;
}
function updateModeUI() {
    normalBtn.classList.toggle('active', mode === 'normal');
    hardBtn.classList.toggle('active', mode === 'hard');
    veryHardBtn.classList.toggle('active', mode === 'veryHard');
    superHardBtn.classList.toggle('active', mode === 'superHard');
    masterBtn.classList.toggle('active', mode === 'master');

    const cfg = MODES[mode];
count = cfg.count;
limit = cfg.time;

modeDescEl.textContent = cfg.desc;
logoEl.textContent = cfg.count;
startIconEl.textContent = cfg.count;

updateBest();
}
    function formatTime(ms) {
        const totalMs = Math.max(0, Math.round(ms));
        const minutes = Math.floor(totalMs / 60000);
        const seconds = Math.floor((totalMs % 60000) / 1000);
        const millis = totalMs % 1000;

        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(millis).padStart(3, '0')}`;
    }

 function getBestValue() {
    return localStorage.getItem(BEST_KEYS[mode]) || '';
}
    function updateBest() {
    const value = localStorage.getItem(BEST_KEYS[mode]);

    bestEl.textContent =
        value
            ? formatTime(Number(value))
            : '--:--:---';
}

    function setMode(next) {
        if (running) return;
        mode = next;
        updateModeUI();
        startScreen.classList.remove('hidden');
        resultScreen.classList.add('hidden');
        updateTargetDisplay(false);
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getScatterLayout(size, maxScale = 1) {
        const rect = board.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        // Kích thước ô thực tế theo từng chế độ.
        const nominal = size >= 50
            ? Math.min(42, Math.max(30, width * 0.037))
            : Math.min(50, Math.max(38, width * 0.046));
        // Có số to nhỏ khác nhau: chừa chỗ theo cỡ lớn nhất để các số không đè nhau
        const buttonSize = nominal * maxScale;

        const half = buttonSize / 2;
        const edge = half + 5;
        const availableW = Math.max(1, width - edge * 2);
        const availableH = Math.max(1, height - edge * 2);
        const aspect = availableW / availableH;

        // Chọn số cột/hàng gần với tỉ lệ màn hình.
        let cols = Math.round(Math.sqrt(size * aspect));
        cols = Math.max(1, Math.min(size, cols));
        let rows = Math.ceil(size / cols);

        // Bảo đảm mỗi ô lưới đủ rộng/cao cho số + khoảng hở.
        // Màn hình thấp (vd 360x640): thêm cột nếu còn chỗ ngang, không thì thu nhỏ cỡ số.
        // (Bản cũ tăng hàng rồi lại tính lại hàng nên lặp vô hạn, treo trang ở chế độ Siêu khó.)
        let bs = buttonSize;
        for (let guard = 0; guard < 300; guard++) {
            const okW = availableW / cols >= bs + 8, okH = availableH / rows >= bs + 8;
            if (okW && okH) break;
            if (!okW && cols > 1) cols--;
            else if (!okH && cols < size && availableW / (cols + 1) >= bs + 8) cols++;
            else bs *= 0.94;
            rows = Math.ceil(size / cols);
        }
        const k = bs / buttonSize;

        return { width, height, buttonSize: bs, nominal: nominal * k, half: bs / 2, edge, cols, rows };
    }

    function createEvenScatterPositions(size, maxScale = 1) {
        const layout = getScatterLayout(size, maxScale);
        const {
            width, height, half, edge, cols, rows
        } = layout;

        const usableW = width - edge * 2;
        const usableH = height - edge * 2;
        const cellW = usableW / cols;
        const cellH = usableH / rows;

        // Tạo một vùng cho mỗi số. Các vùng được xáo trộn
        // để phá cảm giác "xếp theo thứ tự", nhưng vẫn phân bố đều.
        const slots = [];
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                slots.push({ row, col });
            }
        }

        shuffle(slots);

        // Khi rows*cols > size, lấy các slot xa nhau nhất có thể
        // bằng cách ưu tiên slot đã được trộn; phần dư được bỏ qua.
        const selected = slots.slice(0, size);

        return selected.map(slot => {
            const cx = edge + (slot.col + 0.5) * cellW;
            const cy = edge + (slot.row + 0.5) * cellH;

            // Jitter giới hạn để vị trí vẫn nằm trong vùng và không va chạm.
            const jitterX = Math.min(cellW * 0.22, Math.max(0, cellW / 2 - half - 4));
            const jitterY = Math.min(cellH * 0.22, Math.max(0, cellH / 2 - half - 4));

            return {
                x: cx + (Math.random() * 2 - 1) * jitterX,
                y: cy + (Math.random() * 2 - 1) * jitterY,
                half,
                nominal: layout.nominal,
                bw: width,
                bh: height
            };
        });
    }

    function buildBoard() {
        board.innerHTML = '';
        cells = [];

        const nums = shuffle(Array.from({length: count}, (_, i) => i + 1));
        const isNormal = mode === 'normal';

        board.dataset.mode = mode;
        board.style.setProperty(
            '--scatter-size',
            isNormal ? '0px' : (count >= 50 ? '34px' : '44px')
        );

        if (isNormal) {
            // 30 số: 5 cột × 6 hàng, ngay ngắn nhưng thứ tự số ngẫu nhiên.
            const cols = 5;
            const rows = 6;
            const cellW = 100 / cols;
            const cellH = 100 / rows;

            nums.forEach((n, index) => {
                const btn = document.createElement('button');
                btn.className = 'number';
                btn.type = 'button';
                btn.textContent = n;
                btn.dataset.number = n;

                const col = index % cols;
                const row = Math.floor(index / cols);

                btn.style.left = `${(col + 0.5) * cellW}%`;
                btn.style.top = `${(row + 0.5) * cellH}%`;

                btn.addEventListener('click', () => handleNumber(btn, n));
                board.appendChild(btn);
                cells.push(btn);
            });
            return;
        }

        // Khó / Rất khó / Cực khó:
        // chia bàn thành các vùng, mỗi vùng tối đa 1 số,
        // sau đó xáo trộn vùng + jitter để vừa đều vừa ngẫu nhiên.
        const cfg = MODES[mode];
        const SIZE_MAX = 1.3;
        const scatterPositions = createEvenScatterPositions(count, cfg.sizes ? SIZE_MAX : 1);

        nums.forEach((n, index) => {
            const btn = document.createElement('button');
            btn.className = 'number';
            btn.type = 'button';
            if (cfg.colors) {
                btn.classList.add('colored');
                btn.style.setProperty('--h', String(Math.floor(Math.random() * 360)));
            }
            btn.textContent = n;
            btn.dataset.number = n;

            const pos = scatterPositions[index];
            // lưu theo % để khi xoay màn / đổi kích thước bảng, số vẫn nằm trong bảng
            btn.style.left = (pos.x / pos.bw * 100) + '%';
            btn.style.top = (pos.y / pos.bh * 100) + '%';

            if (cfg.sizes) {
                // Kích thước ngẫu nhiên từ nhỏ (0,62×) tới lớn (1,3×) so với cỡ chuẩn
                const px = pos.nominal * (0.62 + Math.random() * (SIZE_MAX - 0.62));
                btn.style.width = px + 'px';
                btn.style.fontSize = Math.max(11, px * 0.42) + 'px';
            }

            btn.addEventListener('click', () => handleNumber(btn, n));
            board.appendChild(btn);
            cells.push(btn);
        });
    }

    function handleNumber(btn, n) {
        if (!running) return;

        if (n === target) {
            btn.classList.add('good');
            try { const q = FX.center(btn); FX.burst(q.x, q.y, { n: 9, colors: ['#f4f1e6', '#c9cfc2', '#ffe17a'], speed: 120, gravity: 120, drag: 2.5, size: 6, life: .6, shape: 'circle' }); FX.ring(q.x, q.y, '#ffe17a', 30, 2.5); } catch (e) {}

            idx++;

            if (!MODES[mode].persistent) {
                setTimeout(() => btn.classList.add('done'), 70);
            }

            if (idx >= count) {
                score = count;
                finish(true);
                return;
            }

            target = seq[idx];
            updateTargetDisplay(true);
        } else {
            btn.classList.remove('bad');
            void btn.offsetWidth;
            btn.classList.add('bad');
            try { const q = FX.center(btn); FX.text(q.x, q.y - 16, '✕', { color: '#ff9b8f', font: "400 30px Pangolin,sans-serif", dur: 600, rise: 26 }); FX.shake(document.querySelector('.boardShell'), 3, 220); } catch (e) {}
        }
    }

    function updateTimer() {
        if (!running) return;
        const elapsed = (performance.now() - startedAt) / 1000;
        const left = Math.max(0, limit - elapsed);
        const pct = Math.max(0, Math.min(1, left / limit));

        timeBar.style.width = (pct * 100) + '%';
        document.querySelector('.boardShell').classList.toggle('hurry', pct < 0.25);
        if (pct < 0.25) {
            timeBar.style.background = 'repeating-linear-gradient(90deg,#ff9b8f 0 14px,#ffb3a8 14px 16px)';
        } else {
            timeBar.style.background = '';
        }

        if (left <= 0) {
            finish(false);
            return;
        }

        raf = requestAnimationFrame(updateTimer);
    }

    function startGame() {
        cancelAnimationFrame(raf);
        running = true;
  // Bậc thầy: thứ tự tìm số ngẫu nhiên; các chế độ khác: 1, 2, 3...
  seq = Array.from({length: count}, (_, i) => i + 1);
  if (MODES[mode].random) shuffle(seq);
  idx = 0;
  target = seq[0];
  score = 0;
  updateTargetDisplay(false);
        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');

        buildBoard();

        requestAnimationFrame(() => {
            startedAt = performance.now();
            timeBar.style.width = '100%';
            timeBar.style.background = '';
            raf = requestAnimationFrame(updateTimer);
        });
    }

    function finish(won) {
        if (!running) return;
        running = false;
        cancelAnimationFrame(raf);

        // Thời gian đã trôi qua tính bằng mili-giây, giới hạn không vượt quá thời gian cho phép.
        const elapsedMs = Math.min(limit * 1000, performance.now() - startedAt);

        if (won) {
            resultIcon.textContent = '✓';
            resultTitle.textContent = 'Hoàn thành!';
            resultScore.classList.remove('hidden');
            resultScore.textContent = formatTime(elapsedMs);
            resultMeta.textContent = `${MODES[mode].label} · ${count} số`;

            const best = Number(localStorage.getItem(BEST_KEYS[mode]));

if (!best || elapsedMs < best) {
    saveBest(mode, elapsedMs);
    updateBest();
}
        } else {
            // Hết giờ luôn xảy ra ở đúng mốc thời gian giới hạn (vd 1:00:000),
            // nên không cần hiển thị con số này vì nó không mang thêm thông tin.
            resultIcon.textContent = '×';
            resultTitle.textContent = 'Hết giờ';
            resultScore.classList.add('hidden');
            resultScore.textContent = '';
            resultMeta.textContent = '';
        }

        document.querySelector('.boardShell').classList.remove('hurry');
        const shell = document.querySelector('.boardShell');
        shell.querySelectorAll('.eraser,.eraseTrail,.chalkScrawl').forEach(e => e.remove());
        if (won) {
            // lau bảng: giẻ lau quét ngang rồi viết lời khen bằng phấn
            const tr = document.createElement('div'); tr.className = 'eraseTrail';
            const er = document.createElement('div'); er.className = 'eraser';
            const sc = document.createElement('div'); sc.className = 'chalkScrawl'; sc.textContent = 'Giỏi lắm!';
            shell.append(tr, er, sc);
            try { const r = shell.getBoundingClientRect(); FX.burst(r.left, r.top + r.height / 2, { n: 30, colors: ['#f4f1e6', '#c9cfc2'], speed: 320, spread: 1.4, angle: 0, gravity: 40, drag: 2, size: 8, life: .9 });
              setTimeout(() => FX.rain({ n: 46, colors: ['#f4f1e6', '#ffe17a', '#ffb3c1', '#a9d8ff'], shapes: ['line', 'star'], size: 9, gravity: 140 }), 900); } catch (e) {}
            setTimeout(() => { sc.remove(); resultScreen.classList.remove('hidden'); }, 1700);
            return;
        }
        try { const r = shell.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + 20, { n: 40, colors: ['#f4f1e6', '#c9cfc2'], speed: 140, spread: 3, angle: 1.57, gravity: 520, shapes: ['line', 'square'], size: 6, life: 1.1 }); FX.shake(shell, 7, 400); } catch (e) {}
        resultScreen.classList.remove('hidden');
    }

    normalBtn.addEventListener('click', () => setMode('normal'));
    hardBtn.addEventListener('click', () => setMode('hard'));
    veryHardBtn.addEventListener('click', () => setMode('veryHard'));
    superHardBtn.addEventListener('click', () => setMode('superHard'));
    masterBtn.addEventListener('click', () => setMode('master'));
    startBtn.addEventListener('click', startGame);
    againBtn.addEventListener('click', startGame);
    changeModeBtn.addEventListener('click', () => {
        resultScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
        updateModeUI();
    });

    seq = Array.from({length: count}, (_, i) => i + 1);
    updateModeUI();
    updateTargetDisplay(false);
    loadBests();
})();
</script>
