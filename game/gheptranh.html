<style>
:root{--bg1:#16424a;--bg2:#08191e;--wood1:#a3692f;--wood2:#6b3f19;--amber:#ffb830;--ink:#f4efe3;--muted:#9fb8bd;--n:4;
  box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px}
h1{margin:0;font-size:26px;letter-spacing:1px;color:var(--amber);text-shadow:0 2px 0 #7a4a00}
.hud{display:flex;gap:8px;width:min(92vw,560px)}
.hud div{flex:1;background:rgba(255,255,255,.07);border-radius:10px;padding:6px 8px;text-align:center}
.hud small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.hud b{font-size:18px;font-variant-numeric:tabular-nums}
.frame{padding:10px;border-radius:16px;background:linear-gradient(145deg,var(--wood1),var(--wood2));box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.25)}
#board{--s:min(88vw,calc(100vh - 330px),540px);position:relative;width:var(--s);height:var(--s);background:#0b171b;border-radius:6px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 12px #000}
.t{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));background-image:var(--img);background-size:calc(var(--n)*100%) calc(var(--n)*100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 2px 2px 0 rgba(255,255,255,.18);transition:left .15s ease,top .15s ease,opacity .5s;pointer-events:none}
.t.miss{opacity:0}
.t span{display:none;position:absolute;left:4px;top:3px;font-size:calc(var(--s)/(var(--n)*4.2));font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
#board.nums .t span{display:block}
#board.done .t{box-shadow:none}
#pv{position:absolute;inset:0;background-image:var(--img);background-size:100% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#pv.on{opacity:1}
.row{display:flex;gap:8px;width:min(92vw,560px)}
button{flex:1;font:inherit;font-weight:700;font-size:14px;min-height:46px;border:0;border-radius:12px;color:var(--ink);background:rgba(255,255,255,.12);box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button.sz.on{background:var(--amber);color:#3a2400}
button.main{background:#2e9e6a}
button.on2{background:#3b7ec9}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal.show{display:flex}
.card{background:linear-gradient(160deg,#245560,#10282f);border:2px solid var(--amber);border-radius:18px;padding:22px;width:min(86vw,340px);text-align:center;animation:pop .35s ease}
.card h2{margin:0 0 8px;color:var(--amber);font-size:26px}
.card p{margin:4px 0;color:var(--ink)}
.card .row{width:100%;margin-top:14px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
footer{position:fixed;bottom:5px;left:10px;font-size:10px;color:#aaa;opacity:.7;font-family:monospace;pointer-events:none}

<script>
/* ===== CONFIG ===== */
const CFG={SHUFFLE_FACTOR:30,REVEAL_MS:700,PIC_SIZE:720,PICS:15,KEY:'ghepTranh.best.'};

let winTimer=0;

const $=s=>document.querySelector(s);
const board=$('#board'),modal=$('#modal');

/* ===== STORAGE ===== */
function loadBest(n){try{const v=JSON.parse(localStorage.getItem(CFG.KEY+n));if(v&&v.moves>0&&v.time>0)return v}catch(e){}return null}
function saveBest(n,v){try{localStorage.setItem(CFG.KEY+n,JSON.stringify(v))}catch(e){}}

/* ===== PICTURES (drawn procedurally) ===== */
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
function drawScene(i){
  const c=document.createElement('canvas');c.width=c.height=CFG.PIC_SIZE;const g=c.getContext('2d');
  const rect=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
  const poly=(p,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>g.lineTo(q[0],q[1]));g.closePath();g.fill()};

    let lk=g.createLinearGradient(0,470,0,720);lk.addColorStop(0,'#62c0ee');lk.addColorStop(1,'#1c6aa5');rect(0,480,720,240,lk);
    for(let k=0;k<7;k++){const w=110-k*12;rect(560-w/2,495+k*26,w,6,'rgba(255,255,255,.35)')}

    for(let k=0;k<45;k++){const left=R()<.6,x=left?R()*190:580+R()*140,y=left?640+R()*70:660+R()*55;circ(x,y,5,['#e74c3c','#ffd23f','#fff'][k%3])}
    g.strokeStyle='#223';g.lineWidth=3;[[120,60],[170,110],[470,150]].forEach(([x,y])=>{g.beginPath();g.arc(x-9,y,10,3.3,5.9);g.arc(x+9,y,10,3.5,6.1);g.stroke()});
  }else if(i===1){

    circ(190,170,72,'#f5f1d8');[[165,150,16],[215,190,12],[180,205,9],[222,145,8]].forEach(([x,y,r])=>circ(x,y,r,'rgba(120,110,80,.22)'));
    const city=(col,hmin,hmax,wmin,win)=>{let x=-10;while(x<720){const w=wmin+R()*40,h=hmin+R()*(hmax-hmin);rect(x,640-h,w,h,col);
      if(win)for(let wy=640-h+14;wy<620;wy+=22)for(let wx=x+8;wx<x+w-10;wx+=18)if(R()<.45)rect(wx,wy,8,11,R()<.8?'#ffd36b':'#8fd0ff');x+=w+2}};

    for(let k=0;k<6;k++){const w=90-k*11;rect(190-w/2,652+k*11,w,4,'rgba(245,241,216,.45)')}
    for(let k=0;k<12;k++)rect(R()*680,655+R()*55,30+R()*30,3,'rgba(255,211,107,.35)');
  }else if(i===2){ // đại dương

    g.lineWidth=9;g.strokeStyle='#2e9e5a';for(let k=0;k<9;k++){const x=40+k*85;g.beginPath();g.moveTo(x,665);g.bezierCurveTo(x-30,610,x+30,570,x,510+R()*40);g.stroke()}
    g.lineCap='round';g.lineWidth=12;[[560,650,'#ff6b81'],[610,640,'#ff9f43'],[150,665,'#ee5a9b']].forEach(([x,y,col])=>{g.strokeStyle=col;for(let k=0;k<7;k++){g.beginPath();g.moveTo(x,y);g.lineTo(x-45+k*15,y-70-(k%3)*20);g.stroke()}});g.lineCap='butt';
    const fish=(x,y,s,col,d)=>{g.save();g.translate(x,y);g.scale(d*s,s);circ(0,0,0,col);g.beginPath();g.ellipse(0,0,45,24,0,0,7);g.fill();poly([[-35,0],[-75,-24],[-75,24]],col);circ(22,-5,5,'#fff');circ(24,-5,2.5,'#111');rect(-5,-22,8,44,'rgba(255,255,255,.35)');g.restore()};
    fish(220,200,1.3,'#ff9f1a',1);fish(500,300,1,'#f7d84a',-1);fish(360,470,.9,'#ff5e7e',1);fish(120,380,.7,'#7bed9f',-1);fish(580,150,.8,'#a29bfe',1);
    g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=2;for(let k=0;k<25;k++){g.beginPath();g.arc(R()*720,R()*600,4+R()*10,0,7);g.stroke()}
    poly(Array.from({length:10},(_,k)=>[380+Math.cos(k*Math.PI/5-1.57)*(k%2?10:26),668+Math.sin(k*Math.PI/5-1.57)*(k%2?10:26)]),'#ff7f50');
  }else if(i===3){ // sa mạc hoàng hôn
    let sk=g.createLinearGradient(0,0,0,500);sk.addColorStop(0,'#2b1a5a');sk.addColorStop(.6,'#e0553d');sk.addColorStop(1,'#ffd27a');rect(0,0,720,720,sk);
    for(let k=0;k<40;k++)circ(R()*720,R()*220,R()*1.5+.3,'rgba(255,255,255,.8)');
    let sg=g.createRadialGradient(360,500,20,360,500,270);sg.addColorStop(0,'rgba(255,230,150,.9)');sg.addColorStop(1,'rgba(255,230,150,0)');rect(0,200,720,320,sg);circ(360,500,90,'#fff1b0');
    poly([[120,510],[230,380],[340,510]],'#7a2e1b');poly([[230,380],[340,510],[270,510]],'#5e2112');poly([[400,510],[470,420],[540,510]],'#7a2e1b');
    const dune=(y,c1,c2,c3,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,y);g.quadraticCurveTo(200,y-c1,420,y+c2);g.quadraticCurveTo(580,y+c3,720,y-10);g.lineTo(720,720);g.lineTo(0,720);g.fill()};
    dune(505,50,5,45,'#c2602f');dune(595,60,10,40,'#a24a24');dune(685,55,5,45,'#7d3419');
    const cac=(x,y,s)=>{g.fillStyle='#1f5a35';[[x-12*s,y-110*s,24*s,110*s],[x-42*s,y-80*s,16*s,50*s],[x+26*s,y-90*s,16*s,55*s]].forEach(([a,b,c2,d])=>{g.beginPath();g.roundRect(a,b,c2,d,8*s);g.fill()});rect(x-42*s,y-45*s,40*s,14*s,'#1f5a35');rect(x+2*s,y-50*s,40*s,14*s,'#1f5a35')};
    cac(120,700,1.3);cac(610,710,1);
  }else if(i===4){ // vũ trụ
    rect(0,0,720,720,'#05061a');
    [[200,600,'rgba(120,60,200,.45)',300],[560,150,'rgba(40,160,200,.35)',280]].forEach(([x,y,col,r])=>{let q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,col);q.addColorStop(1,'rgba(0,0,0,0)');rect(0,0,720,720,q)});

    let pg=g.createLinearGradient(330,130,550,370);pg.addColorStop(0,'#ffcf7a');pg.addColorStop(.5,'#e0783a');pg.addColorStop(1,'#8a3a22');circ(440,250,120,pg);
    g.save();g.beginPath();g.arc(440,250,120,0,7);g.clip();[[200,18],[240,10],[290,22]].forEach(([y,h])=>rect(300,y,280,h,'rgba(120,50,20,.25)'));g.restore();
    g.beginPath();g.ellipse(440,250,190,45,-.35,0,Math.PI);g.stroke();
    let sp=g.createLinearGradient(80,480,180,600);sp.addColorStop(0,'#6fd3ff');sp.addColorStop(1,'#1d4fa0');circ(130,540,62,sp);circ(110,525,16,'rgba(80,200,120,.75)');circ(150,558,12,'rgba(80,200,120,.75)');

    g.save();g.translate(190,250);g.rotate(.6);poly([[28,20],[58,64],[28,50]],'#e74c3c');poly([[-28,20],[-58,64],[-28,50]],'#e74c3c');poly([[-16,50],[16,50],[0,115]],'#ffb830');poly([[0,-90],[28,-30],[28,50],[-28,50],[-28,-30]],'#eee');poly([[0,-90],[22,-42],[-22,-42]],'#e74c3c');circ(0,-5,14,'#4aa8ec');circ(0,-5,14,'rgba(255,255,255,.15)');g.restore();
  }else if(i===5){ // nông trại
    let sk=g.createLinearGradient(0,0,0,450);sk.addColorStop(0,'#6fc2ff');sk.addColorStop(1,'#eaf8ff');rect(0,0,720,720,sk);
    let sg=g.createRadialGradient(110,100,10,110,100,130);sg.addColorStop(0,'rgba(255,240,150,1)');sg.addColorStop(1,'rgba(255,240,150,0)');rect(0,0,400,300,sg);circ(110,100,46,'#fff3a0');
    [[420,90,1],[560,170,.7],[260,200,.6]].forEach(([x,y,s])=>[[0,0,34],[36,-12,30],[72,0,32],[36,10,32]].forEach(([dx,dy,r])=>circ(x+dx*s,y+dy*s,r*s,'rgba(255,255,255,.95)')));
    g.fillStyle='#8cc66a';g.beginPath();g.moveTo(0,400);g.bezierCurveTo(150,320,300,380,450,340);g.bezierCurveTo(580,310,650,350,720,330);g.lineTo(720,500);g.lineTo(0,500);g.fill();

    for(let k=0;k<6;k++)rect(0,480+k*40,720,40,k%2?'#4f9a3f':'#5aa748');

    [285,395].forEach(x=>{rect(x,365,40,40,'#8fd3ff');rect(x+18,365,4,40,'#fff');rect(x,383,40,4,'#fff')});
    for(let k=0;k<14;k++)rect(k*55+10,505,10,60,'#fff');rect(0,520,720,8,'#fff');rect(0,545,720,8,'#fff');
    [[80,670],[190,690],[560,680],[650,660],[370,700]].forEach(([x,y])=>{rect(x-3,y-90,6,90,'#2e8b3a');for(let k=0;k<12;k++)circ(x+Math.cos(k*.52)*24,y-100+Math.sin(k*.52)*24,11,'#ffcc1a');circ(x,y-100,16,'#6b3f19')});
  }else if(i===6){ // khảm tam giác
    const N=15,P=[];for(let y=0;y<=N;y++){P[y]=[];for(let x=0;x<=N;x++)P[y][x]=[x*48+(x&&x<N?(R()-.5)*30:0),y*48+(y&&y<N?(R()-.5)*30:0)]}

}
function setPic(){
  if(!S.urls[S.pic])S.urls[S.pic]=drawScene(S.pic);
  board.style.setProperty('--img',`url("${S.urls[S.pic]}")`);
}

/* ===== BOARD ===== */
const LAST=()=>S.n*S.n-1;
function build(){
  const n=S.n;board.innerHTML='';board.style.setProperty('--n',n);S.tiles=[];
  for(let id=0;id<n*n;id++){
    const t=document.createElement('div');t.className='t';
    t.style.backgroundPosition=`${(id%n)/(n-1)*100}% ${Math.floor(id/n)/(n-1)*100}%`;
    t.innerHTML=`<span>${id+1}</span>`;board.appendChild(t);S.tiles[id]=t;
  }
  S.tiles[LAST()].classList.add('miss');
  const pv=document.createElement('div');pv.id='pv';board.appendChild(pv);
}
function place(){
  const n=S.n;
  S.grid.forEach((id,idx)=>{const t=S.tiles[id];t.style.left=(idx%n)*100/n+'%';t.style.top=Math.floor(idx/n)*100/n+'%'});
}
function isSolved(){return S.grid.every((id,i)=>id===i)}
function shuffle(){
  const n=S.n;
  do{
    S.grid=[...Array(n*n).keys()];S.er=S.ec=n-1;let prev=-1;
    for(let k=0;k<n*n*CFG.SHUFFLE_FACTOR;k++){
      const e=S.er*n+S.ec,opts=[];
      if(S.er>0)opts.push(e-n);if(S.er<n-1)opts.push(e+n);if(S.ec>0)opts.push(e-1);if(S.ec<n-1)opts.push(e+1);
      const cand=opts.filter(o=>o!==prev),to=cand[Math.floor(Math.random()*cand.length)];
      [S.grid[e],S.grid[to]]=[S.grid[to],S.grid[e]];prev=e;S.er=Math.floor(to/n);S.ec=to%n;
    }
  }while(isSolved());
}

/* ===== GAMEPLAY ===== */
function moveTile(r,c){
  if(S.status!=='ready'&&S.status!=='playing')return false;
  const n=S.n;
  if(r<0||c<0||r>=n||c>=n||(r===S.er&&c===S.ec)||(r!==S.er&&c!==S.ec))return false;
  if(S.status==='ready'){S.status='playing';S.last=performance.now()}
  const sr=Math.sign(r-S.er),sc=Math.sign(c-S.ec);
  while(S.er!==r||S.ec!==c){
    const nr=S.er+sr,nc=S.ec+sc,a=S.er*n+S.ec,b=nr*n+nc;
    [S.grid[a],S.grid[b]]=[S.grid[b],S.grid[a]];S.er=nr;S.ec=nc;
  }
  S.moves++;place();ui();
  if(isSolved())finish();
  return true;
}
// dx,dy = hướng mảnh trượt
function moveDir(dx,dy){moveTile(S.er-dy,S.ec-dx)}

function finish(){
  S.status='revealing';
  const t=S.tiles[LAST()];t.classList.remove('miss');board.classList.add('done');
  winTimer=setTimeout(showWin,CFG.REVEAL_MS);
}
function showWin(){
  S.status='won';
  const time=Math.max(1,Math.round(S.elapsed/1000)),old=loadBest(S.n);
  const nb={moves:old?Math.min(old.moves,S.moves):S.moves,time:old?Math.min(old.time,time):time};
  const rec=!old||S.moves<old.moves||time<old.time;
  saveBest(S.n,nb);
  $('#mt').textContent='Thời gian: '+fmt(S.elapsed);
  $('#mm').textContent='Số lượt: '+S.moves;
  $('#mb').textContent=rec?'🏆 Kỷ lục mới!':'Kỷ lục: '+nb.moves+' lượt · '+fmt(nb.time*1000);
  modal.classList.add('show');ui();
}

function newGame(){
  clearTimeout(winTimer);modal.classList.remove('show');board.classList.remove('done');
  S.moves=0;S.elapsed=0;S.status='ready';
  build();setPic();shuffle();place();ui();
}

/* ===== UI ===== */
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function ui(){
  $('#time').textContent=fmt(S.elapsed);$('#moves').textContent=S.moves;
  const b=loadBest(S.n);$('#best').textContent=b?b.moves+' lượt':'-';
  document.querySelectorAll('.sz').forEach(x=>x.classList.toggle('on',+x.dataset.n===S.n));
}
setInterval(()=>{ // chỉ đồng hồ hiển thị; clamp để tab nền không cộng giờ
  if(S.status!=='playing')return;
  const now=performance.now();S.elapsed+=Math.min(now-S.last,500);S.last=now;
  $('#time').textContent=fmt(S.elapsed);
},250);

/* ===== INPUT ===== */
let ptr=null;
board.addEventListener('pointerdown',e=>{ptr={id:e.pointerId,x:e.clientX,y:e.clientY};board.setPointerCapture(e.pointerId)});
board.addEventListener('pointerup',e=>{
  if(!ptr||ptr.id!==e.pointerId)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr=null;
  if(Math.hypot(dx,dy)<14){
    const r=board.getBoundingClientRect(),n=S.n;
    moveTile(Math.floor((e.clientY-r.top)/r.height*n),Math.floor((e.clientX-r.left)/r.width*n));
  }else if(Math.abs(dx)>Math.abs(dy))moveDir(Math.sign(dx),0);else moveDir(0,Math.sign(dy));
});
board.addEventListener('pointercancel',()=>{ptr=null});
board.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){e.preventDefault();moveDir(m[0],m[1])}
});
document.querySelectorAll('.sz').forEach(b=>b.addEventListener('click',()=>{S.n=+b.dataset.n;newGame()}));
$('#bShuffle').addEventListener('click',newGame);
$('#mAgain').addEventListener('click',newGame);
const nextPic=()=>{let p;do{p=Math.floor(Math.random()*CFG.PICS)}while(p===S.pic);S.pic=p;newGame()};
$('#bPic').addEventListener('click',nextPic);$('#mPic').addEventListener('click',nextPic);
$('#bNum').addEventListener('click',e=>{board.classList.toggle('nums');e.currentTarget.classList.toggle('on2')});
const pvBtn=$('#bPrev'),pvShow=on=>{const p=$('#pv');if(p)p.classList.toggle('on',on)};
pvBtn.addEventListener('pointerdown',()=>pvShow(true));
['pointerup','pointerleave','pointercancel'].forEach(ev=>pvBtn.addEventListener(ev,()=>pvShow(false)));
document.addEventListener('dblclick',e=>e.preventDefault());

newGame();
</script>
