<style>
:root{--wall:#efe3cc;--wall2:#e4d4b6;--ink:#2e2418;--muted:#7a6650;--gold1:#e9c46a;--gold2:#a87a24;--gold3:#6e4c12;--mat:#f7f0e0;--accent:#b5452c;--n:4;
  box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;background:var(--wall)}
/* tường phòng tranh: giấy dán tường sọc mờ + chân tường gỗ */
body{background:
  linear-gradient(180deg,rgba(0,0,0,0) calc(100% - 34px),#7a4e2a calc(100% - 34px),#7a4e2a calc(100% - 30px),#9a6638 calc(100% - 30px),#8a5a30 100%),
  repeating-linear-gradient(90deg,var(--wall) 0 28px,var(--wall2) 28px 30px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 12px}
.top{display:flex;align-items:center;justify-content:space-between;width:min(100%,560px);gap:12px}
.brand{display:flex;flex-direction:column;line-height:1}
.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:30px;color:var(--ink)}
/* ảnh mẫu nhỏ ghim trên tường: giữ để xem tranh gốc phủ lên bàn */
.thumb{flex:none;position:relative;width:64px;height:76px;padding:5px 5px 16px;background:#fffdf8;border:0;border-radius:2px;box-shadow:0 4px 10px rgba(60,40,10,.3);transform:rotate(4deg);cursor:pointer;touch-action:manipulation}
.thumb i{display:block;width:100%;height:100%;background-image:var(--img);background-size:cover;border:1px solid rgba(0,0,0,.15)}
.thumb small{position:absolute;left:0;right:0;bottom:2px;font-size:9px;color:var(--muted);text-align:center}
.thumb::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b5452c);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.thumb:active{filter:brightness(.92)}
.hang{position:relative}
.frame{padding:12px;border-radius:4px;background:linear-gradient(135deg,var(--gold1),var(--gold2) 45%,var(--gold1) 70%,var(--gold3));
  box-shadow:0 14px 26px rgba(60,35,10,.38),inset 0 0 0 2px rgba(255,240,190,.5),inset 0 0 0 6px rgba(110,76,18,.35)}
.mat{padding:8px;background:var(--mat);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
#board{--s:min(84vw,calc(100vh - 372px),520px);position:relative;width:var(--s);height:var(--s);background:#3a2e22;overflow:hidden;touch-action:none;box-shadow:inset 0 0 10px #000}
.t{position:absolute;width:calc(100% / var(--n));height:calc(100% / var(--n));background-image:var(--img);background-size:calc(var(--n)*100%) calc(var(--n)*100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 2px 2px 0 rgba(255,255,255,.2);transition:left .15s ease,top .15s ease,opacity .5s;pointer-events:none}
.t.miss{opacity:0}
.t span{display:none;position:absolute;left:4px;top:3px;font-size:calc(var(--s)/(var(--n)*4.2));font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
#board.nums .t span{display:block}
#board.done .t{box-shadow:none}
#pv{position:absolute;inset:0;background-image:var(--img);background-size:100% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#pv.on{opacity:1}
/* thẻ chú thích kiểu bảo tàng dưới tranh */
.label{width:min(100%,400px);background:#fbf7ee;border-radius:3px;padding:8px 14px 9px;box-shadow:0 3px 8px rgba(60,40,10,.22);border-left:4px solid var(--accent)}
.ltitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid #e2d6bf;padding-bottom:4px;margin-bottom:5px}
.ltitle em{font-family:Georgia,serif;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltitle span{font-size:12px;color:var(--muted);white-space:nowrap}
.stats{display:flex;margin:0;gap:4px}
.stats div{flex:1}
.stats dt{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ctrl{display:flex;flex-direction:column;gap:8px;width:min(100%,400px)}
.sizes{display:flex;gap:6px;justify-content:center}
.sizes button{flex:1;min-height:40px;background:rgba(255,252,244,.7);color:var(--ink);border:2px solid rgba(110,76,18,.45);border-radius:3px;box-shadow:none;font-size:13px}
.sizes button.on{background:linear-gradient(135deg,var(--gold1),var(--gold2));border-color:var(--gold3);color:#2a1a00}
.acts{display:flex;gap:8px}
button{font:inherit;font-weight:700;font-size:14px;min-height:46px;border:0;border-radius:8px;color:#fff8ea;background:#6b4a2e;box-shadow:0 3px 0 #3e2a18;cursor:pointer;touch-action:manipulation;flex:1}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #3e2a18}
button.main{background:var(--accent);box-shadow:0 3px 0 #7a2a18;flex:1.4}
button.on2{background:#2f6f8a;box-shadow:0 3px 0 #1c4556}
#modal{position:fixed;inset:0;background:rgba(30,20,8,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal.show{display:flex}
.card{background:#fbf7ee;border:6px solid var(--gold2);outline:2px solid var(--gold1);outline-offset:-10px;border-radius:4px;padding:24px 22px 20px;width:min(86vw,340px);text-align:center;animation:pop .35s ease;color:var(--ink)}
.card h2{margin:0 0 8px;color:var(--accent);font-family:Georgia,serif;font-style:italic;font-size:28px}
.card p{margin:4px 0}
.card .acts{margin-top:14px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
footer{position:fixed;bottom:5px;left:10px;font-size:10px;color:#f3e2c4;opacity:.7;font-family:monospace;pointer-events:none}
/* màn ngang thấp: tranh treo bên trái, cột phải là tên + thẻ chú thích + điều khiển */
@media (orientation:landscape) and (max-height:560px){
  body{display:grid;grid-template-columns:auto minmax(0,330px);grid-template-rows:1fr auto auto auto 1fr;grid-template-areas:"f ." "f t" "f l" "f c" "f .";align-content:center;justify-content:center;column-gap:26px;row-gap:10px;
    padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
    background:linear-gradient(180deg,rgba(0,0,0,0) calc(100% - 22px),#7a4e2a calc(100% - 22px),#9a6638 calc(100% - 19px),#8a5a30 100%),repeating-linear-gradient(90deg,var(--wall) 0 28px,var(--wall2) 28px 30px)}
  .top{grid-area:t;width:100%}
  h1{font-size:24px}
  .hang{grid-area:f;align-self:center}
  .frame{padding:8px}.mat{padding:5px}
  .label{grid-area:l;width:100%}
  .ctrl{grid-area:c;width:100%}
  #board{--s:min(calc(100vh - 48px),calc(100vw - 420px),520px)}
  button{min-height:40px}.sizes button{min-height:34px}
  .thumb{width:54px;height:64px}
}

<style id="fx-gheptranh">
/* mảnh trượt có quán tính (vượt nhẹ rồi về chỗ) */
.t{transition:left .24s cubic-bezier(.3,1.35,.5,1),top .24s cubic-bezier(.3,1.35,.5,1),box-shadow .2s,opacity .5s !important}
@keyframes tileSquash{0%{transform:scale(1)}40%{transform:scale(1.07,.93)}100%{transform:none}}
.t.slid{animation:tileSquash .3s .18s ease-out}
@keyframes tileOk{0%{filter:none}40%{filter:brightness(1.35)}100%{filter:none}}
.t.ok{animation:tileOk .5s ease-out}
@keyframes tileShine{0%{transform:none;filter:none}40%{transform:scale(1.1);filter:brightness(1.5) saturate(1.3)}100%{transform:none;filter:none}}
#board.done .t{animation:tileShine .6s ease-out both;animation-delay:calc(var(--sd,0) * 70ms)}
@keyframes tileDeal{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.t.slid,.t.ok,#board.done .t{animation:none}.t{transition:none !important}}
</style>

<header class="top">
  <div class="brand"><span class="eyebrow">Phòng tranh</span><h1>Ghép tranh</h1></div>
  <button class="thumb" id="bPrev" aria-label="Giữ để xem tranh gốc"><i></i><small>giữ để xem</small></button>

<script>
/* ===== CONFIG ===== */
const CFG={SHUFFLE_FACTOR:30,REVEAL_MS:1500,PIC_SIZE:720,PICS:15,KEY:'ghepTranh.best.'};
const NAMES=['Hồ trên núi','Thành phố đêm','Đáy đại dương','Sa mạc hoàng hôn','Vũ trụ','Nông trại','Ruộng bậc thang','Phố đèn lồng','Đầm sen','Vịnh đá vôi','Mèo bên cửa sổ','Cầu vồng','Khinh khí cầu','Hải đăng','Cánh cụt và cực quang'];

/* ===== STATE (single source of truth) ===== */
const S={n:4,grid:[],er:0,ec:0,moves:0,elapsed:0,last:0,status:'ready',pic:Math.floor(Math.random()*CFG.PICS),tiles:[],urls:[]};
let winTimer=0;

const $=s=>document.querySelector(s);
const board=$('#board'),modal=$('#modal');

/* ===== STORAGE ===== */
function loadBest(n){try{const v=JSON.parse(localStorage.getItem(CFG.KEY+n));if(v&&v.moves>0&&v.time>0)return v}catch(e){}return null}
function saveBest(n,v){try{localStorage.setItem(CFG.KEY+n,JSON.stringify(v))}catch(e){}}

/* ===== PICTURES (drawn procedurally) ===== */
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
function drawScene(i){
  const c=document.createElement('canvas');c.width=c.height=CFG.PIC_SIZE;const g=c.getContext('2d');
  const rect=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
  const poly=(p,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>g.lineTo(q[0],q[1]));g.closePath();g.fill()};
  const circ=(x,y,r,col)=>{g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
  const R=rng(7+i*13);const hsl=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
  if(i===0){
    let sky=g.createLinearGradient(0,0,0,430);sky.addColorStop(0,'#3f9fe8');sky.addColorStop(1,'#ffe9b8');rect(0,0,720,720,sky);
    let sg=g.createRadialGradient(560,140,10,560,140,150);sg.addColorStop(0,'rgba(255,240,150,1)');sg.addColorStop(1,'rgba(255,220,120,0)');rect(0,0,720,420,sg);
    circ(560,140,46,'#fff3b0');
    const cloud=(x,y,s)=>[[0,0,60],[50,-15,50],[100,0,55],[45,12,55]].forEach(([dx,dy,r])=>circ(x+dx*s,y+dy*s,r*s*.6,'rgba(255,255,255,.93)'));
    cloud(60,90,1.1);cloud(330,210,.8);cloud(400,70,.6);
    poly([[0,430],[90,300],[170,370],[290,220],[420,380],[520,300],[640,390],[720,330],[720,470],[0,470]],'#7b8fc2');
    poly([[290,220],[252,268],[280,258],[302,280],[324,258],[344,270]],'#fff');
    poly([[90,300],[66,330],[90,322],[112,334]],'#fff');
    poly([[0,450],[120,350],[230,430],[360,330],[500,440],[620,370],[720,450],[720,480],[0,480]],'#4a6a8f');
    g.fillStyle='#4f9d5b';g.beginPath();g.moveTo(0,470);g.quadraticCurveTo(180,400,360,470);g.quadraticCurveTo(540,410,720,470);g.lineTo(720,490);g.lineTo(0,490);g.fill();
    let lk=g.createLinearGradient(0,470,0,720);lk.addColorStop(0,'#62c0ee');lk.addColorStop(1,'#1c6aa5');rect(0,480,720,240,lk);
    for(let k=0;k<7;k++){const w=110-k*12;rect(560-w/2,495+k*26,w,6,'rgba(255,255,255,.35)')}
    poly([[250,590],[400,590],[372,626],[280,626]],'#c0392b');rect(322,488,5,102,'#5a3a1e');
    poly([[331,494],[331,585],[396,585]],'#fff');poly([[319,506],[319,585],[262,585]],'#ffd9a0');poly([[327,488],[352,495],[327,502]],'#e74c3c');
    poly([[0,560],[150,540],[230,720],[0,720]],'#3f8a4c');poly([[720,600],[600,640],[556,720],[720,720]],'#3f8a4c');
    const tree=(x,y,s)=>{rect(x-5*s,y,10*s,40*s,'#5a3a1e');[0,22,44].forEach((o,k)=>poly([[x-(46-k*8)*s,y+(10+o*.9)*s],[x,y-(50-o)*s],[x+(46-k*8)*s,y+(10+o*.9)*s]],'#1f6b3a'))};
    tree(60,545,1.3);tree(150,570,1);tree(665,615,1.1);
    for(let k=0;k<45;k++){const left=R()<.6,x=left?R()*190:580+R()*140,y=left?640+R()*70:660+R()*55;circ(x,y,5,['#e74c3c','#ffd23f','#fff'][k%3])}
    g.strokeStyle='#223';g.lineWidth=3;[[120,60],[170,110],[470,150]].forEach(([x,y])=>{g.beginPath();g.arc(x-9,y,10,3.3,5.9);g.arc(x+9,y,10,3.5,6.1);g.stroke()});
  }else if(i===1){
    let sky=g.createLinearGradient(0,0,0,640);sky.addColorStop(0,'#080c2a');sky.addColorStop(.6,'#3a1f5c');sky.addColorStop(1,'#d2607e');rect(0,0,720,720,sky);
    for(let k=0;k<130;k++)circ(R()*720,R()*420,R()*1.8+.4,`rgba(255,255,255,${.4+R()*.6})`);
    let mg=g.createRadialGradient(190,170,60,190,170,190);mg.addColorStop(0,'rgba(255,250,210,.5)');mg.addColorStop(1,'rgba(255,250,210,0)');rect(0,0,500,420,mg);
    circ(190,170,72,'#f5f1d8');[[165,150,16],[215,190,12],[180,205,9],[222,145,8]].forEach(([x,y,r])=>circ(x,y,r,'rgba(120,110,80,.22)'));
    const city=(col,hmin,hmax,wmin,win)=>{let x=-10;while(x<720){const w=wmin+R()*40,h=hmin+R()*(hmax-hmin);rect(x,640-h,w,h,col);
      if(win)for(let wy=640-h+14;wy<620;wy+=22)for(let wx=x+8;wx<x+w-10;wx+=18)if(R()<.45)rect(wx,wy,8,11,R()<.8?'#ffd36b':'#8fd0ff');x+=w+2}};
    city('#2a2155',100,260,50,false);city('#141731',120,330,46,true);
    rect(500,250,6,100,'#141731');circ(503,246,6,'#ff3b3b');
    let wt=g.createLinearGradient(0,640,0,720);wt.addColorStop(0,'#1a1840');wt.addColorStop(1,'#07091c');rect(0,640,720,80,wt);
    for(let k=0;k<6;k++){const w=90-k*11;rect(190-w/2,652+k*11,w,4,'rgba(245,241,216,.45)')}
    for(let k=0;k<12;k++)rect(R()*680,655+R()*55,30+R()*30,3,'rgba(255,211,107,.35)');
  }else if(i===2){ // đại dương
    let w=g.createLinearGradient(0,0,0,720);w.addColorStop(0,'#3cc8ea');w.addColorStop(1,'#0a3470');rect(0,0,720,720,w);
    for(let k=0;k<5;k++)poly([[100+k*140,0],[160+k*140,0],[90+k*140,640],[-20+k*140,640]],'rgba(255,255,255,.07)');
    g.fillStyle='#e8cf8e';g.beginPath();g.moveTo(0,650);g.quadraticCurveTo(180,600,360,650);g.quadraticCurveTo(540,700,720,630);g.lineTo(720,720);g.lineTo(0,720);g.fill();
    g.lineWidth=9;g.strokeStyle='#2e9e5a';for(let k=0;k<9;k++){const x=40+k*85;g.beginPath();g.moveTo(x,665);g.bezierCurveTo(x-30,610,x+30,570,x,510+R()*40);g.stroke()}
    g.lineCap='round';g.lineWidth=12;[[560,650,'#ff6b81'],[610,640,'#ff9f43'],[150,665,'#ee5a9b']].forEach(([x,y,col])=>{g.strokeStyle=col;for(let k=0;k<7;k++){g.beginPath();g.moveTo(x,y);g.lineTo(x-45+k*15,y-70-(k%3)*20);g.stroke()}});g.lineCap='butt';
    const fish=(x,y,s,col,d)=>{g.save();g.translate(x,y);g.scale(d*s,s);circ(0,0,0,col);g.beginPath();g.ellipse(0,0,45,24,0,0,7);g.fill();poly([[-35,0],[-75,-24],[-75,24]],col);circ(22,-5,5,'#fff');circ(24,-5,2.5,'#111');rect(-5,-22,8,44,'rgba(255,255,255,.35)');g.restore()};
    fish(220,200,1.3,'#ff9f1a',1);fish(500,300,1,'#f7d84a',-1);fish(360,470,.9,'#ff5e7e',1);fish(120,380,.7,'#7bed9f',-1);fish(580,150,.8,'#a29bfe',1);
    g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=2;for(let k=0;k<25;k++){g.beginPath();g.arc(R()*720,R()*600,4+R()*10,0,7);g.stroke()}
    poly(Array.from({length:10},(_,k)=>[380+Math.cos(k*Math.PI/5-1.57)*(k%2?10:26),668+Math.sin(k*Math.PI/5-1.57)*(k%2?10:26)]),'#ff7f50');
  }else if(i===3){ // sa mạc hoàng hôn
    let sk=g.createLinearGradient(0,0,0,500);sk.addColorStop(0,'#2b1a5a');sk.addColorStop(.6,'#e0553d');sk.addColorStop(1,'#ffd27a');rect(0,0,720,720,sk);
    for(let k=0;k<40;k++)circ(R()*720,R()*220,R()*1.5+.3,'rgba(255,255,255,.8)');
    let sg=g.createRadialGradient(360,500,20,360,500,270);sg.addColorStop(0,'rgba(255,230,150,.9)');sg.addColorStop(1,'rgba(255,230,150,0)');rect(0,200,720,320,sg);circ(360,500,90,'#fff1b0');
    poly([[120,510],[230,380],[340,510]],'#7a2e1b');poly([[230,380],[340,510],[270,510]],'#5e2112');poly([[400,510],[470,420],[540,510]],'#7a2e1b');

    poly([[560,520],[660,520],[640,550],[580,550]],'#8a3a2a');rect(608,450,4,70,'#333');poly([[612,455],[612,515],[650,515]],'#fff');
    poly([[275,215],[720,140],[720,290]],'rgba(255,240,150,.35)');
    poly([[0,520],[120,470],[300,500],[380,720],[0,720]],'#4a3b36');poly([[0,600],[140,560],[260,600],[320,720],[0,720]],'#3a2e2a');
    const xl=y=>210-(y-230)*20/240,xr=y=>270+(y-230)*20/240;

    [[255,300],[340,380],[425,470]].forEach(([a,b])=>poly([[xl(a),a],[xr(a),a],[xr(b),b],[xl(b),b]],'#d63031'));
    rect(198,226,84,8,'#333');rect(206,196,68,30,'#ffd23f');rect(206,196,68,30,'rgba(255,255,255,.2)');poly([[194,198],[286,198],[240,156]],'#d63031');rect(232,420,16,30,'#5a3a1e');
    g.strokeStyle='#223';g.lineWidth=3;[[420,120],[480,80]].forEach(([x,y])=>{g.beginPath();g.arc(x-9,y,10,3.3,5.9);g.arc(x+9,y,10,3.5,6.1);g.stroke()});
  }else{ // chim cánh cụt + cực quang (trung bình)
    let sk=g.createLinearGradient(0,0,0,520);sk.addColorStop(0,'#050b2a');sk.addColorStop(1,'#0d2a4a');rect(0,0,720,720,sk);
    for(let k=0;k<70;k++)circ(R()*720,R()*400,R()*1.5+.3,'rgba(255,255,255,.8)');
    ['rgba(60,255,160,.35)','rgba(60,200,255,.3)','rgba(170,90,255,.3)'].forEach((col,k)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,130+k*50);g.bezierCurveTo(200,30+k*40,400,230,720,100+k*40);g.lineTo(720,210+k*40);g.bezierCurveTo(400,340,200,140,0,240+k*50);g.fill()});
    poly([[0,520],[120,400],[240,500],[400,380],[560,500],[720,420],[720,540],[0,540]],'#9ec5e6');poly([[400,380],[360,430],[395,420],[420,440],[445,420]],'#fff');
    g.fillStyle='#e8f6ff';g.beginPath();g.moveTo(0,540);g.quadraticCurveTo(360,500,720,540);g.lineTo(720,720);g.lineTo(0,720);g.fill();
    poly([[270,420],[235,530],[290,500]],'#1a1a2e');poly([[450,420],[485,530],[430,500]],'#1a1a2e');
    g.fillStyle='#1a1a2e';g.beginPath();g.ellipse(360,440,95,150,0,0,7);g.fill();
    g.fillStyle='#fff';g.beginPath();g.ellipse(360,470,62,110,0,0,7);g.fill();
    g.fillStyle='#ff9f1a';[[320,598],[400,598]].forEach(([x,y])=>{g.beginPath();g.ellipse(x,y,36,14,0,0,7);g.fill()});
    circ(332,350,15,'#fff');circ(388,350,15,'#fff');circ(334,352,7,'#111');circ(386,352,7,'#111');
    poly([[342,372],[378,372],[360,402]],'#ff9f1a');circ(310,375,10,'rgba(255,120,150,.6)');circ(410,375,10,'rgba(255,120,150,.6)');
    for(let k=0;k<50;k++)circ(R()*720,R()*720,2,'rgba(255,255,255,.75)');
  }
  return c.toDataURL('image/jpeg',.92);
}
function setPic(){
  if(!S.urls[S.pic])S.urls[S.pic]=drawScene(S.pic);
  document.documentElement.style.setProperty('--img',`url("${S.urls[S.pic]}")`);
  $('#picName').textContent=NAMES[S.pic]||'';
}

/* ===== BOARD ===== */
const LAST=()=>S.n*S.n-1;
function build(){
  const n=S.n;board.innerHTML='';board.style.setProperty('--n',n);S.tiles=[];
  for(let id=0;id<n*n;id++){
    const t=document.createElement('div');t.className='t';
    t.style.backgroundPosition=`${(id%n)/(n-1)*100}% ${Math.floor(id/n)/(n-1)*100}%`;
    t.innerHTML=`<span>${id+1}</span>`;board.appendChild(t);S.tiles[id]=t;
  }
  S.tiles[LAST()].classList.add('miss');
  const pv=document.createElement('div');pv.id='pv';board.appendChild(pv);
}
function place(){
  const n=S.n;
  S.grid.forEach((id,idx)=>{const t=S.tiles[id];t.style.left=(idx%n)*100/n+'%';t.style.top=Math.floor(idx/n)*100/n+'%'});
}
function isSolved(){return S.grid.every((id,i)=>id===i)}
function shuffle(){
  const n=S.n;
  do{
    S.grid=[...Array(n*n).keys()];S.er=S.ec=n-1;let prev=-1;
    for(let k=0;k<n*n*CFG.SHUFFLE_FACTOR;k++){
      const e=S.er*n+S.ec,opts=[];
      if(S.er>0)opts.push(e-n);if(S.er<n-1)opts.push(e+n);if(S.ec>0)opts.push(e-1);if(S.ec<n-1)opts.push(e+1);
      const cand=opts.filter(o=>o!==prev),to=cand[Math.floor(Math.random()*cand.length)];
      [S.grid[e],S.grid[to]]=[S.grid[to],S.grid[e]];prev=e;S.er=Math.floor(to/n);S.ec=to%n;
    }
  }while(isSolved());
}

/* ===== GAMEPLAY ===== */
function moveTile(r,c){
  if(S.status!=='ready'&&S.status!=='playing')return false;
  const n=S.n;
  if(r<0||c<0||r>=n||c>=n||(r===S.er&&c===S.ec)||(r!==S.er&&c!==S.ec))return false;
  if(S.status==='ready'){S.status='playing';S.last=performance.now()}
  const before=S.grid.slice();
  const sr=Math.sign(r-S.er),sc=Math.sign(c-S.ec);
  while(S.er!==r||S.ec!==c){
    const nr=S.er+sr,nc=S.ec+sc,a=S.er*n+S.ec,b=nr*n+nc;
    [S.grid[a],S.grid[b]]=[S.grid[b],S.grid[a]];S.er=nr;S.ec=nc;
  }
  S.moves++;place();ui();
  if(window.SFX){let k=0;S.grid.forEach((id,idx)=>{if(before[idx]!==id&&id===idx)k++});SFX.play('move',{pitch:.9+Math.random()*.2});if(k)setTimeout(()=>SFX.play('pick',{pitch:1+Math.min(k,4)*.06}),120)}
  try{
    S.grid.forEach((id,idx)=>{
      if(before[idx]===id)return;
      const t=S.tiles[id];t.classList.remove('slid','ok');void t.offsetWidth;t.classList.add('slid');
      if(id===idx)t.classList.add('ok');   // về đúng chỗ thì sáng lên
      setTimeout(()=>{const q=FX.center(t);FX.burst(q.x,q.y+t.offsetHeight*.35,{n:4,colors:['#ffffff','#d8c8a8'],speed:70,spread:2.2,angle:-1.57,gravity:60,drag:2,size:5,life:.4});if(id===idx)FX.ring(q.x,q.y,'#ffe27a',t.offsetWidth*.7,3)},210);
    });
  }catch(e){}
  if(isSolved())finish();
  return true;
}
// dx,dy = hướng mảnh trượt
function moveDir(dx,dy){moveTile(S.er-dy,S.ec-dx)}

function finish(){
  S.status='revealing';
  if(window.SFX)setTimeout(()=>SFX.play('win'),300);
  const t=S.tiles[LAST()];t.classList.remove('miss');board.classList.add('done');
  try{
    const n=S.n;S.tiles.forEach((tt,id)=>{tt.style.setProperty('--sd',(id%n)+Math.floor(id/n));});
    const q=FX.center(board);
    setTimeout(()=>{FX.ring(q.x,q.y,'#ffe27a',Math.max(board.offsetWidth,board.offsetHeight)*.7,6);FX.burst(q.x,q.y,{n:46,colors:['#ffe27a','#ffffff','#7dd3fc','#f9a8d4'],shapes:['star','circle'],speed:440,gravity:300,size:10,life:1.1});FX.rain({n:60,colors:['#ffe27a','#7dd3fc','#f9a8d4','#a7f3d0'],shapes:['square','tri'],size:10});},(n*2-2)*70+100);
  }catch(e){}
  winTimer=setTimeout(showWin,CFG.REVEAL_MS);
}
function showWin(){
  S.status='won';
  const time=Math.max(1,Math.round(S.elapsed/1000)),old=loadBest(S.n);
  // kỷ lục là cặp (lượt, thời gian) của cùng một ván: ưu tiên ít lượt, bằng lượt thì ít thời gian
  const rec=!old||S.moves<old.moves||(S.moves===old.moves&&time<old.time);
  const nb=rec?{moves:S.moves,time:time}:old;
  if(rec)saveBest(S.n,nb);
  S.elapsed=time*1000;   // thời gian hiển thị khớp với giá trị được lưu
  $('#mt').textContent='Thời gian: '+fmt(S.elapsed);
  $('#mm').textContent='Số lượt: '+S.moves;
  $('#mb').textContent=rec?' Kỷ lục mới!':'Kỷ lục: '+nb.moves+' lượt · '+fmt(nb.time*1000);
  modal.classList.add('show');ui();
}

function newGame(){
  clearTimeout(winTimer);modal.classList.remove('show');board.classList.remove('done');
  S.moves=0;S.elapsed=0;S.status='ready';
  build();setPic();shuffle();place();ui();
}

/* ===== UI ===== */
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function ui(){
  $('#time').textContent=fmt(S.elapsed);$('#moves').textContent=S.moves;
  const b=loadBest(S.n);$('#best').textContent=b?b.moves+' lượt':'-';
  document.querySelectorAll('.sz').forEach(x=>x.classList.toggle('on',+x.dataset.n===S.n));
  $('#sizeTxt').textContent=S.n+'×'+S.n+' · '+(S.n*S.n-1)+' mảnh';
}
setInterval(()=>{ // chỉ đồng hồ hiển thị; clamp để tab nền không cộng giờ
  if(S.status!=='playing')return;
  const now=performance.now();S.elapsed+=Math.min(now-S.last,500);S.last=now;
  $('#time').textContent=fmt(S.elapsed);
},250);

/* ===== INPUT ===== */
let ptr=null;
board.addEventListener('pointerdown',e=>{ptr={id:e.pointerId,x:e.clientX,y:e.clientY};board.setPointerCapture(e.pointerId)});
board.addEventListener('pointerup',e=>{
  if(!ptr||ptr.id!==e.pointerId)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr=null;
  if(Math.hypot(dx,dy)<14){
    const r=board.getBoundingClientRect(),n=S.n;
    moveTile(Math.floor((e.clientY-r.top)/r.height*n),Math.floor((e.clientX-r.left)/r.width*n));
  }else if(Math.abs(dx)>Math.abs(dy))moveDir(Math.sign(dx),0);else moveDir(0,Math.sign(dy));
});
board.addEventListener('pointercancel',()=>{ptr=null});
board.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){e.preventDefault();moveDir(m[0],m[1])}
});
document.querySelectorAll('.sz').forEach(b=>b.addEventListener('click',()=>{S.n=+b.dataset.n;newGame()}));
$('#bShuffle').addEventListener('click',newGame);
$('#mAgain').addEventListener('click',newGame);
const nextPic=()=>{let p;do{p=Math.floor(Math.random()*CFG.PICS)}while(p===S.pic);S.pic=p;newGame()};
$('#bPic').addEventListener('click',nextPic);$('#mPic').addEventListener('click',nextPic);
$('#bNum').addEventListener('click',e=>{board.classList.toggle('nums');e.currentTarget.classList.toggle('on2')});
const pvBtn=$('#bPrev'),pvShow=on=>{const p=$('#pv');if(p)p.classList.toggle('on',on)};
pvBtn.addEventListener('pointerdown',()=>pvShow(true));
['pointerup','pointerleave','pointercancel'].forEach(ev=>pvBtn.addEventListener(ev,()=>pvShow(false)));
document.addEventListener('dblclick',e=>e.preventDefault());

newGame();
</script>
