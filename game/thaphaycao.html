<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<script src="../maintenance.js" data-game="thaphaycao"></script>
<script src="../scene.js" data-game="thaphaycao"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f0e8">
<title>Thấp hay cao</title>
<style>
  :root {
    --bg: #f5f0e8;
    --ink: #1a1a2e;
    --blue: #3a7bd5;
    --red: #c0392b;
    --green: #2a9d8f;
    --gold: #d4a017;
    --dash: #bbb;
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }

  /* Không dùng 100vh: trên iOS Safari 100vh cao hơn vùng nhìn thấy (thanh địa chỉ/thanh công cụ che mất đáy màn hình).
     Khung trò chơi bám theo vùng nhìn thấy bằng position: fixed + inset: 0. */
  body {
    font-family: Tahoma, sans-serif;
    background: var(--bg);
    position: fixed;
    inset: 0;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(0,0,0,0.032) 28px, rgba(0,0,0,0.032) 29px);
    pointer-events: none;
    z-index: 0;
  }

  /* Căn giữa bằng margin:auto (không dùng justify-content:center) để khi màn hình thấp, nội dung cuộn được thay vì mất phần đầu */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .screen > :first-child { margin-top: auto; }
  .screen > :last-child  { margin-bottom: auto; }

  #start-screen {
    background: var(--bg);
    z-index: 100;
    gap: 18px;
  }

  .game-title {
    font-size: 58px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.05;
    text-align: center;
    letter-spacing: -1px;
  }

  .game-title span { color: var(--blue); }

  .title-decoration {
    font-size: 11px;
    color: #999;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .how-to {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: white;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 14px 22px;
    font-size: 14px;
    color: var(--ink);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.08);
    max-width: 320px;
    width: 100%;
  }

  .how-to-title {
    font-weight: 700;
    font-size: 13px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .how-to-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .how-to-arrow {
    font-size: 18px;
    width: 24px;
    text-align: center;
    color: var(--blue);
    font-weight: 700;
    flex-shrink: 0;
  }

  .how-to-sep { border-top: 1px dashed #eee; margin: 2px 0; }

  .box-sample {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 1px 8px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }

  .box-sample.blue  { border: 2px solid var(--blue); color: var(--blue); background: white; }
  .box-sample.red-s { border: 2px solid var(--red);  color: #111; background: #f8d7d4; }

  .best-line {
    font-size: 14px;
    color: #777;
    min-height: 20px;
    text-align: center;
  }

  .best-line b { color: var(--gold); font-size: 17px; }

  .big-btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    padding: 14px 48px;
    font-family: Tahoma, sans-serif;
    font-size: 18px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
  }

  .big-btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.2); }
  .big-btn:active { transform: translate(2px,2px);   box-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
  .big-btn.ghost  { background: white; color: var(--ink); border: 2px solid var(--ink); padding: 11px 36px; font-size: 15px; }

  #game-area {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: var(--sat) var(--sar) 0 var(--sal);
    z-index: 1;
  }

  #field {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  #danger-line {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    border-top: 2px dashed var(--dash);
    pointer-events: none;
    z-index: 10;
  }

  .tool-btn {
    position: absolute;
    top: 8px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.18);
    background: rgba(255,255,255,0.85);
    color: var(--ink);
    font-size: 17px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    font-family: Tahoma, sans-serif;
  }

  #btn-pause { right: 8px; }
  #btn-mute  { right: 56px; }
  .tool-btn:active { transform: scale(0.92); }

  .num-box {
    position: absolute;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    cursor: default;
    user-select: none;
    white-space: nowrap;
    padding: 4px 11px;
    font-size: 18px;
    opacity: 0.4;
    font-family: Tahoma, sans-serif;
    transition: transform 0.1s ease, border-width 0.1s ease, box-shadow 0.1s ease;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
  }

  .num-box.targeted {
    border-width: 4px !important;
    transform: translateX(-50%) scale(1.15) !important;
    z-index: 5;
    opacity: 1 !important;
    box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.2), 0 0 15px rgba(58, 123, 213, 0.3);
  }

  .num-box.blue-box {
    border: 2px solid var(--blue);
    background: white;
    color: var(--blue);
  }

  .num-box.red-box {
    border: 2px solid var(--red);
    background: #f8d7d4;
    color: #111;
  }

  .num-box.correct {
    background: var(--green) !important;
    border-color: var(--green) !important;
    color: white !important;
    animation: pop 0.3s ease;
  }

  .num-box.wrong {
    background: var(--red) !important;
    border-color: var(--red) !important;
    color: white !important;
    animation: shake 0.3s ease;
  }

  .num-box.rerolled { animation: flip 0.35s ease; }

  @keyframes pop {
    0%   { transform: translateX(-50%) scale(1); }
    50%  { transform: translateX(-50%) scale(1.22); }
    100% { transform: translateX(-50%) scale(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(calc(-50% + 0px)); }
    25%      { transform: translateX(calc(-50% - 7px)); }
    75%      { transform: translateX(calc(-50% + 7px)); }
  }

  @keyframes flip {
    0%   { transform: translateX(-50%) rotateX(0deg); }
    50%  { transform: translateX(-50%) rotateX(90deg); }
    100% { transform: translateX(-50%) rotateX(0deg); }
  }

  .float-pts {
    position: absolute;
    transform: translateX(-50%);
    font-weight: 700;
    font-size: 18px;
    pointer-events: none;
    z-index: 40;
    animation: floatUp 0.8s ease-out forwards;
    text-shadow: 0 1px 0 rgba(255,255,255,0.8);
  }

  @keyframes floatUp {
    0%   { opacity: 1; margin-top: 0; }
    100% { opacity: 0; margin-top: -46px; }
  }

  #bottom-panel {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--bg);
    border-top: 2px solid rgba(0,0,0,0.08);
    padding: 10px 16px calc(12px + var(--sab));
    z-index: 20;
    position: relative;
  }

  #stats-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
    max-width: 360px;
  }

  #hud {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }

  #combo-display {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    min-width: 90px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  #combo-display.on { opacity: 1; }
  #combo-display.bump { animation: pop2 0.25s ease; }

  @keyframes pop2 {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  #lives-display {
    font-size: 17px;
    letter-spacing: 1px;
    text-align: right;
    white-space: nowrap;
  }

  #speed-bar-wrap {
    width: 100%;
    max-width: 360px;
    height: 3px;
    background: rgba(0,0,0,0.08);
    border-radius: 2px;
  }

  #speed-bar {
    height: 100%;
    background: var(--blue);
    border-radius: 2px;
    width: 0%;
    transition: width 0.4s;
  }

  #player-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 360px;
  }

  .ans-btn {
    flex: 1;
    min-width: 0;
    height: 52px;
    border: 3px solid var(--ink);
    border-radius: 8px;
    background: white;
    color: var(--ink);
    font-family: Tahoma, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.18);
    transition: transform 0.08s, box-shadow 0.08s;
  }

  .ans-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(0,0,0,0.18); }
  .ans-btn.low  { border-color: var(--green); color: var(--green); }
  .ans-btn.high { border-color: var(--blue);  color: var(--blue); }

  #player-box {
    width: 86px;
    height: 52px;
    flex-shrink: 0;
    border: 3px solid var(--ink);
    border-radius: 6px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.18);
    font-family: Tahoma, sans-serif;
  }

  #swipe-hint {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 1px;
  }

  @keyframes swipeLeft {
    0%   { transform: translateX(0); }
    40%  { transform: translateX(-28px); }
    100% { transform: translateX(0); }
  }
  @keyframes swipeRight {
    0%   { transform: translateX(0); }
    40%  { transform: translateX(28px); }
    100% { transform: translateX(0); }
  }
  .player-swipe-left  { animation: swipeLeft  0.25s ease forwards; }
  .player-swipe-right { animation: swipeRight 0.25s ease forwards; }

  #pause-screen {
    display: none;
    background: rgba(245,240,232,0.95);
    z-index: 190;
    gap: 14px;
  }

  #gameover-screen {
    display: none;
    background: rgba(245,240,232,0.97);
    z-index: 200;
    gap: 14px;
  }

  .go-title {
    font-size: 60px;
    font-weight: 700;
    color: var(--red);
    line-height: 1;
  }

  .pause-title {
    font-size: 44px;
    font-weight: 700;
    color: var(--ink);
  }

  .go-score {
    font-size: 15px;
    color: #666;
    text-align: center;
    line-height: 2;
  }

  .go-score .big {
    font-size: 42px;
    color: var(--blue);
    font-weight: 700;
    display: block;
    line-height: 1;
  }

  .go-stats {
    font-size: 13px;
    color: #888;
    text-align: center;
    line-height: 1.7;
  }

  #new-record {
    display: none;
    font-size: 16px;
    font-weight: 700;
    color: white;
    background: var(--gold);
    padding: 4px 14px;
    border-radius: 999px;
    animation: pop2 0.5s ease 2;
  }

  #feedback {
    position: fixed;
    top: 44%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-size: 48px;
    font-weight: 700;
    pointer-events: none;
    z-index: 150;
    opacity: 0;
    transition: opacity 0.12s;
    font-family: Tahoma, sans-serif;
  }

  .num-box.pushing-up {
    transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s !important;
  }

  /* Màn hình thấp: thu gọn màn hình bắt đầu để nút BẮT ĐẦU luôn nằm trong màn hình */
  @media (max-height: 600px) {
    .game-title { font-size: 44px; }
    .title-decoration { display: none; }
    #start-screen { gap: 10px; }
    .how-to { padding: 10px 16px; gap: 6px; font-size: 13px; }
  }

  /* Điện thoại nằm ngang: chia hai cột (tiêu đề + nút | cách chơi) */
  @media (max-height: 460px) and (orientation: landscape) {
    #start-screen {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-areas: "t h" "b h" "s h";
      align-content: center;
      justify-content: center;
      justify-items: center;
      column-gap: 28px;
      row-gap: 8px;
    }
    #start-screen > * { margin: 0 !important; }
    #start-screen .game-title { grid-area: t; }
    #start-screen .how-to { grid-area: h; align-self: center; max-width: 340px; }
    #start-screen .best-line { grid-area: b; }
    #start-screen #btn-start { grid-area: s; }
  }

  @media (max-width: 340px) {
    .ans-btn { font-size: 11px; letter-spacing: 0; }
    #player-box { width: 70px; }
  }

  /* Màn hình thấp (điện thoại nằm ngang): gọn lại để không mất ô nào */
  @media (max-height: 460px) {
    .game-title { font-size: 40px; }
    #start-screen { gap: 10px; }
    .how-to { padding: 8px 16px; gap: 5px; }
    .go-title { font-size: 40px; }
    #swipe-hint { display: none; }
    #bottom-panel { gap: 4px; padding-top: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .float-pts, #new-record, .num-box.rerolled { animation: none; }
  }
</style>
</head>
<body>

<div id="start-screen" class="screen">
  <div class="game-title">THẤP<br/><span>HAY CAO</span></div>
  <div class="title-decoration">vuốt để so sánh</div>
  <div class="how-to">
    <div class="how-to-title">Cách chơi</div>
    <div class="how-to-row">
      <div class="how-to-arrow">←</div>
      <div>Vuốt trái nếu ô rơi <strong>có số THẤP hơn</strong></div>
    </div>
    <div class="how-to-row">
      <div class="how-to-arrow">→</div>
      <div>Vuốt phải nếu ô rơi <strong>có số CAO hơn</strong></div>
    </div>
    <div class="how-to-sep"></div>
    <div class="how-to-row">
      <div class="box-sample red-s">42</div>
      <div style="color:#888; font-size:13px;">Ô đỏ: Làm ngược lại logic trên</div>
    </div>
    <div class="how-to-row">
      <div class="how-to-arrow" style="color:var(--gold)">★</div>
      <div style="color:#888; font-size:13px;">Đúng liên tiếp để nhân điểm; cứ 10 lần đúng được hồi 1 tim</div>
    </div>
  </div>
  <div class="best-line" id="best-line"></div>
  <button id="btn-start" class="big-btn">BẮT ĐẦU</button>
</div>

<div id="game-area">
  <div id="field">
    <div id="danger-line"></div>
    <button id="btn-mute" class="tool-btn" type="button" aria-label="Bật/tắt âm thanh">🔊</button>
    <button id="btn-pause" class="tool-btn" type="button" aria-label="Tạm dừng">⏸</button>
  </div>
  <div id="bottom-panel">
    <div id="stats-row">
      <div id="hud">0</div>
      <div id="combo-display"></div>
      <div id="lives-display"></div>
    </div>
    <div id="speed-bar-wrap"><div id="speed-bar"></div></div>
    <div id="player-row">
      <button id="btn-low" class="ans-btn low" type="button">← THẤP HƠN</button>
      <div id="player-box">—</div>
      <button id="btn-high" class="ans-btn high" type="button">CAO HƠN →</button>
    </div>
    <div id="swipe-hint">VUỐT TRÁI / PHẢI HOẶC CHẠM NÚT</div>
  </div>
</div>

<div id="pause-screen" class="screen">
  <div class="pause-title">TẠM DỪNG</div>
  <button id="btn-resume" class="big-btn">TIẾP TỤC</button>
  <button id="btn-restart" class="big-btn ghost">CHƠI LẠI</button>
</div>

<div id="gameover-screen" class="screen">
  <div class="go-title">HẾT RỒI!</div>
  <div id="new-record">★ KỶ LỤC MỚI ★</div>
  <div class="go-score"><span class="big" id="final-score">0</span> điểm</div>
  <div class="go-stats" id="go-stats"></div>
  <button id="btn-replay" class="big-btn">CHƠI LẠI</button>
</div>

<div id="feedback"></div>

<script>
const NUM_LANES        = 4;
const MIN_GAP          = 120;
const BASE_SPEED       = 30;
const MAX_SPEED_PCT    = 3.0;
const SPEED_INC_PER_S  = 0.005;
const EXPR_CHANCE      = 0.15;
const RED_CHANCE       = 0.08;
const MAX_LIVES        = 6;
const SCORE_PER_SEC    = 458;
const SCORE_NORMAL     = 300;
const SCORE_EXPR       = 500;
const SCORE_RED        = 1000;
const SCORE_RED_EXPR   = 2500;
const COMBO_STEP       = 5;      // mỗi 5 lần đúng liên tiếp tăng hệ số nhân
const COMBO_MULT_STEP  = 0.5;    // mỗi bậc cộng thêm ×0,5
const COMBO_MULT_MAX   = 3;      // tối đa ×3
const HEART_EVERY      = 10;     // mỗi 10 lần đúng liên tiếp hồi 1 tim
const BEST_KEY         = 'thaphaycao:best';
const MUTE_KEY         = 'thaphaycao:muted';

let boxes       = [];
let playerValue = 0;
let score       = 0;
let displayedScore = 0;
let lives       = MAX_LIVES;
let gameRunning = false;
let paused      = false;
let animFrame   = null;
let lastTime    = null;
let spawnTimer  = 0;
let totalTime   = 0;
let touchStartX = null;
let lastTouchAt = 0;
let mouseStartX = null;
let combo       = 0;
let maxCombo    = 0;
let correctCount = 0;
let bestScore   = 0;
let muted       = false;

const $ = id => document.getElementById(id);
const fieldEl    = () => $('field');
const playerEl   = () => $('player-box');
const hudEl      = () => $('hud');
const livesEl    = () => $('lives-display');
const speedBarEl = () => $('speed-bar');

function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

/* ---------- Lưu trữ (có thể bị chặn ở chế độ riêng tư) ---------- */
function loadNum(key) { try { const v = parseInt(localStorage.getItem(key), 10); return Number.isFinite(v) ? v : 0; } catch (e) { return 0; } }
function saveStr(key, v) { try { localStorage.setItem(key, String(v)); } catch (e) {} }

/* ---------- Âm thanh (tạo bằng WebAudio, mở khoá ở lần chạm đầu tiên) ---------- */
let audioCtx = null;
function unlockAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted || !audioCtx) return;
  try {
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  good:  c => tone(520 + Math.min(c, 12) * 40, 0.12, 'triangle', 0.16, 760 + Math.min(c, 12) * 40),
  bad:   () => tone(200, 0.28, 'sawtooth', 0.12, 90),
  heart: () => { tone(660, 0.1, 'sine', 0.15, null, 0); tone(880, 0.1, 'sine', 0.15, null, 0.1); tone(1320, 0.16, 'sine', 0.15, null, 0.2); },
  over:  () => { tone(392, 0.22, 'triangle', 0.15, null, 0); tone(294, 0.22, 'triangle', 0.15, null, 0.2); tone(196, 0.45, 'triangle', 0.15, null, 0.4); },
  record:() => { tone(523, 0.12, 'triangle', 0.15, null, 0); tone(659, 0.12, 'triangle', 0.15, null, 0.12); tone(784, 0.12, 'triangle', 0.15, null, 0.24); tone(1047, 0.3, 'triangle', 0.15, null, 0.36); }
};

function syncMuteBtn() { $('btn-mute').textContent = muted ? '🔇' : '🔊'; }

/* ---------- Sinh ô số ---------- */
function spawnInLane(lane, startY) {
  const laneWidth = fieldEl().clientWidth / NUM_LANES;
  let x = Math.round((lane * laneWidth) + (laneWidth / 2));

  const isRed = Math.random() < RED_CHANCE;
  const isExpr = Math.random() < EXPR_CHANCE;
  let displayText, numValue;

  let safetyBreak = 0;
  do {
    if (isExpr) {
      const e = genExpression();
      displayText = e.display;
      numValue = e.value;
    } else {
      numValue = randInt(1, 99);
      displayText = String(numValue);
    }
    safetyBreak++;
  } while (numValue === playerValue && safetyBreak < 50);

  const el = document.createElement('div');
  el.className = 'num-box ' + (isRed ? 'red-box' : 'blue-box');
  el.textContent = displayText;

  const y = startY !== undefined ? startY : -45 - randInt(0, 20);
  el.style.top  = y + 'px';
  el.style.left = x + 'px';
  el.style.transform = 'translateX(-50%)';

  fieldEl().appendChild(el);

  requestAnimationFrame(() => {
    const rect = el.getBoundingClientRect();
    const halfWidth = rect.width / 2;
    const screenWidth = fieldEl().clientWidth;
    const padding = 10;
    let finalX = x;
    if (x - halfWidth < padding) finalX = halfWidth + padding;
    else if (x + halfWidth > screenWidth - padding) finalX = screenWidth - halfWidth - padding;
    el.style.left = finalX + 'px';
  });

  boxes.push({ el, lane, y, value: numValue, isRed, isExpr, dead: false });
}

function genExpression() {
  const ops = ['+', '-', '*', '/'];
  for (let i = 0; i < 60; i++) {
    const op = ops[randInt(0, 3)];
    let a, b, res;
    if (op === '+') { a = randInt(1, 89); b = randInt(1, 99 - a); res = a + b; }
    else if (op === '-') { a = randInt(2, 99); b = randInt(1, a - 1); res = a - b; }
    else if (op === '*') { a = randInt(2, 9);  b = randInt(2, 9);  res = a * b; }
    else { res = randInt(2, 19); b = randInt(2, 9); a = res * b; }
    if (res >= 1 && res <= 99 && res !== playerValue) {
      return { display: `${a}${op === '*' ? '×' : op === '/' ? '÷' : op}${b}`, value: res };
    }
  }
  return { display: playerValue === 8 ? '5+4' : '5+3', value: playerValue === 8 ? 9 : 8 };
}

/* Số của người chơi vừa đổi: ô nào đang rơi mà bằng đúng số đó thì không thể trả lời đúng
   (không "thấp hơn" cũng không "cao hơn"), nên đổi sang số khác trước khi tới lượt. */
function rerollEqualBoxes() {
  for (const box of boxes) {
    if (box.dead || box.value !== playerValue) continue;
    let text, val, guard = 0;
    do {
      if (box.isExpr) { const e = genExpression(); text = e.display; val = e.value; }
      else { val = randInt(1, 99); text = String(val); }
      guard++;
    } while (val === playerValue && guard < 50);
    box.value = val;
    box.el.textContent = text;
    box.el.classList.remove('rerolled');
    void box.el.offsetWidth;
    box.el.classList.add('rerolled');
  }
}

function findClosestBox() {
  // Chỉ xét các ô chưa bị đánh dấu dead
  const alive = boxes.filter(b => !b.dead);
  if (alive.length === 0) return null;
  return alive.reduce((prev, curr) => (curr.y > prev.y ? curr : prev), alive[0]);
}

/* ---------- Combo, tim, điểm ---------- */
function comboMult() { return Math.min(COMBO_MULT_MAX, 1 + Math.floor(combo / COMBO_STEP) * COMBO_MULT_STEP); }

function renderLives() {
  livesEl().textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, MAX_LIVES - lives));
}

function renderCombo(bump) {
  const el = $('combo-display');
  if (combo >= 2) {
    const m = comboMult();
    el.textContent = '🔥 ' + combo + (m > 1 ? ' · ×' + String(m).replace('.', ',') : '');
    el.classList.add('on');
    if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  } else {
    el.classList.remove('on');
  }
}

function floatText(text, color, x, y) {
  const el = document.createElement('div');
  el.className = 'float-pts';
  el.textContent = text;
  el.style.color = color;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  fieldEl().appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function breakCombo() {
  combo = 0;
  renderCombo(false);
}

function handleMiss() {
  const target = findClosestBox();
  if (target) {
    target.dead = true;
    target.el.remove();
    boxes = boxes.filter(b => b !== target);
  }

  const pushBackDistance = 80;
  boxes.forEach(box => {
    box.el.classList.add('pushing-up');
    box.y -= pushBackDistance;
    box.el.style.top = box.y + 'px';
    setTimeout(() => { if (box.el) box.el.classList.remove('pushing-up'); }, 500);
  });

  breakCombo();
  lives--;
  renderLives();
  showFeedback('✗', '#c0392b');
  sfx.bad();

  if (lives <= 0) triggerGameOver();
}

function loop(ts) {
  if (!gameRunning || paused) return;
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  totalTime += dt;

  score += SCORE_PER_SEC * dt;
  displayedScore = Math.min(score, displayedScore + Math.max(SCORE_PER_SEC, (score - displayedScore) * 6) * dt);
  hudEl().textContent = Math.floor(displayedScore).toLocaleString('vi-VN');

  const mult = Math.min(MAX_SPEED_PCT, 1 + totalTime * SPEED_INC_PER_S);
  speedBarEl().style.width = ((mult - 1) / (MAX_SPEED_PCT - 1) * 100) + '%';

  const target = findClosestBox();
  let missed = false;
  const fieldH = fieldEl().clientHeight;

  boxes.forEach(box => {
    box.y += (BASE_SPEED * mult) * dt;
    box.el.style.top = box.y + 'px';

    if (box.y >= 0) box.el.style.opacity = "1";
    else box.el.style.opacity = "0.4";

    if (box === target) box.el.classList.add('targeted');
    else box.el.classList.remove('targeted');

    if (box.y + 45 >= fieldH) missed = true;
  });

  if (missed) {
    handleMiss();
    if (!gameRunning) return;
  }

  spawnTimer += dt;
  const spawnDelayLimit = Math.max(0.3, 1.8 - totalTime * 0.02);

  if (spawnTimer >= spawnDelayLimit) {
    const SAME_LANE_GAP = 110;
    const ADJACENT_LANE_GAP = 65;
    const validLanes = [];

    for (let i = 0; i < NUM_LANES; i++) {
      let isBlocked = false;
      for (let box of boxes) {
        if (box.lane === i && box.y < SAME_LANE_GAP) { isBlocked = true; break; }
        if ((box.lane === i - 1 || box.lane === i + 1) && box.y < ADJACENT_LANE_GAP) { isBlocked = true; break; }
      }
      if (!isBlocked) validLanes.push(i);
    }

    if (validLanes.length > 0) {
      spawnInLane(validLanes[randInt(0, validLanes.length - 1)]);
      spawnTimer = 0;
    }
  }

  animFrame = requestAnimationFrame(loop);
}

function triggerGameOver() {
  gameRunning = false;
  paused = false;
  if (animFrame) cancelAnimationFrame(animFrame);

  const finalScore = Math.floor(score);
  const isRecord = finalScore > bestScore;
  if (isRecord) { bestScore = finalScore; saveStr(BEST_KEY, bestScore); }

  $('final-score').textContent = finalScore.toLocaleString('vi-VN');
  $('new-record').style.display = isRecord ? 'inline-block' : 'none';
  $('go-stats').innerHTML =
    'Trả lời đúng: <b>' + correctCount + '</b> · Combo cao nhất: <b>' + maxCombo + '</b><br>' +
    'Sống sót: <b>' + Math.floor(totalTime) + ' giây</b>' +
    (isRecord ? '' : ' · Kỷ lục: <b>' + bestScore.toLocaleString('vi-VN') + '</b>');
  $('gameover-screen').style.display = 'flex';
  fieldEl().querySelectorAll('.num-box, .float-pts').forEach(e => e.remove());
  boxes = [];
  if (isRecord) sfx.record(); else sfx.over();
}

function handleAnswer(isSwipeRight) {
  if (!gameRunning || paused) return;

  const target = findClosestBox();

  // Chặn vuốt khi ô chưa vào vùng chơi
  if (!target || target.y < 0) return;

  // Đánh dấu dead NGAY LẬP TỨC để tránh xử lý trùng
  target.dead = true;
  boxes = boxes.filter(b => b !== target);

  // Vuốt phải = đoán "cao hơn", vuốt trái = đoán "thấp hơn" (đúng như hướng dẫn trên màn hình)
  const guessIsHigher = isSwipeRight;

  // Ô đỏ đảo ngược logic
  const effectiveHigher = target.isRed ? !guessIsHigher : guessIsHigher;
  const correct = effectiveHigher ? (target.value > playerValue) : (target.value < playerValue);

  playerEl().classList.remove('player-swipe-left','player-swipe-right');
  void playerEl().offsetWidth;
  playerEl().classList.add(isSwipeRight ? 'player-swipe-right' : 'player-swipe-left');

  const bx = parseFloat(target.el.style.left) || fieldEl().clientWidth / 2;

  if (correct) {
    playerValue = target.value;
    playerEl().textContent = playerValue;

    combo++;
    correctCount++;
    if (combo > maxCombo) maxCombo = combo;

    const base = target.isExpr
      ? (target.isRed ? SCORE_RED_EXPR : SCORE_EXPR)
      : (target.isRed ? SCORE_RED : SCORE_NORMAL);
    const pts = Math.round(base * comboMult());
    score += pts;
    showFeedback('+' + pts, target.isRed ? '#c0392b' : '#2a9d8f');
    floatText('+' + pts, target.isRed ? '#c0392b' : '#2a9d8f', bx, target.y);
    sfx.good(combo);

    // Cứ HEART_EVERY lần đúng liên tiếp hồi 1 tim
    if (combo % HEART_EVERY === 0 && lives < MAX_LIVES) {
      lives++;
      renderLives();
      floatText('+❤️', '#c0392b', bx, Math.max(0, target.y - 28));
      sfx.heart();
    }
    renderCombo(true);

    target.el.classList.add('correct');
    setTimeout(() => target.el.remove(), 250);

    rerollEqualBoxes();
  } else {
    loseLife(target);
  }
}

function loseLife(badBox) {
  if (badBox) {
    badBox.el.classList.add('wrong');
    setTimeout(() => badBox.el.remove(), 300);
  }
  breakCombo();
  lives--;
  renderLives();
  showFeedback('✗', '#c0392b');
  sfx.bad();
  if (lives <= 0) triggerGameOver();
}

function initGame() {
  touchStartX = null;
  mouseStartX = null;
  gameRunning = false;
  paused = false;
  lastTime = null;
  if (animFrame) cancelAnimationFrame(animFrame);

  fieldEl().querySelectorAll('.num-box, .float-pts').forEach(e => e.remove());
  boxes = [];
  score = 0;
  displayedScore = 0;
  lives = MAX_LIVES;
  totalTime = 0;
  spawnTimer = 0;
  combo = 0;
  maxCombo = 0;
  correctCount = 0;

  renderLives();
  renderCombo(false);
  hudEl().textContent = '0';
  speedBarEl().style.width = '0%';
  playerValue = randInt(1, 99);
  playerEl().textContent = playerValue;

  for (let l = 0; l < NUM_LANES; l++) spawnInLane(l, -(l * 148 + 55));
  gameRunning = true;
  animFrame = requestAnimationFrame(loop);
}

function showFeedback(char, color) {
  const el = $('feedback');
  el.textContent = char;
  el.style.color = color;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 600);
}

/* ---------- Tạm dừng ---------- */
function pauseGame() {
  if (!gameRunning || paused) return;
  paused = true;
  if (animFrame) cancelAnimationFrame(animFrame);
  $('pause-screen').style.display = 'flex';
}

function resumeGame() {
  if (!gameRunning || !paused) return;
  paused = false;
  lastTime = null;               // không tính thời gian đã dừng vào dt
  $('pause-screen').style.display = 'none';
  animFrame = requestAnimationFrame(loop);
}

function restartGame() {
  $('pause-screen').style.display = 'none';
  $('gameover-screen').style.display = 'none';
  initGame();
}

/* ---------- Điều khiển ---------- */
window.addEventListener('touchstart', e => {
  lastTouchAt = Date.now();
  touchStartX = e.touches[0].clientX;
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (gameRunning) e.preventDefault();
}, { passive: false });

window.addEventListener('touchend', e => {
  lastTouchAt = Date.now();
  if (touchStartX === null || !gameRunning || paused) { touchStartX = null; return; }
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 15) handleAnswer(dx > 0);
  touchStartX = null;
}, { passive: false });

window.addEventListener('touchcancel', () => { touchStartX = null; });

// Chuột (máy tính): kéo trái/phải như vuốt
window.addEventListener('mousedown', e => {
  if (Date.now() - lastTouchAt < 700) return;      // bỏ qua chuột giả sau khi chạm
  mouseStartX = e.clientX;
});
window.addEventListener('mouseup', e => {
  if (mouseStartX === null) return;
  const dx = e.clientX - mouseStartX;
  mouseStartX = null;
  if (Date.now() - lastTouchAt < 700) return;
  if (gameRunning && !paused && Math.abs(dx) > 15) handleAnswer(dx > 0);
});

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') handleAnswer(false);
  if (k === 'ArrowRight' || k === 'd' || k === 'D') handleAnswer(true);
  if (k === 'Escape' || k === 'p' || k === 'P') { paused ? resumeGame() : pauseGame(); }
});

// Nút trên màn hình: bấm ngay khi chạm (không đợi nhả tay)
function bindPress(id, fn) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fn(); });
  el.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });
  el.addEventListener('touchend', e => { e.stopPropagation(); }, { passive: true });
  el.addEventListener('mousedown', e => { e.stopPropagation(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); fn(); } });
}
bindPress('btn-low',  () => handleAnswer(false));
bindPress('btn-high', () => handleAnswer(true));
bindPress('btn-pause', () => pauseGame());
bindPress('btn-mute', () => { muted = !muted; saveStr(MUTE_KEY, muted ? 1 : 0); syncMuteBtn(); unlockAudio(); });

// Tự tạm dừng khi chuyển tab/ứng dụng
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

$('btn-start').addEventListener('click', () => {
  unlockAudio();
  $('start-screen').style.display = 'none';
  $('game-area').style.display = 'flex';
  initGame();
});

$('btn-resume').addEventListener('click', resumeGame);
$('btn-restart').addEventListener('click', () => { unlockAudio(); restartGame(); });
$('btn-replay').addEventListener('click', () => { unlockAudio(); restartGame(); });

// Xoay màn hình / thanh địa chỉ iOS co giãn: đặt lại các ô theo chiều rộng mới
let lastFieldW = 0;
function onResize() {
  const w = fieldEl().clientWidth;
  if (!w || w === lastFieldW) return;
  lastFieldW = w;
  const laneWidth = w / NUM_LANES;
  for (const box of boxes) {
    const half = box.el.offsetWidth / 2;
    let x = Math.round(box.lane * laneWidth + laneWidth / 2);
    x = Math.max(half + 10, Math.min(w - half - 10, x));
    box.el.style.left = x + 'px';
  }
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

/* ---------- Khởi tạo ---------- */
(function init() {
  bestScore = loadNum(BEST_KEY);
  muted = loadNum(MUTE_KEY) === 1;
  syncMuteBtn();
  $('best-line').innerHTML = bestScore
    ? 'Kỷ lục: <b>' + bestScore.toLocaleString('vi-VN') + '</b>'
    : 'Chưa có kỷ lục. Hãy thử sức!';
})();
</script>
